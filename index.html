<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>工具大全</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            :root {
                --bg: #f3f7ff;
                --card: #ffffff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --border: #dbe6ff;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
            }
            html, body {
                width: 100%;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, #f3f7ff 80%);
                color: var(--text);
            }
            .container {
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
                gap: 6px;
                padding: 6px;
            }
            .header {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
                box-shadow: var(--shadow);
                padding: 6px 8px;
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                position: relative;
            }
            .left-zone {
                display: flex;
                align-items: center;
                gap: 10px;
                min-width: 0;
                flex: 1;
            }
            .brand-mark {
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }
            .clover-icon {
                width: 30px;
                height: 30px;
                flex: 0 0 30px;
                border: 1px solid #d8e5ff;
                border-radius: 50%;
                background: #edf3ff;
                color: #3c4f78;
                font-size: 18px;
                line-height: 1;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                user-select: none;
            }
            .clover-icon.active {
                color: #fff;
                border-color: transparent;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            .brand-title {
                font-size: 15px;
                font-weight: 700;
                white-space: nowrap;
            }
            .recent-nav {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                flex-wrap: wrap;
                margin-left: auto;
                margin-right: 4px;
                min-height: 30px;
            }
            .recent-tool {
                padding: 5px 10px;
                font-size: 13px;
                border: 1px solid #d8e5ff;
                background: #edf3ff;
                color: #3c4f78;
                border-radius: 999px;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                white-space: nowrap;
                max-width: 140px;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .search-wrap {
                width: 300px;
                max-width: 46%;
                position: relative;
            }
            #search-input {
                width: 100%;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                padding: 5px 8px;
                font-size: 12px;
                outline: none;
            }
            #search-input:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.15);
            }
            .floating-panel {
                display: none;
                position: absolute;
                z-index: 20;
                border: 1px solid #d8e5ff;
                border-radius: 10px;
                background: #fff;
                box-shadow: 0 10px 28px rgba(36, 90, 190, 0.16);
            }
            .floating-panel.visible {
                display: block;
            }
            .overview-panel {
                display: none;
                position: fixed;
                z-index: 35;
                border: 1px solid #d8e5ff;
                border-radius: 10px;
                background: #fff;
                box-shadow: 0 10px 28px rgba(36, 90, 190, 0.16);
                overflow: auto;
                padding: 8px;
            }
            .overview-panel.visible {
                display: block;
            }
            .overview-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 6px;
            }
            .overview-title {
                font-size: 16px;
                font-weight: 600;
                color: #2b3e63;
            }
            .overview-close {
                width: 24px;
                height: 24px;
                border: 1px solid #d8e5ff;
                border-radius: 50%;
                background: #edf3ff;
                color: #3c4f78;
                font-size: 16px;
                line-height: 1;
                cursor: pointer;
            }
            .overview-group {
                border: 1px solid #dbe7ff;
                border-radius: 8px;
                background: #f8fbff;
                padding: 6px;
                margin-bottom: 6px;
            }
            .overview-group-title {
                font-size: 14px;
                font-weight: 600;
                color: #324a76;
                margin-bottom: 6px;
            }
            .overview-group-tools {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
            }
            .search-results {
                top: calc(100% + 6px);
                left: 0;
                right: 0;
                padding: 6px;
            }
            .result-title {
                font-size: 12px;
                color: var(--muted);
                margin-bottom: 6px;
            }
            .result-list {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
            }
            .result-item {
                padding: 4px 8px;
                cursor: pointer;
                font-size: 11px;
                color: #3c4f78;
                background: #edf3ff;
                border: 1px solid #d8e5ff;
                border-radius: 999px;
            }
            .tool-chip {
                padding: 5px 10px;
                font-size: 13px;
                border: 1px solid #d8e5ff;
                background: #edf3ff;
                color: #3c4f78;
                border-radius: 999px;
                cursor: pointer;
            }
            .tool-chip.active,
            .result-item.active,
            .recent-tool.active {
                color: #fff;
                border-color: transparent;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            .content {
                flex: 1;
                overflow: hidden;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--card);
                box-shadow: var(--shadow);
            }
            #tool-frame-container {
                width: 100%;
                height: 100%;
                position: relative;
            }
            iframe {
                width: 100%;
                height: 100%;
                border: none;
                background: #fff;
                display: block;
                position: absolute;
                inset: 0;
                visibility: hidden;
                pointer-events: none;
            }
            iframe.tool-frame-active {
                visibility: visible;
                pointer-events: auto;
            }
            @media (max-width: 900px) {
                .header { flex-direction: column; align-items: stretch; }
                .left-zone { min-width: 0; }
                .recent-nav { width: 100%; margin-left: 0; justify-content: flex-start; }
                .search-wrap { width: 100%; max-width: 100%; }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <div class="left-zone">
                    <div class="brand-mark">
                        <div id="clover-toggle" class="clover-icon" title="全部分类工具">✤</div>
                        <div class="brand-title">工具导航</div>
                    </div>
                    <div id="recent-nav" class="recent-nav" title="最近打开的工具"></div>
                </div>
                <div class="search-wrap">
                    <input id="search-input" type="text" placeholder="搜索工具..." />
                    <div id="search-results" class="search-results floating-panel">
                        <div class="result-title">搜索结果</div>
                        <div id="result-list" class="result-list"></div>
                    </div>
                </div>
            </div>
            <div id="overview-panel" class="overview-panel"></div>
            <div class="content">
                <div id="tool-frame-container"></div>
            </div>
        </div>
        <script>
            const STORAGE_PREFIX = "tool_form_data_";
            const RECENT_TOOLS_KEY = "tool_nav_recent_tool_ids";
            const RECENT_TOOLS_MAX = 5;
            const FORM_CACHE = {};
            const FRAME_CACHE = {};
            const TOOLS = [
                { id: "tab8", name: "Json工具", category: "解析与转换", path: "pages/Json工具.html", keywords: ["json", "format", "yaml", "xml", "toml", "转换"] },
                { id: "tab19", name: "格式化工具", category: "解析与转换", path: "pages/格式化工具.html", keywords: ["format", "json", "xml", "sql", "css", "javascript", "html", "美化", "压缩", "格式化", "prettier"] },
                { id: "tab1", name: "DDL 解析", category: "解析与转换", path: "pages/DDL.html", keywords: ["ddl", "mysql", "pgsql", "oracle"] },
                { id: "tab21", name: "MyBatis SQL 填充", category: "解析与转换", path: "pages/MyBatisSql日志填充.html", keywords: ["mybatis", "sql", "日志", "jdbc", "参数", "preparing", "ibatis", "完整sql"] },
                { id: "tab2", name: "Java 与 JSON", category: "解析与转换", path: "pages/JavaToJson.html", keywords: ["java", "json"] },
                { id: "tab3", name: "JSON/Excel/SQL", category: "解析与转换", path: "pages/JsonToExcel.html", keywords: ["json", "excel", "csv", "sql", "insert"] },
                { id: "tab4", name: "Tester 文档解析", category: "解析与转换", path: "pages/TesterJSON.html", keywords: ["tester", "talend", "api"] },
                { id: "tab9", name: "Nginx 配置", category: "运维工具", path: "pages/Nginx配置工具.html", keywords: ["nginx", "proxy", "server"] },
                { id: "tab5", name: "Shell 脚本生成", category: "运维工具", path: "pages/Shell脚本.html", keywords: ["shell", "script"] },
                { id: "tab6", name: "Crontab", category: "运维工具", path: "pages/Crontab工具.html", keywords: ["cron", "schedule"] },
                { id: "tab12", name: "Linux curl", category: "运维工具", path: "pages/LinuxCurl工具.html", keywords: ["curl", "linux", "http", "api"] },
                { id: "tab7", name: "身份证生成", category: "生成", path: "pages/身份证号码生成器.html", keywords: ["idcard", "身份证"] },
                { id: "tab22", name: "时间日期", category: "其他", path: "pages/时间日期工具.html", keywords: ["时间", "日期", "时间戳", "时区", "unix", "timestamp", "换算", "离线"] },
                { id: "tab18", name: "文本处理", category: "其他", path: "pages/文本处理工具.html", keywords: ["文本", "trim", "排序", "去重", "base64", "url", "行号", "换行", "text"] },
                { id: "tab11", name: "二维码/条形码生成", category: "生成", path: "pages/码生成工具.html", keywords: ["二维码", "条形码", "qrcode", "barcode"] },
                { id: "tab20", name: "UUID 工具", category: "生成", path: "pages/UUID工具.html", keywords: ["uuid", "guid", "唯一标识", "生成", "rfc4122"] },
                { id: "tab14", name: "Excel SQL 查询", category: "其他", path: "pages/ExcelSQL查询工具.html", keywords: ["excel", "sql", "查询", "数据分析", "时间筛选"] },
                { id: "tab15", name: "统一社会信用代码生成", category: "生成", path: "pages/统一社会信用代码生成工具.html", keywords: ["统一社会信用代码", "社会信用代码", "信用代码", "生成", "校验"] },
                { id: "tab10", name: "文本对比", category: "比较", path: "pages/文本对比.html", keywords: ["文本对比", "比较", "对比", "diff", "compare"] },
                { id: "tab13", name: "集合比较", category: "比较", path: "pages/集合比较工具.html", keywords: ["集合", "集合对比", "集合比较", "比较", "对比", "交集", "差异", "compare", "set", "diff"] },
                { id: "tab16", name: "单位换算", category: "解析与转换", path: "pages/单位换算工具.html", keywords: ["单位换算", "时间", "长度", "面积", "重量", "温度", "功率"] },
                { id: "tab17", name: "退税计算", category: "其他", path: "pages/退税计算工具.html", keywords: ["退税", "出口退税", "税率", "计算"] }
            ];
            /** 全部分类工具面板「常用」分栏（顺序即展示顺序） */
            const COMMON_TOOL_IDS = ["tab8", "tab18", "tab13", "tab14", "tab5"];
            const DEFAULT_TAB_ID = "tab8";
            let currentId = "";
            let overviewVisible = false;

            function getFieldKey(field, idx) {
                if (!field) return "";
                const directKey = field.name || field.id || field.getAttribute("data-persist-key");
                if (directKey) return directKey;
                const fallbackKey = "auto_" + field.tagName.toLowerCase() + "_" + idx;
                field.setAttribute("data-persist-key", fallbackKey);
                return fallbackKey;
            }

            function getToolFrame(toolId) {
                return FRAME_CACHE[toolId] || null;
            }

            function getFrameDoc(toolId) {
                const frame = getToolFrame(toolId || currentId);
                return frame ? (frame.contentDocument || (frame.contentWindow && frame.contentWindow.document)) : null;
            }

            function saveToolFormData(toolId) {
                if (!toolId) return;
                const doc = getFrameDoc(toolId);
                if (!doc) return;
                try {
                    const fields = doc.querySelectorAll("input, textarea, select");
                    const data = {};
                    fields.forEach((field, idx) => {
                        if (field.type === "file") return;
                        const key = getFieldKey(field, idx);
                        if (!key) return;
                        if (field.type === "checkbox" || field.type === "radio") {
                            data[key] = !!field.checked;
                        } else {
                            data[key] = field.value;
                        }
                    });
                    FORM_CACHE[toolId] = data;
                    localStorage.setItem(STORAGE_PREFIX + toolId, JSON.stringify(data));
                } catch (e) {
                    // Ignore cross-document/storage errors.
                }
            }

            function restoreToolFormData(toolId) {
                if (!toolId) return;
                const doc = getFrameDoc(toolId);
                if (!doc) return;
                try {
                    const fromCache = FORM_CACHE[toolId];
                    const raw = localStorage.getItem(STORAGE_PREFIX + toolId);
                    const data = fromCache || (raw ? JSON.parse(raw) : null);
                    if (!data) return;
                    const fields = doc.querySelectorAll("input, textarea, select");
                    fields.forEach((field, idx) => {
                        if (field.type === "file") return;
                        const key = getFieldKey(field, idx);
                        if (!key || data[key] === undefined) return;
                        try {
                            if (field.type === "checkbox" || field.type === "radio") {
                                field.checked = !!data[key];
                            } else {
                                field.value = data[key];
                            }
                        } catch (fieldError) {
                            // Skip problematic individual field.
                        }
                    });
                    try {
                        const evtInput = new Event("input", { bubbles: true });
                        const evtChange = new Event("change", { bubbles: true });
                        fields.forEach((field) => {
                            if (field.type === "file") return;
                            field.dispatchEvent(evtInput);
                            field.dispatchEvent(evtChange);
                        });
                    } catch (eventError) {
                        // Ignore event dispatch failure.
                    }
                } catch (e) {
                    // Ignore parse/DOM errors.
                }
            }

            function bindFrameAutosave(toolId) {
                const frame = getToolFrame(toolId);
                if (!frame || frame.getAttribute("data-autosave-bound") === "1") return;
                const doc = getFrameDoc(toolId);
                if (!doc) return;
                const handler = function (e) {
                    const tag = (e.target && e.target.tagName) || "";
                    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") {
                        saveToolFormData(toolId);
                    }
                };
                try {
                    doc.addEventListener("input", handler);
                    doc.addEventListener("change", handler);
                    frame.setAttribute("data-autosave-bound", "1");
                } catch (e) {
                    // Ignore event bind failures.
                }
            }

            function restoreToolFormDataTwice(toolId) {
                restoreToolFormData(toolId);
                setTimeout(function () {
                    if (currentId === toolId) restoreToolFormData(toolId);
                }, 80);
                setTimeout(function () {
                    if (currentId === toolId) restoreToolFormData(toolId);
                }, 220);
            }

            function dedupeRecentSlots(slots) {
                const seen = new Set();
                const out = [];
                (slots || []).forEach((id) => {
                    if (!TOOLS.some((t) => t.id === id)) return;
                    if (seen.has(id)) return;
                    seen.add(id);
                    out.push(id);
                    if (out.length >= RECENT_TOOLS_MAX) return;
                });
                return out;
            }

            function loadRecentState() {
                try {
                    const raw = localStorage.getItem(RECENT_TOOLS_KEY);
                    if (!raw) return { slots: [], lastUsed: {} };
                    const parsed = JSON.parse(raw);
                    if (parsed && typeof parsed === "object" && !Array.isArray(parsed) && Array.isArray(parsed.slots)) {
                        let slots = dedupeRecentSlots(parsed.slots);
                        const lastUsed = parsed.lastUsed && typeof parsed.lastUsed === "object" ? { ...parsed.lastUsed } : {};
                        const slotSet = new Set(slots);
                        Object.keys(lastUsed).forEach((k) => {
                            if (!slotSet.has(k)) delete lastUsed[k];
                        });
                        const now = Date.now();
                        slots.forEach((id, i) => {
                            const t = lastUsed[id];
                            if (typeof t !== "number" || !Number.isFinite(t)) {
                                lastUsed[id] = now - (slots.length - i) * 1000;
                            }
                        });
                        return { slots, lastUsed };
                    }
                    if (Array.isArray(parsed)) {
                        const ids = dedupeRecentSlots(parsed);
                        const lastUsed = {};
                        const base = Date.now();
                        ids.forEach((id, i) => {
                            lastUsed[id] = base - i * 1000;
                        });
                        return { slots: ids, lastUsed };
                    }
                } catch (e) {
                    // Ignore parse errors.
                }
                return { slots: [], lastUsed: {} };
            }

            function saveRecentState(state) {
                try {
                    localStorage.setItem(RECENT_TOOLS_KEY, JSON.stringify(state));
                } catch (e) {
                    // Ignore storage failures.
                }
            }

            /** 固定槽位顺序；已收录的工具只刷新使用时间，新工具满员时替换最久未使用项并占据其槽位 */
            function persistRecentToolId(toolId) {
                if (!toolId || !TOOLS.some((t) => t.id === toolId)) return;
                const now = Date.now();
                let { slots, lastUsed } = loadRecentState();
                slots = dedupeRecentSlots(slots);

                const existingIdx = slots.indexOf(toolId);
                if (existingIdx !== -1) {
                    lastUsed[toolId] = now;
                    saveRecentState({ slots, lastUsed });
                    return;
                }

                if (slots.length < RECENT_TOOLS_MAX) {
                    slots.push(toolId);
                    lastUsed[toolId] = now;
                    saveRecentState({ slots, lastUsed });
                    return;
                }

                let lruId = slots[0];
                let lruTime = lastUsed[lruId] != null ? lastUsed[lruId] : 0;
                for (let i = 1; i < slots.length; i++) {
                    const id = slots[i];
                    const t = lastUsed[id] != null ? lastUsed[id] : 0;
                    if (t < lruTime) {
                        lruTime = t;
                        lruId = id;
                    }
                }
                const lruIdx = slots.indexOf(lruId);
                delete lastUsed[lruId];
                slots[lruIdx] = toolId;
                lastUsed[toolId] = now;
                saveRecentState({ slots, lastUsed });
            }

            function renderRecentNav() {
                const nav = document.getElementById("recent-nav");
                if (!nav) return;
                nav.innerHTML = "";
                const { slots } = loadRecentState();
                const ids = dedupeRecentSlots(slots);
                ids.forEach((tid) => {
                    const tool = TOOLS.find((t) => t.id === tid);
                    if (!tool) return;
                    const chip = document.createElement("div");
                    chip.className = "recent-tool";
                    chip.setAttribute("data-id", tool.id);
                    chip.textContent = tool.name;
                    chip.title = tool.name;
                    chip.addEventListener("click", function (e) {
                        e.stopPropagation();
                        openTool(tool.id, true);
                    });
                    nav.appendChild(chip);
                });
            }

            function openTool(id, updateHash) {
                const tool = TOOLS.find((t) => t.id === id) || TOOLS[0];
                if (currentId === tool.id) {
                    document.getElementById("search-results").classList.remove("visible");
                    hideOverviewPanel();
                    if (updateHash) {
                        const sameHash = "tab=" + encodeURIComponent(currentId);
                        if (window.location.hash !== "#" + sameHash) {
                            window.location.hash = sameHash;
                        }
                    }
                    persistRecentToolId(tool.id);
                    renderRecentNav();
                    updateActiveStates();
                    return;
                }

                const previousId = currentId;
                if (previousId) {
                    try {
                        saveToolFormData(previousId);
                    } catch (e) {
                        // Never block navigation due to save failures.
                    }
                }
                currentId = tool.id;
                const frame = getOrCreateToolFrame(tool);
                activateToolFrame(tool.id);
                if (frame.getAttribute("data-loaded") === "1") {
                    try {
                        restoreToolFormDataTwice(currentId);
                    } catch (e) {
                        // Ignore runtime restore failures.
                    }
                }
                persistRecentToolId(tool.id);
                renderRecentNav();
                updateActiveStates();
                document.getElementById("search-results").classList.remove("visible");
                hideOverviewPanel();
                if (updateHash) {
                    const nextHash = "tab=" + encodeURIComponent(currentId);
                    if (window.location.hash !== "#" + nextHash) {
                        window.location.hash = nextHash;
                    }
                }
            }

            function activateToolFrame(toolId) {
                Object.keys(FRAME_CACHE).forEach((id) => {
                    const frame = FRAME_CACHE[id];
                    if (!frame) return;
                    frame.classList.toggle("tool-frame-active", id === toolId);
                });
            }

            function getOrCreateToolFrame(tool) {
                if (FRAME_CACHE[tool.id]) return FRAME_CACHE[tool.id];
                const container = document.getElementById("tool-frame-container");
                const frame = document.createElement("iframe");
                frame.setAttribute("data-tool-id", tool.id);
                frame.onload = function () {
                    frame.setAttribute("data-loaded", "1");
                    try {
                        restoreToolFormDataTwice(tool.id);
                        bindFrameAutosave(tool.id);
                    } catch (e) {
                        // Never block tool display due to restore failures.
                    }
                };
                frame.src = tool.path;
                FRAME_CACHE[tool.id] = frame;
                container.appendChild(frame);
                return frame;
            }

            function updateActiveStates() {
                document.querySelectorAll(".tool-chip").forEach((el) => {
                    el.classList.toggle("active", el.getAttribute("data-id") === currentId);
                });
                document.querySelectorAll(".result-item").forEach((el) => {
                    el.classList.toggle("active", el.getAttribute("data-id") === currentId);
                });
                document.querySelectorAll(".recent-tool").forEach((el) => {
                    el.classList.toggle("active", el.getAttribute("data-id") === currentId);
                });
                document.querySelectorAll(".clover-tool").forEach((el) => {
                    el.classList.toggle("active", el.getAttribute("data-id") === currentId);
                });
            }

            function getInitialTab() {
                const hash = window.location.hash.replace(/^#/, "");
                if (!hash) return DEFAULT_TAB_ID;
                const tab = new URLSearchParams(hash).get("tab");
                return TOOLS.some((t) => t.id === tab) ? tab : DEFAULT_TAB_ID;
            }

            function renderOverviewPanel() {
                const panel = document.getElementById("overview-panel");
                const grouped = {};
                TOOLS.forEach((tool) => {
                    if (!grouped[tool.category]) grouped[tool.category] = [];
                    grouped[tool.category].push(tool);
                });

                panel.innerHTML = ""
                    + "<div class=\"overview-header\">"
                    + "<div class=\"overview-title\">全部分类工具</div>"
                    + "<button id=\"overview-close\" type=\"button\" class=\"overview-close\" title=\"关闭\">×</button>"
                    + "</div>";

                function appendToolGroup(titleText, tools) {
                    if (!tools.length) return;
                    const group = document.createElement("div");
                    group.className = "overview-group";
                    const title = document.createElement("div");
                    title.className = "overview-group-title";
                    title.textContent = titleText;
                    group.appendChild(title);
                    const toolsWrap = document.createElement("div");
                    toolsWrap.className = "overview-group-tools";
                    tools.forEach((tool) => {
                        const chip = document.createElement("div");
                        chip.className = "tool-chip clover-tool";
                        chip.setAttribute("data-id", tool.id);
                        chip.textContent = tool.name;
                        chip.addEventListener("click", function () {
                            openTool(tool.id, true);
                        });
                        toolsWrap.appendChild(chip);
                    });
                    group.appendChild(toolsWrap);
                    panel.appendChild(group);
                }

                /** 大类展示顺序；未列出的分类按在 TOOLS 中首次出现的顺序排在末尾 */
                const OVERVIEW_CATEGORY_ORDER = ["解析与转换", "运维工具", "生成", "比较", "其他"];
                const commonTools = COMMON_TOOL_IDS.map((id) => TOOLS.find((t) => t.id === id)).filter(Boolean);
                appendToolGroup("常用", commonTools);

                const categoryOrder = [];
                const seenCat = new Set();
                OVERVIEW_CATEGORY_ORDER.forEach((cat) => {
                    if (grouped[cat] && grouped[cat].length) {
                        categoryOrder.push(cat);
                        seenCat.add(cat);
                    }
                });
                Object.keys(grouped).forEach((cat) => {
                    if (!seenCat.has(cat)) categoryOrder.push(cat);
                });

                categoryOrder.forEach((cat) => {
                    appendToolGroup(cat, grouped[cat]);
                });

                const closeBtn = document.getElementById("overview-close");
                if (closeBtn) {
                    closeBtn.addEventListener("click", function (e) {
                        e.stopPropagation();
                        hideOverviewPanel();
                    });
                }
                updateActiveStates();
            }

            function syncOverviewPanelPosition() {
                const header = document.querySelector(".header");
                const container = document.querySelector(".container");
                const panel = document.getElementById("overview-panel");
                if (!header || !container || !panel) return;
                const headerRect = header.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                panel.style.top = (headerRect.bottom + 6) + "px";
                panel.style.left = (containerRect.left + 6) + "px";
                panel.style.width = Math.max(280, containerRect.width - 12) + "px";
                panel.style.height = Math.max(180, window.innerHeight - headerRect.bottom - 12) + "px";
            }

            function hideOverviewPanel() {
                overviewVisible = false;
                document.getElementById("overview-panel").classList.remove("visible");
                document.getElementById("clover-toggle").classList.remove("active");
            }

            function toggleOverviewPanel() {
                overviewVisible = !overviewVisible;
                if (!overviewVisible) {
                    hideOverviewPanel();
                    return;
                }
                document.getElementById("search-results").classList.remove("visible");
                renderOverviewPanel();
                syncOverviewPanelPosition();
                document.getElementById("overview-panel").classList.add("visible");
                document.getElementById("clover-toggle").classList.add("active");
            }

            function applySearch(keyword) {
                const kw = (keyword || "").trim().toLowerCase();
                const resultWrap = document.getElementById("search-results");
                const list = document.getElementById("result-list");
                list.innerHTML = "";

                if (!kw) {
                    resultWrap.classList.remove("visible");
                    return;
                }

                const filtered = TOOLS.filter((tool) => {
                    const text = (tool.name + " " + tool.category + " " + tool.keywords.join(" ")).toLowerCase();
                    return text.includes(kw);
                });

                filtered.forEach((tool) => {
                    const item = document.createElement("div");
                    item.className = "result-item";
                    item.setAttribute("data-id", tool.id);
                    item.textContent = tool.name + "（" + tool.category + "）";
                    item.addEventListener("click", function () {
                        openTool(tool.id, true);
                    });
                    list.appendChild(item);
                });
                resultWrap.classList.toggle("visible", filtered.length > 0);
                updateActiveStates();
            }

            document.getElementById("search-input").addEventListener("input", function (e) {
                applySearch(e.target.value);
            });

            window.addEventListener("hashchange", function () {
                openTool(getInitialTab(), false);
            });

            document.querySelector(".content").addEventListener("click", function () {
                document.getElementById("search-results").classList.remove("visible");
                hideOverviewPanel();
            });

            document.addEventListener("click", function (e) {
                if (e.target.closest(".search-wrap")) return;
                if (e.target.closest("#clover-toggle")) return;
                if (e.target.closest("#overview-panel")) return;
                document.getElementById("search-results").classList.remove("visible");
                if (e.target.closest(".header")) {
                    if (e.target.closest(".recent-tool")) return;
                    hideOverviewPanel();
                    return;
                }
                hideOverviewPanel();
            });

            document.getElementById("clover-toggle").addEventListener("click", function (e) {
                e.stopPropagation();
                toggleOverviewPanel();
            });

            window.addEventListener("resize", function () {
                if (overviewVisible) {
                    syncOverviewPanelPosition();
                }
            });

            document.addEventListener("DOMContentLoaded", function () {
                renderRecentNav();
                openTool(getInitialTab(), false);
                if (!window.location.hash) {
                    window.location.hash = "tab=" + DEFAULT_TAB_ID;
                }
            });
        </script>
    </body>
</html>
