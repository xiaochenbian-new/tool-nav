<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Shell脚本生成器</title>
        <link rel="stylesheet" href="libs/tool-danger-btn.css" />
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                --bg: #f3f7ff;
                --card: #ffffff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --danger: #f05656;
                --text: #1f2a44;
                --muted: #6f7d96;
                --border: #dbe6ff;
                --shadow: 0 10px 24px rgba(36, 90, 190, 0.12);
            }
            body {
                margin: 0;
                min-height: 100vh;
                padding: 8px;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                background: var(--bg);
            }
            .page {
                width: 100%;
                height: calc(100vh);
            }
            .container {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
                box-shadow: var(--shadow);
                padding: 8px;
                height: 100%;
                display: flex;
                gap: 8px;
                min-height: 0;
            }
            .left-panel,
            .right-panel {
                flex: 1;
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .left-panel {
                overflow: hidden;
            }
            .right-panel {
                border: 1px solid #dbe7ff;
                border-radius: 8px;
                background: #f8fbff;
                padding: 8px;
            }
            .result-head {
                margin: 0 0 8px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
            }
            .result-head .panel-title {
                margin: 0;
            }
            .result-actions {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-shrink: 0;
            }
            .result-btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 4px 10px;
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                margin: 0;
                transform: none;
                box-shadow: none;
            }
            .result-btn:hover {
                border-color: var(--primary);
                color: var(--primary);
                transform: none;
                box-shadow: none;
            }
            .result-btn.qr-btn {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 4px 10px;
                border-style: dashed;
                border-color: #7a94c8;
                background: #f8fbff;
                color: #3c5a94;
            }
            .result-btn.qr-btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .result-btn.qr-btn svg {
                display: block;
                flex-shrink: 0;
            }
            .panel-title {
                margin: 0 0 8px;
                font-size: 13px;
                font-weight: 700;
                color: var(--text);
            }
            .form-group {
                margin-bottom: 12px;
            }
            label {
                display: block;
                margin-bottom: 6px;
                font-size: 13px;
                font-weight: 600;
                color: var(--text);
            }
            input,
            textarea {
                width: 100%;
                padding: 8px 10px;
                margin-bottom: 8px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                outline: none;
                font-size: 13px;
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
            }
            input:focus,
            textarea:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.15);
            }
            button {
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
                color: #fff;
                padding: 7px 12px;
                border: 0;
                border-radius: 6px;
                cursor: pointer;
                margin: 4px 4px 4px 0;
                font-size: 12px;
                font-weight: 600;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }
            button:hover {
                transform: translateY(-1px);
                box-shadow: 0 8px 16px rgba(36, 90, 190, 0.25);
            }
            #result {
                flex: 1;
                padding: 8px;
                background: #fff;
                border: 1px solid #dbe7ff;
                border-radius: 8px;
                min-height: 0;
                overflow: auto;
            }
            #result pre {
                margin: 0;
                white-space: pre-wrap;
                word-break: break-all;
            }
            .model-container {
                border: 1px solid #dbe7ff;
                padding: 8px;
                margin: 8px 0;
                border-radius: 8px;
                background: #f9fbff;
            }
            .model-header {
                margin-bottom: 8px;
                font-weight: 700;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
            }
            .config-item {
                border: 1px solid #dbe7ff;
                padding: 8px;
                margin: 8px 0;
                border-radius: 8px;
                background: #fff;
                display: flex;
                flex-direction: column;
            }
            .config-item button {
                margin-top: 5px;
                align-self: flex-end;
            }
            .duplicate-key {
                border-color: #ff8383 !important;
                background-color: #fff0f0;
            }
            #models {
                flex: 1;
                overflow: auto;
                padding-right: 4px;
                min-height: 0;
            }
            .actions {
                display: flex;
                gap: 8px;
                flex-wrap: nowrap;
                overflow-x: auto;
                margin-top: 4px;
                padding-top: 8px;
                border-top: 1px solid #dbe7ff;
                background: var(--card);
            }
            .actions button {
                margin: 0;
                flex-shrink: 0;
            }
            @media (max-width: 900px) {
                .container {
                    flex-direction: column;
                }
            }
        </style>
    
    <!-- 外壳注入：清除 body/根容器内边距 + 隐藏根滚动条，使工具内容宽度与导航栏一致（file:// 跨域下由页面自带） -->
    <style id="tool-shell-flush">
        body{padding:0!important;}
        body>*{padding:0!important;margin:0!important;}
        html::-webkit-scrollbar{width:0!important;height:0!important;}
        html{scrollbar-width:none!important;}
    </style>
    </head>
    <body>
        <div class="page">
            <div class="container">
                <div class="left-panel">
                    <h3 class="panel-title">输入配置</h3>
                    <div id="models">
                        <div class="model-container">
                            <div class="model-header">
                                <span>模型 1</span>
                                <button class="danger-btn tool-btn-danger" onclick="removeModel(this)">删除模型</button>
                            </div>
                            <div class="form-group">
                                <label for="model1-configFiles"
                                    >配置文件（多个文件用英文逗号分隔,例如：application-stg,application-prd,site_cm_common）:</label
                                >
                                <input
                                    id="model1-configFiles"
                                    placeholder="例如：application-prd,site_cm_common"
                                />
                            </div>
                            <div id="model1-configItems">
                                <div class="config-item">
                                    <label>配置项 1:</label>
                                    <input
                                        placeholder="键（例如：common.dp.conf.esg.ocr）"
                                        class="configKey"
                                        onblur="checkDuplicateKey(this)"
                                    />
                                    <input
                                        placeholder="值（例如：Y）"
                                        class="configValue"
                                    />
                                    <button class="danger-btn tool-btn-danger" onclick="removeConfigItem(this)">
                                        删除配置项
                                    </button>
                                </div>
                            </div>
                            <button onclick="addConfigItem(this)">添加配置项</button>
                        </div>
                    </div>
                    <div class="actions">
                        <button onclick="addModel()">添加模型</button>
                        <button onclick="generateScript()">生成</button>
                        <button type="button" class="danger-btn tool-btn-danger" data-tool-form-clear onclick="clearShellForm()">清空</button>
                    </div>
                </div>
                <div class="right-panel">
                    <div class="result-head">
                        <h3 class="panel-title">生成结果</h3>
                        <div class="result-actions">
                            <button type="button" class="result-btn" id="btn-copy-result">复制</button>
                            <button type="button" class="result-btn" onclick="downloadScript()">下载</button>
                            <button type="button" class="result-btn qr-btn" id="btn-qr-result" title="生成二维码">
                                <span>二维码</span>
                                <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                                    <path
                                        fill="currentColor"
                                        d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zM14 13h2v3h-2v-3zm3 3h2v2h-2v-2zm-3 3h3v2h-3v-2zm3-3h2v2h-2v-2z"
                                    ></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div id="result"></div>
                </div>
            </div>
        </div>
        <script src="libs/tool-copy.js"></script>
        <script src="libs/qrcode-lib.bundle.js"></script>
        <script src="libs/tool-qr.js"></script>
        <script>
const SHELL_FORM_STORAGE_KEY = "shell_script_tool_form_v1";
let modelCount = 1; // 跟踪模型的数量
let scriptContent = ''; // 用于保存生成的脚本内容
let allKeys = new Set(); // 存储所有配置项 key，用于去重校验

function addModel() {
                const modelsDiv = document.getElementById('models');
                modelCount++;
                const newModel = document.createElement('div');
                newModel.className = 'model-container';
                newModel.innerHTML = `
                    <div class="model-header">
                        <span>模型 ${modelCount}</span>
                            <button class="danger-btn tool-btn-danger" onclick="removeModel(this)">删除模型</button>
                    </div>
                    <div class="form-group">
                        <label for="model${modelCount}-configFiles">配置文件（多个文件用逗号分隔）:</label>
                        <input type="text" id="model${modelCount}-configFiles" placeholder="例如：application-prd,site_cm_common">
                    </div>
                    <div id="model${modelCount}-configItems">
                        <!-- 配置项将动态添加在此处 -->
                        <div class="config-item">
                            <label>配置项 1:</label>
                            <input type="text" placeholder="键（例如：common.dp.conf.esg.ocr）" class="configKey" onblur="checkDuplicateKey(this)">
                            <input type="text" placeholder="值（例如：Y）" class="configValue">
                            <button class="danger-btn tool-btn-danger" onclick="removeConfigItem(this)">删除配置项</button>
                        </div>
                    </div>
                    <button onclick="addConfigItem(this)">添加配置项</button>
                `;
                modelsDiv.appendChild(newModel);
                persistShellForm();
            }


 function removeModel(button) {
                const modelContainer = button.parentElement.parentElement;
                modelContainer.remove();
                persistShellForm();
            }

            function addConfigItem(button) {
                const modelId = button.previousElementSibling.id.split('-')[0];
                const configItemsDiv = document.getElementById(`${modelId}-configItems`);
                const configItemCount = configItemsDiv.children.length + 1;
                const newItem = document.createElement('div');
                newItem.className = 'config-item';
                newItem.innerHTML = `
                    <label>配置项 ${configItemCount}:</label>
                    <input type="text" placeholder="键（例如：common.dp.conf.esg.ocr）" class="configKey" onblur="checkDuplicateKey(this)">
                    <input type="text" placeholder="值（例如：Y）" class="configValue">
                    <button class="danger-btn tool-btn-danger" onclick="removeConfigItem(this)">删除配置项</button>
                `;
                configItemsDiv.appendChild(newItem);
                persistShellForm();
            }
  function removeConfigItem(button) {
                const configItem = button.parentElement;
                const configItemsDiv = configItem.parentElement;
                configItem.remove();
                persistShellForm();
            }

function checkDuplicateKey(input) {
                const key = input.value.trim();
                if (!key) return;

                const allKeyInputs = document.querySelectorAll('.configKey');
                let isDuplicate = false;

                allKeyInputs.forEach(otherInput => {
                    if (otherInput !== input) {
                        const otherKey = otherInput.value.trim();
                        if (otherKey === key) {
                            isDuplicate = true;
                        }
                    }
                });

                if (isDuplicate) {
                    alert('警告：配置项 key 重复，请确保每个 key 唯一！');
                    input.classList.add('duplicate-key');
                } else {
                    input.classList.remove('duplicate-key');
                }
            }

function generateScript() {
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = '';
                scriptContent = ''; // 重置脚本内容

                const allKeyInputs = document.querySelectorAll('.configKey');
                const allKeysSet = new Set();

                // 检查是否有重复 key
                for (let i = 0; i < allKeyInputs.length; i++) {
                    const key = allKeyInputs[i].value.trim();
                    if (key && allKeysSet.has(key)) {
                        alert('存在重复的配置项 key，请先修正！');
                        return;
                    }
                    if (key) allKeysSet.add(key);
                }

                const models = document.querySelectorAll('.model-container');

                models.forEach(model => {
                    const modelId = model.querySelector('input').id.split('-')[0];
                    const configFilesInput = document.getElementById(`${modelId}-configFiles`);
                    const configFiles = configFilesInput.value.split(',')
                        .map(file => file.trim())
                        .filter(file => file !== '')
                        .map(file => {
                            return file.endsWith('.properties') ? file : `${file}.properties`;
                        });

                    const configItems = model.querySelectorAll('.config-item');
                    const configs = [];

configItems.forEach(item => {
                        const key = item.querySelector('.configKey').value.trim();
                        const value = item.querySelector('.configValue').value.trim();
                        if (key && value) {
                            const escapedValue = value.includes('&') ? value.replace(/&/g, '\\&') : value;
                            configs.push({ key, value: escapedValue });
                        }
                    });

                    if (configFiles.length === 0 || configs.length === 0) {
                        alert('请填写所有必填信息');
                        return;
                    }

                    const filesWithConfigPath = configFiles.map(file => `config/${file}`);

                    scriptContent += `# 处理模型 ${modelId}\n`;

                    configs.forEach(config => {
                        const { key, value } = config;
                        filesWithConfigPath.forEach(file => {
                            scriptContent += `grep -q '${key}' ${file} && sed -i 's#^${key}=.*#${key}=${value}#g' ${file}\n`;
                            scriptContent += `grep -q '${key}' ${file} || echo '${key}=${value}' >> ${file}\n\n`;
                        });
                    });

                    scriptContent += '\n# 更新文件时间戳\n';
                    filesWithConfigPath.forEach(file => {
                        scriptContent += `touch ${file}\n`;
                    });

                    scriptContent += '\n';
                });

                resultDiv.innerHTML = `<pre>${scriptContent}</pre>`;
            }

function clearShellForm() {
                const modelsDiv = document.getElementById('models');
                modelsDiv.innerHTML = `
                    <div class="model-container">
                        <div class="model-header">
                            <span>模型 1</span>
                            <button class="danger-btn tool-btn-danger" onclick="removeModel(this)">删除模型</button>
                        </div>
                        <div class="form-group">
                            <label for="model1-configFiles">配置文件（多个文件用英文逗号分隔,例如：application-stg,application-prd,site_cm_common）:</label>
                            <input id="model1-configFiles" placeholder="例如：application-prd,site_cm_common">
                        </div>
                        <div id="model1-configItems">
                            <div class="config-item">
                                <label>配置项 1:</label>
                                <input placeholder="键（例如：common.dp.conf.esg.ocr）" class="configKey" onblur="checkDuplicateKey(this)">
                                <input placeholder="值（例如：Y）" class="configValue">
                                <button class="danger-btn tool-btn-danger" onclick="removeConfigItem(this)">删除配置项</button>
                            </div>
                        </div>
                        <button onclick="addConfigItem(this)">添加配置项</button>
                    </div>
                `;
                modelCount = 1;
                scriptContent = '';
                document.getElementById('result').innerHTML = '';
                try {
                    localStorage.removeItem(SHELL_FORM_STORAGE_KEY);
                } catch (e) {
                    // Ignore storage failure.
                }
                if (typeof ToolCopy !== 'undefined' && ToolCopy.toast) {
                    ToolCopy.toast('已清空');
                }
                setTimeout(function () {
                    document.querySelectorAll('input, textarea, select').forEach(function (field) {
                        field.dispatchEvent(new Event('input', { bubbles: true }));
                        field.dispatchEvent(new Event('change', { bubbles: true }));
                    });
                    if (window.ToolFormPersist && ToolFormPersist.saveNow) {
                        ToolFormPersist.saveNow();
                    }
                }, 0);
            }

function downloadScript() {
                // 先调用 generateScript() 以确保 scriptContent 是最新的
                generateScript();

                if (!scriptContent.trim()) {
                    alert('请先生成脚本内容');
                    return;
                }

                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const filename = `shell_${year}${month}${day}.sh`;

                const blob = new Blob([scriptContent], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }

function readShellFormState() {
                const models = Array.from(document.querySelectorAll('.model-container')).map((model) => {
                    const configFilesInput = model.querySelector('input[id$="-configFiles"]');
                    const configItems = Array.from(model.querySelectorAll('.config-item')).map((item) => {
                        const keyInput = item.querySelector('.configKey');
                        const valueInput = item.querySelector('.configValue');
                        return {
                            key: keyInput ? keyInput.value : '',
                            value: valueInput ? valueInput.value : ''
                        };
                    });
                    return {
                        configFiles: configFilesInput ? configFilesInput.value : '',
                        configItems: configItems
                    };
                });
                return {
                    models: models
                };
            }

function persistShellForm() {
                try {
                    localStorage.setItem(SHELL_FORM_STORAGE_KEY, JSON.stringify(readShellFormState()));
                } catch (e) {
                    // Ignore storage failure.
                }
            }

function restoreShellForm() {
                try {
                    const raw = localStorage.getItem(SHELL_FORM_STORAGE_KEY);
                    if (!raw) return;
                    const state = JSON.parse(raw);
                    if (!state || !Array.isArray(state.models) || state.models.length === 0) return;

                    const modelsDiv = document.getElementById('models');
                    modelsDiv.innerHTML = '';
                    modelCount = 0;

                    state.models.forEach((modelState, index) => {
                        modelCount = index + 1;
                        const modelId = "model" + modelCount;
                        const configItemsHtml = (modelState.configItems && modelState.configItems.length ? modelState.configItems : [{ key: '', value: '' }])
                            .map((item, itemIndex) => `
                                <div class="config-item">
                                    <label>配置项 ${itemIndex + 1}:</label>
                                    <input type="text" placeholder="键（例如：common.dp.conf.esg.ocr）" class="configKey" value="${(item.key || '').replace(/"/g, '&quot;')}" onblur="checkDuplicateKey(this)">
                                    <input type="text" placeholder="值（例如：Y）" class="configValue" value="${(item.value || '').replace(/"/g, '&quot;')}">
                                    <button class="danger-btn tool-btn-danger" onclick="removeConfigItem(this)">删除配置项</button>
                                </div>
                            `)
                            .join('');

                        const modelHtml = `
                            <div class="model-container">
                                <div class="model-header">
                                    <span>模型 ${modelCount}</span>
                                    <button class="danger-btn tool-btn-danger" onclick="removeModel(this)">删除模型</button>
                                </div>
                                <div class="form-group">
                                    <label for="${modelId}-configFiles">配置文件（多个文件用逗号分隔）:</label>
                                    <input type="text" id="${modelId}-configFiles" placeholder="例如：application-prd,site_cm_common" value="${(modelState.configFiles || '').replace(/"/g, '&quot;')}">
                                </div>
                                <div id="${modelId}-configItems">${configItemsHtml}</div>
                                <button onclick="addConfigItem(this)">添加配置项</button>
                            </div>
                        `;
                        modelsDiv.insertAdjacentHTML('beforeend', modelHtml);
                    });
                } catch (e) {
                    // Ignore restore errors.
                }
            }

document.addEventListener('input', function (e) {
                const t = e.target;
                if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) {
                    persistShellForm();
                }
            });
document.addEventListener('change', function (e) {
                const t = e.target;
                if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) {
                    persistShellForm();
                }
            });

function getResultText() {
                if (scriptContent && scriptContent.trim()) return scriptContent;
                const pre = document.querySelector('#result pre');
                return pre ? pre.textContent : '';
            }

document.getElementById('btn-copy-result').addEventListener('click', function () {
                const text = getResultText();
                if (!text.trim()) {
                    ToolCopy.copy('', { emptyMsg: '请先生成脚本' });
                    return;
                }
                ToolCopy.copy(text, { onLabelEl: this, labelText: '复制' });
            });

document.getElementById('btn-qr-result').addEventListener('click', function () {
                const text = getResultText();
                if (!text.trim()) {
                    ToolCopy.toast('请先生成脚本');
                    return;
                }
                ToolQr.toggle(text, this);
            });

restoreShellForm();
		</script>
        <script src="libs/tool-form-persist.js"></script>
    </body>
</html>
