<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>文本处理工具</title>
        <link rel="stylesheet" href="libs/tool-danger-btn.css" />
        <link rel="stylesheet" href="../vendor/codemirror/lib/codemirror.css" />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            :root {
                --card: #ffffff;
                --bg: #f3f7ff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --danger: #e04040;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
            }
            html, body {
                width: 100%;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
            }
            .page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                min-height: 0;
            }
            /* 主编辑区占满剩余高度，底部选项区与 Json工具 等页面一致 */
            .editor-wrap {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                overflow: hidden;
            }
            /* 与集合比较工具 / Json工具 的 .panel-title / .title-btn 一致 */
            .panel-title {
                padding: 8px 10px;
                font-size: 14px;
                color: #324a76;
                border-bottom: 1px solid #e4edff;
                background: #f8fbff;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .editor-head {
                flex: 0 0 auto;
                gap: 8px;
            }
            .editor-head-main {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 2px;
                min-width: 0;
                flex: 1;
            }
            .editor-head-title-row {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
            }
            .line-stats-hint {
                font-size: 12px;
                color: var(--muted);
            }
            .stat-line-summary {
                font-size: 13px;
                color: var(--muted);
                margin-bottom: 8px;
            }
            .editor-head .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
                flex-shrink: 0;
            }
            .title-btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 4px 10px;
                font-size: 13px;
                cursor: pointer;
            }
            .title-btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .title-btn:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }
            .title-btn.dotted {
                border-style: dashed;
            }
            .title-btn.handoff-btn,
            .title-btn.qr-btn {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                border-style: dashed;
                border-color: #7a94c8;
                background: #f8fbff;
                color: #3c5a94;
            }
            .title-btn.handoff-btn:hover,
            .title-btn.qr-btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .title-btn.handoff-btn svg,
            .title-btn.qr-btn svg {
                display: block;
                flex-shrink: 0;
            }
            .icon-paper-plane {
                fill: none;
            }
            .icon-paper-plane path {
                fill: none;
                stroke: currentColor;
                stroke-width: 1.6;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            /* 隐藏 textarea 仅用于父页 localStorage 字段恢复；实际编辑为本地 CodeMirror 5 */
            #main-input {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                border: 0;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                opacity: 0;
                pointer-events: none;
            }
            #editor-mount {
                flex: 1;
                width: 100%;
                min-height: 160px;
                position: relative;
                overflow: hidden;
                background: #fff;
            }
            #cm-editor {
                position: absolute;
                inset: 0;
            }
            #cm-editor .CodeMirror {
                height: 100%;
                font-family: Consolas, "Courier New", monospace;
                font-size: 14px;
                line-height: 1.6;
                color: var(--text);
            }
            #cm-editor .CodeMirror-scroll {
                min-height: 100%;
            }
            #cm-editor .CodeMirror-focused {
                box-shadow: inset 0 0 0 1px rgba(47, 107, 255, 0.25);
            }
            .ctool-page-option {
                flex: 0 0 auto;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                padding: 8px;
            }
            .align-row {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
                justify-content: center;
                align-items: center;
            }
            select.dd {
                min-height: 2rem;
                min-width: 6.5rem;
                max-width: 11rem;
                padding: 4px 8px;
                font-size: 14px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                background: #fff;
                color: var(--text);
                cursor: pointer;
            }
            select.dd:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.15);
                outline: none;
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 8px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 7px 12px;
                font-size: 14px;
                cursor: pointer;
                min-height: 2rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }
            .btn:hover { border-color: var(--primary); color: var(--primary); }
            .btn.primary {
                color: #fff;
                border-color: transparent;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            .btn.primary:hover { filter: brightness(1.05); color: #fff; }
            /* 弹窗：仅 [open] 时布局。勿对 dialog 写死 display，否则会覆盖浏览器默认的 display:none，导致未打开也可见 */
            dialog.dlg-root[open] {
                position: fixed;
                inset: 0;
                width: 100%;
                max-width: 100vw;
                height: 100%;
                max-height: 100vh;
                margin: 0;
                padding: 16px;
                border: none;
                background: rgba(31, 42, 68, 0.4);
                box-sizing: border-box;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: auto;
            }
            dialog.dlg-root[open]::backdrop {
                background: transparent;
            }
            .dlg-panel {
                position: relative;
                width: 100%;
                max-width: 620px;
                max-height: min(90vh, 100% - 32px);
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .dlg-panel .dlg-h {
                flex-shrink: 0;
                padding: 10px 12px;
                font-size: 14px;
                font-weight: 600;
                border-bottom: 1px solid #e4edff;
                background: #f8fbff;
                color: var(--text);
            }
            .dlg-panel .dlg-b { flex: 1; min-height: 0; padding: 12px; overflow: auto; }
            .dlg-panel .dlg-f {
                flex-shrink: 0;
                padding: 10px 12px;
                border-top: 1px solid #e4edff;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                justify-content: flex-end;
                background: #fafcff;
            }
            .dlg-grid-2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            @media (max-width: 520px) { .dlg-grid-2 { grid-template-columns: 1fr; } }
            .field-label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
            textarea.modal-ta {
                width: 100%;
                min-height: 160px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                padding: 8px;
                font-size: 14px;
                font-family: Consolas, "Courier New", monospace;
                resize: vertical;
            }
            textarea.modal-ta:focus {
                border-color: var(--primary);
                outline: none;
                box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.12);
            }
            .row-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
            .escape-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 6px 10px;
                font-size: 13px;
            }
            .escape-grid label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
            .stat-tabs { display: flex; gap: 4px; margin-bottom: 10px; }
            .stat-tabs button {
                border: 1px solid #cfdcf7;
                background: #fff;
                padding: 7px 14px;
                font-size: 14px;
                border-radius: 8px;
                cursor: pointer;
                color: var(--text);
            }
            .stat-tabs button:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .stat-tabs button.active {
                border-color: var(--primary);
                color: #fff;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            .stat-panel { display: none; font-size: 14px; }
            .stat-panel.active { display: block; }
            table.stat-table { width: 100%; border-collapse: collapse; }
            table.stat-table th, table.stat-table td {
                border: 1px solid #e4edff;
                padding: 6px 8px;
                text-align: left;
            }
            table.stat-table th { background: #f8fbff; color: #324a76; }
            .explain-list { line-height: 1.6; color: var(--text); }
            .explain-list dt { font-weight: 600; margin-top: 8px; color: #324a76; }
            .explain-list dd { margin-left: 0; color: var(--muted); }
            #toast {
                position: fixed;
                bottom: 28px;
                left: 50%;
                transform: translateX(-50%) translateY(12px);
                padding: 8px 18px;
                background: rgba(31, 42, 68, 0.92);
                color: #fff;
                border-radius: 8px;
                font-size: 13px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease, transform 0.2s ease;
                z-index: 100000;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            }
            #toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            /* 悬浮于编辑区右上角的查找/替换面板（与 Json 工具一致） */
            .find-bar {
                position: absolute;
                top: 8px;
                right: 8px;
                z-index: 30;
                width: min(440px, calc(100% - 16px));
                padding: 8px 10px;
                font-size: 12px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                background: #fff;
                box-shadow: 0 6px 24px rgba(36, 90, 190, 0.18);
                pointer-events: auto;
            }
            .find-bar .btn {
                min-height: 1.75rem;
                padding: 0 10px;
                font-size: 12px;
            }
            .find-bar[hidden] { display: none !important; }
            .find-row {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 6px;
                margin-top: 4px;
            }
            .find-row:first-child { margin-top: 0; }
            .find-label {
                flex: 0 0 auto;
                width: 2.5rem;
                color: var(--muted);
                text-align: right;
            }
            .find-input {
                flex: 1 1 80px;
                min-width: 72px;
                max-width: 100%;
                height: 1.75rem;
                padding: 0 8px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                font-size: 12px;
                font-family: Consolas, "Courier New", monospace;
                outline: none;
            }
            .find-input:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.15);
            }
            .find-bar .btn-icon {
                min-width: 1.75rem;
                padding: 0 8px;
            }
            .find-count {
                color: var(--muted);
                font-size: 11px;
                min-width: 3.5rem;
            }
            .find-bar label.chk {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                cursor: pointer;
                color: #3c4f78;
                user-select: none;
            }
            .editor-head .hint {
                color: var(--muted);
                font-size: 13px;
            }
            #cm-editor .CodeMirror .cm-find-hl {
                background: rgba(255, 220, 120, 0.55);
                padding: 0 1px;
                border-radius: 2px;
            }
            #cm-editor .CodeMirror .cm-find-hl-current {
                background: rgba(255, 165, 60, 0.88);
                box-shadow: 0 0 0 1px rgba(200, 100, 0, 0.35);
            }
            /* 底部 Sheet 标签（与 Json 工具一致） */
            .json-sheet-bar {
                flex: 0 0 auto;
                display: flex;
                align-items: flex-end;
                min-height: 30px;
                padding: 0 10px 2px;
                background: #fff;
                overflow: hidden;
            }
            .json-sheet-strip {
                display: flex;
                align-items: flex-end;
                flex-wrap: nowrap;
                gap: 4px;
                min-width: 0;
                max-width: 100%;
                overflow-x: auto;
                overflow-y: hidden;
                scrollbar-width: thin;
            }
            .json-sheet-strip::-webkit-scrollbar {
                height: 4px;
            }
            .json-sheet-tabs {
                display: contents;
            }
            .json-sheet-tab {
                flex: 0 0 auto;
                display: inline-flex;
                align-items: center;
                max-width: 148px;
                height: 26px;
                padding: 0 10px;
                margin: 0;
                border: 1px solid #dbe4f0;
                border-radius: 4px 4px 0 0;
                background: #fff;
                color: #516078;
                font-size: 12px;
                font-weight: 400;
                cursor: pointer;
                user-select: none;
                position: relative;
                z-index: 1;
            }
            .json-sheet-tab:hover:not(.active) {
                background: #fafbfd;
                border-color: #cdd8ea;
                color: #3c4f78;
                z-index: 2;
            }
            .json-sheet-tab.active {
                background: #edf3ff;
                color: var(--primary);
                font-weight: 600;
                z-index: 3;
                border-color: #d8e5ff;
            }
            .json-sheet-tab .sheet-name {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                max-width: 120px;
            }
            .json-sheet-tab .sheet-rename-input {
                width: 96px;
                max-width: 120px;
                height: 22px;
                padding: 0 6px;
                font-size: 12px;
                border: 1px solid var(--primary);
                border-radius: 4px;
                outline: none;
                background: #fff;
            }
            .json-sheet-tab .sheet-close {
                flex: 0 0 auto;
                margin-left: 4px;
                width: 16px;
                height: 16px;
                padding: 0;
                border: none;
                border-radius: 3px;
                background: transparent;
                color: #7a879e;
                font-size: 14px;
                line-height: 1;
                cursor: pointer;
                opacity: 1;
            }
            .json-sheet-tab.active .sheet-close {
                color: #5a7fd4;
            }
            .json-sheet-tab .sheet-close:hover {
                background: rgba(224, 64, 64, 0.15);
                color: var(--danger);
            }
            .json-sheet-add {
                flex: 0 0 26px;
                width: 26px;
                height: 26px;
                margin: 0;
                padding: 0;
                border: none;
                border-radius: 4px;
                background: transparent;
                font-size: 18px;
                line-height: 1;
                color: #8a9bb8;
                cursor: pointer;
            }
            .json-sheet-add:hover {
                background: #f0f5ff;
                color: var(--primary);
            }
            #text-sheets-meta {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                border: 0;
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="editor-wrap">
                <div class="editor-head panel-title">
                    <div class="editor-head-main">
                        <div class="editor-head-title-row">
                            <span>文本内容</span>
                            <span class="hint" title="底部可切换多个文本工作表，双击标签可重命名">多工作表 · Ctrl+F 查找 · Ctrl+H 替换</span>
                        </div>
                        <span id="editor-line-stats" class="line-stats-hint">共 0 行 · 重复 0 行</span>
                    </div>
                    <div class="actions">
                        <button type="button" class="title-btn dotted" id="btn-stat-preview" title="打开详细统计">统计预览…</button>
                        <button type="button" class="title-btn handoff-btn" id="btn-excel-sql" title="将各工作表中符合 CSV 格式的文本导入 Excel SQL 查询工具">
                            <span>Excel SQL</span>
                            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" class="icon-paper-plane">
                                <path d="M22 2L11 13"></path>
                                <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
                            </svg>
                        </button>
                        <button type="button" class="title-btn" id="btn-copy">复制</button>
                        <button type="button" class="title-btn qr-btn" id="btn-qr" title="生成二维码">
                            <span>二维码</span>
                            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                                <path
                                    fill="currentColor"
                                    d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zM14 13h2v3h-2v-3zm3 3h2v2h-2v-2zm-3 3h3v2h-3v-2zm3-3h2v2h-2v-2z"
                                ></path>
                            </svg>
                        </button>
                        <button type="button" class="title-btn danger" id="btn-clear">清空</button>
                    </div>
                </div>
                <div id="editor-mount">
                    <textarea id="main-input" data-persist-key="text_input" tabindex="-1" aria-hidden="true"></textarea>
                    <div id="cm-editor"></div>
                    <div id="find-bar" class="find-bar" hidden>
                        <div class="find-row">
                            <span class="find-label">查找</span>
                            <input type="text" id="find-input" class="find-input" autocomplete="off" spellcheck="false" placeholder="查找内容" />
                            <button type="button" class="btn find-icon btn-icon" id="find-prev" title="上一个 (Shift+Enter)">↑</button>
                            <button type="button" class="btn find-icon btn-icon" id="find-next" title="下一个 (Enter)">↓</button>
                            <label class="chk"><input type="checkbox" id="find-case" />区分大小写</label>
                            <span id="find-count" class="find-count"></span>
                            <button type="button" class="btn btn-icon" id="find-close" title="关闭 (Esc)">×</button>
                        </div>
                        <div class="find-row" id="find-replace-row" hidden>
                            <span class="find-label">替换</span>
                            <input type="text" id="find-replace-input" class="find-input" autocomplete="off" spellcheck="false" placeholder="替换为" />
                            <button type="button" class="btn" id="find-rep-one">替换</button>
                            <button type="button" class="btn" id="find-rep-all">全部替换</button>
                        </div>
                    </div>
                </div>
                <div class="json-sheet-bar" id="text-sheet-bar">
                    <div class="json-sheet-strip">
                        <div class="json-sheet-tabs" id="text-sheet-tabs" role="tablist" aria-label="文本工作表"></div>
                        <button type="button" class="json-sheet-add" id="text-sheet-add" title="新建工作表">+</button>
                    </div>
                </div>
                <textarea id="text-sheets-meta" data-persist-key="text_sheets_state" aria-hidden="true" tabindex="-1"></textarea>
            </div>

            <div class="ctool-page-option">
                <div class="align-row">
                    <select id="dd-case" class="dd" title="大小写转换">
                        <option value="">大小写转换</option>
                        <option value="upper">全部大写</option>
                        <option value="lower">全部小写</option>
                        <option value="upperLineStart">行首大写</option>
                        <option value="lowerLineStart">行首小写</option>
                        <option value="upperStart">词首大写</option>
                        <option value="lowerStart">词首小写</option>
                    </select>
                    <select id="dd-punct" class="dd" title="标点符号">
                        <option value="">标点符号</option>
                        <option value="zh">英文标点 → 中文标点</option>
                        <option value="en">中文标点 → 英文标点</option>
                    </select>
                    <select id="dd-zh" class="dd" title="简繁转换（离线）">
                        <option value="">简繁转换</option>
                        <option value="simplified">简体 → 繁体</option>
                        <option value="traditional">繁体 → 简体</option>
                    </select>
                    <button type="button" class="btn" id="btn-replace">替换</button>
                    <button type="button" class="btn" id="btn-escape">转义</button>
                    <button type="button" class="btn" id="btn-dedupe">去除重复行</button>
                    <select id="dd-rename" class="dd" title="命名规范（英文标识）">
                        <option value="">命名规范</option>
                        <option value="kebabCase">kebab-case</option>
                        <option value="upperSnakeCase">SNAKE_CASE</option>
                        <option value="pascalCase">CamelCase</option>
                        <option value="camelCase">camelCase</option>
                        <option value="lowerSnakeCase">snake_case</option>
                    </select>
                    <select id="dd-line" class="dd" title="行号">
                        <option value="">行号</option>
                        <option value="addLineIndex">添加行号</option>
                        <option value="removeLineIndex">移除行号</option>
                    </select>
                    <select id="dd-sort" class="dd" title="行顺序调整">
                        <option value="">行顺序调整</option>
                        <option value="line_asc">升序排序</option>

        <div id="toast" role="status" aria-live="polite"></div>

        <script src="../vendor/codemirror/lib/codemirror.js"></script>
        <script src="../vendor/zh-tran/zh-tran-offline.js"></script>
        <script src="libs/tool-copy.js"></script>
        <script src="libs/qrcode-lib.bundle.js"></script>
        <script src="libs/tool-qr.js"></script>
        <script>
            (function () {
                if (typeof CodeMirror === "undefined") {
                    alert("编辑器脚本缺失：请先在项目根目录执行 npm install（生成 vendor/codemirror）。");
                    return;
                }

                var persistTa = document.getElementById("main-input");
                var sheetsMetaInput = document.getElementById("text-sheets-meta");
                var sheetTabsEl = document.getElementById("text-sheet-tabs");
                var sheetAddBtn = document.getElementById("text-sheet-add");
                var cmMount = document.getElementById("cm-editor");
                var findBar = document.getElementById("find-bar");
                var findInput = document.getElementById("find-input");
                var findReplaceRow = document.getElementById("find-replace-row");
                var replaceInput = document.getElementById("find-replace-input");
                var findCase = document.getElementById("find-case");
                var findCountEl = document.getElementById("find-count");

                var afterDocChange = function () {};
                var refreshFindHighlights = function () {};

                var editor = CodeMirror(cmMount, {
                    value: "",
                    lineNumbers: true,
                    mode: null,
                    theme: "default",
                    indentWithTabs: false,
                    indentUnit: 4,
                    tabSize: 4,
                    lineWrapping: false,
                    autofocus: false,
                    spellcheck: false,
                    inputStyle: "textarea",
                    extraKeys: {
                        "Ctrl-F": function () {
                            handleFindShortcut();
                        },
                        "Cmd-F": function () {
                            handleFindShortcut();
                        },
                        "Ctrl-H": function () {
                            openFind(true);
                        },
                        "Shift-Ctrl-F": function () {
                            openFind(true);
                        },
                        "Cmd-Alt-F": function () {
                            openFind(true);
                        },
                    },
                });

                function getInputValue() {
                    return editor.getValue();
                }
                /** 全文替换但保留 CodeMirror 撤销栈（底部工具与 Ctrl+Z） */
                function setInputValue(text) {
                    var cur = editor.getValue();
                    var next = text == null ? "" : String(text);
                    if (cur === next) {
                        var sh = getActiveSheet();
                        if (sh) sh.content = next;
                        persistTa.value = next;
                        return;
                    }
                    var doc = editor.getDoc();
                    var end = doc.posFromIndex(cur.length);
                    doc.replaceRange(next, { line: 0, ch: 0 }, end);
                    var sheet = getActiveSheet();
                    if (sheet) sheet.content = next;
                    persistTa.value = next;
                }

                function syncEditorToPersist() {
                    var t = editor.getValue();
                    if (persistTa.value !== t) persistTa.value = t;
                    var sheet = getActiveSheet();
                    if (sheet) sheet.content = t;
                }

                /* —— 多 Sheet（与 Json 工具一致） —— */
                var docSheets = [];
                var activeSheetId = null;
                var sheetRenameId = null;
                var _sheetPersistTimer = null;

                function genSheetId() {
                    return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
                }

                function getActiveSheet() {
                    for (var i = 0; i < docSheets.length; i++) {
                        if (docSheets[i].id === activeSheetId) return docSheets[i];
                    }
                    return null;
                }

                function nextSheetName() {
                    var used = {};
                    for (var i = 0; i < docSheets.length; i++) used[docSheets[i].name] = true;
                    var n = 1;
                    while (used["Sheet" + n]) n++;
                    return "Sheet" + n;
                }

                function persistSheetsState() {
                    syncEditorToPersist();
                    if (!docSheets.length) return;
                    var state = { activeId: activeSheetId, sheets: docSheets };
                    sheetsMetaInput.value = JSON.stringify(state);
                    sheetsMetaInput.dispatchEvent(new Event("input", { bubbles: true }));
                }

                function schedulePersistSheets() {
                    clearTimeout(_sheetPersistTimer);
                    _sheetPersistTimer = setTimeout(persistSheetsState, 400);
                }

                function applyActiveSheetToEditor() {
                    var sheet = getActiveSheet();
                    var content = sheet ? String(sheet.content == null ? "" : sheet.content) : "";
                    if (sheet) sheet.content = content;
                    editor.setValue(content);
                    persistTa.value = content;
                    afterDocChange();
                }

                function initSheetsFromStorage() {
                    var legacy = persistTa.value ? String(persistTa.value) : "";
                    if (sheetsMetaInput.value) {
                        try {
                            var state = JSON.parse(sheetsMetaInput.value);
                            if (state && state.sheets && state.sheets.length) {
                                docSheets = state.sheets.map(function (s) {
                                    return {
                                        id: s.id || genSheetId(),
                                        name: String(s.name || "Sheet1"),
                                        content: s.content == null ? "" : String(s.content),
                                    };
                                });
                                activeSheetId = state.activeId;
                                if (!getActiveSheet()) activeSheetId = docSheets[0].id;
                                return;
                            }
                        } catch (e) {
                            /* 损坏的存储，回退为单表 */
                        }
                    }
                    docSheets = [{ id: genSheetId(), name: "Sheet1", content: legacy }];
                    activeSheetId = docSheets[0].id;
                }

                function switchSheet(sheetId) {
                    if (!sheetId || sheetId === activeSheetId) return;
                    syncEditorToPersist();
                    activeSheetId = sheetId;
                    applyActiveSheetToEditor();
                    if (typeof resetFindNavigation === "function") resetFindNavigation();
                    renderSheetTabs();
                    if (typeof refreshFindHighlights === "function") refreshFindHighlights();
                    persistSheetsState();
                }

                function addSheet() {
                    syncEditorToPersist();
                    var sheet = {
                        id: genSheetId(),
                        name: nextSheetName(),
                        content: "",
                    };
                    docSheets.push(sheet);
                    switchSheet(sheet.id);
                    showToast("已新建 " + sheet.name);
                }

                function removeSheet(sheetId) {
                    if (docSheets.length <= 1) {
                        showToast("至少保留一个工作表");
                        return;
                    }
                    var idx = -1;
                    for (var i = 0; i < docSheets.length; i++) {
                        if (docSheets[i].id === sheetId) {
                            idx = i;
                            break;
                        }
                    }
                    if (idx < 0) return;
                    var removed = docSheets.splice(idx, 1)[0];
                    if (activeSheetId === sheetId) {
                        var next = docSheets[Math.min(idx, docSheets.length - 1)];
                        activeSheetId = next.id;
                        applyActiveSheetToEditor();
                        if (typeof resetFindNavigation === "function") resetFindNavigation();
                    }
                    renderSheetTabs();
                    persistSheetsState();
                    showToast("已删除 " + removed.name);
                }

                function renameSheet(sheetId, newName) {
                    var name = String(newName || "").trim();
                    if (!name) {
                        showToast("名称不能为空");
                        return false;
                    }
                    for (var i = 0; i < docSheets.length; i++) {
                        if (docSheets[i].id !== sheetId && docSheets[i].name === name) {
                            showToast("名称已存在");
                            return false;
                        }
                    }
                    for (var j = 0; j < docSheets.length; j++) {
                        if (docSheets[j].id === sheetId) {
                            docSheets[j].name = name;
                            break;
                        }
                    }
                    renderSheetTabs();
                    persistSheetsState();
                    return true;
                }

                function startSheetRename(sheetId) {
                    sheetRenameId = sheetId;
                    renderSheetTabs();
                    var tab = sheetTabsEl.querySelector('[data-sheet-id="' + sheetId + '"]');
                    if (!tab) return;
                    var input = tab.querySelector(".sheet-rename-input");
                    if (input) {
                        input.focus();
                        input.select();
                    }
                }

                function finishSheetRename(sheetId, value, cancel) {
                    sheetRenameId = null;
                    if (!cancel) renameSheet(sheetId, value);
                    renderSheetTabs();
                }

                function renderSheetTabs() {
                    if (!sheetTabsEl) return;
                    sheetTabsEl.innerHTML = "";
                    for (var i = 0; i < docSheets.length; i++) {
                        (function (sheet) {
                            var tab = document.createElement("button");
                            tab.type = "button";
                            tab.className =
                                "json-sheet-tab" + (sheet.id === activeSheetId ? " active" : "");
                            tab.setAttribute("data-sheet-id", sheet.id);
                            tab.setAttribute("role", "tab");
                            tab.setAttribute("aria-selected", sheet.id === activeSheetId ? "true" : "false");
                            tab.title = sheet.name + "（双击重命名）";

                            if (sheetRenameId === sheet.id) {
                                var inp = document.createElement("input");
                                inp.type = "text";
                                inp.className = "sheet-rename-input";
                                inp.value = sheet.name;
                                inp.addEventListener("click", function (e) {
                                    e.stopPropagation();
                                });
                                inp.addEventListener("keydown", function (e) {
                                    if (e.key === "Enter") {
                                        e.preventDefault();
                                        finishSheetRename(sheet.id, inp.value, false);
                                    } else if (e.key === "Escape") {
                                        e.preventDefault();
                                        finishSheetRename(sheet.id, "", true);
                                    }
                                });
                                inp.addEventListener("blur", function () {
                                    finishSheetRename(sheet.id, inp.value, false);
                                });
                                tab.appendChild(inp);
                            } else {
                                var span = document.createElement("span");
                                span.className = "sheet-name";
                                span.textContent = sheet.name;
                                tab.appendChild(span);
                                tab.addEventListener("dblclick", function (e) {
                                    e.preventDefault();
                                    e.stopPropagation();
                                    startSheetRename(sheet.id);
                                });
                            }

                            if (docSheets.length > 1) {
                                var closeBtn = document.createElement("button");
                                closeBtn.type = "button";
                                closeBtn.className = "sheet-close";
                                closeBtn.title = "删除工作表";
                                closeBtn.textContent = "×";
                                closeBtn.addEventListener("click", function (e) {
                                    e.stopPropagation();
                                    removeSheet(sheet.id);
                                });
                                tab.appendChild(closeBtn);
                            }

                            tab.addEventListener("click", function () {
                                if (sheetRenameId) return;
                                switchSheet(sheet.id);
                            });

                            sheetTabsEl.appendChild(tab);
                        })(docSheets[i]);
                    }
                }

                sheetAddBtn.addEventListener("click", addSheet);

                initSheetsFromStorage();
                applyActiveSheetToEditor();
                renderSheetTabs();
                persistSheetsState();

                window.addEventListener("load", function () {
                    if (sheetsMetaInput.value) {
                        initSheetsFromStorage();
                        applyActiveSheetToEditor();
                        renderSheetTabs();
                        persistSheetsState();
                    }
                });

                editor.on("change", function () {
                    syncEditorToPersist();
                    schedulePersistSheets();
                    afterDocChange();
                    if (findBar && !findBar.hidden && findInput && findInput.value) refreshFindHighlights();
                });

                persistTa.addEventListener("input", function () {
                    var v = persistTa.value;
                    if (v !== editor.getValue()) {
                        editor.setValue(v);
                        var sheet = getActiveSheet();
                        if (sheet) sheet.content = v;
                    }
                });

                /** 焦点在底部按钮/下拉等处时，Ctrl+Z / Ctrl+Y 仍作用在主编辑器（弹窗内输入框保持自带撤销） */
                function globalUndoRedoAction(e) {
                    if (!e.ctrlKey && !e.metaKey) return null;
                    var k = (e.key || "").toLowerCase();
                    if (k === "z" && !e.shiftKey) return "undo";
                    if (k === "y") return "redo";
                    if (k === "z" && e.shiftKey) return "redo";
                    return null;
                }
                document.addEventListener("keydown", function (e) {
                    var action = globalUndoRedoAction(e);
                    if (!action) return;
                    var el = e.target;
                    if (el && el.closest && el.closest("dialog[open]")) return;
                    if (el && el.closest && el.closest("#cm-editor")) return;
                    var tag = el && el.tagName;
                    if ((tag === "INPUT" || tag === "TEXTAREA") && el && el.closest && !el.closest("#cm-editor")) return;
                    e.preventDefault();
                    editor.focus();
                    if (action === "undo") CodeMirror.commands.undo(editor);
                    else CodeMirror.commands.redo(editor);
                }, true);

                /* —— 查找 / 替换（与 Json 工具条一致，交互对齐 Ctool Monaco：Ctrl+F / Ctrl+H） —— */
                var findMarks = [];
                var findNavMatchIndex = -1;

                function resetFindNavigation() {
                    findNavMatchIndex = -1;
                }

                editor.getWrapperElement().addEventListener("mousedown", function () {
                    resetFindNavigation();
                });

                function getMatchPositions(text, needle, caseSens) {
                    var res = [];
                    if (!needle) return res;
                    if (caseSens) {
                        var pos = 0;
                        var step = Math.max(1, needle.length);
                        while ((pos = text.indexOf(needle, pos)) !== -1) {
                            res.push({ start: pos, end: pos + needle.length });
                            pos += step;
                        }
                    } else {
                        var lower = text.toLowerCase();
                        var n = needle.toLowerCase();
                        var pos2 = 0;
                        var step2 = Math.max(1, n.length);
                        while ((pos2 = lower.indexOf(n, pos2)) !== -1) {
                            res.push({ start: pos2, end: pos2 + needle.length });
                            pos2 += step2;
                        }
                    }
                    return res;
                }

                function cmGetSelOffsets() {
                    var a = editor.indexFromPos(editor.getCursor("from"));
                    var b = editor.indexFromPos(editor.getCursor("to"));
                    return { start: Math.min(a, b), end: Math.max(a, b) };
                }

                function cmSetSelOffsets(start, end, focusEditor) {
                    if (focusEditor !== false) editor.focus();
                    var a = editor.posFromIndex(start);
                    var b = editor.posFromIndex(end);
                    editor.setSelection(a, b);
                    editor.scrollIntoView({ from: a, to: b });
                }

                function activeEditorHasSelection() {
                    var ae = document.activeElement;
                    if (editor && editor.getWrapperElement().contains(ae)) {
                        return editor.somethingSelected();
                    }
                    return false;
                }

                function focusFindInput(selectAll) {
                    setTimeout(function () {
                        findInput.focus();
                        if (selectAll && findInput.value) {
                            findInput.select();
                        } else {
                            var len = findInput.value.length;
                            findInput.setSelectionRange(len, len);
                        }
                    }, 0);
                }

                function handleFindShortcut() {
                    if (!findBar.hidden) {
                        if (activeEditorHasSelection()) {
                            findInput.value = editor.getSelection();
                            resetFindNavigation();
                            focusFindInput(true);
                        } else {
                            focusFindInput(false);
                        }
                        return;
                    }
                    openFind(false);
                }

                function clearFindMarks() {
                    while (findMarks.length) {
                        var m = findMarks.pop();
                        if (m && m.clear) m.clear();
                    }
                }

                refreshFindHighlights = function () {
                    var on = !findBar.hidden && findInput.value.length > 0;
                    clearFindMarks();
                    if (on) {
                        var needle = findInput.value;
                        var text = editor.getValue();
                        var caseSens = findCase.checked;
                        var positions = getMatchPositions(text, needle, caseSens);
                        var sel = cmGetSelOffsets();
                        for (var pi = 0; pi < positions.length; pi++) {
                            var p = positions[pi];
                            var isCur =
                                (p.start === sel.start && p.end === sel.end) ||
                                (sel.start === sel.end && sel.start >= p.start && sel.start < p.end);
                            findMarks.push(
                                editor.markText(editor.posFromIndex(p.start), editor.posFromIndex(p.end), {
                                    className: "cm-find-hl" + (isCur ? " cm-find-hl-current" : ""),
                                })
                            );
                        }
                    }
                };

                function replaceAllString(text, needle, repl, caseSens) {
                    if (!needle) return text;
                    var esc = needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                    var re = new RegExp(esc, caseSens ? "g" : "gi");
                    return text.replace(re, function () {
                        return repl;
                    });
                }

                function selectionMatchesFind(needle, caseSens) {
                    if (!needle) return false;
                    var fr = editor.getCursor("from");
                    var to = editor.getCursor("to");
                    var s = editor.getRange(fr, to);
                    return caseSens ? s === needle : s.toLowerCase() === needle.toLowerCase();
                }

                function updateFindCount() {
                    var needle = findInput.value;
                    if (!needle) {
                        findCountEl.textContent = "";
                        refreshFindHighlights();
                        return;
                    }
                    var text = editor.getValue();
                    var positions = getMatchPositions(text, needle, findCase.checked);
                    if (!positions.length) {
                        findCountEl.textContent = "无匹配";
                        refreshFindHighlights();
                        return;
                    }
                    var o = cmGetSelOffsets();
                    var s = o.start;
                    var e = o.end;
                    var idx = -1;
                    for (var i = 0; i < positions.length; i++) {
                        if (positions[i].start === s && positions[i].end === e) {
                            idx = i;
                            break;
                        }
                    }
                    if (idx < 0) {
                        for (var j = 0; j < positions.length; j++) {
                            if (s >= positions[j].start && s < positions[j].end) {
                                idx = j;
                                break;
                            }
                        }
                    }
                    findCountEl.textContent = (idx >= 0 ? idx + 1 : "—") + " / " + positions.length;
                    refreshFindHighlights();
                }

                function findNext(keepFindFocus) {
                    var needle = findInput.value;
                    if (!needle) {
                        updateFindCount();
                        return;
                    }
                    var text = editor.getValue();
                    var positions = getMatchPositions(text, needle, findCase.checked);
                    if (!positions.length) {
                        findCountEl.textContent = "无匹配";
                        refreshFindHighlights();
                        return;
                    }
                    var i;
                    if (findNavMatchIndex < 0) {
                        var wrap = editor.getWrapperElement();
                        var from = wrap.contains(document.activeElement)
                            ? editor.indexFromPos(editor.getCursor("head"))
                            : 0;
                        var qi;
                        for (qi = 0; qi < positions.length; qi++) {
                            var pm = positions[qi];
                            if (from > pm.start && from < pm.end) {
                                from = pm.end;
                                break;
                            }
                        }
                        i = positions.findIndex(function (p) {
                            return p.start >= from;
                        });
                        if (i === -1) i = 0;
                    } else {
                        i = findNavMatchIndex + 1;
                        if (i >= positions.length) i = 0;
                    }
                    findNavMatchIndex = i;
                    var p = positions[i];
                    cmSetSelOffsets(p.start, p.end, !keepFindFocus);
                    if (keepFindFocus) findInput.focus();
                    updateFindCount();
                }

                function findPrev(keepFindFocus) {
                    var needle = findInput.value;
                    if (!needle) {
                        updateFindCount();
                        return;
                    }
                    var text = editor.getValue();
                    var positions = getMatchPositions(text, needle, findCase.checked);
                    if (!positions.length) {
                        findCountEl.textContent = "无匹配";
                        refreshFindHighlights();
                        return;
                    }
                    var i;
                    if (findNavMatchIndex < 0) {
                        var wrap2 = editor.getWrapperElement();
                        var from = wrap2.contains(document.activeElement)
                            ? editor.indexFromPos(editor.getCursor("head"))
                            : editor.getValue().length;
                        var qj;
                        for (qj = 0; qj < positions.length; qj++) {
                            var pn = positions[qj];
                            if (from > pn.start && from < pn.end) {
                                from = pn.start;
                                break;
                            }
                        }
                        i = -1;
                        for (var k = positions.length - 1; k >= 0; k--) {
                            if (positions[k].start < from) {
                                i = k;
                                break;
                            }
                        }
                        if (i === -1) i = positions.length - 1;
                    } else {
                        i = findNavMatchIndex - 1;
                        if (i < 0) i = positions.length - 1;
                    }
                    findNavMatchIndex = i;
                    var p = positions[i];
                    cmSetSelOffsets(p.start, p.end, !keepFindFocus);
                    if (keepFindFocus) findInput.focus();
                    updateFindCount();
                }

                function openFind(withReplace) {

                    findReplaceRow.hidden = !withReplace;
                    resetFindNavigation();

                    focusFindInput(hasSel);
                    updateFindCount();

                function closeFind() {
                    findBar.setAttribute("hidden", "");

                    refreshFindHighlights();

                function replaceOne() {

                findInput.addEventListener("keydown", function (e) {

                replaceInput.addEventListener("keydown", function (e) {

                window.addEventListener(
                    "keydown",
                    function (e) {
                        var mod = e.ctrlKey || e.metaKey;
                        var k = String(e.key || "").toLowerCase();
                        if (mod && k === "f") {
                            e.preventDefault();

                    },

                refreshFindHighlights();

                var spaceCaseToPascalCaseSpace = "spaceCaseToPascalCaseSpace";
                var pascalCaseSpaceToKebabCase = "pascalCaseSpaceToKebabCase";
                var kebabCaseToUpperSnakeCase = "kebabCaseToUpperSnakeCase";
                var upperSnakeCaseToPascalCase = "upperSnakeCaseToPascalCase";
                var pascalCaseToCamelCase = "pascalCaseToCamelCase";
                var camelCaseToLowerSnakeCase = "camelCaseToLowerSnakeCase";
                var lowerSnakeCaseToSpaceCase = "lowerSnakeCaseToSpaceCase";

                function isUpperCase(str, first) {
                    if (!first) return str.toUpperCase() === str;
                    return str.substring(0, 1).toUpperCase() === str.substring(0, 1)
                        && (str.length === 1 || str.substring(1, 2).toLowerCase() === str.substring(1, 2));
                }
                function isLowerCase(str, first) {
                    if (!first) return str.toLowerCase() === str;
                    return str.substring(0, 1).toLowerCase() === str.substring(0, 1);
                }
                function firstToUpper(str) {
                    return str !== "" ? str.replace(str[0], str[0].toUpperCase()) : "";
                }
                function firstToLower(str) {
                    return str !== "" ? str.replace(str[0], str[0].toLowerCase()) : "";
                }
                function getMethodName(str) {
                    str = str.trim();
                    if (isLowerCase(str) && str.indexOf("_") >= 0) return lowerSnakeCaseToSpaceCase;
                    if (isLowerCase(str) && str.indexOf("-") >= 0) return kebabCaseToUpperSnakeCase;
                    if (isLowerCase(str) && str.indexOf(" ") >= 0) return spaceCaseToPascalCaseSpace;
                    if (isUpperCase(str, true) && str.indexOf(" ") >= 0) return pascalCaseSpaceToKebabCase;
                    if (isUpperCase(str) && str.indexOf("_") >= 0) return upperSnakeCaseToPascalCase;
                    if (isUpperCase(str, true) && str.indexOf("_") < 0 && str.indexOf(" ") < 0) return pascalCaseToCamelCase;
                    return camelCaseToLowerSnakeCase;
                }
                function Convent(str) {
                    this.str = str.trim();
                    this.result = {};
                    this._convert();
                }
                Convent.prototype.spaceCaseToPascalCaseSpace = function () {
                    return this.str.split(" ").map(function (s) { return firstToUpper(s); }).join(" ").trim();
                };
                Convent.prototype.pascalCaseSpaceToKebabCase = function () {
                    return this.str.replace(/ /g, "-").toLowerCase().trim();
                };
                Convent.prototype.kebabCaseToUpperSnakeCase = function () {
                    return this.str.toUpperCase().replace(/-/g, "_").trim();
                };
                Convent.prototype.upperSnakeCaseToPascalCase = function () {
                    return this.str.split("_").map(function (s) { return firstToUpper(s.toLowerCase()); }).join("").trim();
                };
                Convent.prototype.pascalCaseToCamelCase = function () {
                    return firstToLower(this.str).trim();
                };
                Convent.prototype.camelCaseToLowerSnakeCase = function () {
                    var str = this.str;
                    if ((isUpperCase(str) || isLowerCase(str)) && str.indexOf("_") < 0 && str.indexOf(" ") < 0) {
                        return str.toLowerCase();
                    }
                    var temp = "";
                    for (var i = 0; i < this.str.length; i++) {
                        if (isUpperCase(this.str.substring(i, i + 1))) temp += "_";
                        temp += this.str.substring(i, i + 1).toLowerCase();
                    }
                    return temp.trim();
                };
                Convent.prototype.lowerSnakeCaseToSpaceCase = function () {
                    return this.str.replace(/_/g, " ").trim();
                };
                Convent.prototype._convert = function () {
                    var methods = [
                        spaceCaseToPascalCaseSpace, pascalCaseSpaceToKebabCase, kebabCaseToUpperSnakeCase,
                        upperSnakeCaseToPascalCase, pascalCaseToCamelCase, camelCaseToLowerSnakeCase, lowerSnakeCaseToSpaceCase
                    ];
                    var current = methods.indexOf(getMethodName(this.str));
                    var executeMethods = current === 0 ? methods.slice()
                        : methods.slice(current).concat(methods.slice(0, current));
                    var str = this.str;
                    for (var i = 0; i < executeMethods.length; i++) {
                        this.str = str.trim();
                        str = this[executeMethods[i]]();
                        this.result[executeMethods[i]] = str;
                    }
                };
                Convent.prototype.spaceCase = function () { return this.result[lowerSnakeCaseToSpaceCase] || ""; };
                Convent.prototype.pascalCaseSpace = function () { return this.result[spaceCaseToPascalCaseSpace] || ""; };
                Convent.prototype.kebabCase = function () { return this.result[pascalCaseSpaceToKebabCase] || ""; };
                Convent.prototype.upperSnakeCase = function () { return this.result[kebabCaseToUpperSnakeCase] || ""; };
                Convent.prototype.pascalCase = function () { return this.result[upperSnakeCaseToPascalCase] || ""; };
                Convent.prototype.camelCase = function () { return this.result[pascalCaseToCamelCase] || ""; };
                Convent.prototype.lowerSnakeCase = function () { return this.result[camelCaseToLowerSnakeCase] || ""; };

                function nameConvent(str, type) {
                    return new Convent(str)[type]();
                }

                var ESCAPE_CHARS = {
                    backslash: { string: "\\\\", char: "\\" },
                    single_quote: { string: "\\'", char: "'" },
                    double_quote: { string: "\\\"", char: "\"" },
                    new_line: { string: "\\n", char: "\n" },
                    carriage_return: { string: "\\r", char: "\r" },
                    tab: { string: "\\t", char: "\t" },
                    vertical_tab: { string: "\\v", char: "\v" },
                    backspace: { string: "\\b", char: "\b" },
                    form_feed: { string: "\\f", char: "\f" }
                };

                var ESCAPE_LABELS = {
                    backslash: "反斜杠",
                    single_quote: "单引号",
                    double_quote: "双引号",
                    new_line: "换行",
                    carriage_return: "回车",
                    tab: "制表符",
                    vertical_tab: "垂直制表",
                    backspace: "退格",
                    form_feed: "换页"
                };

                function regExpQuote(str) {
                    return String(str).replace(/([.?*+^$[\]\\(){}|-])/g, "\\$1");
                }

                function getGbkStrLength(str) {
                    var realLength = 0;
                    for (var i = 0; i < str.length; i++) {
                        var c = str.charCodeAt(i);
                        realLength += c >= 0 && c <= 128 ? 1 : 2;
                    }
                    return realLength;
                }

                function utf8ByteLength(text) {
                    return new TextEncoder().encode(text).length;
                }

                function lineUniq(lines) {
                    var seen = Object.create(null);
                    var out = [];
                    lines.forEach(function (l) {
                        if (!Object.prototype.hasOwnProperty.call(seen, l)) {
                            seen[l] = true;
                            out.push(l);
                        }
                    });
                    return out;
                }

                /** 行统计：与 lineRemoveRepeat / lineUniq 一致，按整行内容判重 */
                function getLineStats(text) {
                    if (!text || !text.length) {
                        return { total: 0, duplicate: 0, unique: 0 };
                    }
                    var lines = text.split(/\r?\n/);
                    var total = lines.length;
                    var unique = lineUniq(lines).length;
                    return { total: total, unique: unique, duplicate: total - unique };
                }

                function refreshEditorLineStats() {
                    var el = document.getElementById("editor-line-stats");
                    if (!el) return;
                    var st = getLineStats(getInputValue());
                    el.textContent = "共 " + st.total + " 行 · 重复 " + st.duplicate + " 行";
                }

                function orderByLinesAsc(parts) {
                    return parts.slice().sort(function (a, b) {
                        if (a < b) return -1;
                        if (a > b) return 1;
                        return 0;
                    });
                }

                function createTextApi(text) {
                    return {
                        upper: function () { return text.toUpperCase(); },
                        lower: function () { return text.toLowerCase(); },
                        upperLineStart: function () {
                            return text.split(/\r?\n/).map(function (str) {
                                if (str.length < 1) return "";
                                return str[0].toUpperCase() + str.substr(1);
                            }).join("\n");
                        },
                        lowerLineStart: function () {
                            return text.split(/\r?\n/).map(function (str) {
                                if (str.length < 1) return "";
                                return str[0].toLowerCase() + str.substr(1);
                            }).join("\n");
                        },
                        upperStart: function () {
                            return text.replace(/\b\w/g, function (s) { return s.toUpperCase(); });
                        },
                        lowerStart: function () {
                            return text.replace(/\b\w/g, function (s) { return s.toLowerCase(); });
                        },
                        replacePunctuation: function (opt) {
                            var type = (opt && opt.type) || "zh";
                            var zh = ["“", "”", "‘", "’", "。", "，", "；", "：", "？", "！", "……", "—", "～", "（", "）", "《", "》"];
                            var en = ["\"", "\"", "'", "'", ".", ",", ";", ":", "?", "!", "…", "-", "~", "(", ")", "<", ">"];
                            var t = text;
                            for (var i = 0; i < zh.length; i++) {
                                var from = type === "zh" ? en[i] : zh[i];
                                var to = type === "zh" ? zh[i] : en[i];
                                t = t.replace(new RegExp(regExpQuote(from), "g"), to);
                            }
                            return t;
                        },
                        replace: function (opt) {
                            var search = (opt && opt.search) || [];
                            var replace = (opt && opt.replace) || [];
                            var t = text;
                            for (var i = 0; i < search.length; i++) {
                                if (search[i]) {
                                    var rep = i in replace ? replace[i] : "";
                                    t = t.replace(new RegExp(regExpQuote(search[i]), "g"), rep);
                                }
                            }
                            return t;
                        },
                        regularReplace: function (opt) {
                            var search = (opt && opt.search) || "";
                            var rep = (opt && opt.replace) || "";
                            if (!search) return text;
                            return text.replace(new RegExp(search, "g"), rep);
                        },
                        lineRemoveRepeat: function () {
                            return lineUniq(text.split("\n")).join("\n");
                        },
                        removeLineIndex: function () {
                            return text.replace(/^\s*\d+\.?/gm, "");
                        },
                        addLineIndex: function () {
                            return text.split("\n").map(function (line, index) {
                                return (index + 1) + ". " + line;
                            }).join("\n");
                        },
                        sort: function (opt) {
                            var type = (opt && opt.type) || "";
                            var parts = text.split(/\r?\n/);
                            switch (type) {
                                case "reverse_line":
                                    return parts.slice().reverse().join("\n");
                                case "reverse_line_string":
                                    return parts.map(function (line) {
                                        return line.split("").reverse().join("");
                                    }).join("\n");
                                case "reverse_all":
                                    return text.split("").reverse().join("");
                                case "line_asc":
                                    return orderByLinesAsc(parts).join("\n");
                                case "line_desc":
                                    return orderByLinesAsc(parts).reverse().join("\n");
                                default:
                                    return text;
                            }
                        },
                        lineTrim: function () {
                            return text.split(/\r?\n/).map(function (item) { return item.trim(); }).join("\n");
                        },
                        filterBlankLine: function () {
                            return text.split(/\r?\n/).filter(function (item) { return item.trim() !== ""; }).join("\n");
                        },
                        filterAllBr: function () {
                            return text.replace(/\r?\n|\r/g, "");
                        },
                        addLinePrefix: function (opt) {
                            var p = opt && opt.prefix != null ? opt.prefix : "";
                            return text.split(/\r?\n/).map(function (line) {
                                return p + line;
                            }).join("\n");
                        },
                        addLineSuffix: function (opt) {
                            var s = opt && opt.suffix != null ? opt.suffix : "";
                            return text.split(/\r?\n/).map(function (line) {
                                return line + s;
                            }).join("\n");
                        },
                        /** 每行包成 'x', 最后一行 'x'（无逗号）；行内单引号按 SQL 加倍 */
                        sqlInListElements: function () {
                            var lines = text.split(/\r?\n/);
                            var n = lines.length;
                            return lines.map(function (line, i) {
                                var esc = String(line).replace(/'/g, "''");
                                var isLast = i === n - 1;
                                return "'" + esc + (isLast ? "'" : "',");
                            }).join("\n");
                        },
                        escape: function (opt) {
                            var lists = (opt && opt.lists) || [];
                            var t = text;
                            for (var i = 0; i < lists.length; i++) {
                                var item = lists[i];
                                if (ESCAPE_CHARS[item]) {
                                    var pair = ESCAPE_CHARS[item];
                                    t = t.split(pair.string).join(pair.char);
                                }
                            }
                            return t;
                        },
                        unescape: function (opt) {
                            var lists = (opt && opt.lists) || [];
                            var t = text;
                            for (var i = 0; i < lists.length; i++) {
                                var item = lists[i];
                                if (ESCAPE_CHARS[item]) {
                                    var pair = ESCAPE_CHARS[item];
                                    t = t.split(pair.char).join(pair.string);
                                }
                            }
                            return t;
                        },
                        rename: function (opt) {
                            var type = (opt && opt.type) || "lowerSnakeCase";
                            return text.replace(/\b[\w\-_]+\b/g, function (str) {
                                return nameConvent(str, type);
                            });
                        },
                        stat: function () {
                            var content = text.replace(/\r?\n/g, "\n");
                            var zh_word = (content.match(/[\u4e00-\u9fa5]/g) || []).length;
                            var zh_punctuation = (content.match(/[\u3002\uff1f\uff01\uff0c\u3001\uff1b\uff1a\u201c\u201d\u2018\u2019\uff08\uff09\u300a\u300b\u3008\u3009\u3010\u3011\u300e\u300f\u300c\u300d\ufe43\ufe44\u3014\u3015\u2026\u2014\uff5e\ufe4f\uffe5]/g) || []).length;
                            var int_string = (content.match(/[0-9]/g) || []).length;
                            var en_string = (content.match(/[A-Za-z]/g) || []).length;
                            var int_word = (content.match(/\b\d+\b/g) || []).length;
                            var en_word = (content.match(/\b\w+\b/g) || []).length - int_word;
                            var en_punctuation = (content.match(/[~`!@#$%^&*()\-_+=|\\[\]{};:"',<.>/?]/g) || []).length;
                            var lineSt = getLineStats(text);
                            return {
                                byte_utf8_length: utf8ByteLength(text),
                                byte_gbk_length: getGbkStrLength(text),
                                string_length: content.replace(/\n/g, "").length,
                                word_length: zh_word + en_word + zh_punctuation + int_word + en_punctuation,
                                zh_word: zh_word,
                                zh_punctuation: zh_punctuation,
                                en_string: en_string,
                                en_word: en_word,
                                en_punctuation: en_punctuation,
                                int_string: int_string,
                                int_word: int_word,
                                line_length: lineSt.total,
                                line_duplicate: lineSt.duplicate,
                                line_unique: lineSt.unique
                            };
                        }
                    };
                }

                function handle(method, opt) {
                    var t = getInputValue();
                    if (t.length < 1) return;
                    var api = createTextApi(t);
                    if (typeof api[method] !== "function") return;
                    setInputValue(api[method](opt));
                }

                function loadZhTran() {
                    var z = typeof window !== "undefined" && window._zhTran;
                    if (z && typeof z.toTraditional === "function" && typeof z.toSimplified === "function") {
                        return Promise.resolve(z);
                    }
                    return Promise.reject(
                        new Error("未加载简繁库（请运行 npm install 生成 vendor/zh-tran/zh-tran-offline.js）")
                    );
                }

                async function handleZhTran(type) {
                    var t = getInputValue();
                    if (t.length < 1) return;
                    try {
                        var mod = await loadZhTran();
                        var out = type === "simplified" ? mod.toTraditional(t) : mod.toSimplified(t);
                        setInputValue(out);
                    } catch (e) {
                        showToast((e && e.message) || String(e));
                    }
                }

                function showToast(msg) {
                    var t = document.getElementById("toast");
                    t.textContent = msg;
                    t.classList.add("show");
                    clearTimeout(t._hideTimer);
                    t._hideTimer = setTimeout(function () {
                        t.classList.remove("show");
                    }, 2000);
                }

                function refreshStatPreviewBtn() {

                }
                afterDocChange = refreshStatPreviewBtn;

                function renderStatTable() {
                    var t = getInputValue();
                    var s = createTextApi(t || "").stat();
                    var h =
                        "<p class=\"stat-line-summary\">共 " +
                        s.line_length +

                    h += "<table class=\"stat-table\"><tbody>";
