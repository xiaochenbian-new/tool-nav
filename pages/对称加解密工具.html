<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>对称加解密</title>
        <link rel="stylesheet" href="libs/tool-danger-btn.css" />
        <script src="libs/crypto-js.js"></script>
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                --bg: #f3f7ff;
                --card: #fff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
                --foot-bg: #f8fbff;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
            }
            .page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .opts {
                flex-shrink: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                padding: 10px 12px;
                display: flex;
                flex-wrap: wrap;
                gap: 10px 14px;
                align-items: center;
                margin-bottom: 10px;
            }
            .opts label {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                font-size: 13px;
                white-space: nowrap;
            }
            .opts select {
                border: 1px solid #cfdcf7;
                border-radius: 6px;
                padding: 5px 10px;
                font-size: 13px;
                background: #fff;
                max-width: 220px;
            }
            .opts-inline-in {
                width: 188px;
                border: 1px solid #cfdcf7;
                border-radius: 6px;
                padding: 5px 10px;
                font-size: 13px;
            }
            .opts-inline-in--iv {
                width: 148px;
            }
            .split {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                gap: 10px;
                align-items: stretch;
            }
            .pane {
                flex: 1 1 0;
                min-width: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .pane-hd {
                flex-shrink: 0;
                padding: 8px 10px;
                font-weight: 600;
                font-size: 14px;
                color: #324a76;
                background: var(--foot-bg);
                border-bottom: 1px solid #e4edff;
            }
            .pane-body {
                flex: 1;
                min-height: 0;
                padding: 10px;
                display: flex;
                flex-direction: column;
            }
            .pane-ta {
                flex: 1;
                width: 100%;
                min-height: 120px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                padding: 10px;
                font-family: Consolas, "Courier New", monospace;
                font-size: 14px;
                line-height: 1.55;
                resize: none;
                outline: none;
            }
            .pane-ta:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.12);
            }
            .actions {
                flex-shrink: 0;
                padding: 10px 12px;
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: center;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: var(--foot-bg);
                box-shadow: var(--shadow);
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 6px 16px;
                font-size: 13px;
                cursor: pointer;
            }
            .btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .btn-primary {
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
                color: #fff;
                border-color: transparent;
            }
            .btn-primary:hover {
                opacity: 0.95;
                color: #fff;
            }
            .hint {
                font-size: 13px;
                color: var(--muted);
                flex: 1;
                min-width: 160px;
            }
            .err {
                color: #c62828;
                font-size: 13px;
                padding: 4px 10px 0;
            }
            @media (max-width: 820px) {
                .split {
                    flex-direction: column;
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="opts">
                <label>
                    算法
                    <select id="algo" name="algo" title="与 Ctool 常用对称算法一致（CryptoJS）">
                        <option value="AES-128" selected>AES-128</option>
                        <option value="AES-192">AES-192</option>
                        <option value="AES-256">AES-256</option>
                        <option value="DES">DES</option>
                        <option value="TripleDES">TripleDES (3DES)</option>
                        <option value="RC4">RC4</option>
                        <option value="Rabbit">Rabbit</option>
                    </select>
                </label>
                <label id="modeWrap">
                    模式
                    <select id="mode" name="mode">
                        <option value="CBC" selected>CBC</option>
                        <option value="ECB">ECB</option>
                        <option value="CFB">CFB</option>
                        <option value="OFB">OFB</option>
                        <option value="CTR">CTR</option>
                    </select>
                </label>
                <label id="padWrap">
                    填充
                    <select id="padding" name="padding">
                        <option value="Pkcs7" selected>Pkcs7</option>
                        <option value="Iso97971">Iso97971</option>
                        <option value="AnsiX923">AnsiX923</option>
                        <option value="Iso10126">Iso10126</option>
                        <option value="ZeroPadding">ZeroPadding</option>
                        <option value="NoPadding">NoPadding</option>
                    </select>
                </label>
                <label>
                    密钥编码
                    <select id="keyEnc" name="keyEnc">
                        <option value="Utf8" selected>Utf8</option>
                        <option value="Hex">Hex</option>
                        <option value="Base64">Base64</option>
                    </select>
                </label>
                <label id="ivEncWrap">
                    IV 编码
                    <select id="ivEnc" name="ivEnc">
                        <option value="Utf8" selected>Utf8</option>
                        <option value="Hex">Hex</option>
                        <option value="Base64">Base64</option>
                    </select>
                </label>
                <label>
                    密钥
                    <input type="text" id="keyStr" name="keyStr" class="opts-inline-in" placeholder="长度不足将右侧补 0x00" autocomplete="off" />
                </label>
                <label id="ivLabel">
                    IV
                    <input type="text" id="ivStr" name="ivStr" class="opts-inline-in opts-inline-in--iv" placeholder="ECB 可留空" autocomplete="off" />
                </label>
                <button type="button" class="btn" id="btnRandIv" title="按块长度生成随机 IV">随机 IV</button>
                <label>
                    输入格式
                    <select id="inFmt" name="inFmt">
                        <option value="Utf8" selected>Utf8 文本</option>
                        <option value="Hex">Hex</option>
                        <option value="Base64">Base64</option>
                    </select>
                </label>
                <label>
                    输出格式
                    <select id="outFmt" name="outFmt">
                        <option value="Base64" selected>Base64（CryptoJS 默认串）</option>
                        <option value="Hex">Hex（仅密文）</option>
                    </select>
                </label>
            </div>
            <div class="err" id="errBox" style="display: none"></div>
            <div class="split">
                <section class="pane">
                    <div class="pane-hd">明文 / 待解密数据</div>
                    <div class="pane-body">
                        <textarea id="plainTa" name="plainTa" class="pane-ta" placeholder="加密前：输入明文；解密前：粘贴 Base64 或 Hex 密文"></textarea>
                    </div>
                </section>
                <section class="pane">
                    <div class="pane-hd">密文 / 解密结果</div>
                    <div class="pane-body">
                        <textarea id="cipherTa" name="cipherTa" class="pane-ta" readonly placeholder="加密结果或解密得到的原文"></textarea>
                    </div>
                </section>
            </div>
            <div class="actions">
                <button type="button" class="btn btn-primary" id="btnEnc">加密</button>
                <button type="button" class="btn btn-primary" id="btnDec">解密</button>
                <button type="button" class="btn" id="btnSwap">左右互换</button>
                <button type="button" class="btn tool-btn-danger" id="btnClear">清空</button>
                <span class="hint">离线使用 CryptoJS；DES/3DES 块大小 8 字节，AES 为 16 字节。Rabbit 建议 16 字节密钥、8 字节 IV。</span>
            </div>
        </div>
        <script>
            (function () {
                var C = window.CryptoJS;
                if (!C) {
                    document.getElementById("errBox").style.display = "block";
                    document.getElementById("errBox").textContent = "未加载 CryptoJS（libs/crypto-js.js）";
                    return;
                }

                function showErr(msg) {
                    var el = document.getElementById("errBox");
                    if (!msg) {
                        el.style.display = "none";
                        el.textContent = "";
                        return;
                    }
                    el.style.display = "block";
                    el.textContent = msg;
                }

                function parseEnc(str, encName) {
                    var s = String(str || "");
                    if (encName === "Hex") return C.enc.Hex.parse(s);
                    if (encName === "Base64") return C.enc.Base64.parse(s);
                    return C.enc.Utf8.parse(s);
                }

                function blockBytes(algo) {
                    if (algo.indexOf("AES") === 0) return 16;
                    if (algo === "DES" || algo === "TripleDES") return 8;
                    return 16;
                }

                function keyBytesTarget(algo) {
                    if (algo === "AES-128") return 16;
                    if (algo === "AES-192") return 24;
                    if (algo === "AES-256") return 32;
                    if (algo === "DES") return 8;
                    if (algo === "TripleDES") return 24;
                    if (algo === "RC4") return 0;
                    if (algo === "Rabbit") return 16;
                    return 16;
                }

                function ivBytesTarget(algo) {
                    if (algo === "Rabbit") return 8;
                    return blockBytes(algo);
                }

                function normalizeToBytes(wa, needBytes) {
                    if (needBytes <= 0) return wa;
                    var hex = C.enc.Hex.stringify(wa || C.lib.WordArray.create());
                    hex = (hex || "").replace(/\s/g, "");
                    if (hex.length % 2 === 1) hex = "0" + hex;
                    if (hex.length > needBytes * 2) hex = hex.substring(0, needBytes * 2);
                    while (hex.length < needBytes * 2) hex += "00";
                    return C.enc.Hex.parse(hex);
                }

                function prepareKey(wa, needBytes) {
                    if (needBytes <= 0) return wa;
                    return normalizeToBytes(wa, needBytes);
                }

                function prepareIv(ivStr, ivEnc, needBytes, zeroIfEmpty) {
                    var t = String(ivStr || "").trim();
                    if (!t && zeroIfEmpty) return C.enc.Hex.parse(new Array(needBytes * 2 + 1).join("0"));
                    return normalizeToBytes(parseEnc(t, ivEnc), needBytes);
                }

                function getEngine(algo) {
                    if (algo.indexOf("AES") === 0) return C.AES;
                    if (algo === "DES") return C.DES;
                    if (algo === "TripleDES") return C.TripleDES;
                    if (algo === "RC4") return C.RC4;
                    if (algo === "Rabbit") return C.Rabbit;
                    throw new Error("未知算法");
                }

                function getMode(name) {
                    var m = C.mode[name];
                    if (!m) throw new Error("不支持模式 " + name);
                    return m;
                }

                function getPad(name) {
                    var p = C.pad[name];
                    if (!p) throw new Error("不支持填充 " + name);
                    return p;
                }

                function inputWordArray() {
                    var fmt = document.getElementById("inFmt").value;
                    var raw = document.getElementById("plainTa").value;
                    if (fmt === "Utf8") return C.enc.Utf8.parse(raw);
                    if (fmt === "Hex") {
                        if (!raw.trim()) return C.lib.WordArray.create();
                        return C.enc.Hex.parse(raw.replace(/\s/g, ""));
                    }
                    if (fmt === "Base64") return C.enc.Base64.parse(raw.replace(/\s/g, ""));
                    return C.enc.Utf8.parse(raw);
                }

                function outputStringFromDecrypted(wa) {
                    var fmt = document.getElementById("inFmt").value;
                    if (fmt === "Utf8") return wa.toString(C.enc.Utf8);
                    if (fmt === "Hex") return wa.toString(C.enc.Hex);
                    return wa.toString(C.enc.Base64);
                }

                function buildCfg(algo, modeName, padName, ivWA, useIv) {
                    var cfg = {};
                    if (algo !== "RC4" && algo !== "Rabbit") {
                        cfg.mode = getMode(modeName);
                        cfg.padding = getPad(padName);
                    }
                    if (useIv && ivWA) cfg.iv = ivWA;
                    return cfg;
                }

                function syncAlgoUi() {
                    var algo = document.getElementById("algo").value;
                    var stream = algo === "RC4" || algo === "Rabbit";
                    var mode = document.getElementById("mode").value;
                    var hideIv = mode === "ECB" || algo === "RC4";
                    document.getElementById("modeWrap").style.display = stream ? "none" : "";
                    document.getElementById("padWrap").style.display = stream ? "none" : "";
                    document.getElementById("ivEncWrap").style.display = hideIv ? "none" : "";
                    document.getElementById("ivLabel").style.display = hideIv ? "none" : "";
                    document.getElementById("btnRandIv").style.display = hideIv ? "none" : "";
                }

                document.getElementById("algo").addEventListener("change", syncAlgoUi);
                document.getElementById("mode").addEventListener("change", syncAlgoUi);
                syncAlgoUi();

                document.getElementById("btnRandIv").addEventListener("click", function () {
                    var algo = document.getElementById("algo").value;
                    var n = ivBytesTarget(algo);
                    if (n <= 0) return;
                    var wa = C.lib.WordArray.random(n);
                    var enc = document.getElementById("ivEnc").value;
                    document.getElementById("ivStr").value =
                        enc === "Hex" ? wa.toString(C.enc.Hex) : enc === "Base64" ? wa.toString(C.enc.Base64) : wa.toString(C.enc.Utf8);
                });

                document.getElementById("btnEnc").addEventListener("click", function () {
                    showErr("");
                    try {
                        var algo = document.getElementById("algo").value;
                        var modeName = document.getElementById("mode").value;
                        var padName = document.getElementById("padding").value;
                        var keyEnc = document.getElementById("keyEnc").value;
                        var ivEnc = document.getElementById("ivEnc").value;
                        var engine = getEngine(algo);
                        var kb = keyBytesTarget(algo);
                        var keyWA = prepareKey(parseEnc(document.getElementById("keyStr").value, keyEnc), kb);
                        var ivWA = null;
                        var useIv = true;
                        if (algo === "RC4") useIv = false;
                        else if (modeName === "ECB") useIv = false;
                        else {
                            var ib = ivBytesTarget(algo);
                            ivWA = prepareIv(document.getElementById("ivStr").value, ivEnc, ib, true);
                        }
                        var msg = inputWordArray();
                        var cfg = buildCfg(algo, modeName, padName, ivWA, useIv);
                        var out = engine.encrypt(msg, keyWA, cfg);
                        var outFmt = document.getElementById("outFmt").value;
                        document.getElementById("cipherTa").value =
                            outFmt === "Hex" ? out.ciphertext.toString(C.enc.Hex) : out.toString();
                    } catch (e) {
                        showErr(e.message || String(e));
                    }
                });

                document.getElementById("btnDec").addEventListener("click", function () {
                    showErr("");
                    try {
                        var algo = document.getElementById("algo").value;
                        var modeName = document.getElementById("mode").value;
                        var padName = document.getElementById("padding").value;
                        var keyEnc = document.getElementById("keyEnc").value;
                        var ivEnc = document.getElementById("ivEnc").value;
                        var engine = getEngine(algo);
                        var kb = keyBytesTarget(algo);
                        var keyWA = prepareKey(parseEnc(document.getElementById("keyStr").value, keyEnc), kb);
                        var ivWA = null;
                        var useIv = true;
                        if (algo === "RC4") useIv = false;
                        else if (modeName === "ECB") useIv = false;
                        else {
                            var ib = ivBytesTarget(algo);
                            ivWA = prepareIv(document.getElementById("ivStr").value, ivEnc, ib, true);
                        }
                        var cipherText = document.getElementById("plainTa").value.trim();
                        var outFmt = document.getElementById("outFmt").value;
                        var params;
                        if (outFmt === "Hex") {
                            params = C.lib.CipherParams.create({ ciphertext: C.enc.Hex.parse(cipherText.replace(/\s/g, "")) });
                        } else {
                            params = cipherText;
                        }
                        var cfg = buildCfg(algo, modeName, padName, ivWA, useIv);
                        var dec = engine.decrypt(params, keyWA, cfg);
                        document.getElementById("cipherTa").value = outputStringFromDecrypted(dec);
                    } catch (e) {
                        showErr(e.message || String(e));
                    }
                });

                document.getElementById("btnSwap").addEventListener("click", function () {
                    var a = document.getElementById("plainTa").value;
                    var b = document.getElementById("cipherTa").value;
                    document.getElementById("plainTa").value = b;
                    document.getElementById("cipherTa").value = a;
                });

                document.getElementById("btnClear").addEventListener("click", function () {
                    document.getElementById("plainTa").value = "";
                    document.getElementById("cipherTa").value = "";
                    showErr("");
                });
            })();
        </script>
    </body>
</html>
