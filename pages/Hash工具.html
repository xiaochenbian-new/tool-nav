<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>哈希(Hash)</title>
        <script src="../vendor/codepage/cpexcel.full.js"></script>
        <script src="../vendor/codepage/cputils.js"></script>
        <script src="libs/sm3-browser.js"></script>
        <script src="libs/tool-copy.js"></script>
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                --bg: #f3f7ff;
                --card: #fff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
                --foot-bg: #f8fbff;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
            }
            /* 左:右 ≈ 10:14 分栏 */
            .hash-page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .hash-split {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                gap: 10px;
                align-items: stretch;
            }
            .hash-pane {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                min-width: 0;
                display: flex;
                flex-direction: column;
            }
            .hash-input-pane {
                flex: 10 1 0%;
            }
            .hash-output-pane {
                flex: 14 1 0%;
            }
            .hash-pane-body {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                padding: 8px;
            }
            .hash-main-ta {
                flex: 1;
                width: 100%;
                min-height: 100px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                padding: 10px;
                font-family: Consolas, "Courier New", monospace;
                font-size: 14px;
                line-height: 1.55;
                resize: none;
                outline: none;
            }
            .hash-main-ta:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.12);
            }
            .hash-upload-card {
                flex: 1;
                min-height: 120px;
                border: 1px dashed #cfdcf7;
                border-radius: 6px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                background: #fcfdff;
            }
            .hash-upload-hint {
                font-size: 13px;
                color: var(--muted);
                text-align: center;
                padding: 0 12px;
            }
            .hash-pane-foot {
                flex-shrink: 0;
                border-top: 1px solid #e4edff;
                background: var(--foot-bg);
                padding: 6px 8px;
                display: flex;
                flex-wrap: wrap;
                gap: 8px 12px;
                align-items: center;
            }
            .hash-pane-foot label {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                font-size: 13px;
                cursor: pointer;
                user-select: none;
            }
            .hash-pane-foot select {
                border: 1px solid #cfdcf7;
                border-radius: 6px;
                padding: 5px 10px;
                font-size: 13px;
                background: #fff;
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 6px 14px;
                font-size: 13px;
                cursor: pointer;
            }
            .btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .hash-salt-box {
                flex-shrink: 0;
                padding: 6px 8px 8px;
                border-top: 1px solid #e4edff;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .hash-salt-box input {
                width: 100%;
                border: 1px solid #cfdcf7;
                border-radius: 6px;
                padding: 6px 10px;
                font-size: 13px;
            }
            .hash-out-stack {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 6px;
                padding: 8px;
            }
            .hash-out-cell {
                flex: 1 1 0;
                min-height: 48px;
                display: flex;
                flex-direction: column;
                min-height: 0;
                border: 1px solid #e4edff;
                border-radius: 8px;
                overflow: hidden;
                background: #fff;
            }
            .hash-out-head {
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 6px 10px;
                font-size: 13px;
                font-weight: 600;
                color: #324a76;
                background: #f8fbff;
                border-bottom: 1px solid #e4edff;
            }
            .hash-out-ta {
                flex: 1;
                min-height: 0;
                width: 100%;
                border: none;
                padding: 8px 10px;
                font-family: Consolas, "Courier New", monospace;
                font-size: 13px;
                line-height: 1.5;
                resize: none;
                outline: none;
                background: #fff;
            }
            .mini-btn {
                border: 1px solid #d8e5ff;
                border-radius: 4px;
                background: #fff;
                padding: 3px 10px;
                font-size: 12px;
                cursor: pointer;
            }
            .mini-btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            input[type="file"] {
                display: none;
            }
            .err {
                color: #c62828;
                font-size: 13px;
                padding: 0 8px 6px;
            }
            @media (max-width: 820px) {
                .hash-split {
                    flex-direction: column;
                }
                .hash-input-pane,
                .hash-output-pane {
                    flex: 1 1 auto;
                    min-height: 280px;
                }
            }
        </style>
    </head>
    <body>
        <div class="hash-page">
            <div class="hash-split">
                <section class="hash-pane hash-input-pane">
                    <div class="hash-pane-body">
                        <textarea
                            id="hashInput"
                            name="hashInput"
                            class="hash-main-ta"
                            placeholder="输入内容…"
                        ></textarea>
                        <div id="uploadCard" class="hash-upload-card" style="display: none">
                            <button type="button" class="btn" id="btnPickFile">选择文件</button>
                            <input type="file" id="fileInput" name="fileInput" />
                            <div class="hash-upload-hint" id="uploadHint">提示: 支持直接粘贴文件</div>
                        </div>
                    </div>
                    <div class="hash-pane-foot">
                        <span id="encRow" style="display: inline-flex; align-items: center; gap: 6px">
                            <label for="encSelect">编码</label>
                            <select id="encSelect" name="encSelect" title="文本模式下的字符串编码（gbk / utf-8）">
                                <option value="utf-8" selected>utf-8</option>
                                <option value="gbk">gbk</option>
                            </select>
                        </span>
                        <span style="display: inline-flex; align-items: center; gap: 6px">
                            <label for="inputType">类型</label>
                            <select id="inputType" name="inputType">
                                <option value="text" selected>文本</option>
                                <option value="base64">Base64</option>
                                <option value="hex">Hex</option>
                                <option value="upload">上传</option>
                                <option value="url">Url</option>
                            </select>
                        </span>
                        <span id="hexPreserveRow" style="display: none; align-items: center; gap: 6px">
                            <label><input type="checkbox" id="hexPreserveLb" name="hexPreserveLb" /> 保留换行符</label>
                        </span>
                        <label><input type="checkbox" id="isSalt" name="isSalt" /> 盐值</label>
                        <label><input type="checkbox" id="isUppercase" name="isUppercase" /> 大写</label>
                        <label><input type="checkbox" id="multiple" name="multiple" /> 多行分别计算</label>
                    </div>
                    <div id="saltBox" class="hash-salt-box" style="display: none">
                        <input type="text" id="saltVal" name="saltVal" placeholder="盐值" autocomplete="off" />
                        <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center">
                            <input type="text" id="saltExp" name="saltExp" placeholder="盐值模式表达式" style="flex: 1; min-width: 120px" autocomplete="off" />
                            <select id="saltTpl" title="快速填入表达式" style="flex: 0 0 auto; max-width: 200px">
                                <option value="">常用模板…</option>
                                <option value="hash(hash($input))">hash(hash($input))</option>
                                <option value="hash($input.$salt)">hash($input.$salt)</option>
                                <option value="hash(hash($input).$salt)">hash(hash($input).$salt)</option>
                                <option value="hash($input).hash($salt)">hash($input).hash($salt)</option>
                                <option value="hash(hash(hash($input)))">hash(hash(hash($input)))</option>
                                <option value="hash($salt.$input.$salt)">hash($salt.$input.$salt)</option>
                                <option value="hash(hash($input.$salt).$salt)">hash(hash($input.$salt).$salt)</option>
                                <option value="hash($salt.hash($input.$salt).$salt)">hash($salt.hash($input.$salt).$salt)</option>
                                <option value="hash($salt.hash($salt.$input.$salt).$salt)">hash($salt.hash($salt.$input.$salt).$salt)</option>
                            </select>
                        </div>
                    </div>
                    <div class="err" id="errBox" style="display: none"></div>
                </section>
                <section class="hash-pane hash-output-pane">
                    <div class="hash-out-stack" id="outStack">
                        <div class="hash-out-cell" data-algo="md5">
                            <div class="hash-out-head"><span>md5</span><button type="button" class="mini-btn copy-one" data-algo="md5">复制</button></div>
                            <textarea class="hash-out-ta" id="out-md5" name="out-md5" readonly placeholder="md5"></textarea>
                        </div>
                        <div class="hash-out-cell" data-algo="sha1">
                            <div class="hash-out-head"><span>sha1</span><button type="button" class="mini-btn copy-one" data-algo="sha1">复制</button></div>
                            <textarea class="hash-out-ta" id="out-sha1" name="out-sha1" readonly placeholder="sha1"></textarea>
                        </div>
                        <div class="hash-out-cell" data-algo="sha256">
                            <div class="hash-out-head"><span>sha256</span><button type="button" class="mini-btn copy-one" data-algo="sha256">复制</button></div>
                            <textarea class="hash-out-ta" id="out-sha256" name="out-sha256" readonly placeholder="sha256"></textarea>
                        </div>
                        <div class="hash-out-cell" data-algo="sha512">
                            <div class="hash-out-head"><span>sha512</span><button type="button" class="mini-btn copy-one" data-algo="sha512">复制</button></div>
                            <textarea class="hash-out-ta" id="out-sha512" name="out-sha512" readonly placeholder="sha512"></textarea>
                        </div>
                        <div class="hash-out-cell" data-algo="sm3">
                            <div class="hash-out-head"><span>sm3</span><button type="button" class="mini-btn copy-one" data-algo="sm3">复制</button></div>
                            <textarea class="hash-out-ta" id="out-sm3" name="out-sm3" readonly placeholder="sm3"></textarea>
                        </div>
                    </div>
                </section>
            </div>
        </div>
        <script>
            (function () {
                var METHODS = ["md5", "sha1", "sha256", "sha512", "sm3"];
                var lastFileBuf = null;
                var lastFileName = "";
                var debounceTimer = null;

                function showErr(msg) {
                    var el = document.getElementById("errBox");
                    if (!msg) {
                        el.style.display = "none";
                        el.textContent = "";
                        return;
                    }
                    el.style.display = "block";
                    el.textContent = msg;
                }

                function getInputType() {
                    return document.getElementById("inputType").value;
                }

                function stringToU8WithEnc(str, encVal) {
                    if (encVal === "utf-8" || encVal === "utf8") return new TextEncoder().encode(str);
                    if (encVal === "gbk") {
                        if (typeof cptable === "undefined" || !cptable.utils) {
                            throw new Error("GBK 需 codepage 库：请在 tool-nav 根目录执行 npm run copy:vendor");
                        }
                        return new Uint8Array(cptable.utils.encode(936, str));
                    }
                    throw new Error("未知编码: " + encVal);
                }

                function base64ToU8(str) {
                    var item = String(str).trim();
                    if (/^data:[^;]*;base64,/i.test(item)) {
                        item = (item.split(",")[1] || "").trim();
                    }
                    if (!item) return new Uint8Array(0);
                    var bin = atob(item.replace(/\s/g, ""));
                    var out = new Uint8Array(bin.length);
                    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i) & 0xff;
                    return out;
                }

                function hexToU8(str, preserveLineBreaks) {
                    var cleaned = String(str).replace(/\\x/gi, "").replace(/ /g, "");
                    cleaned = preserveLineBreaks ? cleaned.replace(/\n/g, "0a") : cleaned.replace(/\n/g, "");
                    cleaned = cleaned.trim();
                    if (cleaned.length % 2 === 1) cleaned = "0" + cleaned;
                    var n = cleaned.length / 2;
                    var out = new Uint8Array(n);
                    for (var i = 0; i < n; i++) {
                        var b = parseInt(cleaned.substr(i * 2, 2), 16);
                        if (Number.isNaN(b)) throw new Error("Hex 解析失败（含非法字符）");
                        out[i] = b;
                    }
                    return out;
                }

                function getExprInputString(raw, type, u8) {
                    if (type === "text") return raw;
                    if (type === "base64" || type === "hex") {
                        if (!u8 || u8.length === 0) return "";
                        return new TextDecoder("utf-8", { fatal: false }).decode(u8);
                    }
                    return raw;
                }

                function getInputBytes() {
                    var t = getInputType();
                    var raw = document.getElementById("hashInput").value;
                    if (t === "upload") {
                        return Promise.resolve(lastFileBuf ? new Uint8Array(lastFileBuf) : new Uint8Array(0));
                    }
                    if (t === "url") {
                        var u = raw.trim();
                        if (!u) return Promise.resolve(new Uint8Array(0));
                        return fetch(u)
                            .then(function (r) {
                                if (!r.ok) throw new Error("[" + u + "] 加载失败 HTTP " + r.status);
                                return r.arrayBuffer();
                            })
                            .then(function (ab) {
                                return new Uint8Array(ab);
                            });
                    }
                    if (t === "text") {
                        try {
                            return Promise.resolve(stringToU8WithEnc(raw, document.getElementById("encSelect").value));
                        } catch (e) {
                            return Promise.reject(e);
                        }
                    }
                    if (t === "base64") {
                        try {
                            return Promise.resolve(base64ToU8(raw));
                        } catch (e) {
                            return Promise.reject(e);
                        }
                    }
                    if (t === "hex") {
                        try {
                            return Promise.resolve(hexToU8(raw, document.getElementById("hexPreserveLb").checked));
                        } catch (e) {
                            return Promise.reject(e);
                        }
                    }
                    return Promise.resolve(new Uint8Array(0));
                }

                function isInputEmpty(type, raw) {
                    if (type === "upload") return !lastFileBuf;
                    return String(raw).trim().length === 0;
                }

                function updateTaPlaceholder() {
                    var t = getInputType();
                    var ph = {
                        text: "输入文本…",
                        base64: "输入 Base64（支持 data:...;base64, 前缀）",
                        hex: "输入十六进制（可含空格；\\x 转义会被去掉）",
                        url: "输入资源 Url（GET 拉取二进制后计算摘要）",
                        upload: "",
                    };
                    document.getElementById("hashInput").placeholder = ph[t] || "";
                }

                function syncInputModeUi() {
                    var t = getInputType();
                    var up = t === "upload";
                    document.getElementById("hashInput").style.display = up ? "none" : "block";
                    document.getElementById("uploadCard").style.display = up ? "flex" : "none";
                    document.getElementById("encRow").style.display = t === "text" ? "inline-flex" : "none";
                    var hexRow = document.getElementById("hexPreserveRow");
                    if (t === "hex") {
                        var hv = document.getElementById("hashInput").value;
                        hexRow.style.display = hv.indexOf("\n") >= 0 ? "inline-flex" : "none";
                    } else {
                        hexRow.style.display = "none";
                    }
                    var salt = document.getElementById("isSalt");
                    var mult = document.getElementById("multiple");
                    mult.disabled = t !== "text";
                    if (t !== "text") mult.checked = false;
                    var saltUrlUp = t === "upload" || t === "url";
                    if (saltUrlUp) {
                        salt.checked = false;
                        salt.disabled = true;
                        document.getElementById("saltBox").style.display = "none";
                    } else {
                        salt.disabled = false;
                        document.getElementById("saltBox").style.display = salt.checked ? "flex" : "none";
                    }
                    updateTaPlaceholder();
                }

                function Expression(flag) {
                    this.parameter = [];
                    this.flag = flag || "root";
                }
                Expression.prototype.add = function (item) {
                    this.parameter.push(item);
                };
                Expression.prototype.toString = function () {
                    var i,
                        str,
                        item;
                    if (this.flag === "root") {
                        str = "";
                        for (i in this.parameter) {
                            item = this.parameter[i].toString();
                            str += (parseInt(i, 10) > 0 ? "." : "") + item;
                        }
                        return str;
                    }
                    if (this.flag === "hash") {
                        str = "";
                        for (i in this.parameter) {
                            item = this.parameter[i].toString();
                            str += (parseInt(i, 10) > 0 ? "." : "") + item;
                        }
                        return "hash(" + str + ")";
                    }
                    return this.flag;
                };
                Expression.prototype.getResultAsync = function (input, salt, hashFuncAsync) {
                    var self = this;
                    if (this.flag === "$input") return Promise.resolve(input);
                    if (this.flag === "$salt") return Promise.resolve(salt);
                    return Promise.all(
                        this.parameter.map(function (p) {
                            return p.getResultAsync(input, salt, hashFuncAsync);
                        })
                    ).then(function (result) {
                        var joined = result.join("");
                        if (self.flag === "root") return joined;
                        return hashFuncAsync(joined);
                    });
                };

                function expressionParse(str) {
                    var separator = "__@@@__";
                    var items,
                        root,
                        stack,
                        prev,
                        idx,
                        item,
                        current,
                        itemExp;
                    str = str
                        .replace(/\(/g, separator + "(" + separator)
                        .replace(/\)/g, separator + ")" + separator)
                        .replace(/\./g, separator + "." + separator);
                    items = str.split(separator).filter(function (x) {
                        return x !== "";
                    });
                    if (["hash", "$input", "$salt"].indexOf(items[0]) === -1) {
                        throw new Error("Expression Error " + items[0]);
                    }
                    root = new Expression();
                    stack = [root];
                    prev = null;
                    for (idx = 0; idx < items.length; idx++) {
                        item = items[idx];
                        current = stack[stack.length - 1];
                        itemExp = null;
                        switch (item) {
                            case ".":
                                break;
                            case "hash":
                            case "$input":
                            case "$salt":
                                itemExp = new Expression(item);
                                current.add(itemExp);
                                prev = itemExp;
                                break;
                            case "(":
                                stack.push(prev);
                                break;
                            case ")":
                                if (stack.length === 1) throw new Error('Expression Error invalid ")"');
                                stack.pop();
                                break;
                            default:
                                throw new Error('Expression Error invalid "' + item + '"');
                        }
                    }
                    if (stack.length > 1) throw new Error('Expression Error invalid "("');
                    return root;
                }

                function utf8Encode(str) {
                    return new TextEncoder().encode(str);
                }

                function hexFromBuf(buf, upper) {
                    var u8 = new Uint8Array(buf);
                    var hex = upper ? "0123456789ABCDEF" : "0123456789abcdef";
                    var out = "",
                        i;
                    for (i = 0; i < u8.length; i++) out += hex.charAt((u8[i] >>> 4) & 15) + hex.charAt(u8[i] & 15);
                    return out;
                }

                function md5Uint8(data) {
                    function safeAdd(x, y) {
                        var lsw = (x & 0xffff) + (y & 0xffff);
                        var msw = (x >> 16) + (y >> 16) + (lsw >> 16);
                        return (msw << 16) | (lsw & 0xffff);
                    }
                    function bitRotateLeft(num, cnt) {
                        return (num << cnt) | (num >>> (32 - cnt));
                    }
                    function md5cm(q, a, b, x, s, t) {
                        return safeAdd(bitRotateLeft(safeAdd(safeAdd(a, q), safeAdd(x, t)), s), b);
                    }
                    function md5ff(a, b, c, d, x, s, t) {
                        return md5cm((b & c) | (~b & d), a, b, x, s, t);
                    }
                    function md5gg(a, b, c, d, x, s, t) {
                        return md5cm((b & d) | (c & ~d), a, b, x, s, t);
                    }
                    function md5hh(a, b, c, d, x, s, t) {
                        return md5cm(b ^ c ^ d, a, b, x, s, t);
                    }
                    function md5ii(a, b, c, d, x, s, t) {
                        return md5cm(c ^ (b | ~d), a, b, x, s, t);
                    }
                    function binlMD5(x, len) {
                        x[len >> 5] |= 0x80 << len % 32;
                        x[(((len + 64) >>> 9) << 4) + 14] = len;
                        var a = 1732584193,
                            b = -271733879,
                            c = -1732584194,
                            d = 271733878;
                        for (var i = 0; i < x.length; i += 16) {
                            var olda = a,
                                oldb = b,
                                oldc = c,
                                oldd = d;
                            a = md5ff(a, b, c, d, x[i + 0], 7, -680876936);
                            d = md5ff(d, a, b, c, x[i + 1], 12, -389564586);
                            c = md5ff(c, d, a, b, x[i + 2], 17, 606105819);
                            b = md5ff(b, c, d, a, x[i + 3], 22, -1044525330);
                            a = md5ff(a, b, c, d, x[i + 4], 7, -176418897);
                            d = md5ff(d, a, b, c, x[i + 5], 12, 1200080426);
                            c = md5ff(c, d, a, b, x[i + 6], 17, -1473231341);
                            b = md5ff(b, c, d, a, x[i + 7], 22, -45705983);
                            a = md5ff(a, b, c, d, x[i + 8], 7, 1770035416);
                            d = md5ff(d, a, b, c, x[i + 9], 12, -1958414417);
                            c = md5ff(c, d, a, b, x[i + 10], 17, -42063);
                            b = md5ff(b, c, d, a, x[i + 11], 22, -1990404162);
                            a = md5ff(a, b, c, d, x[i + 12], 7, 1804603682);
                            d = md5ff(d, a, b, c, x[i + 13], 12, -40341101);
                            c = md5ff(c, d, a, b, x[i + 14], 17, -1502002290);
                            b = md5ff(b, c, d, a, x[i + 15], 22, 1236535329);
                            a = md5gg(a, b, c, d, x[i + 1], 5, -165796510);
                            d = md5gg(d, a, b, c, x[i + 6], 9, -1069501632);

                    function binl2rstr(input) {
                        var i,
                            str = "";
                        for (i = 0; i < input.length * 32; i += 8) str += String.fromCharCode((input[i >> 5] >>> (i % 32)) & 0xff);
                        return str;
                    }
                    function rstr2binl(input) {
                        var i,
                            n = input.length * 8,
                            output = Array((n >> 5) + 1);
                        for (i = 0; i < output.length; i++) output[i] = 0;
                        for (i = 0; i < n; i += 8) output[i >> 5] |= (input.charCodeAt(i / 8) & 0xff) << i % 32;
                        return output;
                    }
                    function rstrMD5(s) {
                        return binl2rstr(binlMD5(rstr2binl(s), s.length * 8));
                    }
                    function rstr2hex(s) {
                        var hx = "0123456789abcdef",
                            out = "",
                            i;
                        for (i = 0; i < s.length; i++) out += hx.charAt((s.charCodeAt(i) >>> 4) & 0xf) + hx.charAt(s.charCodeAt(i) & 0xf);
                        return out;
                    }
                    var s = "";
                    for (var j = 0; j < data.length; j++) s += String.fromCharCode(data[j]);
                    return rstr2hex(rstrMD5(s));
                }

                function subtleDigest(alg, bytes) {
                    var subtle = crypto && crypto.subtle;
                    if (!subtle || typeof subtle.digest !== "function") {
                        return Promise.reject(new Error("不支持 Web Crypto"));
                    }
                    return subtle.digest(alg, bytes);
                }

                function hashCoreBytes(type, u8, upper) {
                    var low,
                        p = Promise.resolve("");
                    if (type === "md5") {
                        low = md5Uint8(u8);
                        return Promise.resolve(upper ? low.toUpperCase() : low);
                    }
                    if (type === "sm3") {
                        if (!window.ctoolSm3Hex) return Promise.reject(new Error("SM3 未加载"));
                        low = window.ctoolSm3Hex.fromBytes(u8);
                        return Promise.resolve(upper ? low.toUpperCase() : low);
                    }
                    var map = { sha1: "SHA-1", sha256: "SHA-256", sha512: "SHA-512" };
                    p = subtleDigest(map[type], u8).then(function (buf) {
                        low = hexFromBuf(buf, false);
                        return upper ? low.toUpperCase() : low;
                    });
                    return p;
                }

                function hashCoreString(type, str, upper) {
                    return hashCoreBytes(type, utf8Encode(str), upper);
                }

                function fixExprChain(type, exprInputStr, payloadU8, salt, exp, upper, allowSalt) {
                    var useExp =
                        allowSalt &&
                        document.getElementById("isSalt").checked &&
                        (exp || "").trim() !== "";
                    if (!useExp) {
                        return hashCoreBytes(type, payloadU8, upper);
                    }
                    try {
                        var root = expressionParse(exp.trim());
                        return root
                            .getResultAsync(exprInputStr, salt, function (joined) {
                                return hashCoreString(type, joined, false);
                            })
                            .then(function (low) {
                                return upper ? low.toUpperCase() : low;
                            });
                    } catch (e) {
                        return Promise.resolve("错误: " + (e.message || String(e)));
                    }
                }

                function clearOutputs() {
                    METHODS.forEach(function (m) {
                        document.getElementById("out-" + m).value = "";
                    });
                }

                function computeAll() {
                    showErr("");
                    syncInputModeUi();
                    var type = getInputType();
                    var raw = document.getElementById("hashInput").value;
                    var upper = document.getElementById("isUppercase").checked;
                    var salt = document.getElementById("saltVal").value || "";
                    var exp = document.getElementById("saltExp").value || "";
                    var mult = document.getElementById("multiple").checked && type === "text";
                    var allowSalt = type !== "upload" && type !== "url";

                    if (!mult && isInputEmpty(type, raw)) {
                        clearOutputs();
                        return;
                    }

                    getInputBytes()
                        .then(function (u8) {
                            if (!mult && (!u8 || u8.length === 0)) {
                                clearOutputs();
                                return;
                            }
                            var exprStr = getExprInputString(raw, type, u8);
                            if (mult) {
                                var enc = document.getElementById("encSelect").value;
                                var lines = raw.split("\n");
                                return Promise.all(
                                    METHODS.map(function (methodId) {
                                        return Promise.all(
                                            lines.map(function (line) {
                                                var lineU8 = stringToU8WithEnc(line, enc);
                                                return fixExprChain(methodId, line, lineU8, salt, exp, false, allowSalt);
                                            })
                                        ).then(function (parts) {
                                            var joined = parts.join("\n");
                                            return { type: methodId, val: upper ? joined.toUpperCase() : joined };
                                        });
                                    })
                                ).then(function (rows) {
                                    rows.forEach(function (r) {
                                        document.getElementById("out-" + r.type).value = r.val;
                                    });
                                });
                            }
                            return Promise.all(
                                METHODS.map(function (methodId) {
                                    return fixExprChain(methodId, exprStr, u8, salt, exp, upper, allowSalt).catch(function (e) {
                                        return "错误: " + (e.message || String(e));
                                    });
                                })
                            ).then(function (vals) {
                                vals.forEach(function (v, i) {
                                    document.getElementById("out-" + METHODS[i]).value = v;
                                });
                            });
                        })
                        .catch(function (e) {
                            showErr(e.message || String(e));
                            clearOutputs();
                            document.getElementById("out-md5").value = "错误: " + (e.message || String(e));
                        });
                }

                function schedule() {
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(computeAll, 200);
                }

                document.getElementById("encSelect").addEventListener("change", schedule);
                document.getElementById("hexPreserveLb").addEventListener("change", schedule);
                document.getElementById("isUppercase").addEventListener("change", schedule);
                document.getElementById("multiple").addEventListener("change", schedule);
                document.getElementById("saltVal").addEventListener("input", schedule);
                document.getElementById("saltExp").addEventListener("input", schedule);
                document.getElementById("saltTpl").addEventListener("change", function () {
                    if (this.value) {
                        document.getElementById("saltExp").value = this.value;
                        this.value = "";
                    }
                    schedule();
                });

                document.getElementById("btnPickFile").addEventListener("click", function () {
                    document.getElementById("fileInput").click();
                });
                document.getElementById("fileInput").addEventListener("change", function (e) {
                    var f = e.target.files && e.target.files[0];
                    if (!f) return;
                    var reader = new FileReader();
                    reader.onload = function () {
                        lastFileBuf = reader.result;
                        lastFileName = f.name;
                        document.getElementById("uploadHint").innerHTML =
                            "已选择：<strong>" +
                            String(f.name)
                                .replace(/&/g, "&amp;")
                                .replace(/</g, "&lt;")
                                .replace(/"/g, "&quot;") +
                            "</strong>（" +
                            f.size +
                            " 字节）";
                        schedule();
                    };
                    reader.onerror = function () {
                        showErr("读取文件失败");
                    };
                    reader.readAsArrayBuffer(f);
                });

                document.querySelectorAll(".copy-one").forEach(function (btn) {
                    btn.addEventListener("click", function () {
                        var algo = this.getAttribute("data-algo");
                        var ta = document.getElementById("out-" + algo);
                        ToolCopy.copy(ta.value, { onLabelEl: this, labelText: "复制" });
                    });
                });

                syncInputModeUi();
                computeAll();
            })();
