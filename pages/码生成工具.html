<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>二维码生成 / 条形码生成</title>
        <link rel="stylesheet" href="libs/tool-danger-btn.css" />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            :root {
                --card: #ffffff;
                --bg: #f3f7ff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --danger: #e04040;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
            }
            html, body {
                width: 100%;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
            }
            .page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                min-height: 0;
            }
            .editor-wrap {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                overflow: hidden;
            }
            .panel-title {
                padding: 8px 10px;
                font-size: 14px;
                color: #324a76;
                border-bottom: 1px solid #e4edff;
                background: #f8fbff;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .editor-head {
                flex: 0 0 auto;
                gap: 8px;
            }
            .editor-head-main {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
                flex-wrap: wrap;
                flex: 1;
            }
            .editor-head .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
                flex-shrink: 0;
            }
            .editor-head .actions .json-tabs {
                margin-right: 4px;
            }
            .hint {
                color: var(--muted);
                font-size: 14px;
            }
            .title-btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 4px 10px;
                font-size: 13px;
                cursor: pointer;
            }
            .title-btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .title-btn.primary {
                color: #fff;
                border-color: transparent;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            .title-btn.primary:hover {
                filter: brightness(1.05);
                color: #fff;
            }
            .editor-zone {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                align-items: stretch;
                padding: 0 8px 8px;
                gap: 10px;
            }
            .editor-main-col {
                flex: 1;
                min-width: 0;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            #input-text {
                flex: 1;
                width: 100%;
                min-height: 120px;
                padding: 10px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                font-size: 13px;
                line-height: 1.6;
                font-family: Consolas, "Courier New", "Microsoft YaHei", sans-serif;
                resize: none;
                outline: none;
            }
            #input-text:focus {
                box-shadow: inset 0 0 0 1px rgba(47, 107, 255, 0.25);
            }
            .preview-wrap {
                flex: 0 0 auto;
                width: min(360px, 38vw);
                min-width: 200px;
                max-width: 100%;
                min-height: 0;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                background: #fff;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                padding: 10px;
                overflow: auto;
                box-sizing: border-box;
            }
            #qrcode {
                width: max-content;
                max-width: 100%;
                display: flex;
                flex-direction: column;
                flex-wrap: nowrap;
                gap: 12px;
                align-items: center;
                justify-content: flex-start;
            }
            #qrcode img,
            #qrcode canvas {
                width: auto;
                height: auto;
                max-width: none;
                display: block;
            }
            .qr-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                padding: 8px;
                border: 1px solid #dbe7ff;
                border-radius: 8px;
                background: #f8fbff;
            }
            .qr-item-label {
                font-size: 12px;
                color: #4a5b82;
            }
            #barcode {
                max-width: 100%;
                height: auto;
                display: block;
            }
            .hidden {
                display: none !important;
            }
            .json-tabs {
                display: flex;
                gap: 4px;
                align-items: center;
                flex-wrap: wrap;
            }
            .json-tabs button {
                border: 1px solid #cfdcf7;
                background: #fff;
                padding: 6px 12px;
                font-size: 13px;
                border-radius: 8px;
                cursor: pointer;
                color: var(--text);
            }
            .json-tabs button:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .json-tabs button.active {
                border-color: var(--primary);
                color: #fff;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            .opt-label {
                font-size: 13px;
                color: var(--muted);
                white-space: nowrap;
            }
            #status {
                font-size: 13px;
                color: #2f3d5d;
                padding: 6px 4px 0;
                line-height: 1.5;
            }
            @media (max-width: 720px) {
                .editor-zone {
                    flex-direction: column;
                }
                .preview-wrap {
                    width: 100%;
                    min-width: 0;
                    max-height: min(50vh, 420px);
                }
            }
            #status.err {
                color: #c62828;
            }
            #toast {
                position: fixed;
                bottom: 28px;
                left: 50%;
                transform: translateX(-50%) translateY(12px);
                padding: 8px 18px;
                background: rgba(31, 42, 68, 0.92);
                color: #fff;
                border-radius: 8px;
                font-size: 13px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease, transform 0.2s ease;
                z-index: 100000;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            }
            #toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="editor-wrap">
                <div class="editor-head panel-title">
                    <div class="editor-head-main">
                        <span id="head-label">二维码生成</span>
                        <span class="hint" id="head-hint">UTF-8 最多约 45KB；较长内容仅手动点「生成」预览</span>
                    </div>
                    <div class="actions">
                        <div class="json-tabs" id="mode-tabs" role="tablist">
                            <button type="button" class="active" data-mode="qrcode">二维码生成</button>
                            <button type="button" data-mode="barcode">条形码生成</button>
                        </div>
                        <button type="button" class="title-btn primary" id="generate-btn">生成</button>
                        <button type="button" class="title-btn" id="download-btn">下载图片</button>
                        <button type="button" class="title-btn danger" id="clear-btn">清空</button>
                    </div>
                </div>
                <div class="editor-zone">
                    <div class="editor-main-col">
                        <textarea id="input-text" name="qrInput" spellcheck="false" aria-label="输入要编码的字符串" placeholder="网址、文本、Wi‑Fi 等；超长内容将生成多张二维码，扫码后按顺序拼接字节"></textarea>
                        <div id="status"></div>
                    </div>
                    <div class="preview-wrap" id="preview-panel" aria-label="预览区">
                        <div id="qrcode"></div>
                        <svg id="barcode" class="hidden"></svg>
                    </div>
                </div>
            </div>
        </div>
        <div id="toast" aria-live="polite"></div>

        <script src="./libs/qrcode-lib.bundle.js"></script>
        <script src="./libs/JsBarcode.all.min.js"></script>
        <script>
            (function () {
                /** Version40 字节模式参考容量（与 node-qrcode 一致，仅作状态栏说明） */
                var CAPACITY_V40 = { L: 2953, M: 2331, Q: 1663, H: 1273 };
                /** 常见网页工具约 15KB 级限制，此处约 2.5～3 倍，兼顾流畅 */
                var MAX_INPUT_UTF8_BYTES = 45000;
                /** 超过此 UTF-8 长度不再输入时自动刷新，避免卡顿 */
                var MAX_AUTO_PREVIEW_UTF8_BYTES = 9600;
                /** 极端纠错下分片过多时保护主线程 */
                var MAX_QR_CHUNKS = 120;
                var teEnc = new TextEncoder();
                var teDec = new TextDecoder("utf-8", { fatal: true });
                var teDecLenient = new TextDecoder("utf-8", { fatal: false });

                /** 默认：纠错 L、边长 280px；条形码高度 120px（CODE128） */
                var DEFAULT_QR_ECC = "L";
                var DEFAULT_QR_SIZE = 280;
                var DEFAULT_BAR_HEIGHT = 120;
                var DEFAULT_CHUNK_MARGIN = 24;

                var mode = "qrcode";
                var autoGenTimer = null;

                function toast(msg) {
                    var el = document.getElementById("toast");
                    el.textContent = msg;
                    el.classList.add("show");
                    clearTimeout(el._t);
                    el._t = setTimeout(function () {
                        el.classList.remove("show");
                    }, 2000);
                }

                function setStatus(text, isError) {
                    var s = document.getElementById("status");
                    s.textContent = text;
                    s.classList.toggle("err", !!isError);
                }

                function normalizeInputText(raw) {
                    return String(raw || "")
                        .replace(/<br\s*\/?>/gi, "\n")
                        .replace(/\r\n/g, "\n");
                }

                function getUtf8ByteLength(text) {
                    return teEnc.encode(text).length;
                }

                /** 从 pos 起读一个 UTF-8 码位的结束字节下标（不含）；非法首字节则 pos+1，避免死循环 */
                function utf8CharEndExclusive(u8, pos) {
                    if (pos >= u8.length) return pos;
                    var c0 = u8[pos];
                    if (c0 < 0x80) return pos + 1;
                    if ((c0 & 0xe0) === 0xc0) {
                        return pos + 2 <= u8.length ? pos + 2 : u8.length;
                    }
                    if ((c0 & 0xf0) === 0xe0) {
                        return pos + 3 <= u8.length ? pos + 3 : u8.length;
                    }
                    if ((c0 & 0xf8) === 0xf0) {
                        return pos + 4 <= u8.length ? pos + 4 : u8.length;
                    }
                    return pos + 1;
                }

                /** node-qrcode（与 Ctool 所用 qr-code-styling 底层同类）能否编码该段 */
                function qrCreateOk(text, ecc) {
                    if (typeof QRCodeLib === "undefined" || !QRCodeLib.create) return false;
                    try {
                        QRCodeLib.create(String(text || ""), { errorCorrectionLevel: ecc });
                        return true;
                    } catch (e) {
                        return false;
                    }
                }

                /**
                 * 按 UTF-8 边界切分：用 QRCodeLib.create 判断是否可进单码（与 Ctool 行为一致，避免旧 davidshimjs 中文 BOM/估长 bug）。
                 */
                function splitUtf8ByQrCreate(text, ecc) {
                    var u8 = teEnc.encode(text);
                    if (u8.length === 0) return [];
                    var out = [];
                    var start = 0;
                    while (start < u8.length) {
                        var ends = [];
                        var p = start;
                        while (p < u8.length) {
                            var nx = utf8CharEndExclusive(u8, p);
                            if (nx <= p) nx = Math.min(p + 1, u8.length);
                            ends.push(nx);
                            p = nx;
                        }
                        var lo = 0;
                        var hi = ends.length - 1;
                        var best = -1;
                        while (lo <= hi) {
                            var mid = (lo + hi) >> 1;
                            var endByte = ends[mid];
                            var sliceStr;
                            try {
                                sliceStr = teDec.decode(u8.subarray(start, endByte));
                            } catch (e) {
                                hi = mid - 1;
                                continue;
                            }
                            if (qrCreateOk(sliceStr, ecc)) {
                                best = mid;
                                lo = mid + 1;
                            } else {
                                hi = mid - 1;
                            }
                        }
                        if (best < 0) {
                            throw new Error(
                                "单码无法容纳当前起始字符（纠错 " +
                                    ecc +
                                    "）。请改用纠错 L 后重试。"
                            );
                        }
                        var cut = ends[best];
                        out.push(teDecLenient.decode(u8.subarray(start, cut)));
                        start = cut;
                    }
                    return out;
                }

                /**
                 * 使用 node-qrcode 的 toCanvas 绘制（UTF-8 中文可靠）；按纠错档回退尝试。
                 */
                function renderChunkWithFallback(el, text, preferredName, size) {
                    var pref = ["L", "M", "Q", "H"].indexOf((preferredName || "L").toUpperCase());
                    if (pref < 0) pref = 0;
                    var names = ["L", "M", "Q", "H"];
                    var order = [];
                    for (var i = 0; i < names.length; i++) {
                        order.push(names[(pref + i) % names.length]);
                    }
                    var uniq = [];
                    order.forEach(function (n) {
                        if (uniq.indexOf(n) < 0) uniq.push(n);
                    });
                    var lastErr = null;
                    for (var j = 0; j < uniq.length; j++) {
                        var nm = uniq[j];
                        if (!qrCreateOk(text, nm)) {
                            lastErr = new Error("该纠错级别下单段过长");
                            continue;
                        }
                        el.innerHTML = "";
                        var canvas = document.createElement("canvas");
                        var err = null;
                        try {
                            QRCodeLib.toCanvas(
                                canvas,
                                text,
                                {
                                    errorCorrectionLevel: nm,
                                    width: size,
                                    margin: 2,
                                    color: { dark: "#000000", light: "#ffffff" }
                                },
                                function (e) {
                                    err = e;
                                }
                            );
                        } catch (e) {
                            err = e;
                        }
                        if (err) {
                            lastErr = err;
                            continue;
                        }
                        el.appendChild(canvas);
                        return nm;
                    }
                    throw lastErr || new Error("单段无法编码");
                }

                function clearPreview() {
                    document.getElementById("qrcode").innerHTML = "";
                    var barcode = document.getElementById("barcode");
                    barcode.innerHTML = "";
                }

                function generateQrList(text, size, eccName, chunkMargin) {
                    void chunkMargin;
                    var ecc = (eccName || "L").toUpperCase();
                    if (!/^[LMQH]$/.test(ecc)) ecc = "L";
                    if (typeof QRCodeLib === "undefined" || !QRCodeLib.create) {
                        throw new Error("二维码引擎未加载，请确认 pages/libs/qrcode-lib.bundle.js 存在且已先于本脚本加载。");
                    }
                    var chunks = splitUtf8ByQrCreate(text, ecc);
                    if (chunks.length > MAX_QR_CHUNKS) {
                        throw new Error(
                            "分片数量超过 " +
                                MAX_QR_CHUNKS +
                                " 张，请缩短内容或改用纠错 L。当前约 " +
                                chunks.length +
                                " 张。"
                        );
                    }
                    var qrcodeEl = document.getElementById("qrcode");
                    qrcodeEl.innerHTML = "";
                    var usedLevels = [];
                    var cap = CAPACITY_V40[ecc] || CAPACITY_V40.L;
                    chunks.forEach(function (chunk, idx) {
                        var item = document.createElement("div");
                        item.className = "qr-item";
                        var label = document.createElement("div");
                        label.className = "qr-item-label";
                        label.textContent = chunks.length > 1 ? "第 " + (idx + 1) + " / " + chunks.length + " 张" : "单张";
                        var codeWrap = document.createElement("div");
                        item.appendChild(label);
                        item.appendChild(codeWrap);
                        qrcodeEl.appendChild(item);
                        var nm = renderChunkWithFallback(codeWrap, chunk, ecc, size);
                        usedLevels.push(nm);
                    });
                    return { chunks: chunks, levels: usedLevels, cap: cap, ecc: ecc };
                }

                function syncModeUi() {
                    var qr = mode === "qrcode";
                    document.getElementById("head-label").textContent = qr ? "二维码生成" : "条形码生成";
                    document.getElementById("head-hint").textContent = qr
                        ? "UTF-8 最多约 " +
                          Math.floor(MAX_INPUT_UTF8_BYTES / 1024) +
                          "KB；超过 " +
                          Math.floor(MAX_AUTO_PREVIEW_UTF8_BYTES / 1024) +
                          "KB 请点「生成」刷新"
                        : "条形码为 CODE128；中文建议改用二维码";
                    document.getElementById("qrcode").classList.toggle("hidden", !qr);
                    document.getElementById("barcode").classList.toggle("hidden", qr);
                }

                function generateCode() {
                    var inputEl = document.getElementById("input-text");
                    var normalizedText = normalizeInputText(inputEl.value);
                    var text = normalizedText;
                    var size = Math.max(80, Math.min(1200, DEFAULT_QR_SIZE));
                    var charLen = text.length;
                    var byteLen = getUtf8ByteLength(text);

                    if (!text.trim()) {
                        clearPreview();
                        setStatus("请输入要编码的字符串。", true);
                        return;
                    }

                    if (byteLen > MAX_INPUT_UTF8_BYTES) {
                        clearPreview();
                        setStatus(
                            "内容过长：当前 UTF-8 为 " +
                                byteLen +
                                " 字节，上限约 " +
                                MAX_INPUT_UTF8_BYTES +
                                " 字节（约为常见在线工具的 2～3 倍）。请删减后重试。",
                            true
                        );
                        return;
                    }

                    clearPreview();

                    if (mode === "qrcode") {
                        var eccName = DEFAULT_QR_ECC;
                        var marginBytes = DEFAULT_CHUNK_MARGIN;
                        try {
                            var res = generateQrList(text, size, eccName, marginBytes);
                            var levelNote = res.levels.length ? "实际纠错：" + res.levels.join("、") + "。" : "";
                            var splitNote =
                                res.chunks.length > 1
                                    ? " 已分为 " +
                                      res.chunks.length +
                                      " 张（node-qrcode 按纠错 " +
                                      res.ecc +
                                      " 自动分片；Version40 " +
                                      res.ecc +
                                      " 约 " +
                                      res.cap +
                                      " 字节）。"
                                    : " 单张二维码，UTF-8 " + byteLen + " 字节（Version40 " + res.ecc + " 最大约 " + res.cap + " 字节）。";
                            setStatus(
                                "共 " +
                                    charLen +
                                    " 字符 / " +
                                    byteLen +
                                    " 字节。" +
                                    splitNote +
                                    " " +
                                    levelNote,
                                false
                            );
                        } catch (error) {
                            clearPreview();
                            setStatus(
                                "生成失败：" +
                                    (error && error.message ? error.message : String(error)) +
                                    "（当前 " +
                                    charLen +
                                    " 字符 / " +
                                    byteLen +
                                    " 字节）",
                                true
                            );
                        }
                        return;
                    }

                    var barcodeEl = document.getElementById("barcode");
                    if (byteLen > 8000) {
                        clearPreview();
                        setStatus("条形码内容过长（>8000 字节），请缩短或改用二维码。", true);
                        return;
                    }
                    var bh = DEFAULT_BAR_HEIGHT;
                    try {
                        JsBarcode(barcodeEl, text, {
                            format: "CODE128",
                            width: 2,
                            height: bh,
                            displayValue: true,
                            margin: 10
                        });
                        setStatus(
                            "条形码已生成。" +
                                charLen +
                                " 字符 / " +
                                byteLen +
                                " 字节。若失败请缩短内容或改用二维码。",
                            false
                        );
                    } catch (error) {
                        clearPreview();
                        setStatus(
                            "条形码失败：CODE128 对中文、换行等支持有限，请改用二维码或仅使用 ASCII。",
                            true
                        );
                    }
                }

                function downloadCode() {
                    var text = document.getElementById("input-text").value.trim();
                    if (!text) {
                        toast("请先生成内容");
                        setStatus("请先输入并生成。", true);
                        return;
                    }

                    if (mode === "qrcode") {
                        var canvases = document.querySelectorAll("#qrcode canvas");
                        var imgs = document.querySelectorAll("#qrcode img");
                        if (!canvases.length && !imgs.length) {
                            toast("请先生成二维码");
                            return;
                        }
                        var list = canvases.length ? Array.prototype.slice.call(canvases) : Array.prototype.slice.call(imgs);
                        list.forEach(function (node, i) {
                            var src = node.tagName === "CANVAS" ? node.toDataURL("image/png") : node.src;
                            if (!src) return;
                            var a = document.createElement("a");
                            a.href = src;
                            a.download = list.length > 1 ? "qrcode-" + (i + 1) + ".png" : "qrcode.png";
                            a.click();
                        });
                        toast(list.length > 1 ? "已依次下载 " + list.length + " 张 PNG" : "已下载 PNG");
                        return;
                    }

                    var svg = document.getElementById("barcode");
                    if (!svg || !svg.innerHTML.trim()) {
                        toast("请先生成条形码");
                        return;
                    }
                    var data = new Blob([svg.outerHTML], { type: "image/svg+xml;charset=utf-8" });
                    var url = URL.createObjectURL(data);
                    var a = document.createElement("a");
                    a.href = url;
                    a.download = "barcode.svg";
                    a.click();
                    URL.revokeObjectURL(url);
                    toast("已下载 SVG");
                }

                function clearAll() {
                    document.getElementById("input-text").value = "";
                    mode = "qrcode";
                    document.querySelectorAll("#mode-tabs button").forEach(function (b) {
                        b.classList.toggle("active", b.getAttribute("data-mode") === "qrcode");
                    });
                    syncModeUi();
                    clearPreview();
                    setStatus("已清空。", false);
                }

                function scheduleGenerate(delayMs) {
                    if (autoGenTimer) window.clearTimeout(autoGenTimer);
                    autoGenTimer = window.setTimeout(function () {
                        var t = normalizeInputText(document.getElementById("input-text").value);
                        var bl = getUtf8ByteLength(t);
                        if (mode === "qrcode" && bl > MAX_AUTO_PREVIEW_UTF8_BYTES) {
                            clearPreview();
                            setStatus(
                                "当前 UTF-8 约 " +
                                    bl +
                                    " 字节，已超过自动预览阈值（" +
                                    MAX_AUTO_PREVIEW_UTF8_BYTES +
                                    " 字节），请点击「生成」更新预览以减轻卡顿。",
                                false
                            );
                            return;
                        }
                        generateCode();
                    }, delayMs);
                }

                document.getElementById("mode-tabs").addEventListener("click", function (e) {
                    var btn = e.target.closest("button[data-mode]");
                    if (!btn) return;
                    mode = btn.getAttribute("data-mode") || "qrcode";
                    document.querySelectorAll("#mode-tabs button").forEach(function (b) {
                        b.classList.toggle("active", b === btn);
                    });
                    syncModeUi();
                    generateCode();
                });

                document.getElementById("generate-btn").addEventListener("click", generateCode);
                document.getElementById("download-btn").addEventListener("click", downloadCode);
                document.getElementById("clear-btn").addEventListener("click", clearAll);
                document.getElementById("input-text").addEventListener("input", function () {
                    scheduleGenerate(400);
                });
                document.getElementById("input-text").addEventListener("paste", function () {
                    scheduleGenerate(200);
                });

                syncModeUi();
                setStatus(
                    "二维码 UTF-8 上限约 " +
                        MAX_INPUT_UTF8_BYTES +
                        " 字节；≤ " +
                        MAX_AUTO_PREVIEW_UTF8_BYTES +
                        " 字节时输入会自动刷新。",
                    false
                );
            })();
        </script>
    </body>
</html>
