<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>UUID 工具</title>
        <link rel="stylesheet" href="libs/tool-danger-btn.css" />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            :root {
                --card: #ffffff;
                --bg: #f3f7ff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
            }
            html, body {
                width: 100%;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
            }
            .page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                min-height: 0;
            }
            .editor-wrap {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                overflow: hidden;
            }
            .panel-title {
                padding: 8px 10px;
                font-size: 14px;
                color: #324a76;
                border-bottom: 1px solid #e4edff;
                background: #f8fbff;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .editor-head {
                flex: 0 0 auto;
                gap: 8px;
            }
            .editor-head-main {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
                flex-wrap: wrap;
                flex: 1;
            }
            .editor-head .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
                flex-shrink: 0;
            }
            .hint {
                color: var(--muted);
                font-size: 14px;
            }
            .title-btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 4px 10px;
                font-size: 13px;
                cursor: pointer;
            }
            .title-btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .title-btn.primary {
                color: #fff;
                border-color: transparent;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            .title-btn.primary:hover {
                filter: brightness(1.05);
                color: #fff;
            }
            .editor-zone {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                padding: 0 8px 8px;
            }
            #uuid-out {
                flex: 1;
                width: 100%;
                min-height: 120px;
                margin-top: 0;
                padding: 10px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                font-size: 13px;
                line-height: 1.6;
                font-family: Consolas, "Courier New", monospace;
                resize: none;
                outline: none;
                background: #fff;
            }
            #uuid-out:focus {
                box-shadow: inset 0 0 0 1px rgba(47, 107, 255, 0.25);
            }
            .ctool-page-option {
                flex: 0 0 auto;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                padding: 8px;
            }
            .align-row {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                justify-content: center;
                align-items: center;
            }
            .opt-label {
                font-size: 13px;
                color: var(--muted);
                white-space: nowrap;
            }
            select.dd,
            .num-in {
                min-height: 2rem;
                padding: 4px 8px;
                font-size: 14px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                background: #fff;
                color: var(--text);
                outline: none;
            }
            select.dd:focus,
            .num-in:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.15);
            }
            select.dd {
                min-width: 7rem;
                max-width: 12rem;
                cursor: pointer;
            }
            .num-in {
                width: 4.5rem;
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 8px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 7px 12px;
                font-size: 14px;
                cursor: pointer;
                min-height: 2rem;
            }
            .btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .check-block {
                margin-top: 8px;
                padding-top: 8px;
                border-top: 1px solid #e4edff;
            }
            #check-in {
                flex: 1;
                min-width: 140px;
                max-width: 420px;
                min-height: 2rem;
                padding: 4px 10px;
                font-size: 14px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                font-family: Consolas, "Courier New", monospace;
            }
            #check-in:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.15);
                outline: none;
            }
            #check-msg {
                font-size: 13px;
                color: var(--muted);
                flex: 1 1 100%;
                text-align: center;
            }
            #check-msg.ok {
                color: #1a7f4a;
            }
            #check-msg.bad {
                color: #c62828;
            }
            #toast {
                position: fixed;
                bottom: 28px;
                left: 50%;
                transform: translateX(-50%) translateY(12px);
                padding: 8px 18px;
                background: rgba(31, 42, 68, 0.92);
                color: #fff;
                border-radius: 8px;
                font-size: 13px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease, transform 0.2s ease;
                z-index: 100000;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            }
            #toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="editor-wrap">
                <div class="editor-head panel-title">
                    <div class="editor-head-main">
                        <span>UUID / GUID</span>
                        <span class="hint">RFC 4122 · 批量生成与校验</span>
                    </div>
                    <div class="actions">
                        <button type="button" class="title-btn primary" id="btn-gen">生成</button>
                        <button type="button" class="title-btn" id="btn-copy">复制</button>
                        <button type="button" class="title-btn danger" id="btn-clear">清空</button>
                    </div>
                </div>
                <div class="editor-zone">
                    <textarea id="uuid-out" name="uuidOut" spellcheck="false" placeholder="点击下方选项即自动生成；也可点「生成」刷新"></textarea>
                </div>
            </div>

            <div class="ctool-page-option">
                <div class="align-row">
                    <span class="opt-label">版本</span>
                    <select id="sel-ver" class="dd" name="uuidVersion" title="UUID 版本">
                        <option value="v4" selected>UUID v4（随机）</option>
                        <option value="v1">UUID v1（时间序）</option>
                        <option value="nil">空 UUID（全 0）</option>
                    </select>
                    <span class="opt-label">数量</span>
                    <input type="number" id="inp-count" class="num-in" name="uuidCount" min="1" max="2000" value="10" title="一次生成条数" />
                    <span class="opt-label">输出格式</span>
                    <select id="sel-fmt" class="dd" name="uuidFmt" title="字符串格式">
                        <option value="std" selected>标准（含连字符）</option>
                        <option value="plain">无连字符（32 位）</option>
                        <option value="brace">大括号（SQL Server 风格）</option>
                    </select>
                    <span class="opt-label">字母</span>
                    <select id="sel-case" class="dd" name="uuidCase" title="大小写">
                        <option value="lower" selected>小写 a-f</option>
                        <option value="upper">大写 A-F</option>
                    </select>
                    <span class="opt-label">多条分隔</span>
                    <select id="sel-sep" class="dd" name="uuidSep" title="批量结果分隔符">
                        <option value="nl" selected>换行</option>
                        <option value="comma">逗号 + 空格</option>
                        <option value="none">无分隔（连续）</option>
                    </select>
                </div>
                <div class="check-block">
                    <div class="align-row">
                        <span class="opt-label">校验</span>
                        <input type="text" id="check-in" name="uuidCheck" spellcheck="false" placeholder="粘贴 UUID / GUID 后校验" />
                        <button type="button" class="btn" id="btn-check">校验</button>
                    </div>
                    <div id="check-msg"></div>
                </div>
            </div>
        </div>
        <div id="toast" aria-live="polite"></div>
        <script>
            (function () {
                var out = document.getElementById("uuid-out");
                var toastEl = document.getElementById("toast");
                var selVer = document.getElementById("sel-ver");
                var inpCount = document.getElementById("inp-count");
                var selFmt = document.getElementById("sel-fmt");
                var selCase = document.getElementById("sel-case");
                var selSep = document.getElementById("sel-sep");
                var checkIn = document.getElementById("check-in");
                var checkMsg = document.getElementById("check-msg");
                var uuidModPromise = null;

                function toast(msg) {
                    toastEl.textContent = msg;
                    toastEl.classList.add("show");
                    clearTimeout(toastEl._t);
                    toastEl._t = setTimeout(function () {
                        toastEl.classList.remove("show");
                    }, 2200);
                }

                function ensureUuidLib() {
                    if (uuidModPromise) return uuidModPromise;
                    uuidModPromise = import("../vendor/bundles/uuid.mjs").then(function (m) {
                        if (typeof m.v1 !== "function" || typeof m.v4 !== "function") {
                            throw new Error("uuid 模块不完整");
                        }
                        return m;
                    });
                    return uuidModPromise;
                }

                function bytesToUuidHex(b) {
                    var h = "";
                    for (var i = 0; i < 16; i++) {
                        h += b[i].toString(16).padStart(2, "0");
                    }
                    return (
                        h.slice(0, 8) +
                        "-" +
                        h.slice(8, 12) +
                        "-" +
                        h.slice(12, 16) +
                        "-" +
                        h.slice(16, 20) +
                        "-" +
                        h.slice(20, 32)
                    );
                }

                function uuidV4Rfc() {
                    var b = new Uint8Array(16);
                    crypto.getRandomValues(b);
                    b[6] = (b[6] & 0x0f) | 0x40;
                    b[8] = (b[8] & 0x3f) | 0x80;
                    return bytesToUuidHex(b);
                }

                function uuidV4() {
                    if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
                        return crypto.randomUUID();
                    }
                    return uuidV4Rfc();
                }

                function formatOutput(stdLower, fmt, upper) {
                    var s = stdLower;
                    if (fmt === "plain") {
                        s = s.replace(/-/g, "");
                    } else if (fmt === "brace") {
                        s = "{" + s + "}";
                    }
                    if (upper) s = s.toUpperCase();
                    return s;
                }

                function joinSep(lines, sep) {
                    if (sep === "comma") return lines.join(", ");
                    if (sep === "none") return lines.join("");
                    return lines.join("\n");
                }

                function clampCount() {
                    var n = parseInt(inpCount.value, 10);
                    if (isNaN(n) || n < 1) n = 1;
                    if (n > 2000) n = 2000;
                    inpCount.value = String(n);
                    return n;
                }

                function doGenerate(opts) {
                    opts = opts || {};
                    var silent = !!opts.silent;
                    var ver = selVer.value;
                    var n = clampCount();
                    var fmt = selFmt.value;
                    var upper = selCase.value === "upper";
                    var sep = selSep.value;

                    if (ver === "nil") {
                        var nilStd = "00000000-0000-0000-0000-000000000000";
                        out.value = formatOutput(nilStd, fmt, upper);
                        if (!silent) toast("已生成空 UUID");
                        return;
                    }

                    if (ver === "v4") {
                        var lines = [];
                        for (var i = 0; i < n; i++) lines.push(formatOutput(uuidV4(), fmt, upper));
                        out.value = joinSep(lines, sep);
                        if (!silent) toast("已生成 " + n + " 条 v4");
                        return;
                    }

                    if (ver === "v1") {
                        ensureUuidLib()
                            .then(function (m) {
                                var lines = [];
                                for (var j = 0; j < n; j++) {
                                    lines.push(formatOutput(m.v1(), fmt, upper));
                                }
                                out.value = joinSep(lines, sep);
                                if (!silent) toast("已生成 " + n + " 条 v1");
                            })
                            .catch(function (e) {
                                toast("v1 依赖加载失败：" + (e.message || String(e)));
                            });
                    }
                }

                function normalizeCheckInput(raw) {
                    var s = String(raw || "").trim();
                    if (!s) return "";
                    if (s.charAt(0) === "{" && s.charAt(s.length - 1) === "}") {
                        s = s.slice(1, -1).trim();
                    }
                    return s.replace(/-/g, "").toLowerCase();
                }

                function withHyphens32(hex32) {
                    if (hex32.length !== 32) return null;
                    return (
                        hex32.slice(0, 8) +
                        "-" +
                        hex32.slice(8, 12) +
                        "-" +
                        hex32.slice(12, 16) +
                        "-" +
                        hex32.slice(16, 20) +
                        "-" +
                        hex32.slice(20, 32)
                    );
                }

                function validateUuid(raw) {
                    var compact = normalizeCheckInput(raw);
                    if (!compact) return { ok: false, msg: "请输入内容" };
                    if (!/^[0-9a-f]{32}$/.test(compact)) return { ok: false, msg: "应为 32 位十六进制（可含连字符或大括号）" };
                    var canon = withHyphens32(compact);
                    if (!canon) return { ok: false, msg: "格式错误" };
                    if (compact === "00000000000000000000000000000000") {
                        return { ok: true, msg: "校验通过 · 空 UUID（NIL）" };
                    }
                    var verDigit = compact.charAt(12);
                    if (!/[1-8]/.test(verDigit)) {
                        return { ok: false, msg: "版本位无效（第 13 位十六进制应为 1–8）" };
                    }
                    var varDigit = compact.charAt(16);
                    if (!/[89ab]/.test(varDigit)) {
                        return { ok: false, msg: "变体位无效（第 17 位应为 8、9、a 或 b）" };
                    }
                    var ver = parseInt(verDigit, 16);
                    return { ok: true, msg: "校验通过 · 版本 " + ver + " · " + canon };
                }

                function doCheck() {
                    var r = validateUuid(checkIn.value);
                    checkMsg.textContent = r.msg;
                    checkMsg.classList.remove("ok", "bad");
                    checkMsg.classList.add(r.ok ? "ok" : "bad");
                }

                document.getElementById("btn-gen").addEventListener("click", function () {
                    doGenerate({ silent: false });
                });

                function debounce(fn, ms) {
                    var t = null;
                    return function () {
                        var ctx = this;
                        var args = arguments;
                        clearTimeout(t);
                        t = setTimeout(function () {
                            fn.apply(ctx, args);
                        }, ms);
                    };
                }

                var regenSilent = function () {
                    doGenerate({ silent: true });
                };
                var regenCountDebounced = debounce(regenSilent, 350);

                selVer.addEventListener("change", regenSilent);
                selFmt.addEventListener("change", regenSilent);
                selCase.addEventListener("change", regenSilent);
                selSep.addEventListener("change", regenSilent);
                inpCount.addEventListener("change", regenSilent);
                inpCount.addEventListener("input", regenCountDebounced);
                document.getElementById("btn-copy").addEventListener("click", function () {
                    var v = out.value;
                    if (!v) {
                        toast("没有可复制的内容");
                        return;
                    }
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(v).then(
                            function () {
                                toast("已复制");
                            },
                            function () {
                                out.select();
                                document.execCommand("copy");
                                toast("已复制");
                            }
                        );
                    } else {
                        out.select();
                        document.execCommand("copy");
                        toast("已复制");
                    }
                });
                document.getElementById("btn-clear").addEventListener("click", function () {
                    out.value = "";
                });
                document.getElementById("btn-check").addEventListener("click", doCheck);
                checkIn.addEventListener("keydown", function (e) {
                    if (e.key === "Enter") doCheck();
                });
            })();
        </script>
    </body>
</html>
