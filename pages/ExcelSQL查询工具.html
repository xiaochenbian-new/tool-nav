            function rebuildEngineWithCurrentDb() {
                try {
                    alasql("SHOW TABLES").forEach(function (t) {
                        alasql("DROP TABLE IF EXISTS [" + t.tableid + "]");
                    });
                } catch (e) {
                    // ignore
                }
                const db = dbStore[currentDb];
                if (!db) {
                    alasqlEngineDbKey = "";
                    return;
                }
                db.tables.forEach(function (t) {
                    alasql("CREATE TABLE [" + t.tableName + "]");
                    alasql.tables[t.tableName].data = t.rows;
                });
                alasqlEngineDbKey = currentDb;
            }

            function ensureAlasqlEngineReady() {
                if (!currentDb || !dbStore[currentDb]) return;
                if (alasqlEngineDbKey === currentDb) return;
                rebuildEngineWithCurrentDb();
            }

            function isIdentifierChar(ch) {
                return /[A-Za-z0-9_\u4e00-\u9fa5]/.test(ch || "");
            }

            function autoQuoteOneIdentifier(sql, identifier) {
                if (!identifier) return sql;
                var out = "";
                var i = 0;
                var n = sql.length;
                var id = String(identifier);
                var idLen = id.length;
                var state = "normal";

                while (i < n) {
                    var ch = sql[i];
                    if (state === "normal") {
                        if (ch === "'") {
                            state = "single";
                            out += ch;
                            i++;
                            continue;
                        }
                        if (ch === '"') {
                            state = "double";
                            out += ch;
                            i++;
                            continue;
                        }
                        if (ch === "[") {
                            state = "bracket";
                            out += ch;
                            i++;
                            continue;
                        }
                        if (ch === "`") {
                            state = "backtick";
                            out += ch;
                            i++;
                            continue;
                        }

                        if (sql.slice(i, i + idLen) === id) {
                            var prev = i > 0 ? sql[i - 1] : "";
                            var next = i + idLen < n ? sql[i + idLen] : "";
                            if (!isIdentifierChar(prev) && !isIdentifierChar(next)) {
                                out += "[" + id + "]";
                                i += idLen;
                                continue;
                            }
                        }

                        out += ch;
                        i++;
                        continue;
                    }

                    out += ch;
                    if (state === "single" && ch === "'") state = "normal";
                    else if (state === "double" && ch === '"') state = "normal";
                    else if (state === "bracket" && ch === "]") state = "normal";
                    else if (state === "backtick" && ch === "`") state = "normal";
                    i++;
                }
                return out;
            }

            function autoQuoteIdentifiers(sql, columns) {
                var out = sql;
                var ordered = (columns || []).slice().sort(function (a, b) {
                    return String(b).length - String(a).length;
                });
                ordered.forEach(function (col) {
                    out = autoQuoteOneIdentifier(out, col);
                });
                return out;
            }

            function transformMysqlSql(sql) {
                // Keep common MySQL habits compatible with AlaSQL parser.
                return String(sql || "")
                    .replace(/`([^`]+)`/g, "[$1]")
                    .replace(/\bIFNULL\s*\(/gi, "COALESCE(")
                    .replace(/\bLCASE\s*\(/gi, "LOWER(")
                    .replace(/\bUCASE\s*\(/gi, "UPPER(")
                    .replace(/\bCHAR_LENGTH\s*\(/gi, "LENGTH(")
                    .replace(/\bSUBSTRING\s*\(/gi, "SUBSTR(");
            }

            function tryParseNumberLike(v) {
                if (typeof v === "number" && Number.isFinite(v)) return v;
                if (typeof v !== "string") return null;
                var s = v.trim();
                if (!s) return null;
                if (couldBeDateLikeString(s) && tryParseSortableOrIsoDateString(s)) return null;
                var normalized = s.replace(/[,\s]/g, "");
                if (/^[-+]?\d+(?:\.\d+)?$/.test(normalized)) {
                    var n = Number(normalized);
                    if (!Number.isFinite(n)) return null;
                    /** 报案号类长整型字符串不可安全转为 Number（超过 2^53-1 会失真） */
                    if (/^[-+]?\d+$/.test(normalized) && !Number.isSafeInteger(n)) return null;
                    return n;
                }
                return null;
            }

            /** 将 SQL 中日期字符串字面量统一为 yyyy-MM-dd HH:mm:ss，避免时间比较因格式差异失效。 */
            function normalizeDateLiteralsInSql(sql) {
                var text = String(sql || "");
                var out = "";
                var i = 0;
                while (i < text.length) {
                    var ch = text.charAt(i);
                    if (ch !== "'") {
                        out += ch;
                        i++;
                        continue;
                    }
                    out += "'";
                    i++;
                    var token = "";
                    while (i < text.length) {
                        var c = text.charAt(i);
                        if (c === "'") {
                            if (i + 1 < text.length && text.charAt(i + 1) === "'") {
                                token += "'";
                                i += 2;
                                continue;
                            }
                            break;
                        }
                        token += c;
                        i++;
                    }
                    var parts = tryParseSortableOrIsoDateString(token);
                    var normalized = parts ? partsToSortable(parts) : token;
                    out += String(normalized).replace(/'/g, "''");
                    if (i < text.length && text.charAt(i) === "'") {
                        out += "'";
                        i++;
                    }
                }
                return out;
            }

            function normalizeSql(rawSql, sqlMode) {
                const tableSelect = document.getElementById("table-select");
                let sql = String(rawSql || "").trim().replace(/;+\s*$/, "");
                if (!sql) return "";
                if (!/\bfrom\b/i.test(sql)) {
                    if (!tableSelect.value) {
                        throw new Error("SQL 未写 FROM 且未选择默认 Sheet 表");
                    }
                    sql = sql + " FROM [" + tableSelect.value + "]";
                }
                const db = dbStore[currentDb];
                const cols = [];
                if (db) {
                    db.tables.forEach(function (t) {
                        t.columns.forEach(function (c) { cols.push(c); });
                    });
                }
                if (sqlMode === "mysql") {
                    sql = transformMysqlSql(sql);
                }
                sql = autoQuoteIdentifiers(sql, cols);
                sql = expandNumericEqualityInSql(sql);
                sql = normalizeDateLiteralsInSql(sql);
                return sql + ";";
            }

            function renderResult(rows) {
                lastQueryRows = Array.isArray(rows) ? rows.slice() : [];
                rowDisplayCache = new WeakMap();
                currentFilters = {};
                currentSort = { col: "", dir: "" };
                currentCols = lastQueryRows.length ? Object.keys(lastQueryRows[0]) : [];
                currentColWidths = {};
                currentPage = 1;
                currentSumText = "";
                rangeSelection = null;
                applyResultView();
            }

            function compareCellValue(a, b) {
                if (a instanceof Date && b instanceof Date && !isNaN(a.getTime()) && !isNaN(b.getTime())) {
                    return a.getTime() - b.getTime();
                }
                const sa = String(formatCellForDisplay(a === null || a === undefined ? "" : a)).trim();
                const sb = String(formatCellForDisplay(b === null || b === undefined ? "" : b)).trim();
                const na = Number(sa);
                const nb = Number(sb);
                const an = sa !== "" && !Number.isNaN(na);
                const bn = sb !== "" && !Number.isNaN(nb);
                if (an && bn) return na - nb;
                return sa.localeCompare(sb, "zh-CN", { numeric: true, sensitivity: "base" });
            }

            function applyResultView() {
                let rows = getRowsByCurrentFilters("", null);
                if (currentSort.col && currentSort.dir) {
                    const col = currentSort.col;
                    const dir = currentSort.dir === "desc" ? -1 : 1;
                    const keyed = rows.map(function (r) {
                        var text = getRowDisplayValue(r, col);
                        var n = Number(text);
                        var p = parseDateFilterInput(text);
                        var key;
                        var mode;
                        if (text !== "" && !Number.isNaN(n)) {
                            mode = "num";
                            key = n;
                        } else if (p) {
                            mode = "date";
                            key = partsToSortable(p);
                        } else {
                            mode = "str";
                            key = text;
                        }
                        return { row: r, mode: mode, key: key };
                    });
                    keyed.sort(function (a, b) {
                        if (a.mode === b.mode) {
                            if (a.mode === "num") return (a.key - b.key) * dir;
                            return String(a.key).localeCompare(String(b.key), "zh-CN", { numeric: true, sensitivity: "base" }) * dir;
                        }
                        return String(a.key).localeCompare(String(b.key), "zh-CN", { numeric: true, sensitivity: "base" }) * dir;
                    });
                    rows = keyed.map(function (x) { return x.row; });
                }
                currentViewRows = rows;
                const totalPages = Math.max(1, Math.ceil(currentViewRows.length / currentPageSize));
                if (currentPage > totalPages) currentPage = totalPages;
                if (currentPage < 1) currentPage = 1;
                renderResultTable();
                renderPager();
                updateViewSql();
            }

            function renderResultTable() {
                const wrap = document.getElementById("result-wrap");
                if (!lastQueryRows || !lastQueryRows.length) {
                    wrap.innerHTML = '<div class="empty">查询成功，但无结果。</div>';
                    return;
                }
                const cols = currentCols;
                const defaultWidth = Math.max(140, Math.floor((wrap.clientWidth || 800) / Math.max(cols.length, 1)));
                const startIdx = (currentPage - 1) * currentPageSize;
                const pageRows = currentViewRows.slice(startIdx, startIdx + currentPageSize);
                let html = "<table><colgroup>";
                html += "<col style=\"width:72px\" />";
                cols.forEach(function (c) {
                    const width = currentColWidths[c] || defaultWidth;
                    html += "<col style=\"width:" + width + "px\" />";
                });
                html += "</colgroup><thead><tr>";
                html += "<th class=\"rowno-col\">行号</th>";
                cols.forEach(function (c) {
                    const active = currentSort.col === c ? " active" : "";
                    const symbol = currentSort.col === c ? (currentSort.dir === "asc" ? "↑" : "↓") : "↕";
                    const filterRule = currentFilters[c] || { keyword: "", selected: [], dateFrom: "", dateTo: "" };
                    const hasFilter = !!String(filterRule.keyword || "").trim()
                        || (filterRule.selected && filterRule.selected.length > 0)
                        || !!String(filterRule.dateFrom || "").trim()
                        || !!String(filterRule.dateTo || "").trim();
                    const filterActive = hasFilter ? " active" : "";
                    html += "<th><span class=\"sortable-head\">"
                        + "<span class=\"th-name\" title=\"" + escapeHtml(c) + "\">" + escapeHtml(c) + "</span>"
                        + "<button class=\"sort-btn" + active + "\" data-col=\"" + escapeHtml(c) + "\" type=\"button\">" + symbol + "</button>"
                        + "<button class=\"filter-btn" + filterActive + "\" data-col=\"" + escapeHtml(c) + "\" type=\"button\" title=\"筛选\">"
                        + "<svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\"><path d=\"M3 5h18l-7 8v5l-4 2v-7L3 5z\" fill=\"currentColor\"></path></svg>"
                        + "</button>"
                        + "</span><span class=\"resize-handle\" data-col=\"" + escapeHtml(c) + "\"></span></th>";
                });
                html += "</tr></thead><tbody>";
                pageRows.forEach(function (r, idx) {
                    const rowNo = startIdx + idx + 1;
                    html += "<tr data-row-index=\"" + rowNo + "\">";
                    html += "<td class=\"rowno-col\" data-row-index=\"" + rowNo + "\" title=\"当前数据第 " + rowNo + " 行\">" + rowNo + "</td>";
                    cols.forEach(function (c) {
                        const text = escapeHtml(formatCellForDisplay(r[c]));
                        html += "<td class=\"data-cell\" data-col=\"" + escapeHtml(c) + "\" data-row-index=\"" + rowNo + "\">"
                            + "<span class=\"cell-content\" title=\"" + text + "\">" + text + "</span>"
                            + "<button class=\"cell-view-btn\" type=\"button\" title=\"查看完整内容\">👁</button></td>";
                    });
                    html += "</tr>";
                });
                html += "</tbody></table>";
                wrap.innerHTML = html;
                bindResultTableEvents();
                refreshSelectionHighlight();
            }

            function bindResultTableEvents() {
                markTruncatedCells();
                bindResizeEvents();
            }

            /** 不用 scrollWidth 逐格测量（大表会触发数万次强制布局、页面无响应）。 */
            function markTruncatedCells() {
                const wrap = document.getElementById("result-wrap");
                var thresh = 40;
                wrap.querySelectorAll(".cell-content").forEach(function (el) {
                    var t = el.textContent || "";
                    var truncated = t.length > thresh;
                    el.classList.toggle("is-truncated", truncated);
                    el.setAttribute("data-truncated", truncated ? "1" : "0");
                    var td = el.closest("td.data-cell");
                    if (td) td.classList.toggle("has-overflow", truncated);
                });
            }

            function bindResizeEvents() {
                const wrap = document.getElementById("result-wrap");
                const table = wrap.querySelector("table");
                if (!table) return;
                const handles = wrap.querySelectorAll(".resize-handle");
                handles.forEach(function (handle, idx) {
                    handle.addEventListener("mousedown", function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        const colName = handle.getAttribute("data-col");
                        const colEls = table.querySelectorAll("col");
                        const targetCol = colEls[idx + 1];
                        if (!targetCol) return;
                        const startX = e.clientX;
                        const startW = parseInt(targetCol.style.width || "160", 10);
                        function onMove(ev) {
                            const next = Math.max(100, startW + (ev.clientX - startX));
                            targetCol.style.width = next + "px";
                            currentColWidths[colName] = next;
                        }
                        function onUp() {
                            document.removeEventListener("mousemove", onMove);
                            document.removeEventListener("mouseup", onUp);
                        }
                        document.addEventListener("mousemove", onMove);
                        document.addEventListener("mouseup", onUp);
                    });
                });
            }

            function renderPager() {
                const pager = document.getElementById("pager");
                const info = document.getElementById("pager-info");
                const sumInfo = document.getElementById("pager-sum");
                const pagesWrap = document.getElementById("pager-pages");
                const first = document.getElementById("pager-first");
                const prev = document.getElementById("pager-prev");
                const next = document.getElementById("pager-next");
                const last = document.getElementById("pager-last");
                const total = currentViewRows.length;
                const totalPages = Math.max(1, Math.ceil(total / currentPageSize));
                const start = total ? (currentPage - 1) * currentPageSize + 1 : 0;
                const end = total ? Math.min(currentPage * currentPageSize, total) : 0;
                info.textContent = "第 " + currentPage + "/" + totalPages + " 页，显示 " + start + "-" + end + "，共 " + total + " 条";
                if (sumInfo) sumInfo.textContent = currentSumText || "";
                if (first) first.disabled = currentPage <= 1;
                prev.disabled = currentPage <= 1;
                next.disabled = currentPage >= totalPages;
                if (last) last.disabled = currentPage >= totalPages;
                if (pagesWrap) {
                    var from = Math.max(1, currentPage - 2);
                    var to = Math.min(totalPages, currentPage + 2);
                    var html = "";
                    for (var p = from; p <= to; p++) {
                        var active = p === currentPage ? " active" : "";
                        html += "<span class=\"pager-page" + active + "\" data-page=\"" + p + "\">" + p + "</span>";
                    }
                    pagesWrap.innerHTML = html;
                }
                pager.classList.toggle("visible", true);
            }

            function showColumnSum(col) {
                var hasValue = false;
                var invalidCount = 0;
                var sum = 0;
                currentViewRows.forEach(function (row) {
                    var v = row ? row[col] : null;
                    if (v === null || v === undefined) return;
                    var s = String(v).trim();
                    if (!s) return;
                    var n = tryParseNumberLike(v);
                    if (n === null) {
                        invalidCount++;
                        return;
                    }
                    hasValue = true;
                    sum += n;
                });
                if (!hasValue) {
                    currentSumText = "列【" + col + "】无可求和数值";
                } else {
                    currentSumText = "列【" + col + "】总和：" + String(Number(sum.toFixed(8)));
                    if (invalidCount > 0) {
                        currentSumText += "（忽略 " + invalidCount + " 个非数值）";
                    }
                }
                renderPager();
            }

            function getUniqueValuesForCol(col, fromAllRows) {
                var set = new Set();
                var candidateRows = fromAllRows ? lastQueryRows : getRowsByCurrentFilters(col, null);
                candidateRows.forEach(function (r) {
                    var text = getRowDisplayValue(r, col);
                    set.add(text);
                });
                return Array.from(set).sort(function (a, b) {
                    return ZH_COLLATOR.compare(a, b);
                });
            }

            function closeAllFilterPopup() {
                document.querySelectorAll(".filter-pop").forEach(function (el) { el.remove(); });
                activeFilterAnchor = null;
            }

            function adjustFilterPopupPosition(panel, btnEl) {
                if (!panel || !btnEl) return;
                var rect = btnEl.getBoundingClientRect();
                var vw = window.innerWidth || document.documentElement.clientWidth;
                var vh = window.innerHeight || document.documentElement.clientHeight;
                var panelW = panel.offsetWidth || 320;
                var panelH = panel.offsetHeight || 320;

                var left = rect.left;
                if (left + panelW > vw - 8) left = vw - panelW - 8;
                if (left < 8) left = 8;

                var top = rect.bottom + 6;
                if (top + panelH > vh - 8) {
                    var above = rect.top - panelH - 6;
                    if (above >= 8) top = above;
                    else top = Math.max(8, vh - panelH - 8);
                }
                panel.style.left = Math.round(left) + "px";
                panel.style.top = Math.round(top) + "px";
            }

            function toggleFilterPopup(col, btnEl) {
                const existing = Array.from(document.querySelectorAll(".filter-pop")).find(function (el) {
                    return el.getAttribute("data-col") === col;
                });
                if (existing) {
                    existing.remove();
                    return;
                }
                closeAllFilterPopup();
                const rule = currentFilters[col] || { keyword: "", selected: [], dateFrom: "", dateTo: "" };
                const dateCol = isDateLikeColumn(col);
                const values = getUniqueValuesForCol(col, dateCol);
                const years = dateCol ? getRecentYears(30) : [];
                const defaultYear = String(new Date().getFullYear());
                const initialFrom = rule.dateFrom ? rule.dateFrom : "";
                const initialTo = rule.dateTo ? rule.dateTo : "";
                const panel = document.createElement("div");
                panel.className = "filter-pop show";
                panel.setAttribute("data-col", col);
                const selectedSet = new Set(Array.isArray(rule.selected) ? rule.selected : []);
                panel.innerHTML =
                    (dateCol
                        ? "<div class=\"filter-quarter\">"
                        + "<span>季度</span>"
                        + "<select class=\"quarter-year\">"
                        + years.map(function (y) {
                            var selected = String(y) === defaultYear ? " selected" : "";
                            return "<option value=\"" + y + "\"" + selected + ">" + y + "年</option>";

            function quoteSqlValue(v) {
                return "'" + String(v).replace(/'/g, "''") + "'";
            }

            function unwrapGeneratedViewBase(sql) {
                var text = String(sql || "").trim().replace(/;+\s*$/, "");
                while (/^select\s+\*\s+from\s*\(/i.test(text)) {
                    var start = text.indexOf("(");
                    if (start < 0) break;
                    var depth = 0;
                    var end = -1;
                    for (var i = start; i < text.length; i++) {
                        var ch = text.charAt(i);
                        if (ch === "(") depth++;
                        else if (ch === ")") {
                            depth--;
                            if (depth === 0) {
                                end = i;
                                break;
                            }
                        }
                    }
                    if (end < 0) break;
                    var tail = text.slice(end + 1).trim();
                    if (!/^as\s+\[t\]\b/i.test(tail)) break;
                    text = text.slice(start + 1, end).trim();
                }
                return text;
            }

            function updateViewSql() {
                const sqlBox = document.getElementById("view-sql");
                if (!lastExecutedSql) {
                    sqlBox.value = "";
                    return;
                }
                const base = unwrapGeneratedViewBase(lastExecutedSql);
                const hasSort = !!(currentSort.col && currentSort.dir);
                const hasFilters = Object.keys(currentFilters).some(function (col) {
                    const rule = currentFilters[col] || { keyword: "", selected: [], dateFrom: "", dateTo: "" };
                    return !!String(rule.keyword || "").trim()
                        || (Array.isArray(rule.selected) && rule.selected.length > 0)
                        || !!String(rule.dateFrom || "").trim()
                        || !!String(rule.dateTo || "").trim();
                });
                if (!hasSort && !hasFilters) {
                    sqlBox.value = base + ";";
                    return;
                }
                const whereParts = [];
                Object.keys(currentFilters).forEach(function (col) {
                    const rule = currentFilters[col] || { keyword: "", selected: [], dateFrom: "", dateTo: "" };
                    const parts = [];
                    const kw = String(rule.keyword || "").trim();
                    const selected = Array.isArray(rule.selected) ? rule.selected : [];
                    const from = String(rule.dateFrom || "").trim();
                    const to = String(rule.dateTo || "").trim();
                    if (kw) {
                        parts.push("CAST([" + col + "] AS STRING) LIKE '%" + kw.replace(/'/g, "''") + "%'");
                    }
                    if (selected.length) {
                        parts.push("[" + col + "] IN (" + selected.map(quoteSqlValue).join(", ") + ")");
                    }
                    if (from) {
                        const p = parseDateFilterInput(from);
                        if (p) parts.push("[" + col + "] >= " + quoteSqlValue(partsToSortable(p)));
                    }
                    if (to) {
                        const p2 = parseDateFilterInput(to);
                        if (p2) parts.push("[" + col + "] <= " + quoteSqlValue(partsToSortable(p2)));
                    }
                    if (parts.length) whereParts.push("(" + parts.join(" AND ") + ")");
                });
                const canDirectAppend =
                    /^select\b/i.test(base)
                    && !/\bwhere\b/i.test(base)
                    && !/\bgroup\s+by\b/i.test(base)
                    && !/\bhaving\b/i.test(base)
                    && !/\border\s+by\b/i.test(base)
                    && !/\blimit\b/i.test(base)
                    && !/\bunion\b/i.test(base);
                let sql = base;
                if (whereParts.length) {
                    if (canDirectAppend) sql += " WHERE " + whereParts.join(" AND ");
                    else sql = "SELECT * FROM (" + base + ") AS [t] WHERE " + whereParts.join(" AND ");
                }
                if (currentSort.col && currentSort.dir) {
                    sql += " ORDER BY [" + currentSort.col + "] " + (currentSort.dir === "desc" ? "DESC" : "ASC");
                }
                sql += ";";
                sqlBox.value = sql;
            }

                document.execCommand("copy");

            function updateRangeSelectionFromClick(mode, rowIndex, colName, shiftKey) {
                var idx = Number(rowIndex || 0);
                if (!idx) return;
                if (!shiftKey || !rangeSelection || rangeSelection.mode !== mode || (mode === "col" && rangeSelection.col !== colName)) {
                    rangeSelection = { mode: mode, col: mode === "col" ? colName : "", start: idx, end: idx };
                } else {
                    rangeSelection.end = idx;
                }
                refreshSelectionHighlight();
            }

            function buildCopyTextBySelection(includeHeader) {
                if (!rangeSelection || !currentViewRows.length) return "";
                var withHeader = !!includeHeader;
                var start = Math.min(rangeSelection.start, rangeSelection.end);
                var end = Math.max(rangeSelection.start, rangeSelection.end);
                var lines = [];
                if (rangeSelection.mode === "row") {
                    if (withHeader) lines.push(currentCols.join("\t"));
                    for (var i = start; i <= end; i++) {
                        var row = currentViewRows[i - 1];
                        if (!row) continue;
                        var vals = currentCols.map(function (c) { return String(formatCellForDisplay(row[c])); });
                        lines.push(vals.join("\t"));
                    }
                    return lines.join("\n");
                }
                if (rangeSelection.mode === "col") {
                    if (withHeader) lines.push(rangeSelection.col);
                    for (var j = start; j <= end; j++) {
                        var row2 = currentViewRows[j - 1];
                        if (!row2) continue;
                        lines.push(String(formatCellForDisplay(row2[rangeSelection.col])));
                    }
                    return lines.join("\n");
                }
                return "";
            }

            function buildCopyTextByColumn(col, includeHeader) {
                var column = String(col || "").trim();
                if (!column || !currentViewRows.length) return "";
                var lines = [];
                if (includeHeader) lines.push(column);
                currentViewRows.forEach(function (row) {
                    lines.push(String(formatCellForDisplay(row[column])));
                });
                return lines.join("\n");
            }

            function refreshSelectionHighlight() {
                var wrap = document.getElementById("result-wrap");
                if (!wrap) return;
                var start = rangeSelection ? Math.min(rangeSelection.start, rangeSelection.end) : 0;
                var end = rangeSelection ? Math.max(rangeSelection.start, rangeSelection.end) : -1;
                wrap.querySelectorAll("tr[data-row-index]").forEach(function (tr) {
                    var idx = Number(tr.getAttribute("data-row-index") || 0);
                    var on = !!rangeSelection && rangeSelection.mode === "row" && idx >= start && idx <= end;
                    tr.classList.toggle("row-selected", on);
                });
                wrap.querySelectorAll("td.data-cell").forEach(function (td) {
                    var idx = Number(td.getAttribute("data-row-index") || 0);
                    var col = td.getAttribute("data-col") || "";
                    var on = !!rangeSelection
                        && rangeSelection.mode === "col"
                        && col === rangeSelection.col
                        && idx >= start
                        && idx <= end;
                    td.classList.toggle("cell-selected", on);
                });
            }

            async function loadExcelFiles(files) {
                var stopBusy = startDelayedBusy("正在导入 Excel…");
                try {
                    if (!window.XLSX || !window.alasql) {
                        setStatus("依赖加载失败，请检查网络后重试。", true);
                        return;
                    }
                    await yieldToBrowser();
                    Object.keys(dbStore).forEach(function (k) { delete dbStore[k]; });
                    alasqlEngineDbKey = "";

                    let tableCount = 0;
                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        const dbName = sanitizeName(file.name);
                        const dbTables = [];

                        if (/\.csv$/i.test(file.name)) {
                            setStatus("读取 CSV：" + file.name + " …", false);
                            const text = await file.text();
                            await yieldToBrowser();
                            const wbCsv = XLSX.read(text, { type: "string", cellDates: true });
                            const date1904Csv = workbookUsesDate1904(wbCsv);
                            const firstSheetName = wbCsv.SheetNames[0];
                            if (firstSheetName) {
                                const firstSheet = wbCsv.Sheets[firstSheetName];
                                const rowsCsvRaw = XLSX.utils.sheet_to_json(firstSheet, {
                                    defval: "",
                                    raw: false,
                                    dateNF: "yyyy-mm-dd HH:mm:ss"
                                });
                                if (rowsCsvRaw.length) {
                                    await yieldToBrowser();
                                    const rowsCsv = await normalizeImportedRowsAsync(rowsCsvRaw, { date1904: date1904Csv });
                                    dbTables.push({ tableName: "sheet", columns: Object.keys(rowsCsv[0]), rows: rowsCsv });
                                    tableCount++;
                                }
                            }
                        } else {
                            setStatus("读取 Excel：" + file.name + " …", false);
                            const buf = await file.arrayBuffer();
                            await yieldToBrowser();
                            const wb = XLSX.read(buf, { type: "array", cellDates: true });
                            const date1904Book = workbookUsesDate1904(wb);
                            for (let si = 0; si < wb.SheetNames.length; si++) {
                                const sheetName = wb.SheetNames[si];
                                const sheet = wb.Sheets[sheetName];
                                const rowsRaw = XLSX.utils.sheet_to_json(sheet, {
                                    defval: "",
                                    raw: false,
                                    dateNF: "yyyy-mm-dd HH:mm:ss"
                                });
                                if (!rowsRaw.length) continue;
                                await yieldToBrowser();
                                const rows = await normalizeImportedRowsAsync(rowsRaw, { date1904: date1904Book });
                                const tableName = sanitizeName(sheetName);
                                dbTables.push({ tableName: tableName, columns: Object.keys(rows[0]), rows: rows });
                                tableCount++;
                            }
                        }
                        if (dbTables.length) {
                            dbStore[dbName] = { dbName: dbName, tables: dbTables };
                        }
                    }

                    await yieldToBrowser();
                    refreshDbSelect();
                    refreshTableSelect();
                    rebuildEngineWithCurrentDb();
                    refreshTableList();
                    setStatus("加载完成：共 " + tableCount + " 张表。当前库：" + currentDb, false);

                    const db = dbStore[currentDb];
                    if (db && db.tables.length) {
                        document.getElementById("sql-input").value =
                            "SELECT * FROM [" + db.tables[0].tableName + "];";
                    }
                } finally {
                    stopBusy();
                }
            }

            async function runSql() {
                const rawSql = (document.getElementById("sql-input").value || "").trim();
                const sqlMode = document.getElementById("sql-mode").value || "mysql";
                if (!rawSql) {
                    setStatus("请输入 SQL。", true);
                    return;
                }
                if (!currentDb || !dbStore[currentDb]) {
                    setStatus("请先上传并选择 Excel 库。", true);
                    return;
                }
                var stopBusy = startDelayedBusy("正在执行 SQL…");
                try {
                    await yieldToBrowser();
                    ensureAlasqlEngineReady();
                    await yieldToBrowser();
                    const sql = normalizeSql(rawSql, sqlMode);
                    lastExecutedSql = sql;
                    await yieldToBrowser();
                    const rows = alasql(sql);
                    await yieldToBrowser();
                    if (Array.isArray(rows)) {
                        renderResult(rows);
                        saveSqlHistoryItem(rawSql);
                        var hint = rows.length > 20000
                            ? "（结果行数较多，已分页显示；需要全量数据请用 LIMIT/OFFSET 或导出）"
                            : "";
                        setStatus("执行成功：返回 " + rows.length + " 行。" + hint, false);
                    } else {
                        renderResult([]);
                        saveSqlHistoryItem(rawSql);
                        setStatus("执行成功。", false);
                    }
                } catch (error) {
                    setStatus("SQL 执行失败：" + (error && error.message ? error.message : "未知错误") + "（可尝试切换 SQL 语法类型）", true);
                } finally {
                    stopBusy();
                }
            }

                document.getElementById("view-sql").value = "";
                lastQueryRows = [];
                currentViewRows = [];
                currentCols = [];
                currentFilters = {};
                currentSort = { col: "", dir: "" };
                lastExecutedSql = "";
                currentColWidths = {};
                currentPage = 1;
                currentSumText = "";
                rangeSelection = null;
                document.getElementById("pager").classList.remove("visible");
                Object.keys(dbStore).forEach(function (k) { delete dbStore[k]; });
                currentDb = "";
                alasqlEngineDbKey = "";
                try {
                    alasql("SHOW TABLES").forEach(function (t) {
                        alasql("DROP TABLE IF EXISTS [" + t.tableid + "]");
                    });
                } catch (e) {
                    // ignore
                }
                refreshTableList();
                setStatus("已清空。", false);
            }

            document.getElementById("excel-files").addEventListener("change", function (e) {
                const files = Array.from(e.target.files || []);
                if (!files.length) return;
                loadExcelFiles(files);
            });
            document.getElementById("db-select").addEventListener("change", function (e) {
                currentDb = e.target.value;
                refreshTableSelect();
                alasqlEngineDbKey = "";
                refreshTableList();
                const db = dbStore[currentDb];
                if (db && db.tables.length) {
                    document.getElementById("sql-input").value = "SELECT * FROM [" + db.tables[0].tableName + "];";
                }
            });
            document.getElementById("run-sql-btn").addEventListener("click", function () {
                void runSql();
            });
            document.getElementById("quick-query-btn").addEventListener("click", function () {
                void quickQueryCurrentTable();
            });
            document.getElementById("clear-all-btn").addEventListener("click", clearAll);
            document.getElementById("sql-help-btn").addEventListener("click", function (e) {
                e.preventDefault();
                e.stopPropagation();
                closeSqlHistoryPop();
                openSqlHelp();
            });
            document.getElementById("sql-history-btn").addEventListener("click", function (e) {
                e.preventDefault();
                e.stopPropagation();
                toggleSqlHistoryPop();
            });
            document.getElementById("toggle-left-btn").addEventListener("click", function () {
                toggleLeftPanel();
            });
            document.getElementById("clear-view-btn").addEventListener("click", function () {
                currentFilters = {};
                currentSort = { col: "", dir: "" };
                currentPage = 1;
                currentSumText = "";
                rangeSelection = null;
                applyResultView();
            });
            document.getElementById("pager-first").addEventListener("click", function () {
                if (currentPage <= 1) return;
                currentPage = 1;
                renderResultTable();
                renderPager();
            });
            document.getElementById("pager-prev").addEventListener("click", function () {
                if (currentPage <= 1) return;
                currentPage--;
                renderResultTable();
                renderPager();
            });
            document.getElementById("pager-next").addEventListener("click", function () {
                const totalPages = Math.max(1, Math.ceil(currentViewRows.length / currentPageSize));
                if (currentPage >= totalPages) return;
                currentPage++;
                renderResultTable();
                renderPager();
            });
            document.getElementById("pager-last").addEventListener("click", function () {
                const totalPages = Math.max(1, Math.ceil(currentViewRows.length / currentPageSize));
                if (currentPage >= totalPages) return;
                currentPage = totalPages;
                renderResultTable();
                renderPager();
            });
            document.getElementById("pager-pages").addEventListener("click", function (e) {
                var target = e.target.closest(".pager-page");
                if (!target) return;
                var p = Number(target.getAttribute("data-page"));
                if (!Number.isFinite(p) || p < 1) return;
                currentPage = p;
                renderResultTable();
                renderPager();
            });
            document.getElementById("export-xlsx-btn").addEventListener("click", function () {
                if (!currentViewRows.length) {
                    setStatus("没有可导出的查询结果。", true);
                    return;
                }
                const ws = XLSX.utils.json_to_sheet(rowsWithDisplayStrings(currentViewRows));
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "result");
                XLSX.writeFile(wb, "query_result.xlsx");
                setStatus("已导出 Excel（query_result.xlsx）。", false);
            });
            document.getElementById("export-csv-btn").addEventListener("click", function () {
                if (!currentViewRows.length) {
                    setStatus("没有可导出的查询结果。", true);
                    return;
                }
                const ws = XLSX.utils.json_to_sheet(rowsWithDisplayStrings(currentViewRows));
                const csv = XLSX.utils.sheet_to_csv(ws);
                const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "query_result.csv";
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                setStatus("已导出 CSV（query_result.csv）。", false);
            });
            document.addEventListener("click", function () {
                closeAllFilterPopup();
                hideCopyMenu();
                closeSqlHistoryPop();
            });
            document.getElementById("sql-history-pop").addEventListener("click", function (e) {
                e.stopPropagation();
            });
            document.getElementById("result-wrap").addEventListener("click", function (e) {
                const sortBtn = e.target.closest(".sort-btn");
                if (sortBtn) {
                    e.stopPropagation();
                    const col = sortBtn.getAttribute("data-col");
                    if (currentSort.col !== col) {
                        currentSort = { col: col, dir: "asc" };
                    } else if (currentSort.dir === "asc") {
                        currentSort = { col: col, dir: "desc" };
                    } else {
                        currentSort = { col: "", dir: "" };
                    }
                    applyResultView();
                    return;
                }
                const filterBtn = e.target.closest(".filter-btn");
                if (filterBtn) {
                    e.stopPropagation();
                    toggleFilterPopup(filterBtn.getAttribute("data-col"), filterBtn);
                    return;
                }
                const thNameHead = e.target.closest(".th-name");
                if (thNameHead) {
                    e.stopPropagation();
                    showColumnSum(thNameHead.textContent || "");
                    return;
                }
                const truncContent = e.target.closest(".cell-content.is-truncated");
                if (truncContent && truncContent.getAttribute("data-truncated") === "1") {
                    e.stopPropagation();
                    const mask = document.getElementById("text-popup-mask");
                    const box = document.getElementById("text-popup");
                    box.textContent = truncContent.textContent || "";
                    mask.classList.add("show");
                    return;
                }
                const viewBtn = e.target.closest(".cell-view-btn");
                if (viewBtn) {
                    e.stopPropagation();
                    const hostCell = viewBtn.closest("td.data-cell");
                    if (!hostCell) return;
                    const cell = hostCell.querySelector(".cell-content");
                    if (!cell || cell.getAttribute("data-truncated") !== "1") return;
                    const mask = document.getElementById("text-popup-mask");
                    const box = document.getElementById("text-popup");
                    box.textContent = cell.textContent || "";
                    mask.classList.add("show");
                    return;
                }
                const rowNoCell = e.target.closest("td.rowno-col");
                if (rowNoCell) {
                    updateRangeSelectionFromClick("row", rowNoCell.getAttribute("data-row-index"), "", e.shiftKey);
                    return;
                }
                const dataCell = e.target.closest("td.data-cell");
                if (dataCell) {
                    updateRangeSelectionFromClick("col", dataCell.getAttribute("data-row-index"), dataCell.getAttribute("data-col"), e.shiftKey);
                }
            });
            document.getElementById("result-wrap").addEventListener("contextmenu", function (e) {
                const thName = e.target.closest(".th-name");
                const rowNoCell = e.target.closest("td.rowno-col");
                const dataCell = e.target.closest("td.data-cell");
                if (!thName && !rowNoCell && !dataCell) return;
                e.preventDefault();
                var includeHeaderAction = false;
                if (thName) {
                    copyMenuState = { type: "column", col: String(thName.textContent || "").trim() };
                    includeHeaderAction = true;
                } else {
                    copyMenuState = { type: "selection", col: "" };
                    if (!rangeSelection) return;
                    includeHeaderAction = rangeSelection.mode === "row";
                }
                showCopyMenu(e.clientX, e.clientY, includeHeaderAction);
            });
            document.getElementById("copy-menu").addEventListener("click", function (e) {
                var actBtn = e.target.closest("button[data-act]");
                if (!actBtn) return;
                var act = actBtn.getAttribute("data-act");
                if (copyMenuState.type === "column" && copyMenuState.col) {
                    if (act === "copy") {
                        var colText = buildCopyTextByColumn(copyMenuState.col, false);
                        if (colText) writeClipboardText(colText, "已复制该列全部数据");
                    } else if (act === "copy-header") {
                        var colText2 = buildCopyTextByColumn(copyMenuState.col, true);
                        if (colText2) writeClipboardText(colText2, "已复制该列（含表头）");
                    }
                } else if (act === "copy") {
                    var text = buildCopyTextBySelection(false);
                    if (text) writeClipboardText(text, "已复制选中范围");
                } else if (act === "copy-header") {
                    var text2 = buildCopyTextBySelection(true);
                    if (text2) writeClipboardText(text2, "已复制选中范围（含表头）");
                }
                hideCopyMenu();
            });
            document.getElementById("text-popup-mask").addEventListener("click", function (e) {
                if (e.target.id === "text-popup-mask") {
                    e.currentTarget.classList.remove("show");
                    document.getElementById("text-popup").textContent = "";
                }
            });
            document.getElementById("sql-help-mask").addEventListener("click", function (e) {
                if (e.target.id === "sql-help-mask") {
                    e.currentTarget.classList.remove("show");
                    document.getElementById("sql-help-popup").textContent = "";
                }
            });
            window.addEventListener("resize", function () {
                const panel = document.querySelector(".filter-pop.show");
                if (panel && activeFilterAnchor) adjustFilterPopupPosition(panel, activeFilterAnchor);
                var hp = document.getElementById("sql-history-pop");
                var hb = document.getElementById("sql-history-btn");
                if (hp && hp.classList.contains("show") && hb) adjustSqlHistoryPopupPosition(hp, hb);
            });
        </script>
    </body>
</html>
