<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Excel SQL 查询工具</title>
        <style>
            * { box-sizing: border-box; }
            :root {
                --bg: #f3f7ff;
                --card: #ffffff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --danger: #f05656;
                --text: #1f2a44;
                --muted: #6f7d96;
                --border: #dbe6ff;
                --shadow: 0 10px 24px rgba(36, 90, 190, 0.12);
            }
            body {
                margin: 0;
                min-height: 100vh;
                padding: 8px;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                font-size: 14px;
                background: var(--bg);
                color: var(--text);
            }
            .container {
                height: calc(100vh - 16px);
                display: grid;
                grid-template-columns: 360px 1fr;
                gap: 8px;
                min-height: 0;
            }
            .container.left-collapsed {
                grid-template-columns: 1fr;
            }
            .panel {
                min-height: 0;
                display: flex;
                flex-direction: column;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
                box-shadow: var(--shadow);
                padding: 8px;
                overflow: hidden;
            }
            .panel-scroll {
                overflow-y: auto;
            }
            .panel-scroll::-webkit-scrollbar {
                width: 8px;
            }
            .panel-scroll::-webkit-scrollbar-thumb {
                background: #c8d8ff;
                border-radius: 999px;
            }
            .panel-scroll::-webkit-scrollbar-track {
                background: #eef4ff;
                border-radius: 999px;
            }
            .left-panel.hidden {
                display: none;
            }
            .title { margin: 0 0 6px; font-size: 16px; font-weight: 700; }
            .left-header {
                display: flex;
                align-items: center;
                justify-content: flex-start;
                margin-bottom: 6px;
            }
            .left-header .title {
                margin: 0;
            }
            .muted { color: var(--muted); font-size: 13px; line-height: 1.45; margin-bottom: 6px; }
            .field { margin-bottom: 6px; }
            label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
            .label-inline {
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }
            .help-icon-btn {
                width: 20px;
                height: 20px;
                border-radius: 50%;
                border: 1px solid #b8cdfb;
                background: #f4f8ff;
                color: #3969e6;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 13px;
                font-weight: 700;
                padding: 0;
                cursor: pointer;
            }
            .sql-history-pop {
                display: none;
                position: fixed;
                z-index: 5100;
                min-width: min(440px, calc(100vw - 24px));
                max-width: min(720px, calc(100vw - 24px));
                max-height: min(480px, 62vh);
                overflow: auto;
                border: 1px solid #d8e5ff;
                border-radius: 10px;
                background: #fff;
                box-shadow: 0 8px 22px rgba(36, 90, 190, 0.16);
                padding: 10px 12px;
            }
            .sql-history-pop.show {
                display: block;
            }
            .sql-history-pop .sql-history-title {
                font-size: 14px;
                font-weight: 600;
                color: #4a5978;
                padding: 6px 8px 10px;
                line-height: 1.4;
            }
            .sql-history-item {
                display: block;
                width: 100%;
                text-align: left;
                border: 1px solid #e7efff;
                border-radius: 8px;
                background: #f8fbff;
                color: #1f2a44;
                font-size: 15px;
                line-height: 1.45;
                padding: 10px 12px;
                margin-bottom: 8px;
                cursor: pointer;
                word-break: break-all;
            }
            .sql-history-item:hover {
                border-color: #b8cdfb;
                background: #eef4ff;
            }
            .sql-history-empty {
                font-size: 15px;
                color: var(--muted);
                padding: 12px;
                line-height: 1.5;
            }
            .busy-overlay {
                position: fixed;
                inset: 0;
                z-index: 6000;
                display: none;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                gap: 16px;
                background: rgba(16, 30, 60, 0.38);
                backdrop-filter: blur(2px);
            }
            .busy-overlay.show {
                display: flex;
            }
            .busy-overlay-card {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 14px;
                padding: 24px 32px;
                border-radius: 12px;
                background: #fff;
                border: 1px solid #dbe7ff;
                box-shadow: 0 12px 32px rgba(36, 90, 190, 0.22);
                max-width: min(360px, calc(100vw - 48px));
            }
            .busy-spinner {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                border: 3px solid #e0e9ff;
                border-top-color: var(--primary);
                animation: busy-spin 0.75s linear infinite;
            }
            @keyframes busy-spin {
                to { transform: rotate(360deg); }
            }
            .busy-overlay-text {
                margin: 0;
                font-size: 15px;
                font-weight: 600;
                color: #2f3d5d;
                text-align: center;
            }
            input, select, textarea, button {
                font-family: inherit;
                font-size: 13px;
            }
            input, select, textarea {
                width: 100%;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                padding: 6px 8px;
                outline: none;
                background: #fff;
            }
            input, select {
                height: 36px;
            }
            input:focus, select:focus, textarea:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.15);
            }
            textarea {
                min-height: 110px;
                resize: vertical;
            }
            .compact-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .btn-row {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                margin-top: 6px;
            }
            button {
                border: 0;
                border-radius: 999px;
                padding: 8px 12px;
                cursor: pointer;
                color: #fff;
                font-weight: 600;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            .danger { background: linear-gradient(135deg, var(--danger), #ff7979); }
            .table-list {
                margin-top: 6px;
                border: 1px solid #dbe7ff;
                border-radius: 8px;
                background: #f8fbff;
                padding: 6px;
                overflow: auto;
                min-height: 76px;
                max-height: 140px;
            }
            .table-item {
                font-size: 13px;
                margin-bottom: 5px;
                line-height: 1.4;
                word-break: break-all;
            }
            .status {
                margin-top: 6px;
                border: 1px solid #dbe7ff;
                border-radius: 8px;
                background: #f8fbff;
                padding: 6px 8px;
                font-size: 13px;
                color: #2f3d5d;
            }
            .result-wrap {
                flex: 1;
                min-height: 0;
                border: 1px solid #dbe7ff;
                border-radius: 8px;
                background: #fff;
                overflow-x: auto;
                overflow-y: visible;
            }
            .result-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                margin-bottom: 6px;
                flex-wrap: nowrap;
            }
            .result-head .title {
                margin: 0;
            }
            .result-head-left {
                display: flex;
                align-items: center;
                gap: 6px;
                min-width: 0;
            }
            .copy-hint {
                color: #2f3d5d;
                font-size: 12px;
                background: #edf3ff;
                border: 1px solid #d8e5ff;
                border-radius: 999px;
                padding: 2px 8px;
                max-width: 420px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                display: none;
            }
            .copy-hint.visible {
                display: inline-block;
            }
            .icon-btn {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                padding: 0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 16px;
                line-height: 1;
            }
            .result-tools {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }
            .secondary {
                color: #3c4f78;
                border: 1px solid #d8e5ff;
                background: #edf3ff;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 13px;
                table-layout: fixed;
                -webkit-user-select: none;
                user-select: none;
            }
            th, td {
                border: 1px solid #e7efff;
                padding: 6px 8px;
                text-align: left;
                white-space: nowrap;
            }
            tbody tr:nth-child(even) td {
                background: #f5f7fb;
            }
            tbody tr:hover td {
                background: #eaf1ff;
            }
            thead th {
                position: sticky;
                top: 0;
                z-index: 1;
                background: #f3f7ff;
            }
            .rowno-col {
                width: 72px;
                text-align: center;
            }
            tbody td.rowno-col {
                cursor: pointer;
                user-select: none;
            }
            .sortable-head {
                display: flex;
                align-items: center;
                gap: 4px;
                width: 100%;
                min-width: 0;
            }
            .sort-btn {
                flex: 0 0 auto;
                border: 1px solid #d8e5ff;
                border-radius: 999px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 2px 8px;
                font-size: 12px;
                font-weight: 600;
                line-height: 1.1;
                cursor: pointer;
            }
            .sort-btn.active {
                color: #fff;
                border-color: transparent;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            .filter-btn {
                flex: 0 0 auto;
                border: 1px solid #d8e5ff;
                border-radius: 999px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 2px 6px;
                font-size: 12px;
                font-weight: 600;
                line-height: 1.1;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 28px;
                height: 24px;
            }
            .filter-btn.active {
                color: #fff;
                border-color: transparent;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            th {
                position: relative;
            }
            .th-name {
                flex: 1 1 auto;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                cursor: pointer;
            }
            .resize-handle {
                position: absolute;
                top: 0;
                right: -2px;
                width: 6px;
                height: 100%;
                cursor: col-resize;
                user-select: none;
                z-index: 8;
            }
            .resize-handle:hover {
                background: rgba(47, 107, 255, 0.18);
            }
            .filter-pop {
                display: none;
                position: fixed;
                left: 0;
                top: 0;
                width: 320px;
                max-width: calc(100vw - 24px);
                border: 1px solid #d8e5ff;
                border-radius: 8px;
                background: #fff;
                box-shadow: 0 8px 22px rgba(36, 90, 190, 0.16);
                padding: 8px;
                z-index: 5000;
            }
            .filter-pop.show {
                display: block;
            }
            .filter-input {
                width: 100%;
                height: 32px;
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                padding: 4px 8px;
                font-size: 12px;
                margin-bottom: 6px;
                outline: none;
            }
            .filter-values {
                max-height: 160px;
                overflow: auto;
                border: 1px solid #dbe7ff;
                border-radius: 8px;
                padding: 6px;
                margin-bottom: 6px;
                background: #f8fbff;
            }
            .filter-check {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 12px;
                line-height: 1.35;
                margin-bottom: 4px;
                word-break: break-all;
                border: 1px solid transparent;
                border-radius: 6px;
                padding: 4px 6px;
                background: #fff;
                cursor: pointer;
                transition: border-color .15s ease, background-color .15s ease;
            }
            .filter-check:hover {
                border-color: #d8e5ff;
                background: #f3f8ff;
            }
            .filter-check input[type="checkbox"] {
                width: 14px;
                height: 14px;
                margin: 0;
                accent-color: #2f6bff;
                flex: 0 0 14px;
            }
            .filter-check span {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .filter-values::-webkit-scrollbar {
                width: 8px;
            }
            .filter-values::-webkit-scrollbar-thumb {
                background: #c8d8ff;
                border-radius: 999px;
            }
            .filter-values::-webkit-scrollbar-track {
                background: #eef4ff;
                border-radius: 999px;
            }
            .filter-actions {
                display: flex;
                gap: 6px;
                justify-content: flex-end;
            }
            .filter-meta {
                margin-top: 2px;
                margin-bottom: 6px;
                font-size: 12px;
                color: #6f7d96;
                text-align: right;
            }
            .filter-date {
                margin-bottom: 6px;
                border: 1px solid #dbe7ff;
                border-radius: 8px;
                padding: 6px;
                background: #f8fbff;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .filter-quarter {
                margin-bottom: 6px;
                border: 1px solid #dbe7ff;
                border-radius: 8px;
                padding: 6px;
                background: #f8fbff;
                display: flex;
                flex-wrap: nowrap;
                align-items: center;
                gap: 6px;
                font-size: 11px;
                white-space: nowrap;
            }
            .filter-quarter select {
                width: 88px;
                height: 28px;
                font-size: 11px;
                padding: 2px 6px;
            }
            .quarter-btn {
                border: 1px solid #d8e5ff;
                border-radius: 999px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 2px 8px;
                font-size: 11px;
                line-height: 1.2;
                cursor: pointer;
            }
            .quarter-btn:hover {
                background: #e3eeff;
            }
            .filter-date input {
                height: 30px;
                width: 100%;
                min-width: 0;
                display: block;
                margin: 0;
            }
            .mini-btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 4px 8px;
                font-size: 12px;
                cursor: pointer;
            }
            .sql-preview {
                margin-top: 6px;
            }
            .pager {
                margin-top: 6px;
                display: none;
                align-items: flex-start;
                justify-content: space-between;
                gap: 10px;
                flex-wrap: nowrap;
            }
            .pager.visible {
                display: flex;
            }
            .pager-info {
                color: #6f7d96;
                font-size: 12px;
                margin-right: 4px;
            }
            .pager-sum {
                color: #1f4d8c;
                font-size: 12px;
                margin-right: 4px;
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .pager-left, .pager-right {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-wrap: wrap;
            }
            .pager-left {
                min-width: 0;
                flex: 1 1 260px;
            }
            .pager-right {
                justify-content: flex-end;
                flex: 1 1 560px;
                flex-wrap: nowrap;
            }
            .pager-pages {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
            }
            .pager-nav-btn {
                border: 0;
                background: transparent;
                color: #486084;
                width: auto;
                height: auto;
                min-width: 0;
                padding: 0 2px;
                border-radius: 0;
                font-size: 16px;
                line-height: 1;
            }
            .pager-nav-btn:hover {
                color: #1f4d8c;
                background: transparent;
            }
            .pager-nav-btn:disabled {
                opacity: 0.35;
                cursor: not-allowed;
            }
            .pager-page {
                color: #486084;
                font-size: 12px;
                cursor: pointer;
                user-select: none;
            }
            .pager-page.active {
                color: #1f4d8c;
                font-weight: 600;
                text-decoration: underline;
            }
            .cell-content {
                display: inline-block;
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                vertical-align: top;
                cursor: default;
            }
            .cell-content.is-truncated {
                cursor: pointer;
                border-bottom: 1px dotted rgba(47, 107, 255, 0.35);
            }
            td.data-cell {
                position: relative;
                padding-right: 26px;
            }
            .cell-view-btn {
                position: absolute;
                right: 6px;
                top: 50%;
                transform: translateY(-50%);
                border: 0;
                background: transparent;
                color: #5a739b;
                font-size: 12px;
                line-height: 1;
                padding: 0;
                display: none;
                cursor: pointer;
            }
            td.data-cell.has-overflow:hover .cell-view-btn {
                display: inline-block;
            }
            .cell-view-btn:hover {
                color: #1f4d8c;
            }
            .text-popup-mask {
                position: fixed;
                inset: 0;
                background: rgba(16, 30, 60, 0.35);
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 80;
                padding: 16px;
            }
            .text-popup-mask.show {
                display: flex;
            }
            .text-popup {
                width: min(760px, 100%);
                max-height: 70vh;
                border: 1px solid #dbe7ff;
                border-radius: 10px;
                background: #fff;
                box-shadow: 0 10px 28px rgba(36, 90, 190, 0.16);
                padding: 10px;
                overflow: auto;
                white-space: pre-wrap;
                word-break: break-all;
                font-size: 13px;
            }
            .copy-menu {
                position: fixed;
                z-index: 120;
                min-width: 132px;
                border: 1px solid #d8e5ff;
                border-radius: 8px;
                background: #fff;
                box-shadow: 0 8px 24px rgba(36, 90, 190, 0.18);
                padding: 4px;
                display: none;
            }
            .copy-menu.show {
                display: block;
            }
            .copy-menu button {
                width: 100%;
                text-align: left;
                border: 0;
                background: transparent;
                color: #2f3d5d;
                padding: 6px 8px;
                border-radius: 6px;
                font-size: 12px;
            }
            .copy-menu button:hover {
                background: #edf3ff;
            }
            #view-sql {
                width: 100%;
                height: 88px;
                border: 1px solid #d8e5ff;
                border-radius: 8px;
                padding: 8px;
                font-size: 12px;
                background: #f8fbff;
                color: #2f3d5d;
                resize: vertical;
            }
            .empty {
                padding: 16px;
                color: var(--muted);
                font-size: 13px;
            }
            .row-selected td {
                background: #eef4ff !important;
            }
            .cell-selected {
                background: #e8f0ff !important;
            }
            .sql-help-content {
                line-height: 1.5;
                color: #2f3d5d;
            }
            @media (max-width: 980px) {
                .container { grid-template-columns: 1fr; }
                .pager {
                    flex-wrap: wrap;
                    align-items: stretch;
                }
                .pager-left, .pager-right {
                    flex: 1 1 100%;
                }
                .pager-right {
                    justify-content: flex-start;
                    flex-wrap: wrap;
                }
                .pager-info {
                    margin-right: 0;
                }
                .pager-sum {
                    max-width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div id="left-panel" class="panel panel-scroll left-panel">
                <div class="left-header">
                    <h3 class="title">Excel 当数据库查询</h3>
                </div>
                <div class="muted">
                    上传多个 Excel 后，每个 Excel 视为一个数据库，Sheet 视为表。<br />
                    执行 SQL 时默认在当前选中的 Excel 库中查询。
                </div>
                <div class="field">
                    <label for="excel-files">上传 Excel 文件（支持多选）</label>
                    <input id="excel-files" type="file" accept=".xlsx,.xls,.csv" multiple />
                </div>
                <div class="compact-grid">
                    <div class="field">
                        <label for="db-select">当前 Excel 库</label>
                        <select id="db-select">
                            <option value="">请先上传 Excel</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="table-select">默认 Sheet 表</label>
                        <select id="table-select">
                            <option value="">请先选择库</option>
                        </select>
                    </div>
                </div>
                <div class="field">
                    <label for="sql-mode">SQL 语法类型</label>
                    <select id="sql-mode">
                        <option value="mysql" selected>MySQL（默认）</option>
                        <option value="alasql">AlaSQL 原生</option>
                    </select>
                </div>
                <div class="field">
                    <label for="sql-input" class="label-inline">
                        <span>SQL 语句</span>
                        <button id="sql-help-btn" class="help-icon-btn" type="button" title="查看 MySQL 常用函数">!</button>
                        <button id="sql-history-btn" class="help-icon-btn" type="button" title="最近执行的 SQL（最多 10 条）" aria-label="最近执行的 SQL">
                            <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a6 6 0 1 1 6 6v-2h2v2a8 8 0 1 0-2.343-5.657L13 3zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                        </button>
                    </label>
                    <div id="sql-history-pop" class="sql-history-pop" aria-hidden="true"></div>
                    <textarea id="sql-input" placeholder="示例：SELECT * FROM [Sheet1];"></textarea>
                </div>
                <div class="btn-row">
                    <button id="run-sql-btn" type="button">执行 SQL</button>

                    <div class="result-head-left">
                        <button id="toggle-left-btn" class="secondary icon-btn" type="button" title="收起左侧">◀</button>

                        <span id="copy-hint" class="copy-hint"></span>
                    </div>
                    <div class="result-tools">
                        <button id="export-xlsx-btn" class="secondary" type="button">导出 Excel</button>
                        <button id="export-csv-btn" class="secondary" type="button">导出 CSV</button>
                        <button id="clear-view-btn" class="secondary" type="button">清除排序和过滤</button>
                    </div>
                </div>

                </div>
                <div id="pager" class="pager">
                    <div class="pager-left">
                        <span id="pager-sum" class="pager-sum"></span>
                    </div>
                    <div class="pager-right">
                        <span id="pager-info" class="pager-info"></span>
                        <button id="pager-first" class="pager-nav-btn" type="button" title="第一页">«</button>
                        <button id="pager-prev" class="pager-nav-btn" type="button" title="上一页">‹</button>
                        <span id="pager-pages" class="pager-pages"></span>
                        <button id="pager-next" class="pager-nav-btn" type="button" title="下一页">›</button>
                        <button id="pager-last" class="pager-nav-btn" type="button" title="最后一页">»</button>
                    </div>
                </div>
                <div class="sql-preview">
                    <label for="view-sql">当前视图 SQL</label>

                </div>

        </div>
        <div id="text-popup-mask" class="text-popup-mask">
            <div id="text-popup" class="text-popup"></div>
        </div>
        <div id="sql-help-mask" class="text-popup-mask">
            <div id="sql-help-popup" class="text-popup sql-help-content"></div>
        </div>
        <div id="copy-menu" class="copy-menu"></div>
        <div id="busy-overlay" class="busy-overlay" aria-hidden="true" role="status">
            <div class="busy-overlay-card">
                <div class="busy-spinner" aria-hidden="true"></div>
                <p id="busy-overlay-text" class="busy-overlay-text">请稍候…</p>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/alasql@4.6.5/dist/alasql.min.js"></script>
        <script>
            const dbStore = {};
            let currentDb = "";
            /** 与 currentDb 一致时表示 AlaSQL 表已从 dbStore 注册，避免每次查询重复 DROP/CREATE 大表。 */
            let alasqlEngineDbKey = "";
            let lastQueryRows = [];
            let currentViewRows = [];
            let currentCols = [];
            let currentFilters = {};
            let currentSort = { col: "", dir: "" };
            let lastExecutedSql = "";
            let currentColWidths = {};
            let currentPage = 1;
            let currentPageSize = 1000;
            const FILTER_VALUE_PAGE_SIZE = 20;
            const ZH_COLLATOR = new Intl.Collator("zh-CN", { numeric: true, sensitivity: "base" });
            let currentSumText = "";
            let leftCollapsed = false;
            let rangeSelection = null; // { mode:'row'|'col', col?:string, start:number, end:number }
            let activeFilterAnchor = null;
            let rowDisplayCache = new WeakMap();
            let copyMenuState = { type: "selection", col: "" };
            let lastSqlHistoryList = [];
            const SQL_HISTORY_KEY = "excelSqlQueryHistoryV1";
            const SQL_HISTORY_MAX = 10;
            /** 大批量导入时每 N 行让出一次主线程，便于 1s 后显示等待层 */
            const IMPORT_YIELD_ROWS = 8000;

            function yieldToBrowser() {
                return new Promise(function (resolve) {
                    window.setTimeout(resolve, 0);
                });
            }

            function showBusyOverlay(message) {
                var msgEl = document.getElementById("busy-overlay-text");
                var overlay = document.getElementById("busy-overlay");
                if (msgEl) msgEl.textContent = message || "请稍候…";
                if (overlay) {
                    overlay.classList.add("show");
                    overlay.setAttribute("aria-hidden", "false");
                }
            }

            function hideBusyOverlay() {
                var overlay = document.getElementById("busy-overlay");
                if (overlay) {
                    overlay.classList.remove("show");
                    overlay.setAttribute("aria-hidden", "true");
                }
            }

            /** 操作超过 1s 才显示全屏等待，避免闪烁 */
            function startDelayedBusy(message) {
                var shown = false;
                var id = window.setTimeout(function () {
                    showBusyOverlay(message);
                    shown = true;
                }, 1000);
                return function stopDelayedBusy() {
                    window.clearTimeout(id);
                    if (shown) hideBusyOverlay();
                };
            }

            function setStatus(text, isError) {
                const el = document.getElementById("status");
                el.textContent = text;
                el.style.color = isError ? "#c43d3d" : "#2f3d5d";
            }

            function sanitizeName(name) {
                return String(name || "")
                    .replace(/\.[^.]+$/, "")
                    .replace(/[^\w\u4e00-\u9fa5]+/g, "_")
                    .replace(/^_+|_+$/g, "")
                    .slice(0, 60) || "table";
            }

            function escapeHtml(value) {
                return String(value === null || value === undefined ? "" : value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
            }

            function loadSqlHistory() {
                try {
                    var raw = localStorage.getItem(SQL_HISTORY_KEY);
                    var arr = JSON.parse(raw);
                    if (!Array.isArray(arr)) return [];
                    var seen = {};
                    var out = [];
                    for (var i = 0; i < arr.length; i++) {
                        var k = normalizeSqlHistoryDedupKey(arr[i]);
                        if (!k || seen[k]) continue;
                        seen[k] = true;
                        out.push(String(arr[i]).trim());
                        if (out.length >= SQL_HISTORY_MAX) break;
                    }
                    return out;
                } catch (err) {
                    return [];
                }
            }

            /** 去重用：忽略首尾空白、连续空白、末尾分号、大小写 */
            function normalizeSqlHistoryDedupKey(s) {
                return String(s || "")
                    .trim()
                    .replace(/;+\s*$/, "")
                    .replace(/\s+/g, " ")
                    .toLowerCase();
            }

            function saveSqlHistoryItem(text) {
                var raw = String(text || "").trim();
                if (!raw) return;
                var key = normalizeSqlHistoryDedupKey(raw);
                var arr = loadSqlHistory().filter(function (x) {
                    return normalizeSqlHistoryDedupKey(x) !== key;
                });
                arr.unshift(raw);
                if (arr.length > SQL_HISTORY_MAX) arr = arr.slice(0, SQL_HISTORY_MAX);
                try {
                    localStorage.setItem(SQL_HISTORY_KEY, JSON.stringify(arr));
                } catch (err) {
                    // ignore quota / private mode
                }
            }

            function mapSqlOutsideStringLiterals(sql, fn) {
                var result = "";
                var i = 0;
                while (i < sql.length) {
                    if (sql.charAt(i) !== "'") {
                        var start = i;
                        while (i < sql.length && sql.charAt(i) !== "'") i++;
                        result += fn(sql.slice(start, i));
                        continue;
                    }
                    var strStart = i;
                    i++;
                    while (i < sql.length) {
                        var c = sql.charAt(i);
                        if (c === "'") {
                            if (i + 1 < sql.length && sql.charAt(i + 1) === "'") {
                                i += 2;
                                continue;
                            }
                            i++;
                            break;
                        }
                        i++;
                    }
                    result += sql.slice(strStart, i);
                }
                return result;
            }

            function expandNumericEqualityChunk(chunk) {
                var s = chunk;
                function pairSq(col, num) {
                    if (num.length > 1 && num.charAt(0) === "0") {
                        return col + " = '" + num + "'";
                    }
                    return "(" + col + " = '" + num + "' OR " + col + " = " + num + ")";
                }
                function pairDq(col, num) {
                    if (num.length > 1 && num.charAt(0) === "0") {
                        return col + " = \"" + num + "\"";
                    }
                    return "(" + col + " = \"" + num + "\" OR " + col + " = " + num + ")";
                }
                s = s.replace(/(\[[^\]]+\])\s*=\s*'(\d+)'/g, function (_, col, num) {
                    return pairSq(col, num);
                });
                s = s.replace(/'(\d+)'\s*=\s*(\[[^\]]+\])/g, function (_, num, col) {
                    if (num.length > 1 && num.charAt(0) === "0") {
                        return "'" + num + "' = " + col;
                    }
                    return "(" + col + " = '" + num + "' OR " + col + " = " + num + ")";
                });
                s = s.replace(/(\[[^\]]+\])\s*=\s*"(\d+)"/g, function (_, col, num) {
                    return pairDq(col, num);
                });
                s = s.replace(/"(\d+)"\s*=\s*(\[[^\]]+\])/g, function (_, num, col) {
                    if (num.length > 1 && num.charAt(0) === "0") {
                        return "\"" + num + "\" = " + col;
                    }
                    return "(" + col + " = \"" + num + "\" OR " + col + " = " + num + ")";
                });
                return s;
            }

            /** Excel 数字列与带引号的数字比较时，AlaSQL 类型不一致会查不到行，这里自动展开为字符串或数字两种相等。 */
            function expandNumericEqualityInSql(sql) {
                return mapSqlOutsideStringLiterals(String(sql || ""), expandNumericEqualityChunk);
            }

            function adjustSqlHistoryPopupPosition(panel, btnEl) {
                if (!panel || !btnEl) return;
                var rect = btnEl.getBoundingClientRect();
                var vw = window.innerWidth || document.documentElement.clientWidth;
                var vh = window.innerHeight || document.documentElement.clientHeight;
                var panelW = panel.offsetWidth || 320;
                var panelH = panel.offsetHeight || 200;
                var left = rect.left;
                if (left + panelW > vw - 8) left = vw - panelW - 8;
                if (left < 8) left = 8;
                var top = rect.bottom + 6;
                if (top + panelH > vh - 8) {
                    var above = rect.top - panelH - 6;
                    if (above >= 8) top = above;
                    else top = Math.max(8, vh - panelH - 8);
                }
                panel.style.left = Math.round(left) + "px";
                panel.style.top = Math.round(top) + "px";
            }

            function closeSqlHistoryPop() {
                var pop = document.getElementById("sql-history-pop");
                if (pop && pop.classList.contains("show")) {
                    pop.classList.remove("show");
                    pop.setAttribute("aria-hidden", "true");
                }
            }

            function toggleSqlHistoryPop() {
                var pop = document.getElementById("sql-history-pop");
                var btn = document.getElementById("sql-history-btn");
                if (!pop || !btn) return;
                if (pop.classList.contains("show")) {
                    closeSqlHistoryPop();
                    return;
                }
                lastSqlHistoryList = loadSqlHistory();
                if (!lastSqlHistoryList.length) {
                    pop.innerHTML = "<div class=\"sql-history-empty\">暂无执行记录（执行成功后会自动保存）。</div>";
                } else {
                    pop.innerHTML = "<div class=\"sql-history-title\">最近 " + lastSqlHistoryList.length + " 条（已去重，最新在上）· 点击填入并执行</div>"
                        + lastSqlHistoryList.map(function (sql, idx) {
                            return "<button type=\"button\" class=\"sql-history-item\" data-idx=\"" + idx + "\">"
                                + escapeHtml(sql) + "</button>";
                        }).join("");
                    pop.querySelectorAll(".sql-history-item").forEach(function (b) {
                        b.addEventListener("click", function (ev) {
                            ev.stopPropagation();
                            var idx = Number(b.getAttribute("data-idx"));
                            var raw = lastSqlHistoryList[idx];
                            if (raw == null) return;
                            document.getElementById("sql-input").value = raw;
                            closeSqlHistoryPop();
                            void runSql();
                        });
                    });
                }
                pop.classList.add("show");
                pop.setAttribute("aria-hidden", "false");
                adjustSqlHistoryPopupPosition(pop, btn);
            }

            function pad2(v) {
                return ("0" + Number(v)).slice(-2);
            }

            /** @param {unknown} wb */
            function workbookUsesDate1904(wb) {
                try {
                    return !!(wb.Workbook && wb.Workbook.WBProps && wb.Workbook.WBProps.date1904);
                } catch (e) {
                    return false;
                }
            }

            /** AlaSQL / Excel 结果里统一成易读时间（与 Excel 常见「2026/2/14 15:19」风格一致） */
            function formatCellForDisplay(value) {
                if (value === null || value === undefined) return "";
                if (value instanceof Date) {
                    if (isNaN(value.getTime())) return "";
                    return formatDatePartsFriendly(dateToParts(value));
                }
                if (typeof value === "number" && Number.isFinite(value)) {
                    // 数值字段（尤其金额）不做日期序列号推断，避免误判为时间。
                    return String(value);
                }
                if (typeof value === "string") {
                    var s = value.trim();
                    if (!s) return "";
                    if (couldBeDateLikeString(s)) {
                        var parsed = tryParseSortableOrIsoDateString(s);
                        if (parsed) return formatDatePartsFriendly(parsed);
                    }
                    return s;
                }
                return String(value);
            }

            function dateToParts(d) {
                return {
                    y: d.getFullYear(),
                    m: d.getMonth() + 1,
                    d: d.getDate(),
                    H: d.getHours(),
                    M: d.getMinutes(),
                    S: d.getSeconds()
                };
            }

            function formatDatePartsFriendly(p) {
                if (!p) return "";
                var t = pad2(p.H) + ":" + pad2(p.M);
                if (p.S) t += ":" + pad2(p.S);
                return p.y + "/" + p.m + "/" + p.d + " " + t;
            }

            /**
             * 导入时转为可排序的本地时间串，避免序列号/JS Date 在查询结果里显示错乱。
             */
            function partsToSortable(p) {
                if (!p) return "";
                return p.y + "-" + pad2(p.m) + "-" + pad2(p.d) + " " + pad2(p.H) + ":" + pad2(p.M) + ":" + pad2(p.S);
            }

            function tryExcelSerialToParts(serial, opts) {
                if (!window.XLSX || !XLSX.SSF || typeof XLSX.SSF.parse_date_code !== "function") return null;
                if (typeof serial !== "number" || !Number.isFinite(serial)) return null;
                var p = XLSX.SSF.parse_date_code(serial, opts || {});
                if (!p || typeof p.y !== "number") return null;
                if (p.y < 1900 || p.y > 2200) return null;
                return p;
            }

            function expandTwoDigitYear(y) {
                y = +y;
                if (y >= 1900 || y <= 0) return y;
                if (y < 100) return y <= 29 ? 2000 + y : 1900 + y;
                return y;
            }

            /**
             * 大表导入时避免对每格跑完整日期正则（理赔号、长文本等）。
             * 仍可能为日期的：含 / 或 : 或 ISO T，或以 yyyy- 开头。
             */
            function couldBeDateLikeString(str) {
                if (typeof str !== "string" || !str) return false;
                var s = str.trim();
                if (s.length < 4) return false;
                if (s.indexOf("/") >= 0) return true;
                if (s.indexOf(":") >= 0) return true;
                if (s.indexOf("T") >= 0 && /\dT\d/.test(s)) return true;
                if (/^\d{4}-\d/.test(s)) return true;
                return false;
            }

            /** 仅识别白名单日期格式，避免金额/编号误判为日期。 */
            function tryParseSortableOrIsoDateString(s) {
                var str = String(s || "").trim();
                if (!str) return null;
                if (/^-?[0-9]+$/.test(str)) return null;

                var slash = str.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})(?:[ T]+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?$/);
                if (slash) {
                    return {
                        y: +slash[1],
                        m: +slash[2],
                        d: +slash[3],
                        H: slash[4] !== undefined ? +slash[4] : 0,
                        M: slash[5] !== undefined ? +slash[5] : 0,
                        S: slash[6] !== undefined ? +slash[6] : 0
                    };
                }
                /**
                 * 须在 slashYY 之前：Excel 用 raw:false 时常得到 "10/1/25 4:30"（月/日/年），
                 * 若先匹配 yy/mm/dd 会把 10 误当年份得到 2010-01-25。
                 */
                var md = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?$/);
                if (md) {
                    var mon = +md[1];
                    var dy = +md[2];
                    var yi = expandTwoDigitYear(+md[3]);
                    if (mon <= 12 && dy <= 31 && mon >= 1 && dy >= 1 && yi >= 1900 && yi <= 2200) {
                        return {
                            y: yi,
                            m: mon,
                            d: dy,
                            H: md[4] !== undefined ? +md[4] : 0,
                            M: md[5] !== undefined ? +md[5] : 0,
                            S: md[6] !== undefined ? +md[6] : 0
                        };
                    }
                }
                /** yy/mm/dd：仅当 m/d 形式不成立时再试（如 "25/10/1" 月份 25 无效）。 */
                var slashYY = str.match(/^(\d{2})\/(\d{1,2})\/(\d{1,2})(?:[ T]+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?$/);
                if (slashYY) {
                    var yy = expandTwoDigitYear(+slashYY[1]);
                    return {
                        y: yy,
                        m: +slashYY[2],
                        d: +slashYY[3],
                        H: slashYY[4] !== undefined ? +slashYY[4] : 0,
                        M: slashYY[5] !== undefined ? +slashYY[5] : 0,
                        S: slashYY[6] !== undefined ? +slashYY[6] : 0
                    };
                }
                var isoDate = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
                if (isoDate) {
                    return {
                        y: +isoDate[1],
                        m: +isoDate[2],
                        d: +isoDate[3],
                        H: 0,
                        M: 0,
                        S: 0
                    };
                }
                var iso = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?/);
                if (iso) {
                    return {
                        y: +iso[1],
                        m: +iso[2],
                        d: +iso[3],
                        H: +iso[4],
                        M: +iso[5],
                        S: iso[6] ? +iso[6] : 0
                    };
                }
                return null;
            }

            function compareDateParts(a, b) {
                if (!a || !b) return 0;
                var aa = partsToSortable(a);
                var bb = partsToSortable(b);
                if (aa === bb) return 0;
                return aa < bb ? -1 : 1;
            }

            function parseDateFilterInput(v) {
                var text = String(v || "").trim();
                if (!text) return null;
                var normalized = text.replace("T", " ");
                return tryParseSortableOrIsoDateString(normalized);
            }

            function toDatetimeLocalValue(v, withSeconds) {
                var p = parseDateFilterInput(v);
                if (!p) return "";
                var out = p.y + "-" + pad2(p.m) + "-" + pad2(p.d) + "T" + pad2(p.H) + ":" + pad2(p.M);
                if (withSeconds) out += ":" + pad2(p.S || 0);
                return out;
            }

            function normalizeDateInputValue(v, isEnd) {
                var s = String(v || "").trim();
                if (!s) return "";
                s = s.replace("T", " ");
                if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)) {
                    return s + (isEnd ? " 23:59:59" : " 00:00:00");
                }
                if (/^\d{4}-\d{1,2}-\d{1,2}\s+\d{1,2}:\d{1,2}$/.test(s)) {
                    return s + (isEnd ? ":59" : ":00");
                }
                return s;
            }

            function enforceDefaultTimeForInputValue(v, isEnd) {
                var s = String(v || "").trim();
                if (!s) return "";
                var p = parseDateFilterInput(s);
                if (!p) return s;
                var base = p.y + "-" + pad2(p.m) + "-" + pad2(p.d);
                if (isEnd) return base + " 23:59:59";
                return base + " 00:00:00";
            }

            function getDateYearsForCol(col) {
                var set = new Set();
                lastQueryRows.forEach(function (r) {
                    var txt = String(r[col] === null || r[col] === undefined ? "" : r[col]).trim();
                    if (!txt) return;
                    var p = tryParseSortableOrIsoDateString(txt);
                    if (!p) p = tryParseSortableOrIsoDateString(formatCellForDisplay(txt));
                    if (p && p.y >= 1900 && p.y <= 2200) set.add(p.y);
                });
                var years = Array.from(set).sort(function (a, b) { return a - b; });
                var current = new Date().getFullYear();
                if (years.indexOf(current) < 0) years.push(current);
                years.sort(function (a, b) { return a - b; });
                return years;
            }

            function quarterRangeByYear(year, q) {
                var y = Number(year);
                if (!y || y < 1900 || y > 2200) return null;
                if (q === "Q1") return { from: y + "-01-01 00:00:00", to: y + "-03-31 23:59:59" };
                if (q === "Q2") return { from: y + "-04-01 00:00:00", to: y + "-06-30 23:59:59" };
                if (q === "Q3") return { from: y + "-07-01 00:00:00", to: y + "-09-30 23:59:59" };
                if (q === "Q4") return { from: y + "-10-01 00:00:00", to: y + "-12-31 23:59:59" };
                return null;
            }

            function getRecentYears(count) {
                var years = [];
                var current = new Date().getFullYear();
                var total = Math.max(1, Number(count) || 30);
                for (var i = 0; i < total; i++) years.push(current - i);
                return years;
            }

            function getDefaultDayTimeRange() {
                var now = new Date();
                var y = now.getFullYear();
                var m = pad2(now.getMonth() + 1);
                var d = pad2(now.getDate());
                return {
                    from: y + "-" + m + "-" + d + " 00:00:00",
                    to: y + "-" + m + "-" + d + " 23:59:59"
                };
            }

            function isDateLikeColumn(col) {
                var total = 0;
                var ok = 0;
                for (var i = 0; i < lastQueryRows.length && total < 200; i++) {
                    var raw = lastQueryRows[i][col];
                    var txt = String(raw === null || raw === undefined ? "" : raw).trim();
                    if (!txt) continue;
                    total++;
                    if (tryParseSortableOrIsoDateString(txt)) ok++;
                }
                return total >= 2 && ok / total >= 0.6;
            }

            function rowMatchesFilterRule(row, col, rule) {
                const realRule = rule || { keyword: "", selected: [], dateFrom: "", dateTo: "" };
                const kw = String(realRule.keyword || "").trim().toLowerCase();
                const selected = Array.isArray(realRule.selected) ? realRule.selected : [];
                const dateFrom = parseDateFilterInput(realRule.dateFrom || "");
                const dateTo = parseDateFilterInput(realRule.dateTo || "");
                const text = getRowDisplayValue(row, col);
                const byKeyword = !kw || text.toLowerCase().includes(kw);
                const bySelected = !selected.length || selected.indexOf(text) >= 0;
                var byDate = true;
                if (dateFrom || dateTo) {
                    var currentDate = parseDateFilterInput(text);
                    if (!currentDate) byDate = false;
                    if (byDate && dateFrom && compareDateParts(currentDate, dateFrom) < 0) byDate = false;
                    if (byDate && dateTo && compareDateParts(currentDate, dateTo) > 0) byDate = false;
                }
                return byKeyword && bySelected && byDate;
            }

            function getRowsByCurrentFilters(excludeCol, overrideRuleForCol) {
                var cols = Object.keys(currentFilters);
                if (!cols.length) return lastQueryRows;
                return lastQueryRows.filter(function (row) {
                    for (var i = 0; i < cols.length; i++) {
                        var col = cols[i];
                        if (excludeCol && col === excludeCol && !overrideRuleForCol) continue;
                        var rule = (excludeCol && col === excludeCol && overrideRuleForCol) ? overrideRuleForCol : currentFilters[col];
                        if (!rowMatchesFilterRule(row, col, rule)) return false;
                    }
                    return true;
                });
            }

            /**
             * @param {unknown} v
             * @param {{ date1904?: boolean }} sheetOpts
             */
            function normalizeImportedCellValue(v, sheetOpts) {
                if (v === null || v === undefined || v === "") return v;
                if (v instanceof Date) {
                    if (isNaN(v.getTime())) return "";
                    return partsToSortable(dateToParts(v));
                }
                if (typeof v === "number" && Number.isFinite(v)) {
                    // Excel 里格式为「数值」的单元格保留 number，SUM/聚合仍可用。
                    return v;
                }
                if (typeof v === "string") {
                    var str = v.trim();
                    if (couldBeDateLikeString(str)) {
                        var parts = tryParseSortableOrIsoDateString(str);
                        if (parts) return partsToSortable(parts);
                    }
                    // 仅当可安全表示为 JS 数字时才转 number（超长整数串如报案号保持原文本，避免精度丢失）。
                    var num = tryParseNumberLike(str);
                    if (num !== null) return num;
                    return str;
                }
                return v;
            }

            function normalizeImportedRow(row, sheetOpts) {
                var out = {};
                Object.keys(row).forEach(function (k) {
                    out[k] = normalizeImportedCellValue(row[k], sheetOpts);
                });
                return out;
            }

            async function normalizeImportedRowsAsync(rowsRaw, sheetOpts) {
                var n = rowsRaw.length;
                var out = new Array(n);
                for (var i = 0; i < n; i++) {
                    out[i] = normalizeImportedRow(rowsRaw[i], sheetOpts);
                    if (i > 0 && (i + 1) % IMPORT_YIELD_ROWS === 0) await yieldToBrowser();
                }
                await yieldToBrowser();
                return out;
            }

            function rowsWithDisplayStrings(rows) {
                if (!Array.isArray(rows) || !rows.length) return [];
                var cols = Object.keys(rows[0]);
                return rows.map(function (r) {
                    var o = {};
                    cols.forEach(function (c) {
                        o[c] = formatCellForDisplay(r[c]);
                    });
                    return o;
                });
            }

            function getRowDisplayValue(row, col) {
                if (!row || !col) return "";
                var cached = rowDisplayCache.get(row);
                if (!cached) {
                    cached = {};
                    rowDisplayCache.set(row, cached);
                }
                if (Object.prototype.hasOwnProperty.call(cached, col)) return cached[col];
                var text = String(formatCellForDisplay(row[col] === null || row[col] === undefined ? "" : row[col]));
                cached[col] = text;
                return text;
            }
