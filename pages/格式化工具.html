<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>格式化工具</title>
        <link rel="stylesheet" href="libs/tool-danger-btn.css" />
        <link rel="stylesheet" href="../vendor/codemirror/lib/codemirror.css" />
        <link rel="stylesheet" href="../vendor/codemirror/theme/eclipse.css" />
        <script src="../vendor/js-beautify/beautify.js"></script>
        <script src="../vendor/js-beautify/beautify-html.js"></script>
        <script src="../vendor/js-beautify/beautify-css.js"></script>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            :root {
                --card: #ffffff;
                --bg: #f3f7ff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
            }
            html, body {
                width: 100%;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
            }
            .page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                min-height: 0;
            }
            .editor-wrap {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                overflow: hidden;
            }
            .panel-title {
                padding: 8px 10px;
                font-size: 14px;
                color: #324a76;
                border-bottom: 1px solid #e4edff;
                background: #f8fbff;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .editor-head {
                flex: 0 0 auto;
                gap: 8px;
            }
            .editor-head-main {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
                flex-wrap: wrap;
                flex: 1;
            }
            .editor-head .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
                flex-shrink: 0;
            }
            .hint {
                color: var(--muted);
                font-size: 14px;
            }
            .title-btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 4px 10px;
                font-size: 13px;
                cursor: pointer;
            }
            .title-btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .editor-zone {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                padding: 0 8px 8px;
                gap: 0;
            }
            .cm-editor-wrap {
                flex: 1;
                min-height: 0;
                position: relative;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                overflow: hidden;
                background: #fff;
            }
            .cm-editor-wrap .CodeMirror {
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                bottom: 0;
                height: auto;
                font-size: 13px;
                line-height: 1.6;
                font-family: Consolas, "Courier New", monospace;
            }
            .cm-editor-wrap .CodeMirror-scroll {
                min-height: 120px;
            }
            .cm-editor-wrap .CodeMirror-focused {
                box-shadow: inset 0 0 0 1px rgba(47, 107, 255, 0.25);
            }
            #main-input {
                width: 100%;
                min-height: 120px;
                margin: 0;
                padding: 10px;
                border: none;
                border-radius: 8px;
                font-size: 13px;
                line-height: 1.6;
                font-family: Consolas, "Courier New", monospace;
                resize: none;
                outline: none;
                tab-size: 4;
                -moz-tab-size: 4;
                background: #fff;
            }
            /* 与 Json工具 Ctool 区块一致 */
            .ctool-page-option {
                flex: 0 0 auto;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                padding: 8px;
            }
            .json-tabs-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                margin-bottom: 8px;
                border-bottom: 1px solid #e4edff;
                padding-bottom: 6px;
                flex-wrap: wrap;
            }
            .json-tabs {
                display: flex;
                gap: 4px;
                align-items: center;
                flex-wrap: wrap;
            }
            .json-tabs button {
                border: 1px solid #cfdcf7;
                background: #fff;
                padding: 7px 14px;
                font-size: 14px;
                border-radius: 8px;
                cursor: pointer;
                color: var(--text);
            }
            .json-tabs button:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .json-tabs button.active {
                border-color: var(--primary);
                color: #fff;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            .sql-dialect-wrap {
                display: none;
                align-items: center;
                gap: 6px;
                flex-shrink: 0;
            }
            .sql-dialect-wrap.visible {
                display: inline-flex;
            }
            .sql-dialect-wrap .hint-inline {
                font-size: 13px;
                color: var(--muted);
                white-space: nowrap;
            }
            .tab-panel {
                display: block;
            }
            .align-row {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
                justify-content: center;
                align-items: center;
            }
            select.dd {
                min-height: 2rem;
                min-width: 6.5rem;
                max-width: 11rem;
                padding: 4px 8px;
                font-size: 14px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                background: #fff;
                color: var(--text);
                cursor: pointer;
            }
            select.dd:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.15);
                outline: none;
            }
            select.dd.wide {
                max-width: 15rem;
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 8px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 7px 12px;
                font-size: 14px;
                cursor: pointer;
                min-height: 2rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }
            .btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .btn.primary {
                color: #fff;
                border-color: transparent;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            .btn.primary:hover {
                filter: brightness(1.05);
                color: #fff;
            }
            .sep {
                color: #c5d2eb;
                font-size: 12px;
                user-select: none;
                padding: 0 2px;
            }
            #toast {
                position: fixed;
                bottom: 28px;
                left: 50%;
                transform: translateX(-50%) translateY(12px);
                padding: 8px 18px;
                background: rgba(31, 42, 68, 0.92);
                color: #fff;
                border-radius: 8px;
                font-size: 13px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease, transform 0.2s ease;
                z-index: 100000;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            }
            #toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="editor-wrap">
                <div class="editor-head panel-title">
                    <div class="editor-head-main">
                        <span id="head-title">JSON</span>
                        <span id="stat-hint" class="hint">粘贴内容后在下方选择类型并操作</span>
                    </div>
                    <div class="actions">
                        <button type="button" class="title-btn" id="btn-copy">复制</button>
                        <button type="button" class="title-btn danger" id="btn-clear">清空</button>
                    </div>
                </div>
                <div class="editor-zone">
                    <div class="cm-editor-wrap">
                        <textarea id="main-input" name="mainInput" spellcheck="false" placeholder='例如 JSON：{"a":1,"b":[2,3]}'></textarea>
                    </div>
                </div>
            </div>

            <div class="ctool-page-option">
                <div class="json-tabs-row">
                    <div class="json-tabs" id="fmt-tabs" role="tablist">
                        <button type="button" class="active" data-kind="json">JSON</button>
                        <button type="button" data-kind="xml">XML</button>
                        <button type="button" data-kind="sql">SQL</button>
                        <button type="button" data-kind="javascript">JavaScript</button>
                        <button type="button" data-kind="css">CSS</button>
                        <button type="button" data-kind="html">HTML</button>
                    </div>
                    <div class="sql-dialect-wrap" id="sql-dialect-wrap">
                        <span class="hint-inline">方言</span>
                        <select id="sql-dialect" name="sqlDialect" class="dd wide" title="SQL 格式化方言">
                            <option value="sql">标准 SQL</option>
                            <option value="mysql">MySQL</option>
                            <option value="mariadb">MariaDB</option>
                            <option value="postgresql">PostgreSQL</option>
                            <option value="sqlite">SQLite</option>
                            <option value="tsql">T-SQL</option>
                            <option value="plsql">PL/SQL</option>
                            <option value="bigquery">BigQuery</option>
                        </select>
                    </div>
                </div>
                <div class="tab-panel active">
                    <div class="align-row">
                        <button type="button" class="btn primary" id="btn-format">格式化</button>
                        <button type="button" class="btn" id="btn-minify">压缩</button>
                        <select id="sel-indent" class="dd" title="缩进宽度">
                            <option value="0">不换行</option>
                            <option value="2" selected>缩进 2</option>
                            <option value="4">缩进 4</option>
                            <option value="6">缩进 6</option>
                            <option value="8">缩进 8</option>
                            <option value="tab">Tab</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div id="toast" aria-live="polite"></div>
        <script src="../vendor/codemirror/lib/codemirror.js"></script>
        <script src="../vendor/codemirror/mode/xml/xml.js"></script>
        <script src="../vendor/codemirror/mode/javascript/javascript.js"></script>
        <script src="../vendor/codemirror/mode/css/css.js"></script>
        <script src="../vendor/codemirror/mode/htmlmixed/htmlmixed.js"></script>
        <script src="../vendor/codemirror/mode/sql/sql.js"></script>
        <script src="../vendor/codemirror/addon/display/placeholder.js"></script>
        <script src="../vendor/sql-formatter/sql-formatter.min.js"></script>
        <script>
            (function () {
                var ta = document.getElementById("main-input");
                var toastEl = document.getElementById("toast");
                var statHint = document.getElementById("stat-hint");
                var headTitle = document.getElementById("head-title");
                var sqlDialectWrap = document.getElementById("sql-dialect-wrap");
                var sqlDialect = document.getElementById("sql-dialect");
                var selIndent = document.getElementById("sel-indent");
                var kind = "json";
                var cm;

                var kindLabels = {
                    json: "JSON",
                    xml: "XML",
                    sql: "SQL",
                    javascript: "JavaScript",
                    css: "CSS",
                    html: "HTML"
                };

                var kindPlaceholders = {
                    json: '例如 JSON：{"a":1,"b":[2,3]}',
                    xml: "例如：<root><item>1</item></root>",
                    sql: "例如：SELECT id, name FROM users WHERE status = 1",
                    javascript: "例如：function hello() { return 1; }",
                    css: "例如：.box { margin: 8px; color: #333; }",
                    html: "例如：<div class=\"x\"><span>hi</span></div>"
                };

                function dialectToMime(d) {
                    if (d === "mysql") return "text/x-mysql";
                    if (d === "mariadb") return "text/x-mariadb";
                    if (d === "postgresql") return "text/x-pgsql";
                    if (d === "sqlite") return "text/x-sqlite";
                    if (d === "tsql") return "text/x-mssql";
                    if (d === "plsql") return "text/x-plsql";
                    if (d === "bigquery") return "text/x-sql";
                    return "text/x-sql";
                }

                function kindToMode(k) {
                    if (k === "json") return { name: "javascript", json: true };
                    if (k === "javascript") return { name: "javascript", json: false };
                    if (k === "css") return "css";
                    if (k === "html") return "text/html";
                    if (k === "xml") return "application/xml";
                    if (k === "sql") return dialectToMime(sqlDialect.value || "sql");
                    return { name: "javascript", json: true };
                }

                function applyCmIndentFromReadIndent() {
                    if (!cm) return;
                    var ind = readIndent();
                    if (ind.char === "\t") {
                        cm.setOption("indentWithTabs", true);
                        cm.setOption("tabSize", Math.max(ind.size, 1));
                        cm.setOption("indentUnit", "\t");
                    } else if (ind.size === 0) {
                        cm.setOption("indentWithTabs", false);
                        cm.setOption("tabSize", 2);
                        cm.setOption("indentUnit", "  ");
                    } else {
                        cm.setOption("indentWithTabs", false);
                        cm.setOption("tabSize", ind.size);
                        cm.setOption("indentUnit", new Array(ind.size + 1).join(" "));
                    }
                }

                function refreshEditorMode() {
                    if (!cm) return;
                    cm.setOption("mode", kindToMode(kind));
                    cm.setOption("placeholder", kindPlaceholders[kind] || "");
                    applyCmIndentFromReadIndent();
                    cm.refresh();
                }

                function toast(msg) {
                    toastEl.textContent = msg;
                    toastEl.classList.add("show");
                    clearTimeout(toastEl._t);
                    toastEl._t = setTimeout(function () {
                        toastEl.classList.remove("show");
                    }, 2200);
                }

                function readIndent() {
                    var v = selIndent.value;
                    if (v === "tab") {
                        return { size: 1, char: "\t", jsonThird: "\t" };
                    }
                    if (v === "0") {
                        return { size: 0, char: " ", jsonThird: null };
                    }
                    var n = parseInt(v, 10);
                    if (isNaN(n)) n = 2;
                    return { size: n, char: " ", jsonThird: n };
                }

                function updateStat() {
                    var val = cm.getValue();
                    var n = val.length;
                    var lines = val ? val.split(/\r\n|\r|\n/).length : 0;
                    statHint.textContent = n ? "字符 " + n + " · 行 " + lines : "粘贴内容后在下方选择类型并操作";
                }

                function syncHeadUi() {
                    headTitle.textContent = kindLabels[kind] || "格式化";
                    sqlDialectWrap.classList.toggle("visible", kind === "sql");
                }

                function getBeautifyBase() {
                    var ind = readIndent();
                    if (ind.size === 0) {
                        return {
                            indent_size: 0,
                            indent_char: " ",
                            preserve_newlines: false,
                            max_preserve_newlines: 0,
                            end_with_newline: false
                        };
                    }
                    return {
                        indent_size: ind.char === "\t" ? 1 : ind.size,
                        indent_char: ind.char,
                        max_preserve_newlines: 2,
                        preserve_newlines: true,
                        end_with_newline: true
                    };
                }

                function formatXmlStr(str, spaces) {
                    if (spaces < 1) return minifyXml(str);
                    var unit = new Array(spaces + 1).join(" ");
                    var formatted = "";
                    var pad = 0;
                    var reg = /(>)(<)(\/*)/g;
                    str = str.replace(reg, "$1\r\n$2$3");
                    str.split("\r\n").forEach(function (node) {
                        var level = 0;
                        if (node.match(/.+<\/\w[^>]*>$/)) {
                            level = 0;
                        } else if (node.match(/^<\/\w/)) {
                            if (pad !== 0) pad -= 1;
                        } else if (node.match(/^<\w[^>]*[^\/]>.*$/)) {
                            level = 1;
                        } else {
                            level = 0;
                        }
                        var padding = "";
                        for (var i = 0; i < pad; i++) padding += unit;
                        formatted += padding + node + "\r\n";
                        pad += level;
                    });
                    return formatted.trim();
                }

                function minifyXml(str) {
                    return str.replace(/>\s+</g, "><").trim();
                }

                cm = CodeMirror.fromTextArea(ta, {
                    lineNumbers: true,
                    lineWrapping: true,
                    theme: "eclipse",
                    mode: kindToMode("json"),
                    tabSize: 2,
                    indentUnit: "  ",
                    indentWithTabs: false,
                    inputStyle: "textarea",
                    spellcheck: false,
                    autofocus: false,
                    placeholder: kindPlaceholders.json
                });

                function getSqlFormatFn() {
                    if (typeof window._sqlFormatFn === "function") {
                        return Promise.resolve(window._sqlFormatFn);
                    }
                    var s = window.sqlFormatter;
                    if (s && typeof s.format === "function") {
                        window._sqlFormatFn = s.format;
                        return Promise.resolve(window._sqlFormatFn);
                    }
                    return Promise.reject(
                        new Error("未加载 sql-formatter（请运行 npm install 生成 vendor/sql-formatter/sql-formatter.min.js）")
                    );
                }

                function doFormat() {
                    var text = cm.getValue();
                    if (!text.trim()) {
                        toast("请先输入内容");
                        return;
                    }
                    var ind = readIndent();
                    try {
                        if (kind === "json") {
                            cm.setValue(JSON.stringify(JSON.parse(text), null, ind.jsonThird));
                        } else if (kind === "xml") {
                            cm.setValue(formatXmlStr(text, ind.size));
                        } else if (kind === "sql") {
                            getSqlFormatFn()
                                .then(function (format) {
                                    try {
                                        var tw = ind.char === "\t" ? 1 : ind.size;
                                        if (!tw) tw = 2;
                                        var out = format(text, {
                                            language: sqlDialect.value || "sql",
                                            tabWidth: tw,
                                            useTabs: ind.char === "\t",
                                            keywordCase: "upper"
                                        });
                                        cm.setValue(out);
                                        updateStat();
                                        toast("已格式化");
                                    } catch (inner) {
                                        toast("SQL 格式化失败：" + (inner.message || String(inner)));
                                    }
                                })
                                .catch(function (e) {
                                    toast("SQL 模块加载失败：" + (e.message || String(e)));
                                });
                            return;
                        } else if (kind === "javascript") {
                            if (typeof js_beautify !== "function") throw new Error("js-beautify 未加载");
                            cm.setValue(js_beautify(text, getBeautifyBase()));
                        } else if (kind === "css") {
                            if (typeof css_beautify !== "function") throw new Error("css-beautify 未加载");
                            cm.setValue(css_beautify(text, getBeautifyBase()));
                        } else if (kind === "html") {
                            if (typeof html_beautify !== "function") throw new Error("html-beautify 未加载");
                            cm.setValue(html_beautify(text, getBeautifyBase()));
                        }
                        updateStat();
                        toast("已格式化");
                    } catch (e) {
                        toast("格式化失败：" + (e.message || String(e)));
                    }
                }

                function doMinify() {
                    var text = cm.getValue();
                    if (!text.trim()) {
                        toast("请先输入内容");
                        return;
                    }
                    var ind = readIndent();
                    try {
                        if (kind === "json") {
                            cm.setValue(JSON.stringify(JSON.parse(text)));
                        } else if (kind === "xml") {
                            cm.setValue(minifyXml(text));
                        } else if (kind === "sql") {
                            getSqlFormatFn()
                                .then(function (format) {
                                    try {
                                        var tw2 = ind.char === "\t" ? 1 : ind.size;
                                        if (!tw2) tw2 = 2;
                                        var pretty = format(text, {
                                            language: sqlDialect.value || "sql",
                                            tabWidth: tw2,
                                            useTabs: ind.char === "\t",
                                            keywordCase: "upper"
                                        });
                                        cm.setValue(
                                            pretty
                                                .split(/\r?\n/)
                                                .map(function (line) {
                                                    return line.trim();
                                                })
                                                .join(" ")
                                        );
                                        updateStat();
                                        toast("已压缩为紧凑单行");
                                    } catch (inner) {
                                        toast("SQL 压缩失败：" + (inner.message || String(inner)));
                                    }
                                })
                                .catch(function (e) {
                                    toast("SQL 模块加载失败：" + (e.message || String(e)));
                                });
                            return;
                        } else if (kind === "javascript") {
                            if (typeof js_beautify !== "function") throw new Error("js-beautify 未加载");
                            cm.setValue(
                                js_beautify(text, {
                                    indent_size: 0,
                                    indent_char: " ",
                                    preserve_newlines: false,
                                    max_preserve_newlines: 0,
                                    space_in_empty_paren: false,
                                    end_with_newline: false
                                })
                            );
                        } else if (kind === "css") {
                            if (typeof css_beautify !== "function") throw new Error("css-beautify 未加载");
                            cm.setValue(
                                css_beautify(text, {
                                    indent_size: 0,
                                    indent_char: " ",
                                    preserve_newlines: false,
                                    newline_between_rules: false,
                                    end_with_newline: false
                                })
                            );
                        } else if (kind === "html") {
                            if (typeof html_beautify !== "function") throw new Error("html-beautify 未加载");
                            cm.setValue(
                                html_beautify(text, {
                                    indent_size: 0,
                                    indent_char: " ",
                                    preserve_newlines: false,
                                    max_preserve_newlines: 0,
                                    end_with_newline: false
                                })
                            );
                        }
                        updateStat();
                        toast("已压缩");
                    } catch (e) {
                        toast("压缩失败：" + (e.message || String(e)));
                    }
                }

                function copyText() {
                    var v = cm.getValue();
                    if (!v) {
                        toast("没有可复制的内容");
                        return;
                    }
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(v).then(
                            function () {
                                toast("已复制到剪贴板");
                            },
                            function () {
                                fallbackCopy();
                            }
                        );
                    } else {
                        fallbackCopy();
                    }
                }

                function fallbackCopy() {
                    var v = cm.getValue();
                    if (!v) {
                        toast("没有可复制的内容");
                        return;
                    }
                    var t2 = document.createElement("textarea");
                    t2.value = v;
                    t2.setAttribute("readonly", "");
                    t2.style.position = "fixed";
                    t2.style.left = "-9999px";
                    document.body.appendChild(t2);
                    t2.select();
                    try {
                        document.execCommand("copy");
                        toast("已复制到剪贴板");
                    } catch (e) {
                        toast("复制失败");
                    }
                    document.body.removeChild(t2);
                }

                document.getElementById("fmt-tabs").addEventListener("click", function (e) {
                    var btn = e.target.closest("button[data-kind]");
                    if (!btn) return;
                    kind = btn.getAttribute("data-kind") || "json";
                    document.querySelectorAll("#fmt-tabs button").forEach(function (b) {
                        b.classList.toggle("active", b === btn);
                    });
                    syncHeadUi();
                    refreshEditorMode();
                });

                document.getElementById("btn-format").addEventListener("click", doFormat);
                document.getElementById("btn-minify").addEventListener("click", doMinify);
                document.getElementById("btn-copy").addEventListener("click", copyText);
                document.getElementById("btn-clear").addEventListener("click", function () {
                    cm.setValue("");
                    updateStat();
                });

                sqlDialect.addEventListener("change", function () {
                    if (kind === "sql") {
                        cm.setOption("mode", dialectToMime(sqlDialect.value || "sql"));
                        cm.refresh();
                    }
                });

                selIndent.addEventListener("change", applyCmIndentFromReadIndent);

                function resizeCm() {
                    var wrap = ta.closest(".cm-editor-wrap");
                    if (!wrap || !cm) return;
                    cm.setSize(null, Math.max(120, wrap.clientHeight));
                    cm.refresh();
                }
                if (typeof ResizeObserver !== "undefined") {
                    var wrapEl = ta.closest(".cm-editor-wrap");
                    if (wrapEl) {
                        new ResizeObserver(resizeCm).observe(wrapEl);
                    }
                }
                window.addEventListener("load", resizeCm);
                window.addEventListener("resize", resizeCm);
                setTimeout(resizeCm, 0);

                cm.on("change", updateStat);
                syncHeadUi();
                refreshEditorMode();
                updateStat();
            })();
        </script>
    </body>
</html>
