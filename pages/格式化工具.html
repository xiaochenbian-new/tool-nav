<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>格式化工具</title>
        <link rel="stylesheet" href="libs/tool-danger-btn.css" />
        <link rel="stylesheet" href="../vendor/codemirror/lib/codemirror.css" />
        <link rel="stylesheet" href="../vendor/codemirror/theme/eclipse.css" />
        <script src="../vendor/js-beautify/beautify.js"></script>
        <script src="../vendor/js-beautify/beautify-html.js"></script>
        <script src="../vendor/js-beautify/beautify-css.js"></script>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            :root {
                --card: #ffffff;
                --bg: #f3f7ff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
            }
            html, body {
                width: 100%;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
            }
            .page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                min-height: 0;
            }
            .editor-wrap {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                overflow: hidden;
            }
            .panel-title {
                padding: 8px 10px;
                font-size: 14px;
                color: #324a76;
                border-bottom: 1px solid #e4edff;
                background: #f8fbff;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .editor-head {
                flex: 0 0 auto;
                gap: 8px;
            }
            .editor-head-main {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
                flex-wrap: wrap;
                flex: 1;
            }
            .editor-head .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
                flex-shrink: 0;
            }
            .hint {
                color: var(--muted);
                font-size: 14px;
            }
            .title-btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 4px 10px;
                font-size: 13px;
                cursor: pointer;
            }
            .title-btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .title-btn.handoff-btn,
            .title-btn.qr-btn {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                border-style: dashed;
                border-color: #7a94c8;
                background: #f8fbff;
                color: #3c5a94;
            }
            .title-btn.handoff-btn:hover,
            .title-btn.qr-btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .title-btn.handoff-btn svg,
            .title-btn.qr-btn svg {
                display: block;
                flex-shrink: 0;
            }
            .editor-zone {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                padding: 0 8px 8px;
                gap: 0;
            }
            .cm-editor-wrap {
                flex: 1;
                min-height: 0;
                position: relative;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                overflow: hidden;
                background: #fff;
            }
            .cm-editor-wrap .CodeMirror {
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                bottom: 0;
                height: auto;
                font-size: 13px;
                line-height: 1.6;
                font-family: Consolas, "Courier New", monospace;
            }
            .cm-editor-wrap .CodeMirror-scroll {
                min-height: 120px;
            }
            .cm-editor-wrap .CodeMirror-focused {
                box-shadow: inset 0 0 0 1px rgba(47, 107, 255, 0.25);
            }
            /* 悬浮于编辑区右上角的查找/替换面板（与 Json / 文本处理工具一致） */
            .find-bar {
                position: absolute;
                top: 8px;
                right: 8px;
                z-index: 30;
                width: min(440px, calc(100% - 16px));
                padding: 8px 10px;
                font-size: 12px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                background: #fff;
                box-shadow: 0 6px 24px rgba(36, 90, 190, 0.18);
                pointer-events: auto;
            }
            .find-bar .btn {
                min-height: 1.75rem;
                padding: 0 10px;
                font-size: 12px;
            }
            .find-bar[hidden] { display: none !important; }
            .find-row {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 6px;
                margin-top: 4px;
            }
            .find-row:first-child { margin-top: 0; }
            .find-label {
                flex: 0 0 auto;
                width: 2.5rem;
                color: var(--muted);
                text-align: right;
            }
            .find-input {
                flex: 1 1 80px;
                min-width: 72px;
                max-width: 100%;
                height: 1.75rem;
                padding: 0 8px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                font-size: 12px;
                font-family: Consolas, "Courier New", monospace;
                outline: none;
            }
            .find-input:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.15);
            }
            .find-bar .btn-icon {
                min-width: 1.75rem;
                padding: 0 8px;
            }
            .find-count {
                color: var(--muted);
                font-size: 11px;
                min-width: 3.5rem;
            }
            .find-bar label.chk {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                cursor: pointer;
                color: #3c4f78;
                user-select: none;
            }
            .cm-editor-wrap .CodeMirror .cm-find-hl {
                background: rgba(255, 220, 120, 0.55);
                padding: 0 1px;
                border-radius: 2px;
            }
            .cm-editor-wrap .CodeMirror .cm-find-hl-current {
                background: rgba(255, 165, 60, 0.88);
                box-shadow: 0 0 0 1px rgba(200, 100, 0, 0.35);
            }
            #main-input {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }
            .json-sheet-bar {
                flex: 0 0 auto;
                display: flex;
                align-items: flex-end;
                min-height: 30px;
                padding: 0 10px 2px;
                background: #fff;
                overflow: hidden;
            }
            .json-sheet-strip {
                display: flex;
                align-items: flex-end;
                flex-wrap: nowrap;
                gap: 4px;
                min-width: 0;
                max-width: 100%;
                overflow-x: auto;
                overflow-y: hidden;
                scrollbar-width: thin;
            }
            .json-sheet-strip::-webkit-scrollbar {
                height: 4px;
            }
            .json-sheet-tabs {
                display: contents;
            }
            .json-sheet-tab {
                flex: 0 0 auto;
                display: inline-flex;
                align-items: center;
                max-width: 148px;
                height: 26px;
                padding: 0 10px;
                margin: 0;
                border: 1px solid #dbe4f0;
                border-radius: 4px 4px 0 0;
                background: #fff;
                color: #516078;
                font-size: 12px;
                font-weight: 400;
                cursor: pointer;
                user-select: none;
                position: relative;
                z-index: 1;
            }
            .json-sheet-tab:hover:not(.active) {
                background: #fafbfd;
                border-color: #cdd8ea;
                color: #3c4f78;
                z-index: 2;
            }
            .json-sheet-tab.active {
                background: #edf3ff;
                color: var(--primary);
                font-weight: 600;
                z-index: 3;
                border-color: #d8e5ff;
            }
            .json-sheet-tab.compare-selected {
                box-shadow: inset 0 0 0 1px #2f6bff;
                border-color: #2f6bff;
                background: #e8f0ff;
            }
            .json-sheet-tab.compare-selected:not(.active) {
                color: #2f6bff;
                font-weight: 600;
            }
            .json-sheet-tab .sheet-name {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                max-width: 120px;
            }
            .json-sheet-tab .sheet-rename-input {
                width: 96px;
                max-width: 120px;
                height: 22px;
                padding: 0 6px;
                font-size: 12px;
                border: 1px solid var(--primary);
                border-radius: 4px;
                outline: none;
                background: #fff;
            }
            .json-sheet-tab .sheet-close {
                flex: 0 0 auto;
                margin-left: 4px;
                width: 16px;
                height: 16px;
                padding: 0;
                border: none;
                border-radius: 3px;
                background: transparent;
                color: #7a879e;
                font-size: 14px;
                line-height: 1;
                cursor: pointer;
                opacity: 1;
            }
            .json-sheet-tab.active .sheet-close {
                color: #5a7fd4;
            }
            .json-sheet-tab .sheet-close:hover {
                background: rgba(224, 64, 64, 0.15);
                color: var(--danger);
            }
            .json-sheet-add {
                flex: 0 0 26px;
                width: 26px;
                height: 26px;
                margin: 0;
                padding: 0;
                border: none;
                border-radius: 4px;
                background: transparent;
                font-size: 18px;
                line-height: 1;
                color: #8a9bb8;
                cursor: pointer;
            }
            .json-sheet-add:hover {
                background: #f0f5ff;
                color: var(--primary);
            }
            #fmt-sheets-meta {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                border: 0;
            }
            /* 与 Json工具 Ctool 区块一致 */
            .ctool-page-option {
                flex: 0 0 auto;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                padding: 8px;
            }
            .json-tabs-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                margin-bottom: 8px;
                border-bottom: 1px solid #e4edff;
                padding-bottom: 6px;
                flex-wrap: wrap;
            }
            .json-tabs {
                display: flex;
                gap: 4px;
                align-items: center;
                flex-wrap: wrap;
            }
            .json-tabs button {
                border: 1px solid #cfdcf7;
                background: #fff;
                padding: 7px 14px;
                font-size: 14px;
                border-radius: 8px;
                cursor: pointer;
                color: var(--text);
            }
            .json-tabs button:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .json-tabs button.active {
                border-color: var(--primary);
                color: #fff;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            .sql-dialect-wrap {
                display: none;
                align-items: center;
                gap: 6px;
                flex-shrink: 0;
            }
            .sql-dialect-wrap.visible {
                display: inline-flex;
            }
            .sql-dialect-wrap .hint-inline {
                font-size: 13px;
                color: var(--muted);
                white-space: nowrap;
            }
            .tab-panel {
                display: block;
            }
            .align-row {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
                justify-content: center;
                align-items: center;
            }
            select.dd {
                min-height: 2rem;
                min-width: 6.5rem;
                max-width: 11rem;
                padding: 4px 8px;
                font-size: 14px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                background: #fff;
                color: var(--text);
                cursor: pointer;
            }
            select.dd:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.15);
                outline: none;
            }
            select.dd.wide {
                max-width: 15rem;
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 8px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 7px 12px;
                font-size: 14px;
                cursor: pointer;
                min-height: 2rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }
            .btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .btn.primary {
                color: #fff;
                border-color: transparent;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            .btn.primary:hover {
                filter: brightness(1.05);
                color: #fff;
            }
            .sep {
                color: #c5d2eb;
                font-size: 12px;
                user-select: none;
                padding: 0 2px;
            }
            #toast {
                position: fixed;
                bottom: 28px;
                left: 50%;
                transform: translateX(-50%) translateY(12px);
                padding: 8px 18px;
                background: rgba(31, 42, 68, 0.92);
                color: #fff;
                border-radius: 8px;
                font-size: 13px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease, transform 0.2s ease;
                z-index: 100000;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            }
            #toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="editor-wrap">
                <div class="editor-head panel-title">
                    <div class="editor-head-main">
                        <span id="head-title">JSON</span>
                        <span id="stat-hint" class="hint" title="底部可切换多个工作表，双击标签可重命名；Ctrl+点击可选两个后点「对比」；Ctrl+F 查找">多工作表 · Ctrl+F 查找</span>
                    </div>
                    <div class="actions">
                        <button type="button" class="title-btn" id="btn-copy">复制</button>
                        <button type="button" class="title-btn handoff-btn" id="btn-compare-diff" title="按住 Ctrl 选择两个工作表后点击，跳转到文本对比">
                            <span>对比</span>
                            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" class="icon-diff-split">
                                <path d="M12 4H5V20H12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.2 1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M12 3V21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="butt"></path>
                                <path d="M12 4H19V20H12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </button>
                        <button type="button" class="title-btn qr-btn" id="btn-qr" title="生成二维码">
                            <span>二维码</span>
                            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                                <path
                                    fill="currentColor"
                                    d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zM14 13h2v3h-2v-3zm3 3h2v2h-2v-2zm-3 3h3v2h-3v-2zm3-3h2v2h-2v-2z"
                                ></path>
                            </svg>
                        </button>
                        <button type="button" class="title-btn danger" id="btn-clear">清空</button>
                    </div>
                </div>
                <div class="editor-zone">
                    <div class="cm-editor-wrap">
                        <textarea id="main-input" name="mainInput" data-persist-key="fmt_input" aria-hidden="true" tabindex="-1" spellcheck="false" placeholder='例如 JSON：{"a":1,"b":[2,3]}'></textarea>
                        <div id="find-bar" class="find-bar" hidden>
                            <div class="find-row">
                                <span class="find-label">查找</span>
                                <input type="text" id="find-input" class="find-input" autocomplete="off" spellcheck="false" placeholder="查找内容" />
                                <button type="button" class="btn find-icon btn-icon" id="find-prev" title="上一个 (Shift+Enter / ↑)">↑</button>
                                <button type="button" class="btn find-icon btn-icon" id="find-next" title="下一个 (Enter / ↓)">↓</button>
                                <label class="chk"><input type="checkbox" id="find-case" />区分大小写</label>
                                <span id="find-count" class="find-count"></span>
                                <button type="button" class="btn btn-icon" id="find-close" title="关闭 (Esc)">×</button>
                            </div>
                            <div class="find-row" id="find-replace-row" hidden>
                                <span class="find-label">替换</span>
                                <input type="text" id="find-replace-input" class="find-input" autocomplete="off" spellcheck="false" placeholder="替换为" />
                                <button type="button" class="btn" id="find-rep-one">替换</button>
                                <button type="button" class="btn" id="find-rep-all">全部替换</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="json-sheet-bar" id="fmt-sheet-bar">
                    <div class="json-sheet-strip">
                        <div class="json-sheet-tabs" id="fmt-sheet-tabs" role="tablist" aria-label="格式化工作表"></div>
                        <button type="button" class="json-sheet-add" id="fmt-sheet-add" title="新建工作表">+</button>
                    </div>
                </div>
                <textarea id="fmt-sheets-meta" data-persist-key="fmt_sheets_state" aria-hidden="true" tabindex="-1"></textarea>
            </div>

            <div class="ctool-page-option">
                <div class="json-tabs-row">
                    <div class="json-tabs" id="fmt-tabs" role="tablist">
                        <button type="button" class="active" data-kind="json">JSON</button>
                        <button type="button" data-kind="xml">XML</button>
                        <button type="button" data-kind="sql">SQL</button>
                        <button type="button" data-kind="javascript">JS</button>
                        <button type="button" data-kind="css">CSS</button>
                        <button type="button" data-kind="html">HTML</button>
                    </div>
                    <div class="sql-dialect-wrap" id="sql-dialect-wrap">
                        <span class="hint-inline">方言</span>
                        <select id="sql-dialect" name="sqlDialect" class="dd wide" title="SQL 格式化方言">
                            <option value="sql">标准 SQL</option>
                            <option value="mysql">MySQL</option>
                            <option value="mariadb">MariaDB</option>
                            <option value="postgresql">PostgreSQL</option>
                            <option value="sqlite">SQLite</option>
                            <option value="tsql">T-SQL</option>
                            <option value="plsql">PL/SQL</option>
                            <option value="bigquery">BigQuery</option>
                        </select>
                    </div>
                </div>
                <div class="tab-panel active">
                    <div class="align-row">
                        <button type="button" class="btn primary" id="btn-format">格式化</button>
                        <button type="button" class="btn" id="btn-minify">压缩</button>
                        <select id="sel-indent" class="dd" title="缩进宽度">
                            <option value="0">不换行</option>
                            <option value="2" selected>缩进 2</option>
                            <option value="4">缩进 4</option>
                            <option value="6">缩进 6</option>
                            <option value="8">缩进 8</option>
                            <option value="tab">Tab</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div id="toast" aria-live="polite"></div>
        <script src="../vendor/codemirror/lib/codemirror.js"></script>
        <script src="../vendor/codemirror/mode/xml/xml.js"></script>
        <script src="../vendor/codemirror/mode/javascript/javascript.js"></script>
        <script src="../vendor/codemirror/mode/css/css.js"></script>
        <script src="../vendor/codemirror/mode/htmlmixed/htmlmixed.js"></script>
        <script src="../vendor/codemirror/mode/sql/sql.js"></script>
        <script src="../vendor/codemirror/addon/display/placeholder.js"></script>
        <script src="../vendor/sql-formatter/sql-formatter.min.js"></script>
        <script src="libs/tool-copy.js"></script>
        <script src="libs/qrcode-lib.bundle.js"></script>
        <script src="libs/tool-qr.js"></script>
        <script src="libs/tool-sheet-tabs-drag.js"></script>
        <script src="libs/tool-find.js"></script>
        <script>
            (function () {
                var ta = document.getElementById("main-input");
                var toastEl = document.getElementById("toast");
                var statHint = document.getElementById("stat-hint");
                var headTitle = document.getElementById("head-title");
                var sqlDialectWrap = document.getElementById("sql-dialect-wrap");
                var sqlDialect = document.getElementById("sql-dialect");
                var selIndent = document.getElementById("sel-indent");
                var kind = "json";
                var cm;

                /* —— 多工作表（按格式类型各自独立） —— */
                var sheetsMetaInput = document.getElementById("fmt-sheets-meta");
                var sheetTabsEl = document.getElementById("fmt-sheet-tabs");
                var sheetAddBtn = document.getElementById("fmt-sheet-add");
                var KIND_LIST = ["json", "xml", "sql", "javascript", "css", "html"];
                var sheetsByKind = {};
                var fmtSheets = [];
                var activeSheetId = null;
                var sheetRenameId = null;
                var compareSelectedIds = [];
                var _sheetPersistTimer = null;
                var HANDOFF_SHEETS_TO_TEXT_DIFF_KEY = "tool-nav:handoff:sheets-to-text-diff";
                var HANDOFF_TEXT_DIFF_TAB = "tab10";

                function genSheetId() {
                    return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
                }

                function createDefaultKindState(legacyContent) {
                    var id = genSheetId();
                    return {
                        activeId: id,
                        sheets: [{ id: id, name: "Sheet1", content: legacyContent == null ? "" : String(legacyContent) }]
                    };
                }

                function cloneKindState(state) {
                    return {
                        activeId: state.activeId,
                        sheets: state.sheets.map(function (s) {
                            return {
                                id: s.id,
                                name: s.name,
                                content: s.content == null ? "" : String(s.content)
                            };
                        })
                    };
                }

                function ensureKindBucket(k, legacyContent) {
                    if (!sheetsByKind[k] || !sheetsByKind[k].sheets || !sheetsByKind[k].sheets.length) {
                        sheetsByKind[k] = createDefaultKindState(k === kind ? legacyContent : "");
                    }
                    return sheetsByKind[k];
                }

                function getActiveSheet() {
                    for (var i = 0; i < fmtSheets.length; i++) {
                        if (fmtSheets[i].id === activeSheetId) return fmtSheets[i];
                    }
                    return null;
                }

                function nextSheetName() {
                    var used = {};
                    for (var i = 0; i < fmtSheets.length; i++) used[fmtSheets[i].name] = true;

                        activeSheetId = sheetsByKind[kind].activeId;
                        return;
                    }
                    sheetsByKind[kind] = {
                        activeId: activeSheetId,
                        sheets: fmtSheets.map(function (s) {
                            return {
                                id: s.id,
                                name: s.name,
                                content: s.content == null ? "" : String(s.content)
                            };
                        })
                    };
                }

                function loadKindIntoMemory(k) {
                    var bucket = ensureKindBucket(k);
                    var cloned = cloneKindState(bucket);
                    fmtSheets = cloned.sheets;
                    activeSheetId = cloned.activeId;
                    if (!getActiveSheet()) activeSheetId = fmtSheets[0].id;
                    compareSelectedIds = [];

                function initSheetsFromStorage() {

                            if (state && state.version === 2 && state.byKind) {
                                KIND_LIST.forEach(function (k) {
                                    var bucket = state.byKind[k];
                                    if (bucket && bucket.sheets && bucket.sheets.length) {
                                        sheetsByKind[k] = {
                                            activeId: bucket.activeId,
                                            sheets: bucket.sheets.map(function (s) {
                                                return {
                                                    id: s.id || genSheetId(),
                                                    name: String(s.name || "Sheet1"),
                                                    content: s.content == null ? "" : String(s.content)
                                                };
                                            })
                                        };
                                        if (
                                            !sheetsByKind[k].sheets.some(function (s) {
                                                return s.id === sheetsByKind[k].activeId;
                                            })
                                        ) {
                                            sheetsByKind[k].activeId = sheetsByKind[k].sheets[0].id;
                                        }
                                    }
                                });
                                if (state.activeKind && KIND_LIST.indexOf(state.activeKind) >= 0) {
                                    kind = state.activeKind;
                                }
                            } else if (state && state.sheets && state.sheets.length) {
                                // 兼容旧版：共用 sheet 归到当前/默认 JSON
                                var migrateKind =
                                    state.activeKind && KIND_LIST.indexOf(state.activeKind) >= 0
                                        ? state.activeKind
                                        : "json";
                                sheetsByKind[migrateKind] = {
                                    activeId: state.activeId,
                                    sheets: state.sheets.map(function (s) {
                                        return {
                                            id: s.id || genSheetId(),
                                            name: String(s.name || "Sheet1"),
                                            content: s.content == null ? "" : String(s.content)
                                        };
                                    })
                                };
                                if (
                                    !sheetsByKind[migrateKind].sheets.some(function (s) {
                                        return s.id === sheetsByKind[migrateKind].activeId;
                                    })
                                ) {
                                    sheetsByKind[migrateKind].activeId = sheetsByKind[migrateKind].sheets[0].id;
                                }
                                kind = migrateKind;
                            }
                        } catch (e) {
                            /* fall through */
                        }
                    }
                    KIND_LIST.forEach(function (k) {
                        ensureKindBucket(k, k === kind ? legacy : "");

                function removeSheet(sheetId) {
                    if (fmtSheets.length <= 1) {
                        toast("至少保留一个工作表");

                    var idx = -1;
                    for (var i = 0; i < fmtSheets.length; i++) {

                    if (idx < 0) return;
                    compareSelectedIds = compareSelectedIds.filter(function (id) {

                    });
                    var removed = fmtSheets.splice(idx, 1)[0];
                    if (activeSheetId === sheetId) {

                        activeSheetId = next.id;
                        applyActiveSheetToEditor();

                function renameSheet(sheetId, newName) {

                    for (var j = 0; j < fmtSheets.length; j++) {
                        if (fmtSheets[j].id === sheetId) {

                                        e.preventDefault();

                                    }
                                });
                                inp.addEventListener("blur", function () {
                                    finishSheetRename(sheet.id, inp.value, false);
                                });

                        })(fmtSheets[i]);

                function formatXmlStr(str, spaces) {
                    if (spaces < 1) return minifyXml(str);
                    var unit = new Array(spaces + 1).join(" ");
                    var formatted = "";
                    var pad = 0;
                    var reg = /(>)(<)(\/*)/g;
                    str = str.replace(reg, "$1\r\n$2$3");
                    str.split("\r\n").forEach(function (node) {
                        var level = 0;
                        if (node.match(/.+<\/\w[^>]*>$/)) {
                            level = 0;
                        } else if (node.match(/^<\/\w/)) {
                            if (pad !== 0) pad -= 1;
                        } else if (node.match(/^<\w[^>]*[^\/]>.*$/)) {
                            level = 1;
                        } else {
                            level = 0;
                        }
                        var padding = "";
                        for (var i = 0; i < pad; i++) padding += unit;
                        formatted += padding + node + "\r\n";
                        pad += level;
                    });
                    return formatted.trim();
                }

                function minifyXml(str) {
                    return str.replace(/>\s+</g, "><").trim();

                refreshFindHighlights = function () {
                    var on = !findBar.hidden && findInput.value.length > 0;
                    clearFindMarks();
                    if (!on) return;
                    var TF = window.ToolFind;
                    var needle = findInput.value;

                    var sel = cmGetSelOffsets();
                    var positions = TF
                        ? TF.collectHighlights(textVal, needle, caseSens, sel.start, TF.MAX_HIGHLIGHT)
                        : [];
                    if (sel.end > sel.start) {
                        var has = false;
                        for (var hx = 0; hx < positions.length; hx++) {
                            if (positions[hx].start === sel.start && positions[hx].end === sel.end) {
                                has = true;
                                break;
                            }
                        }
                        if (!has) {
                            var sn = textVal.slice(sel.start, sel.end);
                            var ok = caseSens ? sn === needle : sn.toLowerCase() === needle.toLowerCase();
                            if (ok) positions.push({ start: sel.start, end: sel.end });
                        }
                    }
                    for (var pi = 0; pi < positions.length; pi++) {
                        var p = positions[pi];
                        var isCur =
                            (p.start === sel.start && p.end === sel.end) ||
                            (sel.start === sel.end && sel.start >= p.start && sel.start < p.end);
                        findMarks.push(
                            cm.markText(cm.posFromIndex(p.start), cm.posFromIndex(p.end), {
                                className: "cm-find-hl" + (isCur ? " cm-find-hl-current" : "")
                            })
                        );
                    }
                };

                function replaceAllString(textVal, needle, repl, caseSens) {
                    if (!needle) return textVal;
                    var esc = needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                    var re = new RegExp(esc, caseSens ? "g" : "gi");
                    return textVal.replace(re, function () {
                        return repl;
                    });
                }

                function selectionMatchesFind(needle, caseSens) {
                    if (!needle) return false;
                    var s = cm.getRange(cm.getCursor("from"), cm.getCursor("to"));
                    return caseSens ? s === needle : s.toLowerCase() === needle.toLowerCase();
                }

                function updateFindCount() {
                    var needle = findInput.value;
                    if (!needle) {
                        findCountEl.textContent = "";
                        refreshFindHighlights();
                        return;
                    }
                    var TF = window.ToolFind;
                    var textVal = cm.getValue();
                    var caseSens = findCase.checked;
                    var total = TF
                        ? TF.countMatches(textVal, needle, caseSens, TF.MAX_COUNT)
                        : { count: 0, truncated: false };
                    if (!total.count && !total.truncated) {
                        findCountEl.textContent = "无匹配";
                        refreshFindHighlights();
                        return;
                    }
                    var o = cmGetSelOffsets();
                    var s0 = o.start;
                    var e0 = o.end;
                    var idx = -1;
                    if (findNavMatchIndex >= 0 && !(total.truncated && findNavMatchIndex >= total.count)) {
                        idx = findNavMatchIndex;
                    } else if (TF) {
                        var sn = textVal.slice(s0, e0);
                        var isMatch = caseSens ? sn === needle : sn.toLowerCase() === needle.toLowerCase();
                        if (isMatch) {
                            var before = TF.countMatchesBefore(textVal, needle, caseSens, s0, TF.MAX_COUNT);
                            if (!before.truncated) idx = before.count;
                        }
                    }
                    if (idx >= 0) findNavMatchIndex = idx;
                    findCountEl.textContent = TF
                        ? TF.formatCountLabel(idx >= 0 ? idx + 1 : "—", total.count, total.truncated)
                        : (idx >= 0 ? idx + 1 : "—") + " / " + total.count;
                    refreshFindHighlights();
                }

                                function findNext(keepFindFocus) {
                    var needle = findInput.value;
                    if (!needle) {
                        updateFindCount();
                        return;
                    }
                    var TF = window.ToolFind;
                    var textVal = cm.getValue();
                    var caseSens = findCase.checked;
                    var from = getFindAnchorOffsetForNext();
                    if (TF) {
                        var around = TF.findNext(textVal, needle, Math.max(0, from - needle.length), caseSens);
                        if (around && from > around.start && from <= around.end) from = around.end;
                    }
                    var p = TF ? TF.findNext(textVal, needle, from, caseSens) : null;
                    if (!p && TF) p = TF.findNext(textVal, needle, 0, caseSens);
                    if (!p) {
                        findCountEl.textContent = "无匹配";
                        refreshFindHighlights();
                        return;
                    }
                    if (TF) {
                        var before = TF.countMatchesBefore(textVal, needle, caseSens, p.start, TF.MAX_COUNT);
                        findNavMatchIndex = before.truncated ? -1 : before.count;
                    } else findNavMatchIndex = -1;
                    cmSetSelOffsets(p.start, p.end, !keepFindFocus);
                    if (keepFindFocus) findInput.focus();
                    updateFindCount();
                }

                                function findPrev(keepFindFocus) {
                    var needle = findInput.value;
                    if (!needle) {
                        updateFindCount();
                        return;
                    }
                    var TF = window.ToolFind;
                    var textVal = cm.getValue();
                    var caseSens = findCase.checked;
                    var from = getFindAnchorOffsetForPrev();
                    if (TF) {
                        var around = TF.findNext(textVal, needle, Math.max(0, from - needle.length), caseSens);
                        if (around && from > around.start && from < around.end) from = around.start;
                    }
                    var p = TF ? TF.findPrev(textVal, needle, from, caseSens) : null;
                    if (!p && TF) p = TF.findPrev(textVal, needle, textVal.length, caseSens);
                    if (!p) {
                        findCountEl.textContent = "无匹配";
                        refreshFindHighlights();
                        return;
                    }
                    if (TF) {
                        var before = TF.countMatchesBefore(textVal, needle, caseSens, p.start, TF.MAX_COUNT);
                        findNavMatchIndex = before.truncated ? -1 : before.count;
                    } else findNavMatchIndex = -1;
                    cmSetSelOffsets(p.start, p.end, !keepFindFocus);
                    if (keepFindFocus) findInput.focus();
                    updateFindCount();
                }

                                function openFind(withReplace) {
                    findBar.removeAttribute("hidden");
                    findReplaceRow.hidden = !withReplace;
                    resetFindNavigation();
                    var selText = getFindSelectionText();
                    if (selText) findInput.value = selText;
                    focusFindInput();
                    updateFindCount();
                }

                function closeFind() {
                    findBar.setAttribute("hidden", "");
                    findReplaceRow.hidden = true;
                    resetFindNavigation();
                    refreshFindHighlights();
                    cm.focus();
                }

                function replaceOne() {
                    var needle = findInput.value;
                    if (!needle) return;
                    if (!selectionMatchesFind(needle, findCase.checked)) {
                        findNext();
                        return;
                    }
                    cm.replaceSelection(replaceInput.value);
                    resetFindNavigation();
                    updateFindCount();
                }

                function replaceAll() {
                    var needle = findInput.value;
                    if (!needle) return;
                    var rep = replaceInput.value;
                    cm.setValue(replaceAllString(cm.getValue(), needle, rep, findCase.checked));
                    ta.value = cm.getValue();
                    resetFindNavigation();
                    updateFindCount();
                    updateStat();
                    toast("已全部替换");
                }

                cm.on("cursorActivity", function () {
                    if (findBar && !findBar.hidden && findInput && findInput.value) refreshFindHighlights();
                });

                document.getElementById("find-prev").addEventListener("click", function () {
                    findPrev(shouldKeepFindFocus());
                });
                document.getElementById("find-next").addEventListener("click", function () {
                    findNext(shouldKeepFindFocus());
                });
                document.getElementById("find-close").addEventListener("click", closeFind);
                findCase.addEventListener("change", function () {
                    resetFindNavigation();
                    updateFindCount();
                });
                var _findInputTimer = null;
                findInput.addEventListener("input", function () {
                    resetFindNavigation();
                    if (_findInputTimer) clearTimeout(_findInputTimer);
                    _findInputTimer = setTimeout(function () {
                        _findInputTimer = null;
                        updateFindCount();
                    }, 120);
                });
                document.getElementById("find-rep-one").addEventListener("click", replaceOne);
                document.getElementById("find-rep-all").addEventListener("click", replaceAll);

                findInput.addEventListener("keydown", function (e) {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        if (e.shiftKey) findPrev(true);
                        else findNext(true);
                    } else if (
                        (e.key === "ArrowUp" || e.key === "ArrowDown") &&
                        findInput.value &&
                        !e.ctrlKey &&
                        !e.metaKey &&
                        !e.altKey
                    ) {
                        e.preventDefault();
                        if (e.key === "ArrowUp") findPrev(true);
                        else findNext(true);
                    }
                });
                replaceInput.addEventListener("keydown", function (e) {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        replaceOne();
                    } else if (
                        (e.key === "ArrowUp" || e.key === "ArrowDown") &&
                        findInput.value &&
                        !e.ctrlKey &&
                        !e.metaKey &&
                        !e.altKey
                    ) {
                        e.preventDefault();
                        if (e.key === "ArrowUp") findPrev(true);
                        else findNext(true);
                    }
                });

                window.addEventListener(
                    "keydown",
                    function (e) {
                        var mod = e.ctrlKey || e.metaKey;
                        var k = String(e.key || "").toLowerCase();
                        if (mod && k === "f") {
                            e.preventDefault();
                            e.stopPropagation();
                            handleFindShortcut();
                            return;
                        }
                        if (mod && k === "h" && !e.shiftKey) {
                            e.preventDefault();
                            openFind(true);
                            return;
                        }
                        if (!findBar.hidden && e.key === "Escape") {
                            e.preventDefault();
                            closeFind();
                            return;
                        }
                        if (!findBar.hidden && e.key === "F3") {
                            e.preventDefault();
                            if (e.shiftKey) findPrev();
                            else findNext();
                            return;
                        }
                        if (handleFindArrowKey(e)) return;
                    },
                    true
                );

                function getSqlFormatFn() {
                    if (typeof window._sqlFormatFn === "function") {
                        return Promise.resolve(window._sqlFormatFn);
                    }
                    var s = window.sqlFormatter;
                    if (s && typeof s.format === "function") {
                        window._sqlFormatFn = s.format;
                        return Promise.resolve(window._sqlFormatFn);
                    }
                    return Promise.reject(
                        new Error("未加载 sql-formatter（请运行 npm install 生成 vendor/sql-formatter/sql-formatter.min.js）")
                    );
                }

                function doFormat() {
                    var text = cm.getValue();
                    if (!text.trim()) {
                        toast("请先输入内容");
                        return;
                    }
                    var ind = readIndent();
                    try {
                        if (kind === "json") {
                            cm.setValue(JSON.stringify(JSON.parse(text), null, ind.jsonThird));
                        } else if (kind === "xml") {
                            cm.setValue(formatXmlStr(text, ind.size));
                        } else if (kind === "sql") {
                            getSqlFormatFn()
                                .then(function (format) {
                                    try {
                                        var tw = ind.char === "\t" ? 1 : ind.size;
                                        if (!tw) tw = 2;
                                        var out = format(text, {
                                            language: sqlDialect.value || "sql",
                                            tabWidth: tw,
                                            useTabs: ind.char === "\t",
                                            keywordCase: "upper"
                                        });
                                        cm.setValue(out);
                                        updateStat();
                                        if (findBar && !findBar.hidden && findInput && findInput.value) {
                                            resetFindNavigation();
                                            updateFindCount();
                                        }
                                        toast("已格式化");
                                    } catch (inner) {
                                        toast("SQL 格式化失败：" + (inner.message || String(inner)));
                                    }
                                })
                                .catch(function (e) {
                                    toast("SQL 模块加载失败：" + (e.message || String(e)));
                                });
                            return;
                        } else if (kind === "javascript") {
                            var jb = typeof js_beautify === "function"
                                ? js_beautify
                                : window.js_beautify;
                            if (typeof jb !== "function") throw new Error("js-beautify 未加载");
                            var jbOpts = getBeautifyBase();
                            jbOpts.brace_style = "collapse";
                            jbOpts.space_before_conditional = true;
                            cm.setValue(jb(text, jbOpts));
                        } else if (kind === "css") {
                            if (typeof css_beautify !== "function") throw new Error("css-beautify 未加载");
                            cm.setValue(css_beautify(text, getBeautifyBase()));
                        } else if (kind === "html") {
                            if (typeof html_beautify !== "function") throw new Error("html-beautify 未加载");
                            cm.setValue(html_beautify(text, getBeautifyBase()));
                        }
                        updateStat();
                        if (findBar && !findBar.hidden && findInput && findInput.value) {
                            resetFindNavigation();
                            updateFindCount();
                        }
                        toast("已格式化");
                    } catch (e) {
                        toast("格式化失败：" + (e.message || String(e)));
                    }
                }

                function doMinify() {
                    var text = cm.getValue();
                    if (!text.trim()) {
                        toast("请先输入内容");
                        return;
                    }
                    var ind = readIndent();
                    try {
                        if (kind === "json") {
                            cm.setValue(JSON.stringify(JSON.parse(text)));
                        } else if (kind === "xml") {
                            cm.setValue(minifyXml(text));
                        } else if (kind === "sql") {
                            getSqlFormatFn()
                                .then(function (format) {
                                    try {
                                        var tw2 = ind.char === "\t" ? 1 : ind.size;
                                        if (!tw2) tw2 = 2;
                                        var pretty = format(text, {
                                            language: sqlDialect.value || "sql",
                                            tabWidth: tw2,
                                            useTabs: ind.char === "\t",
                                            keywordCase: "upper"
                                        });
                                        cm.setValue(
                                            pretty
                                                .split(/\r?\n/)
                                                .map(function (line) {
                                                    return line.trim();
                                                })
                                                .join(" ")
                                        );
                                        updateStat();
                                        if (findBar && !findBar.hidden && findInput && findInput.value) {
                                            resetFindNavigation();
                                            updateFindCount();
                                        }
                                        toast("已压缩为紧凑单行");
                                    } catch (inner) {
                                        toast("SQL 压缩失败：" + (inner.message || String(inner)));
                                    }
                                })
                                .catch(function (e) {
                                    toast("SQL 模块加载失败：" + (e.message || String(e)));
                                });
                            return;
                        } else if (kind === "javascript") {
                            var jbMin = typeof js_beautify === "function"
                                ? js_beautify
                                : window.js_beautify;
                            if (typeof jbMin !== "function") throw new Error("js-beautify 未加载");
                            cm.setValue(
                                jbMin(text, {
                                    indent_size: 0,
                                    indent_char: " ",
                                    preserve_newlines: false,
                                    max_preserve_newlines: 0,
                                    space_in_empty_paren: false,
                                    end_with_newline: false,
                                    brace_style: "collapse"
                                })
                            );
                        } else if (kind === "css") {
                            if (typeof css_beautify !== "function") throw new Error("css-beautify 未加载");
                            cm.setValue(
                                css_beautify(text, {
                                    indent_size: 0,
                                    indent_char: " ",
                                    preserve_newlines: false,
                                    newline_between_rules: false,
                                    end_with_newline: false
                                })
                            );
                        } else if (kind === "html") {
                            if (typeof html_beautify !== "function") throw new Error("html-beautify 未加载");
                            cm.setValue(
                                html_beautify(text, {
                                    indent_size: 0,
                                    indent_char: " ",
                                    preserve_newlines: false,
                                    max_preserve_newlines: 0,
                                    end_with_newline: false
                                })
                            );
                        }
                        updateStat();
                        if (findBar && !findBar.hidden && findInput && findInput.value) {
                            resetFindNavigation();
                            updateFindCount();
                        }
                        toast("已压缩");
                    } catch (e) {
                        toast("压缩失败：" + (e.message || String(e)));
                    }
                }

                function copyText() {
                    var v = cm.getValue();
                    if (!v) {
                        toast("没有可复制的内容");
                        return;
                    }
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(v).then(
                            function () {
                                toast("已复制到剪贴板");
                            },
                            function () {
                                fallbackCopy();
                            }
                        );
                    } else {
                        fallbackCopy();
                    }
                }

                function fallbackCopy() {
                    var v = cm.getValue();
                    if (!v) {
                        toast("没有可复制的内容");
                        return;
                    }
                    var t2 = document.createElement("textarea");
                    t2.value = v;
                    t2.setAttribute("readonly", "");
                    t2.style.position = "fixed";
                    t2.style.left = "-9999px";
                    document.body.appendChild(t2);
                    t2.select();
                    try {
                        document.execCommand("copy");
                        toast("已复制到剪贴板");
                    } catch (e) {
                        toast("复制失败");
                    }
                    document.body.removeChild(t2);
                }

                document.getElementById("fmt-tabs").addEventListener("click", function (e) {
                    var btn = e.target.closest("button[data-kind]");
                    if (!btn) return;
                    switchFormatKind(btn.getAttribute("data-kind") || "json");
                });

                document.getElementById("btn-format").addEventListener("click", doFormat);
                document.getElementById("btn-minify").addEventListener("click", doMinify);
                document.getElementById("btn-copy").addEventListener("click", copyText);
                document.getElementById("btn-qr").addEventListener("click", function () {
                    var text = cm.getValue();
                    if (!text.trim()) {
                        if (typeof ToolCopy !== "undefined") {
                            ToolCopy.toast("没有可生成二维码的内容");
                        } else {
                            toast("没有可生成二维码的内容");
                        }
                        return;
                    }
                    ToolQr.toggle(text, this);
                });
                document.getElementById("btn-clear").addEventListener("click", function () {
                    cm.setValue("");
                    var sh = getActiveSheet();
                    if (sh) sh.content = "";
                    ta.value = "";
                    updateStat();
                    if (findBar && !findBar.hidden) {
                        resetFindNavigation();
                        updateFindCount();
                    }
                    persistSheetsState();
                    if (window.ToolFormPersist && ToolFormPersist.saveNow) {
                        ToolFormPersist.saveNow();
                    }
                    toast("已清空当前工作表");
                });

                window.toolNavRestoreForm = restoreSheetsFromPersist;
                document.addEventListener("tool-nav:form-restored", restoreSheetsFromPersist);
                window.addEventListener("load", restoreSheetsFromPersist);

                sqlDialect.addEventListener("change", function () {
                    if (kind === "sql") {
                        cm.setOption("mode", dialectToMime(sqlDialect.value || "sql"));
                        cm.refresh();
                    }
                });

                selIndent.addEventListener("change", applyCmIndentFromReadIndent);

                function resizeCm() {
                    var wrap = ta.closest(".cm-editor-wrap");
                    if (!wrap || !cm) return;
                    cm.setSize(null, Math.max(120, wrap.clientHeight));
                    cm.refresh();
                }
                if (typeof ResizeObserver !== "undefined") {
                    var wrapEl = ta.closest(".cm-editor-wrap");
                    if (wrapEl) {
                        new ResizeObserver(resizeCm).observe(wrapEl);
                    }
                }
                window.addEventListener("load", resizeCm);
                window.addEventListener("resize", resizeCm);
                setTimeout(resizeCm, 0);

                cm.on("change", function () {
                    syncEditorToSheets();
                    schedulePersistSheets();
                    updateStat();
                    if (findBar && !findBar.hidden && findInput && findInput.value) refreshFindHighlights();
                });

                document.getElementById("btn-compare-diff").addEventListener("click", handoffSelectedSheetsToTextDiff);
                sheetAddBtn.addEventListener("click", addSheet);
                if (sheetTabsEl && window.ToolSheetTabsDrag) {
                    ToolSheetTabsDrag.attach({
                        container: sheetTabsEl,
                        isDragDisabled: function () {
                            return !!sheetRenameId;
                        },
                        onReorder: reorderSheet
                    });
                }

                initSheetsFromStorage();
                syncFmtTabsUi();
                applyActiveSheetToEditor();
                renderSheetTabs();
                persistSheetsState();
                updateStat();
            })();
        </script>
            <script src="libs/tool-form-persist.js"></script>
    </body>
</html>
