<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Base64 编解码</title>
        <link rel="stylesheet" href="libs/codec-page.css" />
    </head>
    <body>
        <div class="codec-page">
            <div class="codec-toolbar">
                <div class="codec-seg" role="tablist">
                    <button type="button" class="active" data-tab="enc">Base64 编码</button>
                    <button type="button" data-tab="dec">Base64 解码</button>
                </div>
            </div>
            <div class="codec-card">
                <div id="p-enc" class="codec-panel">
                    <div class="codec-panel-inner">
                        <div class="codec-io-top">
                            <h3>Base64 编码</h3>
                            <div class="codec-hint">UTF-8 文本或文件字节 → Base64；可选 URL-safe。</div>
                            <div class="codec-toolbar-inner">
                                <label><input type="checkbox" id="encUrlSafe" /> URL-safe（<code>-_</code> 替换 <code>+/</code>）</label>
                                <label><input type="file" id="encFile" /></label>
                            </div>
                            <div class="codec-lbl">输入（文本）</div>
                            <textarea id="encText" class="codec-ta codec-ta-grow" placeholder="文本；若选择了文件则优先使用文件字节"></textarea>
                        </div>
                        <div class="codec-io-bottom">
                            <div class="codec-lbl">Base64 输出</div>
                            <textarea id="encOut" class="codec-ta codec-ta-grow" readonly></textarea>
                        </div>
                    </div>
                </div>
                <div id="p-dec" class="codec-panel" hidden>
                    <div class="codec-panel-inner">
                        <div class="codec-io-top">
                            <h3>Base64 解码</h3>
                            <div class="codec-hint">兼容 Data URL；支持 URL-safe；按所选编码输出文本。</div>
                            <div class="codec-toolbar-inner">
                                <label><input type="checkbox" id="decUrlSafe" /> 输入为 URL-safe Base64</label>
                                <label>输出编码 <select id="decEnc" class="codec-select"><option value="utf-8">UTF-8</option><option value="latin1">Latin1</option><option value="utf-16le">UTF-16LE</option><option value="utf-16be">UTF-16BE</option></select></label>
                            </div>
                            <div class="codec-lbl">Base64 输入</div>
                            <textarea id="decB64" class="codec-ta codec-ta-grow" placeholder="Base64 或 data:...;base64,..."></textarea>
                        </div>
                        <div class="codec-io-bottom">
                            <div class="codec-lbl">解码文本</div>
                            <textarea id="decOut" class="codec-ta codec-ta-grow" readonly></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            (function () {
                var fileU8 = null;
                function u8ToB64(u8, urlSafe) {
                    var bin = "";
                    for (var i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
                    var b = btoa(bin);
                    if (urlSafe) return b.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
                    return b;
                }
                function normalizeB64Input(s, urlSafe) {
                    var t = (s || "").replace(/\s+/g, "");
                    if (/^data:[^;]+;base64,/i.test(t)) t = t.split(",").pop() || "";
                    if (urlSafe) t = t.replace(/-/g, "+").replace(/_/g, "/");
                    var pad = t.length % 4;
                    if (pad) t += "====".slice(pad);
                    return t;
                }
                function b64ToU8(s) {
                    var bin = atob(s);
                    var u8 = new Uint8Array(bin.length);
                    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
                    return u8;
                }
                function runEnc() {
                    var out = document.getElementById("encOut");
                    try {
                        var u8 = fileU8 || new TextEncoder().encode(document.getElementById("encText").value);
                        out.value = u8ToB64(u8, document.getElementById("encUrlSafe").checked);
                    } catch (e) {
                        out.value = "编码失败: " + (e && e.message ? e.message : e);
                    }
                }
                function runDec() {
                    var out = document.getElementById("decOut");
                    try {
                        var t = normalizeB64Input(document.getElementById("decB64").value, document.getElementById("decUrlSafe").checked);
                        if (!t) {
                            out.value = "";
                            return;
                        }
                        var u8 = b64ToU8(t);
                        var enc = document.getElementById("decEnc").value;
                        out.value = new TextDecoder(enc, { fatal: false }).decode(u8);
                    } catch (e) {
                        out.value = "解码失败: " + (e && e.message ? e.message : e);
                    }
                }
                document.getElementById("encText").addEventListener("input", function () {
                    fileU8 = null;
                    runEnc();
                });
                document.getElementById("encUrlSafe").addEventListener("change", runEnc);
                document.getElementById("encFile").addEventListener("change", function (ev) {
                    var f = ev.target.files && ev.target.files[0];
                    fileU8 = null;
                    if (!f) {
                        runEnc();
                        return;
                    }
                    var r = new FileReader();
                    r.onload = function () {
                        fileU8 = new Uint8Array(r.result);
                        runEnc();
                    };
                    r.readAsArrayBuffer(f);
                });
                document.getElementById("decB64").addEventListener("input", runDec);
                document.getElementById("decUrlSafe").addEventListener("change", runDec);
                document.getElementById("decEnc").addEventListener("change", runDec);
                document.querySelectorAll(".codec-seg button").forEach(function (btn) {
                    btn.addEventListener("click", function () {
                        document.querySelectorAll(".codec-seg button").forEach(function (b) {
                            b.classList.toggle("active", b === btn);
                        });
                        var t = btn.getAttribute("data-tab");
                        document.getElementById("p-enc").hidden = t !== "enc";
                        document.getElementById("p-dec").hidden = t !== "dec";
                    });
                });
                runEnc();
                runDec();
            })();
            document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
        </script>
    </body>
</html>
