<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>证件照冲印排版</title>
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                --bg: #f3f7ff;
                --card: #fff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
                --foot-bg: #f8fbff;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                font-size: 15px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
            }
            .page {
                height: 100%;
                max-height: 100%;
                box-sizing: border-box;
                padding: 6px 8px;
                display: flex;
                flex-direction: column;
                gap: 6px;
                min-height: 0;
                overflow: hidden;
            }
            .toolbar {
                flex: 0 1 auto;
                min-height: 0;
                max-height: min(22%, 200px);
                overflow-y: auto;
                overflow-x: hidden;
                -webkit-overflow-scrolling: touch;
                display: flex;
                flex-wrap: wrap;
                gap: 6px 8px;
                align-items: flex-start;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
                box-shadow: var(--shadow);
                padding: 6px 8px;
            }
            .toolbar label,
            .single-preview-root label {
                display: flex;
                flex-direction: column;
                gap: 2px;
                font-size: 13px;
                color: #324a76;
            }
            .toolbar select,
            .toolbar input[type="text"],
            .toolbar input[type="number"],
            .single-preview-root select,
            .single-preview-root input[type="text"],
            .single-preview-root input[type="number"] {
                border: 1px solid #cfdcf7;
                border-radius: 4px;
                padding: 3px 6px;
                font-size: 14px;
                min-width: 88px;
            }
            #presetSel {
                min-width: 0;
                width: 100%;
                max-width: min(420px, 100%);
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 4px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 4px 10px;
                font-size: 14px;
                cursor: pointer;
                align-self: flex-end;
            }
            .btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .btn-primary {
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
                color: #fff;
                border-color: transparent;
            }
            .btn-primary:hover {
                color: #fff;
                opacity: 0.95;
            }
            .btn.btn-primary {
                align-self: center;
            }
            .drop {
                border: 1px dashed #cfdcf7;
                border-radius: 6px;
                padding: 6px 10px;
                background: #fcfdff;
                cursor: pointer;
                font-size: 14px;
                color: var(--muted);
                min-width: 140px;
            }
            .drop:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            input[type="file"] {
                display: none;
            }
            .hint {
                font-size: 13px;
                color: var(--muted);
                line-height: 1.35;
                margin: 0;
                max-width: 56em;
            }
            .toolbar-inner {
                display: flex;
                flex-direction: column;
                gap: 6px;
                width: 100%;
                min-width: 0;
            }
            .toolbar-section {
                border: 1px solid #e8eefc;
                border-radius: 6px;
                padding: 6px 8px;
                background: #fbfcff;
            }
            .toolbar-section-hd {
                font-size: 13px;
                font-weight: 600;
                color: #5a6f94;
                letter-spacing: 0.02em;
                margin-bottom: 4px;
                line-height: 1.2;
            }
            .toolbar-fields {
                display: flex;
                flex-wrap: wrap;
                gap: 6px 8px;
                align-items: flex-end;
            }
            .toolbar-fields label {
                min-width: 0;
            }
            .toolbar-fields .field-grow {
                flex: 1 1 160px;
                min-width: 120px;
            }
            .toolbar-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
            }
            .toolbar-upload-row {
                display: flex;
                flex-wrap: wrap;
                gap: 6px 10px;
                align-items: center;
            }
            .custom-size-row {
                display: none;
                flex-wrap: wrap;
                gap: 6px 8px;
                align-items: flex-end;
                margin-top: 4px;
                padding-top: 4px;
                border-top: 1px dashed #dbe6ff;
            }
            .custom-size-row.is-on {
                display: flex;
            }
            .custom-size-row input[type="number"] {
                width: 88px;
            }
            #customMmHint {
                font-size: 13px;
                color: var(--muted);
                align-self: center;
            }
            .main {
                flex: 1 1 0%;
                min-height: 0;
                display: flex;
                flex-direction: row;
                gap: 6px;
                overflow: hidden;
            }
            .panel {
                flex: 1 1 0;
                min-width: 0;
                min-height: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .panel-bd {
                flex: 1 1 0%;
                min-height: 0;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }
            .panel-hd {
                padding: 5px 8px;
                font-weight: 600;
                font-size: 14px;
                color: #324a76;
                background: var(--foot-bg);
                border-bottom: 1px solid #e4edff;
                flex-shrink: 0;
            }
            .panel-bd--layout {
                align-items: stretch;
            }
            .panel-hd-with-meta {
                display: flex;
                align-items: baseline;
                flex-wrap: wrap;
                gap: 4px 10px;
            }
            .panel-hd-title {
                flex-shrink: 0;
            }
            .panel-hd-meta {
                font-weight: 500;
                font-size: 13px;
                color: var(--muted);
                line-height: 1.35;
                word-break: break-all;
            }
            .single-preview-root {
                width: 100%;
                flex: 1 1 auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .single-band {
                flex-shrink: 0;
                width: 100%;
            }
            .single-band--spec {
                padding: 4px 6px;
                border: 1px solid #e8eefc;
                border-radius: 6px;
                background: #fbfcff;
            }
            .single-band--spec .toolbar-fields {
                align-items: flex-end;
            }
            .single-mid {
                flex: 1 1 0%;
                min-height: 0;
                width: 100%;
                display: flex;
                flex-direction: row;
                align-items: stretch;
                gap: 8px;
            }
            .single-compose-rail {
                flex: 0 0 auto;
                width: 200px;
                max-width: 42%;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 4px;
                padding: 4px 6px;
                border: 1px solid #e8eefc;
                border-radius: 6px;
                background: #fbfcff;
                overflow-y: auto;
                overflow-x: hidden;
                -webkit-overflow-scrolling: touch;
            }
            .single-compose-rail .band-lab {
                font-size: 12px;
                font-weight: 600;
                color: #5a6f94;
                margin-bottom: 2px;
            }
            .single-compose-rail .btn {
                align-self: stretch;
                margin-top: 2px;
            }
            .single-preview-root .preview-stage-wrap {
                flex: 1 1 0%;
                min-width: 0;
                justify-content: center;
                align-items: center;
            }
            #previewWrap {
                width: 100%;
                text-align: center;
                flex: 1 1 auto;
                min-height: 0;
                overflow: auto;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            #previewCanvas {
                max-width: 100%;
                width: auto;
                height: auto;
                max-height: min(64vh, 560px);
                max-height: min(64dvh, 560px);
                border: 1px solid #e4edff;
                border-radius: 6px;
                background: #eee;
            }
            #singlePreview {
                display: block;
                max-width: 100%;
                width: auto;
                height: auto;
                max-height: min(64vh, 520px);
                max-height: min(64dvh, 520px);
                object-fit: contain;
                border: 1px solid #e4edff;
                border-radius: 6px;
                background: #eee;
                vertical-align: top;
                pointer-events: auto;
            }
            .preview-stage-wrap {
                width: 100%;
                text-align: center;
                flex: 1 1 auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                overflow: auto;
            }
            .preview-tip {
                font-size: 13px;
                color: var(--muted);
                margin: 0 0 4px;
                line-height: 1.3;
                flex-shrink: 0;
            }
            .preview-stage {
                position: relative;
                display: inline-block;
                max-width: 100%;
                max-height: 100%;
                touch-action: none;
                user-select: none;
                -webkit-user-select: none;
            }
            .preview-stage.is-panning {
                cursor: grabbing;
            }
            .preview-stage.is-rotating {
                cursor: crosshair;
            }
            .preview-stage.can-interact:not(.is-panning):not(.is-rotating) {
                cursor: grab;
            }
            .rotate-handle {
                position: absolute;
                top: 2px;
                right: 2px;
                width: 26px;
                height: 26px;
                border-radius: 50%;
                border: 1px solid #d8e5ff;
                background: rgba(255, 255, 255, 0.94);
                box-shadow: 0 2px 10px rgba(36, 90, 190, 0.15);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: grab;
                z-index: 3;
                padding: 0;
                margin: 0;
            }
            .rotate-handle:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .rotate-handle:disabled {
                opacity: 0.35;
                cursor: default;
                pointer-events: none;
            }
            .layout-meta-bar {
                flex-shrink: 0;
                padding: 8px 10px;
                font-size: 14px;
                line-height: 1.45;
                color: #324a76;
                background: var(--foot-bg);
                border-top: 1px solid #e4edff;
                text-align: center;
            }
            .toolbar-actions-inline {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: flex-end;
            }
            .err {
                color: #c62828;
                font-size: 15px;
                padding: 4px 0;
                flex-shrink: 0;
            }
            .row-inline {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: flex-end;
            }
            @media (max-width: 900px) {
                .main {
                    flex-direction: column;
                }
                .single-mid {
                    flex-direction: column;
                }
                .single-compose-rail {
                    width: 100%;
                    max-width: none;
                    flex-direction: row;
                    flex-wrap: wrap;
                    align-items: flex-end;
                }
                .single-compose-rail .band-lab {
                    width: 100%;
                }
                .single-compose-rail label {
                    flex: 1 1 120px;
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="toolbar">
                <div class="toolbar-inner">
                    <div class="toolbar-section" style="background: #fff">
                        <div class="toolbar-upload-row">
                            <div>
                                <input type="file" id="fileIn" accept="image/*" />
                                <button type="button" class="drop" id="btnPick" title="支持 JPG / PNG 等">点击上传证件照</button>
                            </div>
                            <p class="hint">
                                本地处理；单张可拖拽/滚轮/右上旋转；排版实时（需上传照片）。
                            </p>
                        </div>
                    </div>
                    <div class="toolbar-section">
                        <div class="toolbar-section-hd">冲印 / 排版</div>
                        <div class="toolbar-fields">
                            <label>
                                相纸
                                <select id="paperSel"></select>
                            </label>
                            <label>
                                DPI
                                <select id="dpiSel">
                                    <option value="300" selected>300</option>
                                    <option value="200">200</option>
                                </select>
                            </label>
                            <label>
                                边距 mm
                                <input type="number" id="marginMm" value="4" min="0" max="20" step="0.5" />
                            </label>
                            <label>
                                间距 mm
                                <input type="number" id="gapMm" value="2" min="0" max="10" step="0.5" />
                            </label>
                            <label style="flex-direction: row; align-items: center; gap: 4px; align-self: center">
                                <input type="checkbox" id="chkCut" checked />
                                裁切线
                            </label>
                            <div class="toolbar-actions-inline">
                                <button type="button" class="btn" id="btnToPhotoBg" disabled title="将当前证件照带入换底色工具">🎨 换底色</button>
                                <button type="button" class="btn btn-primary" id="btnDl" disabled>下载 PNG</button>
                                <button type="button" class="btn btn-primary" id="btnPrint" disabled>打印排版</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="err" id="errBox" style="display: none"></div>
            <div class="main">
                <section class="panel">
                    <div class="panel-hd panel-hd-with-meta">
                        <span class="panel-hd-title">单张预览</span>
                        <span class="panel-hd-meta" id="singlePanelMeta"></span>
                    </div>
                    <div class="panel-bd">
                        <canvas id="singleCanvas" width="295" height="413" style="display: none"></canvas>
                        <div class="single-preview-root">
                            <div class="single-band single-band--spec">
                                <div class="toolbar-fields">
                                    <label class="field-grow">
                                        规格
                                        <select id="presetSel"></select>
                                    </label>
                                    <label id="overlayWrap" style="display: none" class="field-grow">
                                        <span id="overlayLabel">底部加字</span>
                                        <input type="text" id="overlayText" name="overlayText" placeholder="可选，如姓名" maxlength="24" autocomplete="off" style="min-width: 0; width: 100%" />
                                    </label>
                                </div>
                                <div id="customSizeRow" class="custom-size-row">
                                    <label>
                                        宽 px
                                        <input type="number" id="customW" min="1" max="4000" value="295" step="1" />
                                    </label>
                                    <label>
                                        高 px
                                        <input type="number" id="customH" min="1" max="4000" value="413" step="1" />
                                    </label>
                                    <span id="customMmHint"></span>
                                </div>
                            </div>
                            <div class="single-mid">
                                <div class="single-compose-rail">
                                    <span class="band-lab">构图</span>
                                    <label>
                                        绘入
                                        <select id="fitSel" title="完整显示：缩小以露出底色；铺满裁切：放大裁切">
                                            <option value="contain" selected>完整显示</option>
                                            <option value="cover">铺满裁切</option>
                                        </select>
                                    </label>
                                    <label>
                                        旋转
                                        <select id="rotSel">
                                            <option value="0" selected>0°</option>
                                            <option value="90">90°</option>
                                            <option value="180">180°</option>
                                            <option value="270">270°</option>
                                            <option value="custom">自定义</option>
                                        </select>
                                    </label>
                                    <label>
                                        角度 °
                                        <input type="number" id="rotDegIn" value="0" step="0.1" min="-720" max="720" style="width: 100%" title="与拖拽旋转同步" />
                                    </label>
                                    <label>
                                        缩放 <span id="zoomLab">100%</span>
                                        <input type="range" id="zoomR" min="50" max="200" value="100" step="1" style="width: 100%" />
                                    </label>
                                    <label>
                                        左右
                                        <input type="range" id="panXR" min="-45" max="45" value="0" step="1" style="width: 100%" />
                                    </label>
                                    <label>
                                        上下
                                        <input type="range" id="panYR" min="-45" max="45" value="0" step="1" style="width: 100%" />
                                    </label>
                                    <button type="button" class="btn" id="btnResetView" title="缩放、平移、旋转恢复默认">重置</button>
                                </div>
                                <div class="preview-stage-wrap">
                                    <p class="preview-tip" id="previewTip" style="display: none">拖拽平移 · 滚轮缩放 · 右上旋转</p>
                                    <div class="preview-stage" id="singleStage">
                                        <img id="singlePreview" alt="单张预览" style="display: none" draggable="false" />
                                        <button type="button" class="rotate-handle" id="rotateHandle" title="按住左键拖拽旋转" aria-label="旋转">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                                <path d="M12 5v4M12 15v4M5 12H1M23 12h-4" />
                                                <path d="M7 7a7 7 0 1 1 3 13" />
                                                <path d="M17 17l2 2" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <section class="panel" style="flex: 1.4 1 0%">
                    <div class="panel-hd">排版预览</div>
                    <div class="panel-bd panel-bd--layout">
                        <div id="previewWrap">
                            <canvas id="previewCanvas" style="display: none"></canvas>
                        </div>
                        <div class="layout-meta-bar" id="layoutMetaBar"></div>
                    </div>
                </section>
            </div>
        </div>
        <script>
            (function () {
                var CUSTOM_PRESET_ID = "custom";
                var DEFAULT_PRINT_BG = "#438edb";
                var PRESETS = [
                    { id: "y1", name: "一寸", w: 295, h: 413, set: "all6", text: false },
                    { id: "e2", name: "二寸", w: 413, h: 579, set: "all6", text: false },
                    { id: "xe2", name: "小二寸", w: 413, h: 531, set: "all6", text: false },
                    { id: "xy1", name: "小一寸", w: 260, h: 378, set: "all6", text: false },
                    { id: "dy1", name: "大一寸", w: 390, h: 567, set: "all6", text: false },
                    { id: "w5", name: "五寸 / 3R", w: 1051, h: 1500, set: "all6", text: false },
                    { id: "s3", name: "三寸", w: 650, h: 992, set: "all6", text: false },
                    { id: "y1t", name: "一寸（可加字）", w: 295, h: 413, set: "all6", text: true },
                    { id: "e2m", name: "二寸（2M～5M）", w: 413, h: 579, set: "all6", text: false },
                    { id: "de2t", name: "大二寸（可加字）", w: 413, h: 626, set: "threeBRW", text: true },
                    { id: "s4", name: "四寸（小四寸）", w: 898, h: 1205, set: "all6", text: false },
                    { id: "y1mj", name: "一寸（门禁系统）", w: 295, h: 413, set: "access", text: false },
                    { id: "e2t", name: "二寸（可加字）", w: 413, h: 579, set: "all6", text: true },
                    { id: "de2", name: "大二寸", w: 413, h: 626, set: "all6", text: false },
                    { id: "dy1t", name: "大一寸（可加字）", w: 390, h: 567, set: "all6", text: true },
                    { id: "w5t", name: "五寸（可加字）", w: 1051, h: 1500, set: "all6", text: true },
                ];
                var PAPERS = [
                    { id: "r3", label: "五寸相纸（3R｜12.7×8.9cm）", wcm: 12.7, hcm: 8.9 },
                    { id: "r4", label: "六寸相纸（4R｜15.2×10.2cm）", wcm: 15.2, hcm: 10.2 },
                    { id: "r5", label: "七寸相纸（5R｜17.8×12.7cm）", wcm: 17.8, hcm: 12.7 },
                    { id: "r6", label: "八寸相纸（6R｜20.3×15.2cm）", wcm: 20.3, hcm: 15.2 },
                    { id: "r8", label: "十寸相纸（8R｜25.4×20.3cm）", wcm: 25.4, hcm: 20.3 },
                    { id: "r12", label: "十二寸相纸（25.4×30.48cm）", wcm: 25.4, hcm: 30.48 },
                    { id: "a4", label: "A4 纸（21.0×29.7cm）", wcm: 21.0, hcm: 29.7 },
                ];

                var img = null;
                /** 连续旋转角度（°），与下拉「自定义」、角度输入框、拖拽手柄同步 */
                var viewRotDeg = 0;
                /** 用户显式选了「自定义」时，在角度仍贴近快捷值前保持该项，避免被 sync 改回 0°/90°… */
                var rotUserPickedCustom = false;
                var stageDrag = null;
                var layoutCanvas = null;
                var lastPaperPx = { w: 0, h: 0 };
                var layoutRefreshTimer = null;
                var lastPresetIdBeforeCustom = "y1";

                function clamp(n, lo, hi) {
                    return Math.max(lo, Math.min(hi, n));
                }

                function pxToMm(px, dpi) {
                    return (px / dpi) * 25.4;
                }

                function formatMmPair(wPx, hPx, dpi) {
                    var a = Math.round(pxToMm(wPx, dpi) * 10) / 10;
                    var b = Math.round(pxToMm(hPx, dpi) * 10) / 10;
                    return a + "×" + b;
                }

                function presetOptionText(p, dpi) {
                    var mm = formatMmPair(p.w, p.h, dpi);
                    var tail = p.text ? " · 可加字" : "";
                    return p.name + " · " + p.w + "×" + p.h + " px · " + mm + " mm @" + dpi + " DPI" + tail;
                }

                function customPresetOptionText(dpi) {
                    var cw = clamp(parseInt(document.getElementById("customW").value, 10) || 295, 1, 4000);
                    var ch = clamp(parseInt(document.getElementById("customH").value, 10) || 413, 1, 4000);
                    var mm = formatMmPair(cw, ch, dpi);
                    return "自定义 · " + cw + "×" + ch + " px · " + mm + " mm @" + dpi + " DPI · 可加字";
                }

                function updatePresetSelectLabels() {
                    var dpi = getDpi();
                    var sel = document.getElementById("presetSel");
                    for (var i = 0; i < sel.options.length; i++) {
                        var o = sel.options[i];
                        if (o.value === CUSTOM_PRESET_ID) o.textContent = customPresetOptionText(dpi);
                        else {
                            for (var j = 0; j < PRESETS.length; j++) {
                                if (PRESETS[j].id === o.value) {
                                    o.textContent = presetOptionText(PRESETS[j], dpi);
                                    break;
                                }
                            }
                        }
                    }
                    updateSinglePanelMeta();
                }

                function updateSinglePanelMeta() {
                    var el = document.getElementById("singlePanelMeta");
                    if (!el) return;
                    var p = getPreset();
                    var dpi = getDpi();
                    var mm = formatMmPair(p.w, p.h, dpi);
                    var nm = p.id === CUSTOM_PRESET_ID ? "自定义" : p.name || "";
                    el.textContent = "· " + nm + " " + p.w + "×" + p.h + " px · " + mm + " mm @" + dpi + " DPI";
                }

                function syncCustomSizeRow() {
                    var on = document.getElementById("presetSel").value === CUSTOM_PRESET_ID;
                    document.getElementById("customSizeRow").className = "custom-size-row" + (on ? " is-on" : "");
                    var dpi = getDpi();
                    var cw = clamp(parseInt(document.getElementById("customW").value, 10) || 295, 1, 4000);
                    var ch = clamp(parseInt(document.getElementById("customH").value, 10) || 413, 1, 4000);
                    document.getElementById("customMmHint").textContent = "≈ " + formatMmPair(cw, ch, dpi) + " mm（宽×高，按当前冲印 DPI）";
                }

                function showErr(msg) {
                    var el = document.getElementById("errBox");
                    if (!msg) {
                        el.style.display = "none";
                        el.textContent = "";
                        el.style.color = "";
                        return;

                    el.style.display = "block";
                    el.style.color = "#c62828";
                    el.textContent = msg;
                }

                var HANDOFF_PRINT_KEY = "tool-nav:handoff:photo-to-print";
                var HANDOFF_DEFAULT_PRESET_ID = "y1";

                function applyPresetFromPhotoHandoff() {
                    var sel = document.getElementById("presetSel");
                    sel.value = HANDOFF_DEFAULT_PRESET_ID;
                    lastPresetIdBeforeCustom = HANDOFF_DEFAULT_PRESET_ID;
                    syncCustomSizeRow();
                    updatePresetSelectLabels();
                    refreshPresetUi();
                }

                function consumeHandoffPayload(payload) {
                    if (!payload || !payload.dataUrl) return false;
                    if (payload.ts && Date.now() - payload.ts > 5 * 60 * 1000) {
                        clearHandoffStorage();
                        showErr("换底色带入的数据已过期，请重新在换底色工具中点击「冲印排版」。");
                        return false;
                    }
                    clearHandoffStorage();
                    applyPresetFromPhotoHandoff();
                    var im = new Image();
                    im.onload = function () {
                        img = im;
                        showErr("");
                        resetViewControls();
                        drawSingle();
                        scheduleLayoutRefresh(true);
                        var hint = payload.presetLabel ? "已从换底色载入（" + payload.presetLabel + "）" : "已从换底色工具载入证件照";
                        var errEl = document.getElementById("errBox");
                        errEl.style.display = "block";
                        errEl.style.color = "#0d6b4a";
                        errEl.textContent = hint;
                    };
                    im.onerror = function () {
                        showErr("换底色带入的图片无法解析。");
                    };
                    im.src = payload.dataUrl;
                    return true;
                }

                function readHandoffFromStorage() {
                    var raw = null;
                    try {
                        raw = sessionStorage.getItem(HANDOFF_PRINT_KEY);
                    } catch (e1) {
                        // ignore
                    }
                    if (!raw) {
                        try {
                            raw = localStorage.getItem(HANDOFF_PRINT_KEY);
                        } catch (e2) {
                            // ignore
                        }
                    }
                    if (!raw) return null;
                    try {
                        return JSON.parse(raw);
                    } catch (e3) {
                        return null;
                    }
                }

                function clearHandoffStorage() {
                    try {
                        sessionStorage.removeItem(HANDOFF_PRINT_KEY);
                    } catch (e1) {
                        // ignore
                    }
                    try {
                        localStorage.removeItem(HANDOFF_PRINT_KEY);
                    } catch (e2) {
                        // ignore
                    }
                }

                function consumeHandoffFromPhotoBg(inlinePayload) {
                    var payload = inlinePayload;
                    if (!payload) payload = readHandoffFromStorage();
                    if (!payload) return;
                    clearHandoffStorage();
                    consumeHandoffPayload(payload);
                }

                window.addEventListener("message", function (e) {
                    var d = e.data;
                    if (!d || d.type !== "tool-nav:consume-handoff") return;
                    if (d.handoff === "photo-to-print") {
                        consumeHandoffFromPhotoBg(d.payload || null);
                    }
                });

                function getDpi() {
                    return parseInt(document.getElementById("dpiSel").value, 10) || 300;
                }

                function cmToPx(cm, dpi) {
                    return Math.round((cm / 2.54) * dpi);
                }

                function mmToPx(mm, dpi) {
                    return (mm / 25.4) * dpi;
                }

                function getPreset() {
                    var id = document.getElementById("presetSel").value;
                    if (id === CUSTOM_PRESET_ID) {
                        var cw = clamp(parseInt(document.getElementById("customW").value, 10) || 295, 1, 4000);
                        var ch = clamp(parseInt(document.getElementById("customH").value, 10) || 413, 1, 4000);
                        return { id: CUSTOM_PRESET_ID, name: "自定义", w: cw, h: ch, set: "all6", text: true };
                    }
                    for (var i = 0; i < PRESETS.length; i++) if (PRESETS[i].id === id) return PRESETS[i];
                    return PRESETS[0];
                }

                function getPaperPx() {
                    var dpi = getDpi();
                    var id = document.getElementById("paperSel").value;
                    for (var i = 0; i < PAPERS.length; i++) {
                        if (PAPERS[i].id === id) {
                            return {
                                w: cmToPx(PAPERS[i].wcm, dpi),
                                h: cmToPx(PAPERS[i].hcm, dpi),
                                label: PAPERS[i].label,
                                wcm: PAPERS[i].wcm,
                                hcm: PAPERS[i].hcm,
                            };
                        }
                    }
                    return { w: cmToPx(15.2, dpi), h: cmToPx(10.2, dpi), label: "", wcm: 15.2, hcm: 10.2 };
                }

                function formatLayoutDateTime(now) {
                    var d = now || new Date();
                    var pad = function (n) {
                        return n < 10 ? "0" + n : String(n);
                    };
                    return (
                        d.getFullYear() +
                        "-" +
                        pad(d.getMonth() + 1) +
                        "-" +
                        pad(d.getDate()) +
                        " " +
                        pad(d.getHours()) +
                        ":" +
                        pad(d.getMinutes()) +
                        ":" +
                        pad(d.getSeconds())
                    );
                }

                function layoutPaperSizeText(paperPx, dpi) {
                    if (!paperPx || paperPx.wcm == null || paperPx.hcm == null) return "";
                    return "打印尺寸 " + paperPx.wcm + "×" + paperPx.hcm + " cm · " + dpi + " DPI · 画布 " + paperPx.w + "×" + paperPx.h + " px";
                }

                function layoutSizeCaptionText(paperPx, dpi) {
                    var base = layoutPaperSizeText(paperPx, dpi);
                    if (!base) return "";
                    return base + " · " + formatLayoutDateTime();
                }

                function updateLayoutMetaBar() {
                    var el = document.getElementById("layoutMetaBar");
                    if (!el) return;
                    var p = getPaperPx();
                    el.textContent = layoutSizeCaptionText(p, getDpi()) || "请选择相纸与 DPI。";
                }

                function setLayoutExportEnabled(on) {
                    document.getElementById("btnDl").disabled = !on;
                    document.getElementById("btnPrint").disabled = !on;
                }

                var HANDOFF_TO_PHOTO_BG_KEY = "tool-nav:handoff:print-to-photo-bg";
                var HANDOFF_PHOTO_BG_TAB = "tab38";

                function buildOriginalImageHandoffPayload() {
                    var iw = img.naturalWidth || img.width;
                    var ih = img.naturalHeight || img.height;
                    if (!iw || !ih) return null;
                    var c = document.createElement("canvas");
                    c.width = iw;
                    c.height = ih;
                    var ctx = c.getContext("2d");
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = "high";
                    ctx.drawImage(img, 0, 0, iw, ih);
                    return {
                        dataUrl: c.toDataURL("image/png"),
                        ts: Date.now(),
                        width: iw,
                        height: ih,
                        from: "print",
                        source: "original"
                    };
                }

                function handoffToPhotoBg() {
                    if (!img) {
                        showErr("请先上传证件照");
                        return;
                    }
                    try {
                        var payload = buildOriginalImageHandoffPayload();
                        if (!payload) {
                            showErr("无法读取原图，请重新上传后重试");
                            return;
                        }
                        try {
                            sessionStorage.setItem(HANDOFF_TO_PHOTO_BG_KEY, JSON.stringify(payload));
                        } catch (storageErr) {
                            // file:// 下 iframe 间 sessionStorage 可能不互通
                        }
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage(
                                {
                                    type: "tool-nav:open-tool",
                                    toolId: HANDOFF_PHOTO_BG_TAB,
                                    handoff: "print-to-photo-bg",
                                    payload: payload
                                },
                                "*"
                            );
                        } else {
                            try {
                                localStorage.setItem(HANDOFF_TO_PHOTO_BG_KEY, JSON.stringify(payload));
                            } catch (storageErr2) {
                                // ignore
                            }
                            window.location.href = "../index.html#tab=" + HANDOFF_PHOTO_BG_TAB;
                        }
                        var errEl = document.getElementById("errBox");
                        errEl.style.display = "block";
                        errEl.style.color = "#0d6b4a";
                        errEl.textContent = "已带入换底色工具，正在切换…";
                    } catch (e) {
                        showErr("带入换底色失败：" + (e && e.message ? e.message : String(e)));
                    }
                }

                function drawLayoutCaptionOnCanvas(ctx, paperPx, dpi, grid, cw, ch, gapPx, marginPx) {
                    if (!paperPx || paperPx.wcm == null || paperPx.hcm == null) return;
                    var pw = paperPx.w,
                        ph = paperPx.h;
                    var line1 = layoutPaperSizeText(paperPx, dpi);
                    var line2 = formatLayoutDateTime();
                    var gridBottom = grid.oy + grid.rows * ch + Math.max(0, grid.rows - 1) * gapPx;
                    var availBelow = ph - marginPx - gridBottom;
                    var availAbove = grid.oy - marginPx;
                    var fs = Math.round(clamp((dpi / 300) * 15, 12, Math.min(pw, ph) / 17));
                    var lineH = fs * 1.4;
                    var blockH = lineH * 2;
                    var y;
                    ctx.save();
                    ctx.font = "600 " + fs + 'px "Microsoft YaHei","PingFang SC",sans-serif';
                    ctx.fillStyle = "rgba(48, 70, 110, 0.9)";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    if (availBelow >= blockH + 6) {
                        y = gridBottom + availBelow / 2;
                    } else if (availAbove >= blockH + 6) {
                        y = marginPx + availAbove / 2;
                    } else {
                        fs = Math.max(10, Math.floor(fs * 0.7));
                        lineH = fs * 1.4;
                        blockH = lineH * 2;
                        ctx.font = "600 " + fs + 'px "Microsoft YaHei","PingFang SC",sans-serif';
                        ctx.shadowColor = "rgba(255,255,255,0.9)";
                        ctx.shadowBlur = Math.max(2, Math.round(fs * 0.35));
                        y = ph - Math.max(8, marginPx * 0.4) - lineH * 0.5;
                    }
                    ctx.fillText(line1, pw / 2, y - lineH * 0.5);
                    ctx.fillText(line2, pw / 2, y + lineH * 0.5);
                    ctx.restore();
                }

                function drawPlaceholderLayoutCaption(ctx, paperPx, dpi) {
                    if (!paperPx || paperPx.wcm == null || paperPx.hcm == null) return;
                    var pw = paperPx.w,
                        ph = paperPx.h;
                    var line1 = layoutPaperSizeText(paperPx, dpi);
                    var line2 = formatLayoutDateTime();
                    var fs = Math.max(14, Math.min(40, Math.floor(Math.min(pw, ph) / 18)));
                    var lineH = fs * 1.35;
                    var bottom = ph - Math.max(10, fs);
                    ctx.save();
                    ctx.font = "600 " + fs + 'px "Microsoft YaHei","PingFang SC",sans-serif';
                    ctx.fillStyle = "rgba(48, 70, 110, 0.88)";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "bottom";
                    ctx.fillText(line2, pw / 2, bottom);
                    ctx.fillText(line1, pw / 2, bottom - lineH);
                    ctx.restore();
                }

                function refreshPresetUi() {
                    var p = getPreset();
                    document.getElementById("overlayWrap").style.display = p.text ? "flex" : "none";
                    var ol = document.getElementById("overlayLabel");
                    if (ol) ol.textContent = p.id === CUSTOM_PRESET_ID ? "底部加字（可选）" : "底部加字";
                    syncCustomSizeRow();
                    updateSinglePanelMeta();
                    drawSingle();
                    requestAnimationFrame(function () {
                        scheduleLayoutRefresh(true);
                    });
                }

                function luminance(hex) {
                    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
                    if (!m) return 0.5;
                    var r = parseInt(m[1], 16) / 255,
                        g = parseInt(m[2], 16) / 255,
                        b = parseInt(m[3], 16) / 255;
                    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
                }

                function rotBBox(iw, ih, rad) {
                    var c = Math.abs(Math.cos(rad)),
                        s = Math.abs(Math.sin(rad));
                    return { rw: iw * c + ih * s, rh: iw * s + ih * c };
                }

                function normDeg360(d) {
                    var x = d % 360;
                    if (x < 0) x += 360;
                    return x;
                }

                function syncRotUI() {
                    var v = normDeg360(viewRotDeg);
                    var snaps = [0, 90, 180, 270];
                    var matched = null;
                    for (var i = 0; i < snaps.length; i++) {
                        var diff = Math.abs(v - snaps[i]);
                        if (diff > 180) diff = 360 - diff;
                        if (diff < 0.65) {
                            matched = snaps[i];
                            break;
                        }
                    }
                    var sel = document.getElementById("rotSel");
                    if (rotUserPickedCustom) sel.value = "custom";
                    else if (matched !== null) sel.value = String(matched);
                    else sel.value = "custom";
                    document.getElementById("rotDegIn").value = (Math.round(viewRotDeg * 10) / 10).toFixed(1);
                }

                function getTransform() {
                    return {
                        fit: document.getElementById("fitSel").value,
                        rot: viewRotDeg,
                        zoom: (parseFloat(document.getElementById("zoomR").value) || 100) / 100,
                        panX: (parseFloat(document.getElementById("panXR").value) || 0) / 100,
                        panY: (parseFloat(document.getElementById("panYR").value) || 0) / 100,
                    };
                }

                function resetViewControls() {
                    document.getElementById("fitSel").value = "contain";
                    rotUserPickedCustom = false;
                    viewRotDeg = 0;
                    document.getElementById("rotSel").value = "0";
                    document.getElementById("rotDegIn").value = "0";
                    document.getElementById("zoomR").value = "100";
                    document.getElementById("panXR").value = "0";
                    document.getElementById("panYR").value = "0";
                    document.getElementById("zoomLab").textContent = "100%";
                }

                function drawPhotoTransformed(ctx, cx, cy, pw, ph, image, t) {
                    var iw = image.naturalWidth || image.width;
                    var ih = image.naturalHeight || image.height;
                    if (!iw || !ih) return;
                    var rad = (t.rot * Math.PI) / 180;
                    var bb = rotBBox(iw, ih, rad);
                    var k0 = t.fit === "cover" ? Math.max(pw / bb.rw, ph / bb.rh) : Math.min(pw / bb.rw, ph / bb.rh);
                    var k = k0 * (t.zoom || 1);
                    var px = t.panX * pw;
                    var py = t.panY * ph;
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(rad);
                    // 平移量按「出图画布 / 屏幕」水平、竖直方向理解；在 rotate 之后需换算到当前局部轴，旋转中心仍在 (cx,cy)
                    ctx.translate(px * Math.cos(rad) + py * Math.sin(rad), -px * Math.sin(rad) + py * Math.cos(rad));
                    ctx.drawImage(image, (-iw * k) / 2, (-ih * k) / 2, iw * k, ih * k);
                    ctx.restore();
                }

                function drawTextBottomInRect(ctx, x, y, w, h, text, bgHex) {
                    if (!text) return;
                    var pad = Math.max(4, Math.floor(h * 0.02));
                    var fs = Math.max(12, Math.floor(h * 0.065));
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.font = "600 " + fs + 'px "Microsoft YaHei","PingFang SC",sans-serif';
                    ctx.textAlign = "center";
                    ctx.textBaseline = "bottom";
                    var lum = luminance(bgHex);
                    ctx.fillStyle = lum > 0.55 ? "#1a1a1a" : "#ffffff";
                    ctx.shadowColor = lum > 0.55 ? "rgba(255,255,255,0.6)" : "rgba(0,0,0,0.45)";
                    ctx.shadowBlur = 3;
                    ctx.fillText(text, w / 2, h - pad);
                    ctx.restore();
                }

                function renderCellToCtx(ctx, x, y, pw, ph, bgHex, overlay) {
                    var t = getTransform();
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(x, y, pw, ph);
                    ctx.clip();
                    ctx.fillStyle = bgHex;
                    ctx.fillRect(x, y, pw, ph);
                    if (img) drawPhotoTransformed(ctx, x + pw / 2, y + ph / 2, pw, ph, img, t);
                    if (overlay) drawTextBottomInRect(ctx, x, y, pw, ph, overlay, bgHex);
                    ctx.restore();
                }

                function drawSingle() {
                    try {
                        var p = getPreset();
                        var bg = DEFAULT_PRINT_BG;
                        var c = document.getElementById("singleCanvas");
                        c.width = p.w;
                        c.height = p.h;
                        var ctx = c.getContext("2d");
                        if (!ctx) throw new Error("no ctx");
                        var t = getTransform();
                        ctx.save();
                        ctx.beginPath();
                        ctx.rect(0, 0, p.w, p.h);
                        ctx.clip();
                        ctx.fillStyle = bg;
                        ctx.fillRect(0, 0, p.w, p.h);
                        if (img) drawPhotoTransformed(ctx, p.w / 2, p.h / 2, p.w, p.h, img, t);
                        ctx.restore();
                        var ov = p.text ? document.getElementById("overlayText").value.trim() : "";
                        if (ov) drawTextBottomInRect(ctx, 0, 0, p.w, p.h, ov, bg);
                        var out = document.getElementById("singlePreview");
                        out.src = c.toDataURL("image/png");
                        out.style.display = "block";
                        updatePreviewStageUI();
                        showErr("");
                    } catch (err) {
                        console.error(err);
                        showErr("单张预览生成失败（常见原因：自定义尺寸过大、内存不足）。请将宽高控制在 4000 以内或换小图重试。");
                    }
                }

                function updatePreviewStageUI() {
                    var stage = document.getElementById("singleStage");
                    var tip = document.getElementById("previewTip");
                    var handle = document.getElementById("rotateHandle");
                    var ok = !!img;
                    tip.style.display = ok ? "block" : "none";
                    handle.style.visibility = ok ? "visible" : "hidden";
                    handle.disabled = !ok;
                    var bgBtn = document.getElementById("btnToPhotoBg");
                    if (bgBtn) bgBtn.disabled = !ok;
                    if (ok) stage.classList.add("can-interact");
                    else stage.classList.remove("can-interact");
                }

                function getPreviewDispSize() {
                    var out = document.getElementById("singlePreview");
                    if (!out || out.style.display === "none") return { w: 0, h: 0 };
                    var r = out.getBoundingClientRect();
                    return { w: r.width, h: r.height };
                }

                function onStagePointerDown(e) {
                    if (!img) return;
                    if (e.pointerType === "mouse" && e.button !== 0) return;
                    var prev = document.getElementById("singlePreview");
                    if (prev.style.display === "none") return;
                    var pr = getPreviewDispSize();
                    if (pr.w < 1 || pr.h < 1) return;
                    var stage = document.getElementById("singleStage");
                    var isHandle = e.target && e.target.closest && e.target.closest("#rotateHandle");
                    var sr = stage.getBoundingClientRect();
                    stageDrag = {
                        mode: isHandle ? "rotate" : "pan",
                        pid: e.pointerId,
                        sx: e.clientX,
                        sy: e.clientY,
                        pan0x: parseFloat(document.getElementById("panXR").value) || 0,
                        pan0y: parseFloat(document.getElementById("panYR").value) || 0,
                        rot0: viewRotDeg,
                        cx: sr.left + sr.width / 2,
                        cy: sr.top + sr.height / 2,
                        a0: Math.atan2(e.clientY - (sr.top + sr.height / 2), e.clientX - (sr.left + sr.width / 2)),
                    };
                    if (isHandle) stage.classList.add("is-rotating");
                    else stage.classList.add("is-panning");
                    try {
                        stage.setPointerCapture(e.pointerId);
                    } catch (err) {}
                    e.preventDefault();
                }

                function onStagePointerMove(e) {
                    if (!stageDrag || e.pointerId !== stageDrag.pid) return;
                    var pr = getPreviewDispSize();
                    if (stageDrag.mode === "pan") {
                        var dx = e.clientX - stageDrag.sx;
                        var dy = e.clientY - stageDrag.sy;
                        var nx = stageDrag.pan0x + (dx / pr.w) * 100;
                        var ny = stageDrag.pan0y + (dy / pr.h) * 100;
                        nx = Math.max(-45, Math.min(45, nx));
                        ny = Math.max(-45, Math.min(45, ny));
                        document.getElementById("panXR").value = String(Math.round(nx));
                        document.getElementById("panYR").value = String(Math.round(ny));
                        bindViewRefresh();
                    } else {
                        var a1 = Math.atan2(e.clientY - stageDrag.cy, e.clientX - stageDrag.cx);
                        var da = a1 - stageDrag.a0;
                        while (da > Math.PI) da -= 2 * Math.PI;
                        while (da < -Math.PI) da += 2 * Math.PI;
                        viewRotDeg = stageDrag.rot0 + (da * 180) / Math.PI;
                        syncRotUI();
                        bindViewRefresh();
                    }
                }

                function clearStageDrag(e) {
                    if (!stageDrag) return;
                    if (e && e.pointerId !== undefined && e.pointerId !== stageDrag.pid) return;
                    var wasRotate = stageDrag.mode === "rotate";
                    var stage = document.getElementById("singleStage");
                    stage.classList.remove("is-panning", "is-rotating");
                    try {
                        if (e && e.pointerId !== undefined) stage.releasePointerCapture(e.pointerId);
                    } catch (err2) {}
                    stageDrag = null;
                    if (wasRotate) {
                        rotUserPickedCustom = false;
                        syncRotUI();
                    }
                }

                function computeGrid(paperW, paperH, cellW, cellH, marginPx, gapPx) {
                    if (!isFinite(paperW) || !isFinite(paperH) || !isFinite(cellW) || !isFinite(cellH) || !isFinite(marginPx) || !isFinite(gapPx)) {
                        return { cols: 0, rows: 0, ox: 0, oy: 0 };
                    }
                    if (paperW < 2 || paperH < 2 || cellW < 1 || cellH < 1) return { cols: 0, rows: 0, ox: 0, oy: 0 };
                    var aw = paperW - 2 * marginPx;
                    var ah = paperH - 2 * marginPx;
                    if (aw < cellW || ah < cellH) return { cols: 0, rows: 0, ox: marginPx, oy: marginPx };
                    var cols = Math.floor((aw + gapPx) / (cellW + gapPx));
                    var rows = Math.floor((ah + gapPx) / (cellH + gapPx));
                    if (cols < 1) cols = 1;
                    if (rows < 1) rows = 1;
                    var usedW = cols * cellW + (cols - 1) * gapPx;
                    var usedH = rows * cellH + (rows - 1) * gapPx;
                    var ox = marginPx + (aw - usedW) / 2;
                    var oy = marginPx + (ah - usedH) / 2;
                    return { cols: cols, rows: rows, ox: ox, oy: oy };
                }

                function drawCutLines(ctx, ox, oy, cols, rows, cw, ch, gap) {
                    ctx.save();
                    ctx.strokeStyle = "rgba(60,80,120,0.55)";
                    ctx.lineWidth = Math.max(1, Math.round(cw / 400));
                    ctx.setLineDash([6, 4]);
                    var totalW = cols * cw + (cols - 1) * gap;
                    var totalH = rows * ch + (rows - 1) * gap;
                    for (var c = 0; c <= cols; c++) {
                        var x = ox + c * (cw + gap);
                        ctx.beginPath();
                        ctx.moveTo(x, oy);
                        ctx.lineTo(x, oy + totalH);
                        ctx.stroke();
                    }
                    for (var r = 0; r <= rows; r++) {
                        var y = oy + r * (ch + gap);
                        ctx.beginPath();
                        ctx.moveTo(ox, y);
                        ctx.lineTo(ox + totalW, y);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                function scheduleLayoutRefresh(immediate) {
                    if (layoutRefreshTimer) {
                        clearTimeout(layoutRefreshTimer);
                        layoutRefreshTimer = null;
                    }
                    if (immediate) {
                        refreshLayoutPreview();
                        return;
                    }
                    layoutRefreshTimer = setTimeout(function () {
                        layoutRefreshTimer = null;
                        refreshLayoutPreview();
                    }, 90);
                }

                function drawLayoutPlaceholder(paper, msg) {
                    try {
                        var canvas = document.getElementById("previewCanvas");
                        if (!paper || !paper.w || !paper.h || paper.w < 2 || paper.h < 2) {
                            paper = { w: 600, h: 800 };
                        }
                        canvas.width = paper.w;
                        canvas.height = paper.h;
                        var ctx = canvas.getContext("2d");
                        if (!ctx) throw new Error("no ctx");
                        ctx.fillStyle = "#e8ecf4";
                        ctx.fillRect(0, 0, paper.w, paper.h);
                        var fs = Math.max(16, Math.min(48, Math.floor(Math.min(paper.w, paper.h) / 18)));
                        ctx.font = "600 " + fs + 'px "Microsoft YaHei","PingFang SC",sans-serif';
                        ctx.fillStyle = "#6f7d96";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(msg, paper.w / 2, paper.h / 2);
                        var sel = getPaperPx();
                        var merge = { w: paper.w, h: paper.h, wcm: sel.wcm, hcm: sel.hcm, label: sel.label };
                        drawPlaceholderLayoutCaption(ctx, merge, getDpi());
                        layoutCanvas = null;
                        canvas.style.display = "inline-block";
                        setLayoutExportEnabled(false);
                        updateLayoutMetaBar();
                    } catch (e2) {
                        console.error(e2);
                        showErr("排版预览画布创建失败，请尝试更换相纸或降低冲印 DPI。");
                        updateLayoutMetaBar();
                    }
                }

                function refreshLayoutPreview() {
                    try {
                        showErr("");
                        var paper = getPaperPx();
                        if (!paper || !paper.w || !paper.h || paper.w < 2 || paper.h < 2) {
                            showErr("相纸尺寸无效，请重新选择相纸。");
                            drawLayoutPlaceholder({ w: 600, h: 800 }, "相纸参数异常");
                            return;
                        }
                        lastPaperPx = { w: paper.w, h: paper.h };
                        if (!img) {
                            drawLayoutPlaceholder(paper, "请先上传证件照以预览排版");
                            return;
                        }
                        var p = getPreset();
                        var dpi = getDpi();
                        var marginPx = mmToPx(parseFloat(document.getElementById("marginMm").value) || 0, dpi);
                        var gapPx = mmToPx(parseFloat(document.getElementById("gapMm").value) || 0, dpi);
                        var bg = DEFAULT_PRINT_BG;
                        var ov = p.text ? document.getElementById("overlayText").value.trim() : "";

                        var cw = p.w,
                            ch = p.h;
                        var grid = computeGrid(paper.w, paper.h, cw, ch, marginPx, gapPx);
                        if (grid.cols < 1 || grid.rows < 1) {
                            showErr("当前相纸在设定边距下容纳不下该证件尺寸，请换大相纸、减小边距，或调整自定义宽高。");
                            drawLayoutPlaceholder(paper, "无法排版：请调整相纸或尺寸");
                            return;
                        }

                        var canvas = document.getElementById("previewCanvas");
                        canvas.width = paper.w;
                        canvas.height = paper.h;
                        var ctx = canvas.getContext("2d");
                        if (!ctx) throw new Error("no ctx");
                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(0, 0, paper.w, paper.h);

                        for (var r = 0; r < grid.rows; r++) {
                            for (var c = 0; c < grid.cols; c++) {
                                var x = grid.ox + c * (cw + gapPx);
                                var y = grid.oy + r * (ch + gapPx);
                                renderCellToCtx(ctx, x, y, cw, ch, bg, ov);
                            }
                        }
                        if (document.getElementById("chkCut").checked) {
                            drawCutLines(ctx, grid.ox, grid.oy, grid.cols, grid.rows, cw, ch, gapPx);
                        }
                        drawLayoutCaptionOnCanvas(ctx, paper, dpi, grid, cw, ch, gapPx, marginPx);

                        layoutCanvas = canvas;
                        canvas.style.display = "inline-block";
                        setLayoutExportEnabled(true);
                        updateLayoutMetaBar();
                    } catch (err) {
                        console.error(err);
                        showErr("排版预览生成失败（画布过大或内存不足）。请换小相纸、降低 DPI 或缩小照片像素规格。");
                        try {
                            drawLayoutPlaceholder({ w: 900, h: 600 }, "预览失败：请缩小规格或相纸后重试");
                        } catch (e3) {
                            console.error(e3);
                        }
                    }
                }

                function fillSelects() {
                    var ps = document.getElementById("presetSel");
                    ps.innerHTML = "";
                    var dpi = getDpi();
                    PRESETS.forEach(function (p) {
                        var o = document.createElement("option");
                        o.value = p.id;
                        o.textContent = presetOptionText(p, dpi);
                        ps.appendChild(o);
                    });
                    var oc = document.createElement("option");
                    oc.value = CUSTOM_PRESET_ID;
                    oc.textContent = customPresetOptionText(dpi);
                    ps.appendChild(oc);
                    var pp = document.getElementById("paperSel");
                    pp.innerHTML = "";
                    PAPERS.forEach(function (p) {
                        var o = document.createElement("option");
                        o.value = p.id;
                        o.textContent = p.label;
                        if (p.id === "r4") o.selected = true;
                        pp.appendChild(o);
                    });
                }

                document.getElementById("btnPick").addEventListener("click", function () {
                    document.getElementById("fileIn").click();
                });
                document.getElementById("fileIn").addEventListener("change", function (e) {
                    var f = e.target.files && e.target.files[0];
                    if (!f) return;
                    var reader = new FileReader();
                    reader.onload = function () {
                        var im = new Image();
                        im.onload = function () {
                            img = im;
                            showErr("");
                            resetViewControls();
                            drawSingle();
                            scheduleLayoutRefresh(true);
                        };
                        im.onerror = function () {
                            showErr("图片无法解析。");
                        };
                        im.src = reader.result;
                    };
                    reader.readAsDataURL(f);
                });

                document.getElementById("presetSel").addEventListener("change", function () {
                    var v = document.getElementById("presetSel").value;
                    if (v === CUSTOM_PRESET_ID) {
                        var base = null;
                        for (var i = 0; i < PRESETS.length; i++) {
                            if (PRESETS[i].id === lastPresetIdBeforeCustom) {
                                base = PRESETS[i];
                                break;
                            }
                        }
                        if (!base) base = PRESETS[0];
                        document.getElementById("customW").value = String(base.w);
                        document.getElementById("customH").value = String(base.h);
                    } else {
                        lastPresetIdBeforeCustom = v;
                    }
                    updatePresetSelectLabels();
                    refreshPresetUi();
                });
                document.getElementById("overlayText").addEventListener("input", function () {
                    drawSingle();
                    scheduleLayoutRefresh(false);
                });
                function bindViewRefresh() {
                    drawSingle();
                    scheduleLayoutRefresh(false);
                }
                document.getElementById("fitSel").addEventListener("change", bindViewRefresh);
                document.getElementById("rotSel").addEventListener("change", function () {
                    var v = document.getElementById("rotSel").value;
                    if (v === "custom") rotUserPickedCustom = true;
                    else {
                        rotUserPickedCustom = false;
                        viewRotDeg = parseFloat(v) || 0;
                    }
                    syncRotUI();
                    bindViewRefresh();
                });
                document.getElementById("rotDegIn").addEventListener("input", function () {
                    rotUserPickedCustom = false;
                    var n = parseFloat(document.getElementById("rotDegIn").value);
                    viewRotDeg = isNaN(n) ? 0 : n;
                    syncRotUI();
                    bindViewRefresh();
                });
                document.getElementById("zoomR").addEventListener("input", function () {
                    document.getElementById("zoomLab").textContent = document.getElementById("zoomR").value + "%";
                    bindViewRefresh();
                });
                document.getElementById("panXR").addEventListener("input", bindViewRefresh);
                document.getElementById("panYR").addEventListener("input", bindViewRefresh);
                document.getElementById("btnResetView").addEventListener("click", function () {
                    resetViewControls();
                    bindViewRefresh();
                });

                (function bindPreviewStage() {
                    var stage = document.getElementById("singleStage");
                    stage.addEventListener("pointerdown", onStagePointerDown);
                    stage.addEventListener("pointermove", onStagePointerMove);
                    stage.addEventListener("pointerup", clearStageDrag);
                    stage.addEventListener("pointercancel", clearStageDrag);
                    stage.addEventListener("lostpointercapture", function (e) {
                        if (stageDrag && e.pointerId === stageDrag.pid) clearStageDrag(e);
                    });
                    stage.addEventListener(
                        "wheel",
                        function (e) {
                            if (!img || document.getElementById("singlePreview").style.display === "none") return;
                            e.preventDefault();
                            var z = parseFloat(document.getElementById("zoomR").value) || 100;
                            var d = e.deltaY > 0 ? -5 : 5;
                            if (e.ctrlKey) d *= 0.5;
                            z = Math.max(50, Math.min(200, Math.round(z + d)));
                            document.getElementById("zoomR").value = String(z);
                            document.getElementById("zoomLab").textContent = z + "%";
                            bindViewRefresh();
                        },
                        { passive: false }
                    );
                })();
                document.getElementById("dpiSel").addEventListener("change", function () {
                    updatePresetSelectLabels();
                    syncCustomSizeRow();
                    updateLayoutMetaBar();
                    refreshPresetUi();
                });
                document.getElementById("paperSel").addEventListener("change", function () {
                    updateLayoutMetaBar();
                    scheduleLayoutRefresh(true);
                });
                function bindMarginGapCut() {
                    scheduleLayoutRefresh(true);
                }
                document.getElementById("marginMm").addEventListener("input", bindMarginGapCut);
                document.getElementById("marginMm").addEventListener("change", bindMarginGapCut);
                document.getElementById("gapMm").addEventListener("input", bindMarginGapCut);
                document.getElementById("gapMm").addEventListener("change", bindMarginGapCut);
                document.getElementById("chkCut").addEventListener("change", bindMarginGapCut);
                function onCustomSizeInput() {
                    updatePresetSelectLabels();
                    syncCustomSizeRow();
                    if (document.getElementById("presetSel").value === CUSTOM_PRESET_ID) {
                        drawSingle();
                        scheduleLayoutRefresh(true);
                    }
                }
                document.getElementById("customW").addEventListener("input", onCustomSizeInput);
                document.getElementById("customH").addEventListener("input", onCustomSizeInput);
                document.getElementById("customW").addEventListener("change", onCustomSizeInput);
                document.getElementById("customH").addEventListener("change", onCustomSizeInput);
                document.getElementById("btnToPhotoBg").addEventListener("click", handoffToPhotoBg);
                document.getElementById("btnDl").addEventListener("click", function () {
                    if (!layoutCanvas) return;
                    var p = getPaperPx();
                    var dpi = getDpi();
                    var wmm = Math.round(p.wcm * 10);
                    var hmm = Math.round(p.hcm * 10);
                    var name = "证件照排版_" + wmm + "x" + hmm + "mm_" + dpi + "dpi.png";
                    var a = document.createElement("a");
                    a.download = name;
                    a.href = layoutCanvas.toDataURL("image/png");
                    a.click();
                });
                document.getElementById("btnPrint").addEventListener("click", function () {
                    if (!layoutCanvas) return;
                    var dataUrl = layoutCanvas.toDataURL("image/png");
                    var doc = window.open("");
                    if (!doc) {
                        showErr("无法打开打印窗口：请允许本站弹出窗口后重试。");
                        return;
                    }
                    doc.document.open();
                    doc.document.write(
                        '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>打印排版</title></head><body style="margin:0;padding:16px;text-align:center;background:#fff">'
                    );
                    doc.document.write(
                        '<img src="' +
                            dataUrl +
                            '" style="max-width:100%;height:auto" alt="排版" onload="window.focus();setTimeout(function(){window.print();},50);" />'
                    );
                    doc.document.write("</body></html>");
                    doc.document.close();
                });

                fillSelects();
                updateLayoutMetaBar();
                syncRotUI();
                updatePreviewStageUI();
                refreshPresetUi();
                consumeHandoffFromPhotoBg();
            })();
        </script>
    </body>
</html>
