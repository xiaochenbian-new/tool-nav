<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>图片压缩</title>
        <link rel="stylesheet" href="libs/tool-danger-btn.css" />
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            :root {
                --bg: #f3f7ff;
                --card: #fff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
                --input-border: #cfdcf7;
                --success: #16a34a;
                --warn: #d97706;
            }
            html, body {
                height: 100%;
                overflow: hidden;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
            }
            .page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                min-height: 0;
            }
            .toolbar {
                flex-shrink: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                padding: 10px 12px;
                display: flex;
                flex-wrap: wrap;
                gap: 10px 16px;
                align-items: flex-end;
            }
            .field {
                display: flex;
                flex-direction: column;
                gap: 4px;
                font-size: 13px;
                color: #324a76;
            }
            .field label { font-size: 12px; color: var(--muted); }
            .field select,
            .field input[type="number"],
            .field input[type="text"] {
                border: 1px solid var(--input-border);
                border-radius: 6px;
                padding: 5px 8px;
                font-size: 13px;
                min-width: 100px;
            }
            .preset-seg {
                display: inline-flex;
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                overflow: hidden;
                background: #edf3ff;
            }
            .preset-seg button {
                border: none;
                background: transparent;
                padding: 6px 12px;
                font-size: 13px;
                cursor: pointer;
                color: #3c4f78;
                white-space: nowrap;
            }
            .preset-seg button:hover:not(.active) {
                color: var(--primary);
                background: rgba(47, 107, 255, 0.06);
            }
            .preset-seg button.active {
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
                color: #fff;
            }
            .quality-row {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 200px;
            }
            .quality-row input[type="range"] {
                flex: 1;
                min-width: 80px;
                accent-color: var(--primary);
            }
            .quality-val {
                min-width: 36px;
                text-align: right;
                font-variant-numeric: tabular-nums;
                color: var(--primary);
                font-weight: 600;
            }
            .resize-row {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-wrap: wrap;
            }
            .resize-row input[type="checkbox"] { accent-color: var(--primary); }
            .resize-row input[type="number"] { width: 72px; min-width: 72px; }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 6px 14px;
                font-size: 13px;
                cursor: pointer;
                white-space: nowrap;
            }
            .btn:hover:not(:disabled) {
                border-color: var(--primary);
                color: var(--primary);
            }
            .btn:disabled { opacity: 0.45; cursor: not-allowed; }
            .btn-primary {
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
                color: #fff;
                border-color: transparent;
            }
            .btn-primary:hover:not(:disabled) { filter: brightness(1.05); color: #fff; }
            .main {
                flex: 1;
                min-height: 0;
                display: flex;
                gap: 10px;
            }
            .file-panel {
                width: 240px;
                flex-shrink: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .file-panel-head {
                padding: 8px 10px;
                border-bottom: 1px solid #e4edff;
                background: #f8fbff;
                font-size: 13px;
                color: #324a76;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .file-list {
                flex: 1;
                overflow-y: auto;
                padding: 6px;
            }
            .file-item {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 8px;
                border-radius: 6px;
                cursor: pointer;
                border: 1px solid transparent;
            }
            .file-item:hover { background: #f0f5ff; }
            .file-item.active {
                background: #e8f0ff;
                border-color: #c5d8ff;
            }
            .file-thumb {
                width: 40px;
                height: 40px;
                border-radius: 4px;
                object-fit: cover;
                background: #f0f4ff;
                flex-shrink: 0;
            }
            .file-info {
                flex: 1;
                min-width: 0;
            }
            .file-name {
                font-size: 12px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .file-size {
                font-size: 11px;
                color: var(--muted);
            }
            .file-size .saved { color: var(--success); }
            .file-remove {
                border: none;
                background: transparent;
                color: #94a3b8;
                cursor: pointer;
                font-size: 16px;
                line-height: 1;
                padding: 2px 4px;
            }
            .file-remove:hover { color: #ef4444; }
            .preview-panel {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 10px;
                min-height: 0;
            }
            .upload-zone {
                flex: 1;
                min-height: 0;
                background: var(--card);
                border: 2px dashed var(--input-border);
                border-radius: 10px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
                color: var(--muted);
                cursor: pointer;
                transition: border-color 0.2s, background 0.2s;
            }
            .upload-zone:hover,
            .upload-zone.dragover {
                border-color: var(--primary);
                background: #f8fbff;
            }
            .upload-zone.hidden { display: none; }
            .upload-icon {
                width: 56px;
                height: 44px;
                border: 2px solid #cfdcf7;
                border-radius: 6px;
                position: relative;
                opacity: 0.7;
            }
            .upload-icon::before {
                content: "";
                position: absolute;
                left: 10px;
                right: 10px;
                top: -8px;
                height: 10px;
                border: 2px solid #cfdcf7;
                border-bottom: none;
                border-radius: 4px 4px 0 0;
            }
            .upload-title { font-size: 15px; color: #324a76; }
            .upload-hint { font-size: 12px; }
            .compare-wrap {
                flex: 1;
                min-height: 0;
                display: none;
                flex-direction: column;
                gap: 10px;
            }
            .compare-wrap.visible { display: flex; }
            .stats-bar {
                flex-shrink: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                padding: 10px 14px;
                display: flex;
                flex-wrap: wrap;
                gap: 16px 24px;
                align-items: center;
            }
            .stat-item { display: flex; flex-direction: column; gap: 2px; }
            .stat-label { font-size: 11px; color: var(--muted); }
            .stat-value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
            .stat-value.original { color: #64748b; }
            .stat-value.compressed { color: var(--primary); }
            .stat-value.saved { color: var(--success); }
            .stat-arrow { color: var(--muted); font-size: 18px; align-self: center; }
            .compare-panes {
                flex: 1;
                min-height: 0;
                display: flex;
                gap: 10px;
            }
            .compare-pane {
                flex: 1;
                min-width: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .pane-head {
                padding: 6px 10px;
                font-size: 13px;
                color: #324a76;
                border-bottom: 1px solid #e4edff;
                background: #f8fbff;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .pane-body {
                flex: 1;
                min-height: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 10px;
                background: repeating-conic-gradient(#f0f4ff 0% 25%, #fafcff 0% 50%) 50% / 16px 16px;
                overflow: hidden;
            }
            .pane-body img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                border-radius: 4px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            }
            .action-bar {
                flex-shrink: 0;
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }
            .target-size-field { display: none; }
            .target-size-field.visible { display: flex; }
            .processing {
                position: fixed;
                inset: 0;
                background: rgba(255, 255, 255, 0.6);
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 100;
                font-size: 14px;
                color: var(--primary);
            }
            .processing.visible { display: flex; }
            .format-hint {
                flex: 1 1 100%;
                font-size: 12px;
                color: var(--warn);
                background: #fffbeb;
                border: 1px solid #fde68a;
                border-radius: 6px;
                padding: 6px 10px;
                line-height: 1.5;
            }
            .format-hint[hidden] { display: none; }
            .stat-value.increase { color: var(--warn); }
            #fileIn { display: none; }
            @media (max-width: 768px) {
                .main { flex-direction: column; }
                .file-panel { width: 100%; max-height: 160px; }
                .compare-panes { flex-direction: column; }
            }
        </style>
    
    <!-- 外壳注入：清除 body/根容器内边距 + 隐藏根滚动条，使工具内容宽度与导航栏一致（file:// 跨域下由页面自带） -->
    <style id="tool-shell-flush">
        body{padding:0!important;}
        body>*{padding:0!important;margin:0!important;}
        html::-webkit-scrollbar{width:0!important;height:0!important;}
        html{scrollbar-width:none!important;}
    </style>
    </head>
    <body>
        <div class="page">
            <div class="toolbar">
                <div class="field">
                    <label>压缩模式</label>
                    <div class="preset-seg" id="presetSeg">
                        <button type="button" data-preset="high" class="active">高清</button>
                        <button type="button" data-preset="standard">标准</button>
                        <button type="button" data-preset="deep">深度</button>
                        <button type="button" data-preset="target">指定大小</button>
                        <button type="button" data-preset="custom">自定义</button>
                    </div>
                </div>
                <div class="field" id="qualityField">
                    <label>图片质量</label>
                    <div class="quality-row">
                        <input type="range" id="qualityRange" min="10" max="100" value="85" />
                        <span class="quality-val" id="qualityVal">85%</span>
                    </div>
                </div>
                <div class="field target-size-field" id="targetSizeField">
                    <label>目标大小 (KB)</label>
                    <input type="number" id="targetSizeKb" min="10" max="10240" value="200" />
                </div>
                <div class="field">
                    <label>输出格式</label>
                    <select id="formatSel">
                        <option value="auto">保持原格式</option>
                        <option value="image/jpeg">JPEG</option>
                        <option value="image/webp">WebP</option>
                        <option value="image/png">PNG</option>
                    </select>
                </div>
                <div class="field">
                    <label>尺寸限制</label>
                    <div class="resize-row">
                        <input type="checkbox" id="resizeEnable" />
                        <span>最大宽</span>
                        <input type="number" id="maxWidth" min="100" max="8192" value="1920" disabled />
                        <span>最大高</span>
                        <input type="number" id="maxHeight" min="100" max="8192" value="1920" disabled />
                    </div>
                </div>
                <button type="button" class="btn btn-primary" id="btnCompress" disabled>压缩当前</button>
                <button type="button" class="btn btn-primary" id="btnCompressAll" disabled>全部压缩</button>
                <div class="format-hint" id="formatHint" hidden></div>
            </div>

            <div class="main">
                <div class="file-panel" id="filePanel" hidden>
                    <div class="file-panel-head">
                        <span>已选 <strong id="fileCount">0</strong> 张</span>
                        <button type="button" class="btn" id="btnAddMore" style="padding: 3px 8px; font-size: 12px">添加</button>
                    </div>
                    <div class="file-list" id="fileList"></div>
                </div>

                <div class="preview-panel">
                    <div class="upload-zone" id="uploadZone">
                        <div class="upload-icon"></div>
                        <div class="upload-title">点击或拖拽图片到此处</div>
                        <div class="upload-hint">支持 JPG、PNG、WebP、GIF、BMP，可多选，全部在本地处理</div>
                    </div>
                    <div class="compare-wrap" id="compareWrap">
                        <div class="stats-bar" id="statsBar">
                            <div class="stat-item">
                                <span class="stat-label">原始大小</span>
                                <span class="stat-value original" id="statOriginal">—</span>
                            </div>
                            <span class="stat-arrow">→</span>
                            <div class="stat-item">
                                <span class="stat-label">压缩后</span>
                                <span class="stat-value compressed" id="statCompressed">—</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">节省</span>
                                <span class="stat-value saved" id="statSaved">—</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">尺寸</span>
                                <span class="stat-value" id="statDim" style="font-size: 13px; font-weight: 500">—</span>
                            </div>
                        </div>
                        <div class="compare-panes">
                            <div class="compare-pane">
                                <div class="pane-head">原图</div>
                                <div class="pane-body"><img id="imgOriginal" alt="原图" /></div>
                            </div>
                            <div class="compare-pane">
                                <div class="pane-head">
                                    <span>压缩后</span>
                                    <button type="button" class="btn btn-primary" id="btnDownload" style="padding: 3px 10px; font-size: 12px" disabled>下载</button>
                                </div>
                                <div class="pane-body"><img id="imgCompressed" alt="压缩后" /></div>
                            </div>
                        </div>
                        <div class="action-bar">
                            <button type="button" class="btn" id="btnDownloadAll" disabled>下载全部</button>
                            <button type="button" class="btn danger-btn" id="btnClear">清空列表</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <input type="file" id="fileIn" accept="image/*" multiple />
        <div class="processing" id="processing">正在压缩…</div>

        <script>
            (function () {
                var PRESETS = {
                    high: { quality: 0.85, label: "高清" },
                    standard: { quality: 0.7, label: "标准" },
                    deep: { quality: 0.5, label: "深度" },
                    custom: { quality: 0.85, label: "自定义" },
                    target: { quality: 0.7, label: "指定大小" }
                };

                var files = [];
                var activeId = null;
                var preset = "high";
                var compressTimer = null;

                function $(id) { return document.getElementById(id); }

                function formatSize(bytes) {
                    if (bytes == null || isNaN(bytes)) return "—";
                    if (bytes < 1024) return bytes + " B";
                    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
                    return (bytes / 1024 / 1024).toFixed(2) + " MB";
                }

                function extFromMime(mime) {
                    if (mime === "image/jpeg") return "jpg";
                    if (mime === "image/png") return "png";
                    if (mime === "image/webp") return "webp";
                    if (mime === "image/gif") return "gif";
                    if (mime === "image/bmp") return "bmp";
                    return "jpg";
                }

                function resolveOutputMime(item) {
                    var sel = $("formatSel").value;
                    if (sel !== "auto") return sel;
                    var src = item.file.type;
                    if (src === "image/jpeg" || src === "image/png" || src === "image/webp") return src;
                    return "image/jpeg";
                }

                function isLossyFormat(mime) {
                    return mime === "image/jpeg" || mime === "image/webp";
                }

                function wasResized(item, dims) {
                    return dims.w !== item.image.naturalWidth || dims.h !== item.image.naturalHeight;
                }

                function formatSavings(originalSize, compressedSize) {
                    var diff = originalSize - compressedSize;
                    if (diff > 0) {
                        var pct = originalSize > 0 ? ((diff / originalSize) * 100).toFixed(1) : "0";
                        return { text: formatSize(diff) + " (-" + pct + "%)", increased: false };
                    }
                    if (diff < 0) {
                        var incPct = originalSize > 0 ? ((-diff / originalSize) * 100).toFixed(1) : "0";
                        return { text: "增大 " + formatSize(-diff) + " (+" + incPct + "%)", increased: true };
                    }
                    return { text: "无变化", increased: false };
                }

                function setCompressedResult(item, blob, mime, dims, meta) {
                    if (item.compressedUrl && item.compressedUrl !== item.originalUrl && item.compressedUrl !== item.thumbUrl) {
                        URL.revokeObjectURL(item.compressedUrl);
                    }
                    item.compressedBlob = blob;
                    item.compressedUrl = URL.createObjectURL(blob);
                    item.outputMime = mime;
                    item.outputDims = dims;
                    item.keptOriginal = !!(meta && meta.keptOriginal);
                    item.autoConverted = !!(meta && meta.autoConverted);
                    item.resultNote = (meta && meta.note) || "";
                }

                async function applyCompressionResult(item, blob, mime, dims) {
                    var originalSize = item.file.size;
                    var resized = wasResized(item, dims);
                    var formatSel = $("formatSel").value;

                    if (blob && (resized || blob.size < originalSize)) {
                        setCompressedResult(item, blob, mime, dims, null);
                        return;
                    }

                    if (formatSel === "auto" && item.file.type === "image/png" && !resized && isLossyFormat(mime) === false) {
                        var quality = getQuality();
                        var webpBlob = await drawToBlob(item.image, "image/webp", quality, dims);
                        if (webpBlob && webpBlob.size < originalSize) {
                            setCompressedResult(item, webpBlob, "image/webp", dims, {
                                autoConverted: true,
                                note: "PNG 重编码无法缩小，已自动转为 WebP"
                            });
                            return;
                        }
                    }

                    setCompressedResult(item, item.file, item.file.type, dims, {
                        keptOriginal: true,
                        note: isLossyFormat(mime)
                            ? "压缩后体积未减小，已保留原图"
                            : "PNG 为无损格式，质量参数无效；缩小体积请选择 JPEG 或 WebP"
                    });
                }

                function updateFormatHint() {
                    var hint = $("formatHint");
                    var item = getActive();
                    if (!item) {
                        hint.hidden = true;
                        return;
                    }
                    var mime = resolveOutputMime(item);
                    var parts = [];
                    if (mime === "image/png") {
                        parts.push("当前输出为 PNG（无损），质量滑块无效。要明显减小体积请改选 JPEG 或 WebP。");
                    }
                    if (item.resultNote) parts.push(item.resultNote);
                    if (item.autoConverted) parts.push("已自动转为 WebP 以获得更小体积。");
                    if (parts.length) {
                        hint.textContent = parts.join(" ");
                        hint.hidden = false;
                    } else {
                        hint.hidden = true;
                    }
                }

                function calcDimensions(nw, nh) {
                    var w = nw, h = nh;
                    if ($("resizeEnable").checked) {
                        var maxW = parseInt($("maxWidth").value, 10) || 99999;
                        var maxH = parseInt($("maxHeight").value, 10) || 99999;
                        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
                        if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
                    }
                    return { w: w, h: h };
                }

                function loadImageFromFile(file) {
                    return new Promise(function (resolve, reject) {
                        var reader = new FileReader();
                        reader.onload = function () {
                            var img = new Image();
                            img.onload = function () { resolve(img); };
                            img.onerror = reject;
                            img.src = reader.result;
                        };
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });
                }

                function drawToBlob(img, mime, quality, dims) {
                    return new Promise(function (resolve) {
                        var canvas = document.createElement("canvas");
                        canvas.width = dims.w;
                        canvas.height = dims.h;
                        var ctx = canvas.getContext("2d");
                        if (mime === "image/jpeg") {
                            ctx.fillStyle = "#ffffff";
                            ctx.fillRect(0, 0, dims.w, dims.h);
                        }
                        ctx.drawImage(img, 0, 0, dims.w, dims.h);
                        var q = mime === "image/png" ? undefined : quality;
                        canvas.toBlob(function (blob) { resolve(blob); }, mime, q);
                    });
                }

                function getQuality() {
                    if (preset === "target") return 0.7;
                    if (preset === "custom") return parseInt($("qualityRange").value, 10) / 100;
                    return PRESETS[preset].quality;
                }

                async function compressOneItem(item) {
                    if (!item.image) {
                        item.image = await loadImageFromFile(item.file);
                    }
                    var mime = resolveOutputMime(item);
                    var dims = calcDimensions(item.image.naturalWidth, item.image.naturalHeight);
                    var quality = getQuality();

                    if (preset === "target") {
                        var targetBytes = (parseInt($("targetSizeKb").value, 10) || 200) * 1024;
                        var searchMime = isLossyFormat(mime) ? mime : "image/webp";
                        var low = 0.05, high = 1, best = null;
                        for (var i = 0; i < 12; i++) {
                            var mid = (low + high) / 2;
                            var blob = await drawToBlob(item.image, searchMime, mid, dims);
                            if (!blob) break;
                            if (blob.size > targetBytes) {
                                high = mid;
                            } else {
                                low = mid;
                                best = blob;
                            }
                        }
                        if (!best) {
                            best = await drawToBlob(item.image, searchMime, low, dims);
                        }
                        await applyCompressionResult(item, best, searchMime, dims);
                        if (searchMime === "image/webp" && mime === "image/png" && !item.keptOriginal) {
                            item.autoConverted = true;
                            item.resultNote = "指定大小模式已自动使用 WebP 编码";
                        }
                    } else {
                        var blob = await drawToBlob(item.image, mime, quality, dims);
                        await applyCompressionResult(item, blob, mime, dims);
                    }
                    return item;
                }

                function uid() {
                    return "f_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
                }

                function addFiles(fileList) {
                    var added = [];
                    Array.prototype.forEach.call(fileList, function (f) {
                        if (!f.type.startsWith("image/")) return;
                        var item = {
                            id: uid(),
                            file: f,
                            thumbUrl: URL.createObjectURL(f),
                            originalUrl: URL.createObjectURL(f),
                            compressedBlob: null,
                            compressedUrl: null,
                            image: null,
                            outputMime: null,
                            outputDims: null
                        };
                        files.push(item);
                        added.push(item);
                    });
                    if (!added.length) return;
                    if (!activeId) activeId = added[0].id;
                    updateUI();
                    scheduleCompress(activeId);
                }

                function removeFile(id) {
                    var idx = files.findIndex(function (f) { return f.id === id; });
                    if (idx < 0) return;
                    var item = files[idx];
                    URL.revokeObjectURL(item.thumbUrl);
                    URL.revokeObjectURL(item.originalUrl);
                    if (item.compressedUrl) URL.revokeObjectURL(item.compressedUrl);
                    files.splice(idx, 1);
                    if (activeId === id) activeId = files.length ? files[0].id : null;
                    updateUI();
                    if (activeId) scheduleCompress(activeId);
                }

                function clearAll() {
                    files.forEach(function (item) {
                        URL.revokeObjectURL(item.thumbUrl);
                        URL.revokeObjectURL(item.originalUrl);
                        if (item.compressedUrl) URL.revokeObjectURL(item.compressedUrl);
                    });
                    files = [];
                    activeId = null;
                    updateUI();
                }

                function getActive() {
                    return files.find(function (f) { return f.id === activeId; });
                }

                function updateButtons() {
                    var has = files.length > 0;
                    $("btnCompress").disabled = !has;
                    $("btnCompressAll").disabled = !has;
                    $("btnDownload").disabled = !has || !getActive() || !getActive().compressedBlob;
                    $("btnDownloadAll").disabled = !has || !files.some(function (f) { return f.compressedBlob; });
                    $("filePanel").hidden = !has;
                    $("uploadZone").classList.toggle("hidden", has);
                    $("compareWrap").classList.toggle("visible", has);
                }

                function renderFileList() {
                    var list = $("fileList");
                    list.innerHTML = "";
                    $("fileCount").textContent = files.length;
                    files.forEach(function (item) {
                        var row = document.createElement("div");
                        row.className = "file-item" + (item.id === activeId ? " active" : "");
                        row.dataset.id = item.id;

                        var thumb = document.createElement("img");
                        thumb.className = "file-thumb";
                        thumb.src = item.thumbUrl;
                        thumb.alt = "";

                        var info = document.createElement("div");
                        info.className = "file-info";
                        var name = document.createElement("div");
                        name.className = "file-name";
                        name.textContent = item.file.name;
                        name.title = item.file.name;
                        var size = document.createElement("div");
                        size.className = "file-size";
                        var orig = formatSize(item.file.size);
                        if (item.compressedBlob) {
                            var sv = formatSavings(item.file.size, item.compressedBlob.size);
                            var suffix = item.keptOriginal ? "，已保留原图" : "";
                            var cls = sv.increased ? "increase" : "saved";
                            size.innerHTML = orig + ' → <span class="' + cls + '">' + formatSize(item.compressedBlob.size) + " (" + sv.text + ")" + suffix + "</span>";
                        } else {
                            size.textContent = orig;
                        }
                        info.appendChild(name);
                        info.appendChild(size);

                        var rm = document.createElement("button");
                        rm.type = "button";
                        rm.className = "file-remove";
                        rm.innerHTML = "×";
                        rm.title = "移除";
                        rm.addEventListener("click", function (e) {
                            e.stopPropagation();
                            removeFile(item.id);
                        });

                        row.appendChild(thumb);
                        row.appendChild(info);
                        row.appendChild(rm);
                        row.addEventListener("click", function () {
                            activeId = item.id;
                            updateUI();
                            scheduleCompress(activeId);
                        });
                        list.appendChild(row);
                    });
                }

                function updatePreview() {
                    var item = getActive();
                    if (!item) {
                        $("imgOriginal").removeAttribute("src");
                        $("imgCompressed").removeAttribute("src");
                        $("statOriginal").textContent = "—";
                        $("statCompressed").textContent = "—";
                        $("statSaved").textContent = "—";
                        $("statDim").textContent = "—";
                        return;
                    }
                    $("imgOriginal").src = item.originalUrl;
                    if (item.compressedUrl) {
                        $("imgCompressed").src = item.compressedUrl;
                    } else {
                        $("imgCompressed").removeAttribute("src");
                    }
                    $("statOriginal").textContent = formatSize(item.file.size);
                    if (item.compressedBlob) {
                        $("statCompressed").textContent = formatSize(item.compressedBlob.size);
                        var sv = formatSavings(item.file.size, item.compressedBlob.size);
                        $("statSaved").textContent = sv.text + (item.keptOriginal ? "（已保留原图）" : "");
                        $("statSaved").className = "stat-value " + (sv.increased ? "increase" : "saved");
                    } else {
                        $("statCompressed").textContent = "—";
                        $("statSaved").textContent = "—";
                        $("statSaved").className = "stat-value saved";
                    }
                    if (item.image) {
                        var d = item.outputDims || calcDimensions(item.image.naturalWidth, item.image.naturalHeight);
                        var orig = item.image.naturalWidth + " × " + item.image.naturalHeight;
                        if (d.w !== item.image.naturalWidth || d.h !== item.image.naturalHeight) {
                            $("statDim").textContent = orig + " → " + d.w + " × " + d.h;
                        } else {
                            $("statDim").textContent = orig;
                        }
                    } else {
                        $("statDim").textContent = "—";
                    }
                }

                function updateUI() {
                    renderFileList();
                    updatePreview();
                    updateFormatHint();
                    updateButtons();
                }

                function scheduleCompress(id) {
                    if (compressTimer) clearTimeout(compressTimer);
                    compressTimer = setTimeout(function () {
                        if (id) compressItemById(id);
                    }, 300);
                }

                async function compressItemById(id) {
                    var item = files.find(function (f) { return f.id === id; });
                    if (!item) return;
                    $("processing").classList.add("visible");
                    try {
                        await compressOneItem(item);
                        if (activeId === id) updatePreview();
                        renderFileList();
                        updateButtons();
                    } catch (e) {
                        console.error(e);
                    } finally {
                        $("processing").classList.remove("visible");
                    }
                }

                async function compressAll() {
                    if (!files.length) return;
                    $("processing").classList.add("visible");
                    try {
                        for (var i = 0; i < files.length; i++) {
                            await compressOneItem(files[i]);
                        }
                        updateUI();
                    } catch (e) {
                        console.error(e);
                    } finally {
                        $("processing").classList.remove("visible");
                    }
                }

                function downloadItem(item) {
                    if (!item || !item.compressedBlob) return;
                    var ext = extFromMime(item.outputMime || "image/jpeg");
                    var base = item.file.name.replace(/\.[^.]+$/, "");
                    var suffix = item.keptOriginal ? "" : "_compressed";
                    var a = document.createElement("a");
                    a.href = item.compressedUrl;
                    a.download = base + suffix + "." + ext;
                    a.click();
                }

                function downloadAll() {
                    files.forEach(function (item, i) {
                        if (!item.compressedBlob) return;
                        setTimeout(function () { downloadItem(item); }, i * 200);
                    });
                }

                function setPreset(name) {
                    preset = name;
                    var buttons = $("presetSeg").querySelectorAll("button");
                    buttons.forEach(function (btn) {
                        btn.classList.toggle("active", btn.dataset.preset === name);
                    });
                    var isTarget = name === "target";
                    var isCustom = name === "custom";
                    $("qualityField").style.display = isTarget ? "none" : "";
                    $("targetSizeField").classList.toggle("visible", isTarget);
                    if (!isCustom && PRESETS[name]) {
                        $("qualityRange").value = Math.round(PRESETS[name].quality * 100);
                        $("qualityVal").textContent = $("qualityRange").value + "%";
                    }
                    updateFormatHint();
                    if (files.length) scheduleCompress(activeId);
                }

                $("presetSeg").addEventListener("click", function (e) {
                    var btn = e.target.closest("button[data-preset]");
                    if (btn) setPreset(btn.dataset.preset);
                });

                $("qualityRange").addEventListener("input", function () {
                    $("qualityVal").textContent = this.value + "%";
                    preset = "custom";
                    $("presetSeg").querySelectorAll("button").forEach(function (btn) {
                        btn.classList.toggle("active", btn.dataset.preset === "custom");
                    });
                    $("qualityField").style.display = "";
                    $("targetSizeField").classList.remove("visible");
                    if (files.length) scheduleCompress(activeId);
                });

                ["formatSel", "targetSizeKb", "maxWidth", "maxHeight"].forEach(function (id) {
                    $(id).addEventListener("change", function () {
                        updateFormatHint();
                        if (files.length) scheduleCompress(activeId);
                    });
                });

                $("resizeEnable").addEventListener("change", function () {
                    $("maxWidth").disabled = !this.checked;
                    $("maxHeight").disabled = !this.checked;
                    if (files.length) scheduleCompress(activeId);
                });

                $("uploadZone").addEventListener("click", function () { $("fileIn").click(); });
                $("btnAddMore").addEventListener("click", function () { $("fileIn").click(); });
                $("fileIn").addEventListener("change", function (e) {
                    if (e.target.files && e.target.files.length) addFiles(e.target.files);
                    e.target.value = "";
                });

                var zone = $("uploadZone");
                ["dragenter", "dragover"].forEach(function (ev) {
                    zone.addEventListener(ev, function (e) {
                        e.preventDefault();
                        zone.classList.add("dragover");
                    });
                });
                ["dragleave", "drop"].forEach(function (ev) {
                    zone.addEventListener(ev, function (e) {
                        e.preventDefault();
                        zone.classList.remove("dragover");
                    });
                });
                zone.addEventListener("drop", function (e) {
                    if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
                });
                document.body.addEventListener("dragover", function (e) { e.preventDefault(); });
                document.body.addEventListener("drop", function (e) {
                    e.preventDefault();
                    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
                        addFiles(e.dataTransfer.files);
                    }
                });

                $("btnCompress").addEventListener("click", function () {
                    if (activeId) compressItemById(activeId);
                });
                $("btnCompressAll").addEventListener("click", compressAll);
                $("btnDownload").addEventListener("click", function () { downloadItem(getActive()); });
                $("btnDownloadAll").addEventListener("click", downloadAll);
                $("btnClear").addEventListener("click", clearAll);
            })();
        </script>
            <script src="libs/tool-form-persist.js"></script>
    </body>
</html>
