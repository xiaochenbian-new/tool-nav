<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>ASN.1 DER 解析</title>
        <script src="libs/asn1-der-tool.bundle.js"></script>
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                --bg: #f3f7ff;
                --card: #fff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
                --foot-bg: #f8fbff;
                --input-border: #cfdcf7;
                --toolbar-line: #e4edff;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
                overflow: hidden;
            }
            .page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                min-height: 0;
                gap: 10px;
            }
            .opts {
                flex-shrink: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                padding: 8px 12px;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 10px 16px;
            }
            .opts-title {
                font-size: 14px;
                font-weight: 600;
                color: #324a76;
            }
            .split {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                gap: 10px;
                align-items: stretch;
            }
            .pane {
                flex: 1 1 0;
                min-width: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .pane-hd {
                flex-shrink: 0;
                padding: 8px 10px;
                font-weight: 600;
                font-size: 14px;
                color: #324a76;
                background: var(--foot-bg);
                border-bottom: 1px solid var(--toolbar-line);
            }
            .pane-body {
                flex: 1;
                min-height: 0;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 0;
            }
            .pane-ta {
                flex: 1;
                width: 100%;
                min-height: 120px;
                border: 1px solid var(--input-border);
                border-radius: 8px;
                padding: 10px;
                font-family: Consolas, "Courier New", monospace;
                font-size: 14px;
                line-height: 1.55;
                resize: none;
                outline: none;
                background: #fff;
                color: var(--text);
            }
            .pane-ta-pre {
                white-space: pre;
            }
            .pane-ta:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.12);
            }
            .pane-ta[readonly] {
                background: #fafcff;
            }
            .foot {
                flex-shrink: 0;
                border-top: 1px solid var(--toolbar-line);
                background: var(--foot-bg);
                padding: 8px 10px;
                display: flex;
                flex-wrap: wrap;
                gap: 10px 14px;
                align-items: center;
            }
            .foot label {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                font-size: 13px;
                color: var(--text);
            }
            .foot .foot-hint {
                flex: 1 1 100%;
                margin: 0;
                font-size: 12px;
                color: var(--muted);
                line-height: 1.45;
            }
            .foot .foot-hint code {
                font-size: 11px;
                background: #eef3ff;
                padding: 1px 5px;
                border-radius: 4px;
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 6px 12px;
                font-size: 13px;
                cursor: pointer;
            }
            .btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .out-wrap {
                position: relative;
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }
            .out-empty {
                position: absolute;
                inset: 0;
                display: none;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                color: var(--muted);
                font-size: 13px;
                pointer-events: none;
                background: #fafcff;
                border-radius: 8px;
                z-index: 1;
            }
            .out-empty.visible {
                display: flex;
            }
            .out-empty-icon {
                width: 40px;
                height: 32px;
                border: 2px solid #cfdcf7;
                border-radius: 4px;
                position: relative;
                opacity: 0.85;
            }
            .out-empty-icon::before {
                content: "";
                position: absolute;
                left: 5px;
                right: 5px;
                top: -5px;
                height: 7px;
                border: 2px solid #cfdcf7;
                border-bottom: none;
                border-radius: 4px 4px 0 0;
            }
            input[type="radio"] {
                accent-color: var(--primary);
            }
            @media (max-width: 820px) {
                .split {
                    flex-direction: column;
                }
            }
        </style>
    
    <!-- 外壳注入：清除 body/根容器内边距 + 隐藏根滚动条，使工具内容宽度与导航栏一致（file:// 跨域下由页面自带） -->
    <style id="tool-shell-flush">
        body{padding:0!important;}
        body>*{padding:0!important;margin:0!important;}
        html::-webkit-scrollbar{width:0!important;height:0!important;}
        html{scrollbar-width:none!important;}
    </style>
    </head>
    <body>
        <div class="page">
            <div class="opts">
                <span class="opts-title">ASN.1 DER 解析</span>
            </div>
            <div class="split">
                <section class="pane">
                    <div class="pane-hd">输入</div>
                    <div class="pane-body">
                        <textarea id="derIn" class="pane-ta" placeholder="例如 3082… 或 MII…"></textarea>
                    </div>
                    <div class="foot">
                        <button type="button" class="btn" id="asn1Run" title="解析">▶</button>
                        <span style="font-size: 13px; color: var(--muted)">输入格式</span>
                        <label><input type="radio" name="fmt" value="auto" checked /> 自动</label>
                        <label><input type="radio" name="fmt" value="hex" /> 十六进制</label>
                        <label><input type="radio" name="fmt" value="b64" /> Base64</label>
                        <p class="foot-hint">输入十六进制或 Base64（自动识别）；输出 DER 结构的 XML（<code>ASN1.decode</code> / <code>ASN1TOXML.decode2Xml</code>）。</p>
                    </div>
                </section>
                <section class="pane">
                    <div class="pane-hd">解析结果</div>
                    <div class="pane-body">
                        <div class="out-wrap">
                            <div id="asn1Empty" class="out-empty visible">
                                <span class="out-empty-icon" aria-hidden="true"></span>
                                <span>暂无输出</span>
                            </div>
                            <textarea id="xmlOut" class="pane-ta pane-ta-pre" readonly placeholder="XML"></textarea>
                        </div>
                    </div>
                </section>
            </div>
        </div>
        <script>
            (function () {
                if (typeof window.ASN1 === "undefined" || typeof window.ASN1TOXML === "undefined") {
                    document.getElementById("xmlOut").value = "未加载 asn1-der-tool.bundle.js";
                    document.getElementById("asn1Empty").classList.remove("visible");
                    return;
                }
                function normalizeHex(s) {
                    return (s || "").replace(/0x/gi, "").replace(/[^0-9a-fA-F]/g, "");
                }
                function looksLikeHex(s) {
                    var t = normalizeHex(s);
                    return t.length > 0 && /^[0-9a-fA-F]+$/.test(t) && t.length % 2 === 0;
                }
                function hexToU8(hex) {
                    var u8 = new Uint8Array(hex.length / 2);
                    for (var i = 0; i < u8.length; i++) {
                        u8[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16);
                    }
                    return u8;
                }
                function b64ToU8(s) {
                    var t = (s || "").replace(/\s+/g, "");
                    var bin = atob(t);
                    var u8 = new Uint8Array(bin.length);
                    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
                    return u8;
                }
                var tmr = null;
                function syncEmpty() {
                    var v = document.getElementById("xmlOut").value;
                    document.getElementById("asn1Empty").classList.toggle("visible", !v || !String(v).trim());
                }
                function run() {
                    var raw = document.getElementById("derIn").value.trim();
                    var out = document.getElementById("xmlOut");
                    out.value = "";
                    if (!raw) {
                        syncEmpty();
                        return;
                    }
                    var fmt = (document.querySelector("input[name=fmt]:checked") || {}).value || "auto";
                    var u8;
                    try {
                        if (fmt === "hex") {
                            u8 = hexToU8(normalizeHex(raw));
                        } else if (fmt === "b64") {
                            u8 = b64ToU8(raw);
                        } else {
                            if (looksLikeHex(raw)) u8 = hexToU8(normalizeHex(raw));
                            else u8 = b64ToU8(raw);
                        }
                        var asn1 = window.ASN1.decode(u8);
                        out.value = window.ASN1TOXML.decode2Xml(asn1);
                    } catch (e) {
                        out.value = "解析失败: " + (e && e.message ? e.message : e);
                    }
                    syncEmpty();
                }
                document.getElementById("derIn").addEventListener("input", function () {
                    clearTimeout(tmr);
                    tmr = setTimeout(run, 80);
                });
                Array.prototype.forEach.call(document.querySelectorAll("input[name=fmt]"), function (r) {
                    r.addEventListener("change", run);
                });
                document.getElementById("asn1Run").addEventListener("click", function () {
                    clearTimeout(tmr);
                    run();
                });
                run();
            })();
            document.addEventListener("contextmenu", function (e) {
                e.preventDefault();
            });
        </script>
            <script src="libs/tool-form-persist.js"></script>
    </body>
</html>
