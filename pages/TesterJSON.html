<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>解析 Talend API Tester 为文档</title>
        <link rel="stylesheet" href="libs/tool-danger-btn.css" />
        <script src="libs/tool-copy.js"></script>
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                --bg: #f3f7ff;
                --card: #ffffff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --border: #dbe6ff;
                --shadow: 0 10px 24px rgba(36, 90, 190, 0.12);
            }
            body {
                margin: 0;
                min-height: 100vh;
                padding: 8px;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                background: var(--bg);
            }
            .page {
                display: flex;
                height: calc(100vh - 16px);
            }
            .container {
                display: flex;
                flex: 1;
                min-height: 0;
                gap: 8px;
            }
            .panel {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                min-height: 0;
                min-width: 0;
                overflow: hidden;
            }
            .input-panel {
                flex: 0 0 38%;
            }
            .output-panel {
                flex: 1;
            }
            .panel-title {
                padding: 8px 10px;
                font-size: 14px;
                color: #324a76;
                border-bottom: 1px solid #e4edff;
                background: #f8fbff;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                flex-wrap: wrap;
                flex-shrink: 0;
            }
            .panel-title-actions {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-wrap: wrap;
            }
            .title-btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 4px 10px;
                font-size: 13px;
                cursor: pointer;
                font-family: inherit;
            }
            .title-btn:hover:not(:disabled) {
                border-color: var(--primary);
                color: var(--primary);
            }
            .title-btn:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }
            .panel-body {
                flex: 1;
                min-height: 0;
                padding: 8px;
                display: flex;
                flex-direction: column;
            }
            #input-json,
            #output-doc {
                width: 100%;
                flex: 1;
                resize: none;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                outline: none;
                padding: 10px;
                font-size: 13px;
                line-height: 1.6;
                font-family: Consolas, "Courier New", "Segoe UI", monospace;
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
                min-height: 0;
            }
            #input-json:focus,
            #output-doc:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.15);
            }
            #output-doc:disabled {
                background: #f8fbff;
                color: var(--muted);
                cursor: not-allowed;
            }
            @media (max-width: 900px) {
                .container {
                    flex-direction: column;
                }
                .input-panel {
                    flex: none;
                    min-height: 240px;
                }
                .output-panel {
                    min-height: 280px;
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="container">
                <div class="panel input-panel">
                    <div class="panel-title">
                        <span>输入 JSON</span>
                        <div class="panel-title-actions">
                            <button type="button" class="title-btn" id="parse-btn" title="解析 JSON">解析</button>
                            <button type="button" class="title-btn danger" id="clear-btn" title="清除输入与文档">清除</button>
                        </div>
                    </div>
                    <div class="panel-body">
                        <textarea id="input-json" placeholder='{"entities":[{"items":[...]}]}'></textarea>
                    </div>
                </div>
                <div class="panel output-panel">
                    <div class="panel-title">
                        <span>接口文档</span>
                        <div class="panel-title-actions">
                            <button type="button" class="title-btn" id="copy-btn" title="复制文档" disabled>复制</button>
                            <button type="button" class="title-btn" id="export-btn" title="导出 Markdown" disabled>导出</button>
                        </div>
                    </div>
                    <div class="panel-body">
                        <textarea id="output-doc" disabled placeholder="解析后在此编辑接口文档…"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function parseFlexibleJson(text) {
                const raw = text.trim();
                if (!raw) throw new Error("empty");
                try {
                    return JSON.parse(raw);
                } catch (firstError) {
                    try {
                        const unescaped = raw.replace(/^\s*["']|["']\s*$/g, "").replace(/\\"/g, '"').replace(/\\n/g, "");
                        return JSON.parse(unescaped);
                    } catch (secondError) {
                        try {
                            // 有些导出内容是被二次 stringify 的字符串
                            const parsed = JSON.parse(raw);
                            if (typeof parsed === "string") return JSON.parse(parsed);
                            throw secondError;
                        } catch (thirdError) {
                            throw firstError;
                        }
                    }
                }
            }

            function getNodeName(node) {
                if (!node || typeof node !== "object") return "";
                return String(node?.entity?.name || node?.name || "").trim();
            }

            function isRequestNode(node) {
                return node?.entity?.type === "Request" || !!node?.request;
            }

            function collectRequestItemsFromNode(node, collector, nameChain) {
                nameChain = nameChain || [];
                if (!node) return;
                if (Array.isArray(node)) {
                    node.forEach(function (n) {
                        collectRequestItemsFromNode(n, collector, nameChain);
                    });
                    return;
                }
                if (typeof node !== "object") return;

                if (isRequestNode(node)) {
                    const reqName = getNodeName(node) || "未命名接口";
                    collector.push({
                        item: node,
                        nameChain: nameChain.concat([reqName])
                    });
                    return;
                }

                let chain = nameChain;
                const name = getNodeName(node);
                if (name) chain = nameChain.concat([name]);

                if (Array.isArray(node.items)) collectRequestItemsFromNode(node.items, collector, chain);
                if (Array.isArray(node.entities)) collectRequestItemsFromNode(node.entities, collector, chain);
                if (Array.isArray(node.children)) collectRequestItemsFromNode(node.children, collector, chain);
            }

            function commonNamePrefix(chains) {
                if (!chains.length) return [];
                let prefix = chains[0].slice();
                for (let i = 1; i < chains.length; i++) {
                    const chain = chains[i];
                    let j = 0;
                    while (j < prefix.length && j < chain.length && prefix[j] === chain[j]) j++;
                    prefix = prefix.slice(0, j);
                    if (!prefix.length) break;
                }
                return prefix;
            }

            function sanitizeFileName(name) {
                return (
                    String(name)
                        .replace(/[\\/:*?"<>|\r\n]/g, "_")
                        .replace(/\s+/g, " ")
                        .trim()
                        .slice(0, 180) || "TesterAPI文档"
                );
            }

            function buildExportFileName(entries) {
                const chains = entries.map(function (entry) {
                    return entry.nameChain && entry.nameChain.length ? entry.nameChain : ["未命名接口"];
                });
                let names = chains.length === 1 ? chains[0].slice() : commonNamePrefix(chains);
                if (!names.length && chains[0]) {
                    names = chains[0].length > 1 ? chains[0].slice(0, -1) : chains[0].slice();
                }
                if (!names.length) names = ["TesterAPI文档"];
                return sanitizeFileName(names.join("-")) + ".md";
            }

            function formatItemMarkdown(entry) {
                const item = entry.item;
                const name = (entry.nameChain && entry.nameChain[entry.nameChain.length - 1]) || getNodeName(item) || "未命名接口";
                const meta = extractRequestMeta(item);
                const uri = meta.uri || "(未识别到 URL)";
                const method = meta.method || "GET";
                const params = method === "GET" ? meta.queryParams : meta.bodyParams || meta.queryParams;
                return (
                    "## " +
                    name +
                    "\n\n- 接口 URI: " +
                    uri +
                    "\n- 请求方式: " +
                    method +
                    "\n- 接口参数:\n\n```\n" +
                    (params || "(无参数)") +
                    "\n```\n"
                );
            }

            function buildDocumentText(entries) {
                return entries.map(formatItemMarkdown).join("\n");
            }

            let lastParsed = { fileName: "" };

            function getOutputDoc() {
                return document.getElementById("output-doc");
            }

            function setResultActionsEnabled(enabled) {
                document.getElementById("copy-btn").disabled = !enabled;
                document.getElementById("export-btn").disabled = !enabled;
                getOutputDoc().disabled = !enabled;
            }

            function parseQueryParams(queryList) {
                if (!queryList) return "";
                const lines = [];
                if (Array.isArray(queryList)) {
                    queryList.forEach((item) => {
                        if (!item || item.enabled === false) return;
                        const name = item.name || item.key || "";
                        const rawValue = item.value ?? item.val ?? item.defaultValue ?? "";
                        const value = typeof rawValue === "string" ? rawValue.replace(/^"|"$/g, "") : rawValue;
                        if (name) lines.push(name + "=" + (value ?? ""));
                    });
                    return lines.join("\n");
                }
                if (typeof queryList === "string") {
                    const str = queryList.trim().replace(/^\?/, "");
                    if (!str) return "";
                    str.split("&").forEach((pair) => {
                        if (!pair) return;
                        const idx = pair.indexOf("=");
                        if (idx === -1) {
                            lines.push(pair);
                        } else {
                            lines.push(pair.slice(0, idx) + "=" + pair.slice(idx + 1));
                        }
                    });
                    return lines.join("\n");
                }
                if (typeof queryList === "object") {
                    if (Array.isArray(queryList.items)) {
                        return parseQueryParams(queryList.items);
                    }
                    Object.keys(queryList).forEach((k) => {
                        if (k === "delimiter" || k === "items") return;
                        lines.push(k + "=" + (queryList[k] ?? ""));
                    });
                    return lines.join("\n");
                }
                return "";
            }

            function parseBodyText(textBody) {
                if (!textBody) return "";
                if (typeof textBody === "object") {
                    try {
                        return JSON.stringify(textBody, null, 2);
                    } catch (error) {
                        return String(textBody);
                    }
                }
                try {
                    const normalized = textBody.replace(/\\n/g, "").replace(/\\"/g, '"');
                    return JSON.stringify(JSON.parse(normalized), null, 2);
                } catch (error) {
                    return textBody;
                }
            }

            function firstNonEmptyString(candidates) {
                for (let i = 0; i < candidates.length; i++) {
                    const v = candidates[i];
                    if (typeof v === "string" && v.trim()) return v.trim();
                }
                return "";
            }

            function buildUriString(uriObj) {
                if (!uriObj) return "";
                if (typeof uriObj === "string") return uriObj;
                const schemeName = uriObj?.scheme?.name || "";
                const host = uriObj?.host || "";
                const path = uriObj?.path || "";
                let query = parseQueryParams(uriObj?.query);
                if (query) {
                    const delimiter = uriObj?.query?.delimiter || "&";
                    query = query.replace(/\n/g, delimiter);
                }
                let url = "";
                if (host) {
                    if (schemeName) {
                        url = schemeName + "://" + host + path;
                    } else {
                        url = host + path;
                    }
                } else {
                    url = path;
                }
                if (query) {
                    url += (url.includes("?") ? "&" : "?") + query;
                }
                return url;
            }

            function extractRequestMeta(item) {
                const request = item?.request || item?.entity || {};
                const pathObj = request.path || {};
                const method = firstNonEmptyString([
                    request?.method?.name,
                    request?.method,
                    request?.httpMethod,
                    item?.entity?.method
                ]) || "GET";

                const uri = firstNonEmptyString([
                    pathObj?.uri,
                    pathObj?.url,
                    request?.uri,
                    request?.url,
                    request?.endpoint,
                    request?.path,
                    item?.entity?.uri,
                    item?.entity?.url,
                    item?.entity?.path,
                    buildUriString(request?.uri),
                    buildUriString(item?.entity?.uri)
                ]) || buildUriString(request?.uri) || buildUriString(item?.entity?.uri);

                const queryParams =
                    parseQueryParams(pathObj?.query) ||
                    parseQueryParams(pathObj?.queryString) ||
                    parseQueryParams(request?.query) ||
                    parseQueryParams(request?.queryString) ||
                    parseQueryParams(request?.params) ||
                    parseQueryParams(request?.parameters) ||
                    parseQueryParams(request?.uri?.query) ||
                    parseQueryParams(item?.entity?.uri?.query);

                const bodyParams =
                    parseBodyText(request?.body?.textBody) ||
                    parseBodyText(request?.body?.raw) ||
                    parseBodyText(request?.body?.json) ||
                    parseBodyText(request?.body?.form) ||
                    parseBodyText(request?.body?.formData) ||
                    parseBodyText(request?.payload) ||
                    parseBodyText(request?.body) ||
                    parseBodyText(item?.entity?.body?.textBody) ||
                    parseBodyText(item?.entity?.body?.raw) ||
                    parseBodyText(item?.entity?.body?.json) ||
                    parseBodyText(item?.entity?.body);

                return {
                    request: request,
                    method: method,
                    uri: uri,
                    queryParams: queryParams,
                    bodyParams: bodyParams
                };
            }

            function parseJson() {
                const input = document.getElementById("input-json").value.trim();
                const outputDoc = getOutputDoc();
                outputDoc.value = "";
                lastParsed = { fileName: "" };
                setResultActionsEnabled(false);
                if (!input) {
                    alert("请输入 JSON 内容");
                    return;
                }
                let data;
                try {
                    data = parseFlexibleJson(input);
                } catch (error) {
                    alert("JSON 格式错误，请检查后再试");
                    return;
                }

                const requestItems = [];
                collectRequestItemsFromNode(data, requestItems, []);
                if (requestItems.length === 0) {
                    outputDoc.value = "没有可解析的 Request 项目。";
                    return;
                }

                outputDoc.value = buildDocumentText(requestItems);
                lastParsed = {
                    fileName: buildExportFileName(requestItems)
                };
                setResultActionsEnabled(true);
            }

            document.getElementById("parse-btn").addEventListener("click", parseJson);
            document.getElementById("clear-btn").addEventListener("click", function () {
                document.getElementById("input-json").value = "";
                getOutputDoc().value = "";
                lastParsed = { fileName: "" };
                setResultActionsEnabled(false);
            });
            document.getElementById("copy-btn").addEventListener("click", function () {
                ToolCopy.copy(getOutputDoc().value, { onLabelEl: this, labelText: "复制" });
            });
            document.getElementById("export-btn").addEventListener("click", function () {
                const text = getOutputDoc().value.trim();
                if (!text) return;
                const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = lastParsed.fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                ToolCopy.toast("已导出 " + lastParsed.fileName);
            });
            document.addEventListener("contextmenu", function (event) {
                event.preventDefault();
            });
        </script>
    </body>
</html>
