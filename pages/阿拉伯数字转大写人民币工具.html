        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            :root {
                --card: #ffffff;
                --bg: #f3f7ff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
                --toolbar-bg: #f8fbff;
                --toolbar-line: #e4edff;
                --input-border: #cfdcf7;
                --chip-bg: #edf3ff;
                --chip-text: #3c4f78;
                --chip-border: #d8e5ff;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
            }
            .page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .editor-wrap {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                overflow: hidden;
            }
            .panel-title {
                flex-shrink: 0;
                padding: 8px 10px;
                border-bottom: 1px solid var(--toolbar-line);
                background: var(--toolbar-bg);
            }
            .editor-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                flex-wrap: wrap;
            }
            .editor-head-main {
                display: flex;
                flex-direction: column;
                gap: 4px;
                min-width: 0;
                flex: 1;
            }
            .title-with-action {
                display: flex;
                align-items: center;
                gap: 6px;
                min-width: 0;
            }
            .editor-head h3 {
                font-size: 14px;
                font-weight: 600;
                color: #324a76;
            }
            .editor-head .hint {
                font-size: 12px;
                color: var(--muted);
                line-height: 1.55;
                max-width: 720px;
            }
            .editor-head .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
                flex-shrink: 0;
            }
            .title-btn {
                border: 1px solid var(--chip-border);
                border-radius: 6px;
                background: var(--chip-bg);
                color: var(--chip-text);
                padding: 4px 10px;
                font-size: 13px;
                cursor: pointer;
                font-family: inherit;
                white-space: nowrap;
            }
            .title-btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .title-btn.primary {
                color: #fff;
                border-color: transparent;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            .title-btn.primary:hover {
                filter: brightness(1.05);
                color: #fff;
            }
            .editor-zone {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                padding: 10px;
                gap: 10px;
                overflow: hidden;
            }
            .io-grid {
                flex: 1;
                min-height: 0;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                align-items: stretch;
            }
            @media (max-width: 820px) {
                .io-grid {
                    grid-template-columns: 1fr;
                }
            }
            .io-col {
                display: flex;
                flex-direction: column;
                gap: 8px;
                min-height: 0;
                min-width: 0;
            }
            .io-col > label {
                font-size: 12px;
                font-weight: 600;
                color: #324a76;
            }
            #amount-in {
                width: 100%;
                border: 1px solid var(--input-border);
                border-radius: 8px;
                padding: 10px 12px;
                font-size: 15px;
                line-height: 1.5;
                font-family: Consolas, "Courier New", "PingFang SC", monospace;
                color: var(--text);
                background: #fff;
                outline: none;
            }
            #amount-in:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.15);
            }
            #amount-in::placeholder {
                color: #9aa8c4;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
                font-size: 13px;
            }
            .samples-row {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 6px;
            }
            .opt-label {
                font-size: 12px;
                color: var(--muted);
                white-space: nowrap;
            }
            .samples {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }
            .sample {
                border: 1px solid var(--chip-border);
                border-radius: 6px;
                background: var(--chip-bg);
                padding: 4px 10px;
                font-size: 12px;
                color: var(--chip-text);
                cursor: pointer;
                font-family: Consolas, "Courier New", monospace;
            }
            .sample:hover {
                border-color: var(--primary);
                color: var(--primary);
                background: rgba(47, 107, 255, 0.06);
            }
            #amount-out {
                flex: 1;
                min-height: 88px;
                width: 100%;
                resize: vertical;
                border: 1px solid var(--input-border);
                border-radius: 8px;
                background: #fafcff;
                padding: 12px 14px;
                font-size: 17px;
                line-height: 1.7;
                letter-spacing: 0.06em;
                color: #1a3260;
                word-break: break-all;
                overflow-y: auto;
                outline: none;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", serif;
            }
            #amount-out:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.15);
            }
            #amount-out::placeholder {
                color: #9aa8c4;
                font-size: 13px;
                letter-spacing: normal;
            }
            #status {
                font-size: 12px;
                min-height: 16px;
                color: var(--muted);
            }
            #status.err {
                color: #c0392b;
            }
            #copy-toast {
                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%) translateY(10px);
                padding: 8px 16px;
                background: rgba(31, 42, 68, 0.92);
                color: #fff;
                border-radius: 8px;
                font-size: 13px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease, transform 0.2s ease;
                z-index: 100000;
                box-shadow: 0 4px 16px rgba(36, 90, 190, 0.2);
            }
            #copy-toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        </style>

    <body>
        <div class="page">
            <div class="editor-wrap">
                <div class="panel-title editor-head">
                    <div class="editor-head-main">
                        <div class="title-with-action">
                            <h3>阿拉伯数字 ↔ 大写人民币</h3>
                            <button
                                type="button"
                                class="tool-help-btn"

                                aria-label="查看各语言工具类代码"

                            双向转换：左侧阿拉伯数字与右侧大写金额（壹贰叁…元角分整）实时联动。支持负号、千分位逗号；整数最多 15 位、小数最多 2 位。反向识别本工具生成的大写格式，亦兼容圆/负/常用异体字。

                    </div>
                    <div class="actions">

                <div class="editor-zone">

                            <input

        <script src="libs/tool-copy.js"></script>
        <script src="libs/rmb-code-samples.js"></script>
        <script>
            (function () {
                var CN_NUM = ["\u96f6", "\u58f9", "\u8d30", "\u53c1", "\u8086", "\u4f0d", "\u9646", "\u67d2", "\u634c", "\u7396"];
                var CN_UNIT = ["", "\u62fe", "\u4f70", "\u4edf"];
                var CN_SEC = ["", "\u4e07", "\u4ebf", "\u5146"];
                var SAMPLES = ["0", "10.01", "1000", "1234.56", "100000000", "2003004005.06", "-88.8"];

                function normalizeInput(raw) {
                    return String(raw || "")
                        .trim()
                        .replace(/,/g, "")
                        .replace(/\uFF0C/g, "")
                        .replace(/\s+/g, "");
                }

                function convertSection(section) {
                    var str = "";
                    var zero = true;
                    var unitPos = 0;
                    while (section > 0) {
                        var v = section % 10;
                        if (v === 0) {
                            if (!zero && unitPos > 0) {
                                str = CN_NUM[0] + str;
                            }
                            zero = true;
                        } else {
                            str = CN_NUM[v] + CN_UNIT[unitPos] + str;
                            zero = false;
                        }
                        unitPos += 1;
                        section = Math.floor(section / 10);
                    }
                    return str;
                }

                function convertInteger(n) {
                    if (n === 0) return "";
                    var str = "";
                    var secIndex = 0;
                    var needZero = false;
                    while (n > 0) {
                        var section = n % 10000;
                        if (needZero && section > 0 && section < 1000) {
                            str = CN_NUM[0] + str;
                        }
                        var sectionStr = convertSection(section);
                        if (section > 0) {
                            str = sectionStr + CN_SEC[secIndex] + str;
                            needZero = section < 1000;
                        } else if (str) {
                            needZero = true;
                        }
                        n = Math.floor(n / 10000);
                        secIndex += 1;
                    }
                    return str;
                }

                function polish(s) {
                    return s
                        .replace(/\u96f6+/g, CN_NUM[0])
                        .replace(/\u96f6([\u4e07\u4ebf\u5146])/g, "$1")
                        .replace(/([\u58f9\u8d30\u53c1\u8086\u4f0d\u9646\u67d2\u634c\u7396\u62fe\u4f70\u4edf\u4e07\u4ebf\u5146]+)\u96f6\u5143/g, "$1\u5143")
                        .replace(/\u96f6\u89d2/g, "")
                        .replace(/\u96f6\u5206$/, "")
                        .replace(/\u4ebf\u4e07/g, "\u4ebf");
                }

                function toRmbUppercase(raw) {
                    var s = normalizeInput(raw);
                    if (!s) {
                        return { ok: false, msg: "\u8bf7\u8f93\u5165\u91d1\u989d" };
                    }
                    var negative = false;
                    if (s.charAt(0) === "-") {
                        negative = true;
                        s = s.slice(1);
                    } else if (s.charAt(0) === "+") {
                        s = s.slice(1);
                    }
                    if (!s || !/^\d+(\.\d+)?$/.test(s)) {
                        return { ok: false, msg: "\u683c\u5f0f\u65e0\u6548\uff0c\u4ec5\u652f\u6301\u6570\u5b57\u3001\u53ef\u9009\u8d1f\u53f7\u4e0e\u6700\u591a\u4e24\u4f4d\u5c0f\u6570" };
                    }
                    if (s.indexOf(".") >= 0) {
                        var frac = s.split(".")[1];
                        if (frac.length > 2) {
                            return { ok: false, msg: "\u5c0f\u6570\u4f4d\u6700\u591a 2 \u4f4d" };
                        }
                    }
                    var intPart = s.split(".")[0];
                    if (intPart.length > 15) {
                        return { ok: false, msg: "\u6574\u6570\u90e8\u5206\u4e0d\u80fd\u8d85\u8fc7 15 \u4f4d" };
                    }

                    var num = Number(s);
                    if (!isFinite(num)) {
                        return { ok: false, msg: "\u8bf7\u8f93\u5165\u6709\u6548\u6570\u5b57" };
                    }
                    num = Math.round(num * 100) / 100;
                    if (num === 0) {
                        return { ok: true, value: CN_NUM[0] + "\u5143\u6574" };
                    }

                    var abs = Math.abs(num);
                    var parts = abs.toFixed(2).split(".");
                    var intVal = parseInt(parts[0], 10);
                    var jiao = parseInt(parts[1].charAt(0), 10);
                    var fen = parseInt(parts[1].charAt(1), 10);

                    var result = "";
                    if (intVal > 0) {
                        result = convertInteger(intVal) + "\u5143";
                    } else {
                        result = CN_NUM[0] + "\u5143";
                    }

                    if (jiao === 0 && fen === 0) {
                        result += "\u6574";
                    } else {
                        if (jiao > 0) {
                            result += CN_NUM[jiao] + "\u89d2";
                        }
                        if (fen > 0) {
                            if (jiao === 0 && intVal > 0) {
                                result += CN_NUM[0];
                            }
                            result += CN_NUM[fen] + "\u5206";
                        }
                    }

                    result = polish(result);
                    if (negative) {
                        result = "\u8d1f" + result;
                    }
                    return { ok: true, value: result };
                }

                var CN_DIGIT_MAP = {
                    "\u96f6": 0,
                    "\u3007": 0,
                    "\u58f9": 1,
                    "\u4e00": 1,
                    "\u8d30": 2,
                    "\u4e8c": 2,
                    "\u4e24": 2,
                    "\u53c1": 3,
                    "\u4e09": 3,
                    "\u8086": 4,
                    "\u56db": 4,
                    "\u4f0d": 5,
                    "\u4e94": 5,
                    "\u9646": 6,
                    "\u516d": 6,
                    "\u67d2": 7,
                    "\u4e03": 7,
                    "\u634c": 8,
                    "\u516b": 8,
                    "\u7396": 9,
                    "\u4e5d": 9,
                };
                var CN_UNIT_MAP = {
                    "\u62fe": 10,
                    "\u5341": 10,
                    "\u4f70": 100,
                    "\u767e": 100,
                    "\u4edf": 1000,
                    "\u5343": 1000,
                    "\u4e07": 10000,
                    "\u842c": 10000,
                    "\u4ebf": 100000000,
                    "\u5104": 100000000,
                    "\u5146": 1000000000000000,
                };
                var CN_SECTION_UNITS = [10000, 100000000, 1000000000000000];
                var UPPER_SAMPLES = [
                    "\u96f6\u5143\u6574",
                    "\u58f9\u62fe\u5143\u6574",
                    "\u58f9\u4edf\u5143\u6574",
                    "\u58f9\u4edf\u8d30\u4f70\u53c1\u62fe\u8086\u5143\u4f0d\u89d2\u9646\u5206",
                    "\u8d1f\u634c\u62fe\u634c\u5143\u634c\u89d2",
                ];

                function normalizeUpperInput(raw) {
                    return String(raw || "")
                        .trim()
                        .replace(/\s+/g, "")
                        .replace(/,/g, "")
                        .replace(/\uFF0C/g, "")
                        .replace(/[\uFF08\uFF09()]/g, "")
                        .replace(/^\u4eba\u6c11\u5e01/, "");
                }

                function parseChineseInteger(str) {
                    if (!str || str === "\u96f6" || str === "\u3007") return 0;
                    var total = 0;
                    var section = 0;
                    var number = 0;
                    for (var i = 0; i < str.length; i++) {
                        var ch = str.charAt(i);
                        if (ch === "\u96f6" || ch === "\u3007") continue;
                        if (Object.prototype.hasOwnProperty.call(CN_DIGIT_MAP, ch)) {
                            number = CN_DIGIT_MAP[ch];
                        } else if (Object.prototype.hasOwnProperty.call(CN_UNIT_MAP, ch)) {
                            var unit = CN_UNIT_MAP[ch];
                            if (CN_SECTION_UNITS.indexOf(unit) >= 0) {
                                section = (section + number) * unit;
                                total += section;
                                section = 0;
                                number = 0;
                            } else {
                                if (number === 0) number = 1;
                                section += number * unit;
                                number = 0;
                            }
                        } else {
                            return NaN;
                        }
                    }
                    var n = total + section + number;
                    return isFinite(n) ? n : NaN;
                }

                function parseSubAmountPart(part) {
                    if (!part || part === "\u96f6" || part === "\u3007") return 0;
                    var n = parseChineseInteger(part);
                    if (!isFinite(n) || n < 0 || n > 9) return NaN;
                    return n;
                }

                function formatArabicAmount(num) {
                    var negative = num < 0;
                    var abs = Math.abs(num);
                    var cents = Math.round(abs * 100);
                    var intPart = Math.floor(cents / 100);
                    var jiao = Math.floor((cents % 100) / 10);
                    var fen = cents % 10;
                    var out = String(intPart);
                    if (jiao > 0 || fen > 0) {
                        out += ".";
                        if (fen > 0) out += String(jiao) + String(fen);
                        else out += String(jiao);
                    }
                    return (negative ? "-" : "") + out;
                }

                function fromRmbUppercase(raw) {
                    var s = normalizeUpperInput(raw);
                    if (!s) {
                        return { ok: false, msg: "\u8bf7\u8f93\u5165\u5927\u5199\u91d1\u989d" };
                    }
                    var negative = false;
                    if (s.charAt(0) === "\u8d1f" || s.charAt(0) === "\u8ca0") {
                        negative = true;
                        s = s.slice(1);
                    }
                    if (!s) {
                        return { ok: false, msg: "\u5927\u5199\u91d1\u989d\u683c\u5f0f\u65e0\u6548" };
                    }
                    if (s.charAt(s.length - 1) === "\u6574") {
                        s = s.slice(0, -1);
                    }
                    var yuanIdx = -1;
                    for (var i = 0; i < s.length; i++) {
                        var c = s.charAt(i);
                        if (c === "\u5143" || c === "\u5706") {
                            yuanIdx = i;
                            break;
                        }
                    }
                    var intStr = "";
                    var fracStr = "";
                    if (yuanIdx >= 0) {
                        intStr = s.slice(0, yuanIdx);
                        fracStr = s.slice(yuanIdx + 1);
                    } else if (/\u89d2|\u5206/.test(s)) {
                        fracStr = s;
                    } else {
                        intStr = s;
                    }
                    var intVal = 0;
                    if (intStr && intStr !== "\u96f6" && intStr !== "\u3007") {
                        intVal = parseChineseInteger(intStr);
                        if (!isFinite(intVal)) {
                            return { ok: false, msg: "\u5927\u5199\u91d1\u989d\u683c\u5f0f\u65e0\u6548" };
                        }
                    }
                    var jiao = 0;
                    var fen = 0;
                    if (fracStr) {
                        var jiaoIdx = fracStr.indexOf("\u89d2");
                        var fenIdx = fracStr.indexOf("\u5206");
                        if (jiaoIdx >= 0) {
                            var jPart = fracStr.slice(0, jiaoIdx);
                            jiao = parseSubAmountPart(jPart);
                            if (!isFinite(jiao)) {
                                return { ok: false, msg: "\u89d2\u4f4d\u683c\u5f0f\u65e0\u6548" };
                            }
                        }
                        if (fenIdx >= 0) {
                            var fStart = jiaoIdx >= 0 ? jiaoIdx + 1 : 0;
                            var fPart = fracStr.slice(fStart, fenIdx);
                            fen = parseSubAmountPart(fPart);
                            if (!isFinite(fen)) {
                                return { ok: false, msg: "\u5206\u4f4d\u683c\u5f0f\u65e0\u6548" };
                            }
                        }
                        var tail = fracStr.slice(fenIdx >= 0 ? fenIdx + 1 : jiaoIdx >= 0 ? jiaoIdx + 1 : 0);
                        if (tail && tail !== "\u96f6" && tail !== "\u3007") {
                            return { ok: false, msg: "\u5927\u5199\u91d1\u989d\u683c\u5f0f\u65e0\u6548" };
                        }
                    }
                    var num = intVal + jiao * 0.1 + fen * 0.01;
                    if (negative) num = -num;
                    num = Math.round(num * 100) / 100;
                    if (!isFinite(num)) {
                        return { ok: false, msg: "\u5927\u5199\u91d1\u989d\u683c\u5f0f\u65e0\u6548" };
                    }
                    var intDigits = String(Math.floor(Math.abs(num))).length;
                    if (intDigits > 15) {
                        return { ok: false, msg: "\u6574\u6570\u90e8\u5206\u4e0d\u80fd\u8d85\u8fc7 15 \u4f4d" };
                    }
                    return { ok: true, value: formatArabicAmount(num) };
                }

                var amountIn = document.getElementById("amount-in");
                var amountOut = document.getElementById("amount-out");
                var statusEl = document.getElementById("status");
                var copyToastTimer = null;
                var syncing = false;

                function showCopyTip(msg) {
                    var el = document.getElementById("copy-toast");
                    el.textContent = msg || "\u5df2\u590d\u5236\u5230\u526a\u8d34\u677f";
                    el.classList.add("show");
                    if (copyToastTimer) clearTimeout(copyToastTimer);
                    copyToastTimer = setTimeout(function () {
                        el.classList.remove("show");
                        copyToastTimer = null;
                    }, 2000);
                }

                function legacyCopy(text) {
                    var ta = document.createElement("textarea");
                    ta.value = text;
                    ta.setAttribute("readonly", "");
                    ta.style.position = "fixed";
                    ta.style.left = "-9999px";
                    document.body.appendChild(ta);
                    ta.select();
                    try {
                        document.execCommand("copy");
                    } catch (e) {}
                    document.body.removeChild(ta);
                }

                function copyText(text, tipMsg) {
                    if (!text) return;
                    function done() {
                        showCopyTip(tipMsg || "\u5df2\u590d\u5236\u5230\u526a\u8d34\u677f");
                    }
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).then(done).catch(function () {
                            legacyCopy(text);
                            done();
                        });
                    } else {
                        legacyCopy(text);
                        done();
                    }
                }

                function setStatus(msg, isErr) {
                    statusEl.textContent = msg || "";
                    statusEl.className = isErr ? "err" : "";
                }

                function renderFromNumber() {
                    var res = toRmbUppercase(amountIn.value);
                    if (!res.ok) {
                        setStatus(res.msg, true);
                        return false;
                    }
                    syncing = true;
                    amountOut.value = res.value;
                    syncing = false;
                    setStatus("", false);
                    return true;
                }

                function renderFromUpper() {
                    var res = fromRmbUppercase(amountOut.value);
                    if (!res.ok) {
                        setStatus(res.msg, true);
                        return false;
                    }
                    syncing = true;
                    amountIn.value = res.value;
                    syncing = false;
                    var fwd = toRmbUppercase(res.value);
                    if (fwd.ok) {
                        syncing = true;
                        amountOut.value = fwd.value;
                        syncing = false;
                    }
                    setStatus("", false);
                    return true;
                }

                function onNumberInput() {
                    if (syncing) return;
                    if (!normalizeInput(amountIn.value)) {
                        syncing = true;
                        amountOut.value = "";
                        syncing = false;
                        setStatus("", false);
                        return;
                    }
                    renderFromNumber();
                }

                function onUpperInput() {
                    if (syncing) return;
                    if (!normalizeUpperInput(amountOut.value)) {
                        syncing = true;
                        amountIn.value = "";
                        syncing = false;
                        setStatus("", false);
                        return;
                    }
                    renderFromUpper();
                }

                function addSampleButtons(containerId, values, onPick) {
                    var box = document.getElementById(containerId);
                    values.forEach(function (val) {
                        var btn = document.createElement("button");
                        btn.type = "button";
                        btn.className = "sample";
                        btn.textContent = val;
                        btn.title = val;
                        btn.addEventListener("click", function () {
                            onPick(val);
                        });
                        box.appendChild(btn);
                    });
                }

                addSampleButtons("samples", SAMPLES, function (val) {
                    amountIn.value = val;
                    onNumberInput();
                    amountIn.focus();
                });
                addSampleButtons("samples-upper", UPPER_SAMPLES, function (val) {
                    amountOut.value = val;
                    onUpperInput();
                    amountOut.focus();
                });

                amountIn.addEventListener("input", onNumberInput);
                amountOut.addEventListener("input", onUpperInput);
                document.getElementById("copy-btn").addEventListener("click", function () {
                    var text = amountOut.value.trim();
                    if (!text) {
                        var res = toRmbUppercase(amountIn.value);
                        if (!res.ok) {
                            setStatus(res.msg || "\u8bf7\u5148\u8f93\u5165\u6709\u6548\u91d1\u989d", true);
                            return;
                        }
                        text = res.value;
                    }
                    copyText(text);
                });
                document.getElementById("copy-num-btn").addEventListener("click", function () {
                    var text = amountIn.value.trim();
                    if (!text) {
                        var res = fromRmbUppercase(amountOut.value);
                        if (!res.ok) {
                            setStatus(res.msg || "\u8bf7\u5148\u8f93\u5165\u6709\u6548\u5927\u5199\u91d1\u989d", true);
                            return;
                        }
                        text = res.value;
                    }
                    copyText(text, "\u5df2\u590d\u5236\u6570\u5b57\u5230\u526a\u8d34\u677f");
                });
                document.getElementById("clear-btn").addEventListener("click", function () {
                    syncing = true;
                    amountIn.value = "";
                    amountOut.value = "";
                    syncing = false;
                    setStatus("", false);
                    amountIn.focus();
                });

                amountIn.value = "1234.56";
                onNumberInput();

                var codeModal = document.getElementById("rmb-code-modal");
                var codeJs = document.getElementById("rmb-code-js");
                var codeLang = document.getElementById("rmb-code-lang");
                var langSelect = document.getElementById("rmb-code-lang-select");
                var samples = window.RmbCodeSamples || {};

                codeJs.textContent = samples.javascript || "";

                function renderLangCode() {
                    codeLang.textContent = samples[langSelect.value] || "";
                }

                renderLangCode();

                function showCodeModal() {
                    codeModal.classList.add("visible");
                    codeModal.setAttribute("aria-hidden", "false");
                }

                function hideCodeModal() {
                    codeModal.classList.remove("visible");
                    codeModal.setAttribute("aria-hidden", "true");
                }

                document.getElementById("rmb-code-help-btn").addEventListener("click", function (e) {
                    e.stopPropagation();
                    showCodeModal();
                });
                document.getElementById("rmb-code-modal-close").addEventListener("click", hideCodeModal);
                document.getElementById("rmb-code-modal-backdrop").addEventListener("click", hideCodeModal);
                document.addEventListener("keydown", function (e) {
                    if (e.key === "Escape" && codeModal.classList.contains("visible")) {
                        hideCodeModal();
                    }
                });
                document.querySelectorAll(".tool-code-copy-btn[data-copy-target]").forEach(function (btn) {
                    btn.addEventListener("click", function () {
                        var target = document.getElementById(btn.getAttribute("data-copy-target"));
                        ToolCopy.copy(target ? target.textContent : "");
                    });
                });
                document.getElementById("rmb-code-lang-copy").addEventListener("click", function () {
                    ToolCopy.copy(codeLang.textContent);
                });
                langSelect.addEventListener("change", renderLangCode);
            })();
        </script>
            <script src="libs/tool-form-persist.js"></script>
    </body>
</html>
