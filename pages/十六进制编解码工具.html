<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>十六进制编解码</title>
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                --bg: #f3f7ff;
                --card: #fff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
                --foot-bg: #f8fbff;
                --input-border: #cfdcf7;
                --toolbar-line: #e4edff;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
                overflow: hidden;
            }
            .page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                min-height: 0;
                gap: 10px;
            }
            .opts {
                flex-shrink: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                padding: 8px 12px;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 10px 16px;
            }
            .mode-seg {
                display: inline-flex;
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                overflow: hidden;
                background: #edf3ff;
            }
            .mode-seg button {
                border: none;
                background: transparent;
                padding: 6px 16px;
                font-size: 13px;
                cursor: pointer;
                color: #3c4f78;
            }
            .mode-seg button:hover:not(.active) {
                color: var(--primary);
                background: rgba(47, 107, 255, 0.06);
            }
            .mode-seg button.active {
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
                color: #fff;
            }
            .mode-seg button.active:hover {
                opacity: 0.95;
                color: #fff;
            }
            .split {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                gap: 10px;
                align-items: stretch;
            }
            .split[hidden] {
                display: none !important;
            }
            .pane {
                flex: 1 1 0;
                min-width: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .pane-hd {
                flex-shrink: 0;
                padding: 8px 10px;
                font-weight: 600;
                font-size: 14px;
                color: #324a76;
                background: var(--foot-bg);
                border-bottom: 1px solid var(--toolbar-line);
            }
            .pane-body {
                flex: 1;
                min-height: 0;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 0;
            }
            .pane-ta {
                flex: 1;
                width: 100%;
                min-height: 120px;
                border: 1px solid var(--input-border);
                border-radius: 8px;
                padding: 10px;
                font-family: Consolas, "Courier New", monospace;
                font-size: 14px;
                line-height: 1.55;
                resize: none;
                outline: none;
                background: #fff;
                color: var(--text);
            }
            .pane-ta:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.12);
            }
            .pane-ta[readonly] {
                background: #fafcff;
            }
            .foot {
                flex-shrink: 0;
                border-top: 1px solid var(--toolbar-line);
                background: var(--foot-bg);
                padding: 8px 10px;
                display: flex;
                flex-wrap: wrap;
                gap: 10px 14px;
                align-items: center;
            }
            .foot label {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                font-size: 13px;
                color: var(--text);
            }
            .foot select {
                border: 1px solid var(--input-border);
                border-radius: 6px;
                padding: 5px 10px;
                font-size: 13px;
                background: #fff;
                color: var(--text);
                max-width: 240px;
            }
            .foot select:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.1);
            }
            .foot .foot-hint {
                flex: 1 1 100%;
                margin: 0;
                font-size: 12px;
                color: var(--muted);
                line-height: 1.45;
            }
            .foot .foot-hint code {
                font-size: 11px;
                background: #eef3ff;
                padding: 1px 5px;
                border-radius: 4px;
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 6px 12px;
                font-size: 13px;
                cursor: pointer;
            }
            .btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .btn-primary {
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
                color: #fff;
                border-color: transparent;
            }
            .btn-primary:hover {
                opacity: 0.95;
                color: #fff;
            }
            .out-wrap {
                position: relative;
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }
            .out-empty {
                position: absolute;
                inset: 0;
                display: none;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                color: var(--muted);
                font-size: 13px;
                pointer-events: none;
                background: #fafcff;
                border-radius: 8px;
                z-index: 1;
            }
            .out-empty.visible {
                display: flex;
            }
            .out-empty-icon {
                width: 40px;
                height: 32px;
                border: 2px solid #cfdcf7;
                border-radius: 4px;
                position: relative;
                opacity: 0.85;
            }
            .out-empty-icon::before {
                content: "";
                position: absolute;
                left: 5px;
                right: 5px;
                top: -5px;
                height: 7px;
                border: 2px solid #cfdcf7;
                border-bottom: none;
                border-radius: 4px 4px 0 0;
            }
            @media (max-width: 820px) {
                .split {
                    flex-direction: column;
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="opts">
                <div class="mode-seg" role="tablist">
                    <button type="button" class="active" data-tab="s2h">字符串 → Hex</button>
                    <button type="button" data-tab="h2s">Hex → 字符串</button>
                </div>
            </div>

            <div id="split-s2h" class="split">
                <section class="pane">
                    <div class="pane-hd">输入</div>
                    <div class="pane-body">
                        <textarea id="s2hIn" class="pane-ta" placeholder="文本或 Base64"></textarea>
                    </div>
                    <div class="foot">
                        <button type="button" class="btn" id="s2hRun" title="转换">▶</button>
                        <label>
                            输入来源
                            <select id="s2hMode" aria-label="输入来源">
                                <option value="text">文本（UTF-8）</option>
                                <option value="base64">Base64</option>
                            </select>
                        </label>
                        <button type="button" class="btn btn-primary" id="s2hPickBtn">选择文件</button>
                        <input type="file" id="s2hFile" hidden />
                        <p class="foot-hint">按字节输出连续小写十六进制；支持文本、Base64 或从文件加载字节。</p>
                    </div>
                </section>
                <section class="pane">
                    <div class="pane-hd">Hex 输出（小写连续）</div>
                    <div class="pane-body">
                        <div class="out-wrap">
                            <div id="s2hEmpty" class="out-empty visible">
                                <span class="out-empty-icon" aria-hidden="true"></span>
                                <span>暂无输出</span>
                            </div>
                            <textarea id="s2hOut" class="pane-ta" readonly placeholder="hex"></textarea>
                        </div>
                    </div>
                </section>
            </div>

            <div id="split-h2s" class="split" hidden>
                <section class="pane">
                    <div class="pane-hd">Hex 输入</div>
                    <div class="pane-body">
                        <textarea id="h2sIn" class="pane-ta" placeholder="连续 hex 或带空格/0x"></textarea>
                    </div>
                    <div class="foot">
                        <button type="button" class="btn" id="h2sRun" title="转换">▶</button>
                        <label>
                            输出编码
                            <select id="h2sEnc" aria-label="输出编码">
                                <option value="utf-8">UTF-8</option>
                                <option value="latin1">Latin1</option>
                                <option value="utf-16le">UTF-16LE</option>
                                <option value="utf-16be">UTF-16BE</option>
                            </select>
                        </label>
                        <button type="button" class="btn btn-primary" id="h2sPickBtn">选择文件</button>
                        <input type="file" id="h2sFile" hidden />
                        <p class="foot-hint">Hex → 字节 → 按编码解码为文本；可从文件加载 hex 文本。</p>
                    </div>
                </section>
                <section class="pane">
                    <div class="pane-hd">文本输出</div>
                    <div class="pane-body">
                        <div class="out-wrap">
                            <div id="h2sEmpty" class="out-empty visible">
                                <span class="out-empty-icon" aria-hidden="true"></span>
                                <span>暂无输出</span>
                            </div>
                            <textarea id="h2sOut" class="pane-ta" readonly placeholder="文本"></textarea>
                        </div>
                    </div>
                </section>
            </div>
        </div>
        <script>
            (function () {
                function bytesToHexLower(u8) {
                    var s = "";
                    for (var i = 0; i < u8.length; i++) {
                        var h = u8[i].toString(16);
                        if (h.length < 2) h = "0" + h;
                        s += h;
                    }
                    return s;
                }
                function normalizeHex(s) {
                    return (s || "").replace(/0x/gi, "").replace(/[^0-9a-fA-F]/g, "");
                }
                function hexToBytes(hex) {
                    if (hex.length % 2 !== 0) throw new Error("十六进制长度须为偶数");
                    var u8 = new Uint8Array(hex.length / 2);
                    for (var i = 0; i < u8.length; i++) u8[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16);
                    return u8;
                }
                function b64ToU8(s) {
                    var t = (s || "").replace(/\s+/g, "");
                    if (/^data:[^;]+;base64,/i.test(t)) t = t.split(",").pop() || "";
                    var bin = atob(t);
                    var u8 = new Uint8Array(bin.length);
                    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
                    return u8;
                }
                var s2hBuf = null;
                var tS2h = null;
                var tH2s = null;
                function syncS2hEmpty() {
                    var v = document.getElementById("s2hOut").value;
                    document.getElementById("s2hEmpty").classList.toggle("visible", !v || !String(v).trim());
                }
                function syncH2sEmpty() {
                    var v = document.getElementById("h2sOut").value;
                    document.getElementById("h2sEmpty").classList.toggle("visible", !v || !String(v).trim());
                }
                function runS2h() {
                    var out = document.getElementById("s2hOut");
                    try {
                        var u8;
                        if (s2hBuf) {
                            u8 = s2hBuf;
                        } else if (document.getElementById("s2hMode").value === "base64") {
                            u8 = b64ToU8(document.getElementById("s2hIn").value);
                        } else {
                            u8 = new TextEncoder().encode(document.getElementById("s2hIn").value);
                        }
                        out.value = bytesToHexLower(u8);
                    } catch (e) {
                        out.value = String(e && e.message ? e.message : e);
                    }
                    syncS2hEmpty();
                }
                function runH2s() {
                    var out = document.getElementById("h2sOut");
                    try {
                        var hex = normalizeHex(document.getElementById("h2sIn").value);
                        if (!hex) {
                            out.value = "";
                            syncH2sEmpty();
                            return;
                        }
                        var u8 = hexToBytes(hex);
                        var enc = document.getElementById("h2sEnc").value;
                        out.value = new TextDecoder(enc, { fatal: false }).decode(u8);
                    } catch (e) {
                        out.value = String(e && e.message ? e.message : e);
                    }
                    syncH2sEmpty();
                }
                document.getElementById("s2hIn").addEventListener("input", function () {
                    s2hBuf = null;
                    clearTimeout(tS2h);
                    tS2h = setTimeout(runS2h, 80);
                });
                document.getElementById("s2hMode").addEventListener("change", function () {
                    s2hBuf = null;
                    runS2h();
                });
                document.getElementById("s2hFile").addEventListener("change", function (ev) {
                    var f = ev.target.files && ev.target.files[0];
                    s2hBuf = null;
                    if (!f) {
                        runS2h();
                        return;
                    }
                    var r = new FileReader();
                    r.onload = function () {
                        s2hBuf = new Uint8Array(r.result);
                        runS2h();
                    };
                    r.readAsArrayBuffer(f);
                });
                document.getElementById("h2sIn").addEventListener("input", function () {
                    clearTimeout(tH2s);
                    tH2s = setTimeout(runH2s, 80);
                });
                document.getElementById("h2sEnc").addEventListener("change", runH2s);
                document.getElementById("h2sFile").addEventListener("change", function (ev) {
                    var f = ev.target.files && ev.target.files[0];
                    if (!f) return;
                    var r = new FileReader();
                    r.onload = function () {
                        document.getElementById("h2sIn").value = String(r.result || "");
                        runH2s();
                    };
                    r.readAsText(f, "utf-8");
                });
                document.getElementById("s2hRun").addEventListener("click", function () {
                    clearTimeout(tS2h);
                    runS2h();
                });
                document.getElementById("h2sRun").addEventListener("click", function () {
                    clearTimeout(tH2s);
                    runH2s();
                });
                document.getElementById("s2hPickBtn").addEventListener("click", function () {
                    document.getElementById("s2hFile").click();
                });
                document.getElementById("h2sPickBtn").addEventListener("click", function () {
                    document.getElementById("h2sFile").click();
                });
                document.querySelectorAll(".mode-seg button").forEach(function (btn) {
                    btn.addEventListener("click", function () {
                        document.querySelectorAll(".mode-seg button").forEach(function (b) {
                            b.classList.toggle("active", b === btn);
                        });
                        var t = btn.getAttribute("data-tab");
                        document.getElementById("split-s2h").hidden = t !== "s2h";
                        document.getElementById("split-h2s").hidden = t !== "h2s";
                    });
                });
                runS2h();
                runH2s();
            })();
            document.addEventListener("contextmenu", function (e) {
                e.preventDefault();
            });
        </script>
    </body>
</html>
