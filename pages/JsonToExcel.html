<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>JSON / Excel / SQL 转换工具</title>
        <link rel="stylesheet" href="libs/tool-danger-btn.css" />
        <script src="../vendor/xlsx/xlsx.full.min.js"></script>
        <script src="libs/tool-sheet-tabs-drag.js"></script>
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                --bg: #f3f7ff;
                --card: #ffffff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --danger: #f05656;
                --text: #1f2a44;
                --muted: #6f7d96;
                --border: #dbe6ff;
                --shadow: 0 10px 24px rgba(36, 90, 190, 0.12);
            }
            body {
                margin: 0;
                padding: 8px;
                min-height: 100vh;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                background: var(--bg);
            }
            .page {
                display: flex;
                flex-direction: column;
                gap: 8px;
                height: calc(100vh - 16px);
            }
            .panel {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
                box-shadow: var(--shadow);
                padding: 8px;
                min-height: 0;
            }
            .panel-main {
                display: flex;
                flex-direction: column;
                flex: 1;
                min-height: 0;
            }
            .control-row {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
                margin-bottom: 8px;
            }
            label {
                font-size: 12px;
                color: var(--muted);
            }
            select,
            input[type="file"] {
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                padding: 5px 8px;
                font-size: 12px;
                background: #fff;
                outline: none;
            }
            .input-wrap {
                display: grid;
                grid-template-rows: minmax(0, 1fr) auto;
                flex: 1;
                min-height: 140px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                overflow: hidden;
                background: #fff;
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
            }
            .input-wrap:focus-within {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.15);
            }
            .input-wrap[hidden] {
                display: none !important;
            }
            #text-input,
            #output {
                width: 100%;
                padding: 10px;
                resize: none;
                outline: none;
                font-size: 13px;
                line-height: 1.6;
            }
            #text-input {
                min-height: 0;
                height: 100%;
                border: none;
                border-radius: 0;
                background: transparent;
            }
            #output {
                flex: 1;
                min-height: 120px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
            }
            #output:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.15);
            }
            .input-hint {
                font-size: 12px;
                color: var(--muted);
            }
            .json-sheet-bar {
                grid-row: 2;
                flex: 0 0 auto;
                display: flex;
                align-items: flex-end;
                min-height: 30px;
                padding: 0 10px 2px;
                background: #fff;
                overflow: hidden;
                flex-shrink: 0;
                border-top: 1px solid #eef2fa;
            }
            .json-sheet-strip {
                display: flex;
                align-items: flex-end;
                flex-wrap: nowrap;
                gap: 4px;
                min-width: 0;
                max-width: 100%;
                overflow-x: auto;
                overflow-y: hidden;
                scrollbar-width: thin;
            }
            .json-sheet-strip::-webkit-scrollbar {
                height: 4px;
            }
            .json-sheet-tabs {
                display: flex;
                align-items: flex-end;
                flex-wrap: nowrap;
                gap: 4px;
                min-width: 0;
                flex: 1 1 auto;
                overflow-x: auto;
                overflow-y: hidden;
            }
            .json-sheet-tab {
                flex: 0 0 auto;
                display: inline-flex;
                align-items: center;
                max-width: 148px;
                height: 26px;
                padding: 0 10px;
                margin: 0;
                border: 1px solid #dbe4f0;
                border-radius: 4px 4px 0 0;
                background: #fff;
                color: #516078;
                font-size: 12px;
                font-weight: 400;
                font-family: inherit;
                cursor: pointer;
                user-select: none;
                position: relative;
                z-index: 1;
                box-shadow: none;
                transform: none;
            }
            .json-sheet-tab:hover:not(.active) {
                background: #fafbfd;
                border-color: #cdd8ea;
                color: #3c4f78;
                z-index: 2;
                transform: none;
                box-shadow: none;
            }
            .json-sheet-tab.active {
                background: #edf3ff;
                color: var(--primary);
                font-weight: 600;
                z-index: 3;
                border-color: #d8e5ff;
            }
            .json-sheet-tab .sheet-name {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                max-width: 120px;
            }
            .json-sheet-tab .sheet-rename-input {
                width: 96px;
                max-width: 120px;
                height: 22px;
                padding: 0 6px;
                font-size: 12px;
                border: 1px solid var(--primary);
                border-radius: 4px;
                outline: none;
                background: #fff;
                color: var(--text);
                font-weight: 400;
            }
            .json-sheet-tab .sheet-close {
                flex: 0 0 auto;
                margin-left: 4px;
                width: 16px;
                height: 16px;
                padding: 0;
                border: none;
                border-radius: 3px;
                background: transparent;
                color: #7a879e;
                font-size: 14px;
                line-height: 1;
                font-weight: 400;
                cursor: pointer;
                opacity: 1;
                transform: none;
                box-shadow: none;
            }
            .json-sheet-tab.active .sheet-close {
                color: #5a7fd4;
            }
            .json-sheet-tab .sheet-close:hover {
                background: rgba(224, 64, 64, 0.15);
                color: var(--danger);
                transform: none;
                box-shadow: none;
            }
            .json-sheet-add {
                flex: 0 0 26px;
                width: 26px;
                height: 26px;
                margin: 0;
                padding: 0;
                border: none;
                border-radius: 4px;
                background: transparent;
                font-size: 18px;
                line-height: 1;
                font-weight: 400;
                color: #8a9bb8;
                cursor: pointer;
                transform: none;
                box-shadow: none;
            }
            .json-sheet-add:hover {
                background: #f0f5ff;
                color: var(--primary);
                transform: none;
                box-shadow: none;
            }
            #jte-sheets-meta {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                border: 0;
            }
            .button-container {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                margin-top: 8px;
            }
            .button-container button {
                padding: 7px 12px;
                border: none;
                border-radius: 6px;
                color: white;
                cursor: pointer;
                font-weight: bold;
                font-size: 12px;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }
            .button-container button:hover {
                transform: translateY(-1px);
                box-shadow: 0 8px 16px rgba(36, 90, 190, 0.25);
            }
            #export-btn,
            #convert-btn,
            #download-btn {
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            .status {
                margin-top: 6px;
                padding: 6px 8px;
                border-radius: 6px;
                background: #f8fbff;
                border: 1px solid #dbe7ff;
                font-size: 12px;
                color: #2f3d5d;
            }
            .tabs {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                margin-top: 8px;
                margin-bottom: 6px;
            }
            .tab {
                padding: 4px 8px;
                font-size: 11px;
                border-radius: 999px;
                border: 1px solid #d8e5ff;
                background: #edf3ff;
                color: #3c4f78;
                cursor: pointer;
            }
            .tab.active {
                color: #fff;
                border-color: transparent;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="panel panel-main">
                <div class="control-row">
                    <label for="source-type">输入类型</label>
                    <select id="source-type">
                        <option value="json">JSON 文本</option>
                        <option value="csv">CSV 文本</option>
                        <option value="excel">Excel 文件</option>
                        <option value="sql">SQL Insert 文本</option>
                    </select>
                    <label for="target-type">输出类型</label>
                    <select id="target-type">
                        <option value="excel">Excel 文件</option>
                        <option value="csv">CSV 文本</option>
                        <option value="insert">Insert 语句</option>
                        <option value="json">JSON 文本</option>
                    </select>
                    <input id="excel-file" type="file" accept=".xlsx,.xls" style="display: none" />
                    <span class="input-hint" id="input-hint" title="底部可切换多个输入工作表，拖拽标签可排序，双击可重命名">多工作表输入</span>
                </div>
                <div class="input-wrap" id="input-wrap">
                    <textarea id="text-input" data-persist-key="jte_text_input" placeholder='JSON 示例：
[
  {"name":"张三","age":10},
  {"name":"李四","age":14}
]

多 Sheet JSON 示例：
{
  "users":[{"id":1,"name":"A"}],
  "orders":[{"id":1001,"userId":1}]
}

SQL 示例：
insert into users(id,name) values (1,'A'),(2,'B');'></textarea>
                    <div class="json-sheet-bar" id="jte-sheet-bar">
                        <div class="json-sheet-strip">
                            <div class="json-sheet-tabs" id="jte-sheet-tabs" role="tablist" aria-label="输入工作表"></div>
                            <button type="button" class="json-sheet-add" id="jte-sheet-add" title="新建工作表">+</button>
                        </div>
                    </div>
                </div>
                <textarea id="jte-sheets-meta" data-persist-key="jte_sheets_state" aria-hidden="true" tabindex="-1"></textarea>
                <div class="button-container">
                    <button id="convert-btn" type="button">执行转换</button>
                    <button id="download-btn" type="button">下载输出</button>
                    <button id="clear-btn" class="tool-btn-danger" type="button">清空</button>
                </div>
                <div id="output-tabs" class="tabs"></div>
                <textarea id="output" readonly></textarea>
                <div id="status" class="status">请选择输入输出类型后执行转换。</div>
            </div>
        </div>
        <script>
            let workbookData = null;
            let outputTextData = "";
            let outputBlob = null;
            let outputFilename = "";
            let outputSections = {};
            let activeSectionKey = "";
            const TARGET_OPTIONS = [
                { value: "excel", label: "Excel 文件" },
                { value: "csv", label: "CSV 文本" },
                { value: "insert", label: "Insert 语句" },
                { value: "json", label: "JSON 文本" }
            ];

            const textInputEl = document.getElementById("text-input");
            const sheetsMetaInput = document.getElementById("jte-sheets-meta");
            const sheetTabsEl = document.getElementById("jte-sheet-tabs");
            const sheetAddBtn = document.getElementById("jte-sheet-add");
            const inputWrapEl = document.getElementById("input-wrap");
            const inputHintEl = document.getElementById("input-hint");
            let inputSheets = [];
            let activeInputSheetId = null;
            let sheetRenameId = null;
            let _sheetPersistTimer = null;

            function genSheetId() {
                return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
            }

            function getActiveSheet() {
                for (let i = 0; i < inputSheets.length; i++) {
                    if (inputSheets[i].id === activeInputSheetId) return inputSheets[i];
                }
                return null;
            }

            function nextSheetName() {
                const used = {};
                inputSheets.forEach((s) => {
                    used[s.name] = true;
                });
                let n = 1;
                while (used["Sheet" + n]) n++;
                return "Sheet" + n;
            }

            function syncInputFromTextarea() {
                const sheet = getActiveSheet();
                if (sheet) sheet.content = textInputEl.value;
            }

            function persistSheetsState() {
                syncInputFromTextarea();
                if (!inputSheets.length) return;
                sheetsMetaInput.value = JSON.stringify({
                    activeId: activeInputSheetId,
                    sheets: inputSheets,
                });
                sheetsMetaInput.dispatchEvent(new Event("input", { bubbles: true }));
            }

            function schedulePersistSheets() {
                clearTimeout(_sheetPersistTimer);
                _sheetPersistTimer = setTimeout(persistSheetsState, 400);
            }

            function applyActiveSheetToInput() {
                const sheet = getActiveSheet();
                const content = sheet ? String(sheet.content == null ? "" : sheet.content) : "";
                if (sheet) sheet.content = content;
                textInputEl.value = content;
            }

            function initSheetsFromStorage() {
                const legacy = textInputEl.value ? String(textInputEl.value) : "";
                if (sheetsMetaInput.value) {
                    try {
                        const state = JSON.parse(sheetsMetaInput.value);
                        if (state && state.sheets && state.sheets.length) {
                            inputSheets = state.sheets.map((s) => ({
                                id: s.id || genSheetId(),
                                name: String(s.name || "Sheet1"),
                                content: s.content == null ? "" : String(s.content),
                            }));
                            activeInputSheetId = state.activeId;
                            if (!getActiveSheet()) activeInputSheetId = inputSheets[0].id;
                            return;
                        }
                    } catch (e) {
                        /* 损坏的存储，回退为单表 */
                    }
                }
                inputSheets = [{ id: genSheetId(), name: "Sheet1", content: legacy }];
                activeInputSheetId = inputSheets[0].id;
            }

            function switchSheet(sheetId) {
                if (!sheetId || sheetId === activeInputSheetId) return;
                syncInputFromTextarea();
                activeInputSheetId = sheetId;
                applyActiveSheetToInput();
                renderSheetTabs();
                persistSheetsState();
            }

            function addSheet() {
                syncInputFromTextarea();
                const sheet = {
                    id: genSheetId(),
                    name: nextSheetName(),
                    content: "",
                };
                inputSheets.push(sheet);
                switchSheet(sheet.id);
                setStatus("已新建 " + sheet.name, false);
            }

            function removeSheet(sheetId) {
                if (inputSheets.length <= 1) {
                    setStatus("至少保留一个工作表", true);
                    return;
                }
                const idx = inputSheets.findIndex((s) => s.id === sheetId);
                if (idx < 0) return;
                const removed = inputSheets.splice(idx, 1)[0];
                if (activeInputSheetId === sheetId) {
                    const next = inputSheets[Math.min(idx, inputSheets.length - 1)];
                    activeInputSheetId = next.id;
                    applyActiveSheetToInput();
                }
                renderSheetTabs();
                persistSheetsState();
                setStatus("已删除 " + removed.name, false);
            }

            function renameSheet(sheetId, newName) {
                const name = String(newName || "").trim();
                if (!name) {
                    setStatus("名称不能为空", true);
                    return false;
                }
                if (inputSheets.some((s) => s.id !== sheetId && s.name === name)) {
                    setStatus("名称已存在", true);
                    return false;
                }
                const sheet = inputSheets.find((s) => s.id === sheetId);
                if (sheet) sheet.name = name;
                renderSheetTabs();
                persistSheetsState();
                return true;
            }

            function startSheetRename(sheetId) {
                sheetRenameId = sheetId;
                renderSheetTabs();
                const tab = sheetTabsEl.querySelector('[data-sheet-id="' + sheetId + '"]');
                const input = tab && tab.querySelector(".sheet-rename-input");
                if (input) {
                    input.focus();
                    input.select();
                }
            }

            function finishSheetRename(sheetId, value, cancel) {
                sheetRenameId = null;
                if (!cancel) renameSheet(sheetId, value);
                renderSheetTabs();
            }

            function reorderSheet(fromIndex, toIndex) {
                if (fromIndex === toIndex) return;
                const item = inputSheets.splice(fromIndex, 1)[0];
                inputSheets.splice(toIndex, 0, item);
                renderSheetTabs();
                persistSheetsState();
            }

            function renderSheetTabs() {
                if (!sheetTabsEl) return;
                sheetTabsEl.innerHTML = "";
                inputSheets.forEach((sheet) => {
                    const tab = document.createElement("button");
                    tab.type = "button";
                    tab.className = "json-sheet-tab" + (sheet.id === activeInputSheetId ? " active" : "");
                    tab.setAttribute("data-sheet-id", sheet.id);
                    tab.setAttribute("role", "tab");
                    tab.setAttribute("aria-selected", sheet.id === activeInputSheetId ? "true" : "false");
                    tab.title = sheet.name + "（拖拽排序，双击重命名）";

                    if (sheetRenameId === sheet.id) {
                        const inp = document.createElement("input");
                        inp.type = "text";
                        inp.className = "sheet-rename-input";
                        inp.value = sheet.name;
                        inp.addEventListener("click", (e) => e.stopPropagation());
                        inp.addEventListener("keydown", (e) => {
                            e.stopPropagation();
                            if (e.key === "Enter") finishSheetRename(sheet.id, inp.value, false);
                            if (e.key === "Escape") finishSheetRename(sheet.id, "", true);
                        });
                        inp.addEventListener("blur", () => finishSheetRename(sheet.id, inp.value, false));
                        tab.appendChild(inp);
                    } else {
                        const span = document.createElement("span");
                        span.className = "sheet-name";
                        span.textContent = sheet.name;
                        tab.appendChild(span);
                        tab.addEventListener("dblclick", (e) => {
                            e.stopPropagation();
                            startSheetRename(sheet.id);
                        });
                    }

                    if (inputSheets.length > 1) {
                        const closeBtn = document.createElement("button");
                        closeBtn.type = "button";
                        closeBtn.className = "sheet-close";
                        closeBtn.title = "删除工作表";
                        closeBtn.textContent = "×";
                        closeBtn.addEventListener("click", (e) => {
                            e.stopPropagation();
                            removeSheet(sheet.id);
                        });
                        tab.appendChild(closeBtn);
                    }

                    tab.addEventListener("click", () => {
                        if (sheetRenameId) return;
                        switchSheet(sheet.id);
                    });
                    sheetTabsEl.appendChild(tab);
                });
            }

            function mergeWorkbooks(target, source) {
                Object.keys(source).forEach((key) => {
                    let name = key;
                    let n = 2;
                    while (Object.prototype.hasOwnProperty.call(target, name)) {
                        name = key + "_" + n;
                        n++;
                    }
                    target[name] = source[key];
                });
            }

            function parseJsonSheetContent(text, sheetName) {
                const parsed = JSON.parse(text);
                if (Array.isArray(parsed)) {
                    return { [sheetName]: parsed };
                }
                if (parsed && typeof parsed === "object") {
                    const keys = Object.keys(parsed);
                    if (keys.length === 0) throw new Error("JSON 对象为空");
                    const allArray = keys.every((k) => Array.isArray(parsed[k]));
                    if (allArray) return parsed;
                    return { [sheetName]: [parsed] };
                }
                throw new Error("JSON 格式不支持，请输入数组或多 Sheet 对象");
            }

            function getTextInputWorkbook(sourceType) {
                syncInputFromTextarea();
                const wb = {};
                let hasContent = false;
                inputSheets.forEach((sheet) => {
                    const text = String(sheet.content || "").trim();
                    if (!text) return;
                    hasContent = true;
                    let part;
                    if (sourceType === "json") {
                        part = parseJsonSheetContent(text, sheet.name);
                    } else if (sourceType === "csv") {
                        const csvPart = parseCsvTextToWorkbook(text);
                        part = { [sheet.name]: csvPart.Sheet1 };
                    } else if (sourceType === "sql") {
                        part = parseInsertSqlToWorkbook(text);
                    }
                    mergeWorkbooks(wb, part);
                });
                if (!hasContent) {
                    if (sourceType === "json") throw new Error("请输入 JSON 文本");
                    if (sourceType === "csv") throw new Error("请输入 CSV 文本");
                    if (sourceType === "sql") throw new Error("请输入 SQL Insert 文本");
                }
                return wb;
            }

            function resetInputSheets() {
                inputSheets = [{ id: genSheetId(), name: "Sheet1", content: "" }];
                activeInputSheetId = inputSheets[0].id;
                sheetRenameId = null;
                applyActiveSheetToInput();
                renderSheetTabs();
                persistSheetsState();
            }

            function setStatus(text, isError) {
                const status = document.getElementById("status");
                status.textContent = text;
                status.style.color = isError ? "#c43d3d" : "#2f3d5d";
            }

            function getEquivalentTargetBySource(sourceType) {
                if (sourceType === "json") return "json";
                if (sourceType === "csv") return "csv";
                if (sourceType === "excel") return "excel";
                if (sourceType === "sql") return "insert";
                return "";
            }

            function refreshTargetOptionsVisibility() {
                const sourceType = document.getElementById("source-type").value;
                const targetSelect = document.getElementById("target-type");
                const hiddenValue = getEquivalentTargetBySource(sourceType);
                const current = targetSelect.value;
                targetSelect.innerHTML = "";
                TARGET_OPTIONS.forEach((opt) => {
                    if (opt.value === hiddenValue) return;
                    const optionEl = document.createElement("option");
                    optionEl.value = opt.value;
                    optionEl.textContent = opt.label;
                    targetSelect.appendChild(optionEl);
                });
                const validCurrent = TARGET_OPTIONS.some((opt) => opt.value === current && opt.value !== hiddenValue);
                targetSelect.value = validCurrent ? current : targetSelect.options[0]?.value;
            }

            function enforceSourceTargetExclusion(triggeredBy) {
                const sourceSelect = document.getElementById("source-type");
                const targetSelect = document.getElementById("target-type");
                const sourceType = sourceSelect.value;
                const equivalent = getEquivalentTargetBySource(sourceType);
                if (targetSelect.value !== equivalent && targetSelect.value) return;

                const options = Array.from(targetSelect.options)
                    .filter((o) => !o.disabled && !o.hidden)
                    .map((o) => o.value);
                const fallback = options.find((v) => v !== equivalent) || targetSelect.value;
                targetSelect.value = fallback;

                if (triggeredBy) {
                    setStatus("输入类型与输出类型不能相同语义，已自动切换输出类型。", false);
                }
            }

            function renderOutputSections() {
                const tabs = document.getElementById("output-tabs");
                const keys = Object.keys(outputSections);
                tabs.innerHTML = "";
                if (!keys.length) {
                    output.value = "";
                    return;
                }
                if (!activeSectionKey || !outputSections[activeSectionKey]) activeSectionKey = keys[0];
                keys.forEach((key) => {
                    const tab = document.createElement("div");
                    tab.className = "tab" + (key === activeSectionKey ? " active" : "");
                    tab.textContent = key;
                    tab.addEventListener("click", function () {
                        activeSectionKey = key;
                        renderOutputSections();
                    });
                    tabs.appendChild(tab);
                });
                output.value = outputSections[activeSectionKey] || "";
            }

            function setSingleOutput(text) {
                outputSections = { "结果": text || "" };
                activeSectionKey = "结果";
                renderOutputSections();
            }

            function setMultiOutput(mapObj) {
                outputSections = mapObj || {};
                activeSectionKey = Object.keys(outputSections)[0] || "";
                renderOutputSections();
            }

            function escapeCsvValue(value) {
                if (value === null || value === undefined) return "";
                const text = String(value);
                if (/[",\r\n]/.test(text)) {
                    return '"' + text.replace(/"/g, '""') + '"';
                }
                return text;
            }

            function splitCsvLine(line) {
                const result = [];
                let current = "";
                let inQuote = false;
                for (let i = 0; i < line.length; i++) {
                    const ch = line[i];
                    const next = i + 1 < line.length ? line[i + 1] : "";
                    if (ch === '"') {
                        if (inQuote && next === '"') {
                            current += '"';
                            i++;
                        } else {
                            inQuote = !inQuote;
                        }
                        continue;
                    }
                    if (ch === "," && !inQuote) {
                        result.push(current);
                        current = "";
                        continue;
                    }
                    current += ch;
                }
                result.push(current);
                return result;
            }

            function parseCsvTextToWorkbook(text) {
                function parseCsvCellValue(rawValue) {
                    const value = rawValue !== undefined ? String(rawValue).trim() : "";
                    if (!value) return "";
                    if (/^null$/i.test(value)) return null;
                    if (!/^-?\d+(\.\d+)?$/.test(value)) return value;

                    // Keep long integer IDs as text to avoid Excel precision loss.
                    if (/^-?\d+$/.test(value)) {
                        const pure = value.replace(/^-/, "");
                        const hasLeadingZero = pure.length > 1 && pure.startsWith("0");
                        if (pure.length > 15 || hasLeadingZero) {
                            return value;
                        }
                    }
                    return Number(value);
                }

                const rawLines = text
                    .replace(/\r/g, "")
                    .split("\n")
                    .map((l) => l.trim())
                    .filter((l) => l);
                if (!rawLines.length) throw new Error("CSV 内容为空");

                const headers = splitCsvLine(rawLines[0]).map((h) => h.trim());
                if (!headers.length) throw new Error("CSV 表头为空");

                const rows = [];
                for (let i = 1; i < rawLines.length; i++) {
                    const vals = splitCsvLine(rawLines[i]);
                    const row = {};
                    for (let j = 0; j < headers.length; j++) {
                        const key = headers[j] || ("col_" + (j + 1));
                        row[key] = parseCsvCellValue(vals[j]);
                    }
                    rows.push(row);
                }
                return { Sheet1: rows };
            }

            function splitValuesTuples(valuesText) {
                const tuples = [];
                let current = "";
                let depth = 0;
                let inSingle = false;
                let inDouble = false;
                for (let i = 0; i < valuesText.length; i++) {
                    const ch = valuesText[i];
                    const prev = i > 0 ? valuesText[i - 1] : "";
                    if (ch === "'" && !inDouble && prev !== "\\") inSingle = !inSingle;
                    if (ch === '"' && !inSingle && prev !== "\\") inDouble = !inDouble;
                    if (!inSingle && !inDouble) {
                        if (ch === "(") depth++;
                        if (ch === ")") depth--;
                        if (ch === "," && depth === 0) {
                            if (current.trim()) tuples.push(current.trim());
                            current = "";
                            continue;
                        }
                    }
                    current += ch;
                }
                if (current.trim()) tuples.push(current.trim());
                return tuples;
            }

            function splitTupleValues(tupleText) {
                const text = tupleText.trim().replace(/^\(/, "").replace(/\)$/, "");
                const vals = [];
                let current = "";
                let inSingle = false;
                let inDouble = false;
                for (let i = 0; i < text.length; i++) {
                    const ch = text[i];
                    const prev = i > 0 ? text[i - 1] : "";
                    if (ch === "'" && !inDouble && prev !== "\\") inSingle = !inSingle;
                    if (ch === '"' && !inSingle && prev !== "\\") inDouble = !inDouble;
                    if (ch === "," && !inSingle && !inDouble) {
                        vals.push(current.trim());
                        current = "";
                        continue;
                    }
                    current += ch;
                }
                vals.push(current.trim());
                return vals.map((v) => {
                    const t = v.trim();
                    if (/^null$/i.test(t)) return null;
                    if (/^-?\d+(\.\d+)?$/.test(t)) return Number(t);
                    if ((t.startsWith("'") && t.endsWith("'")) || (t.startsWith('"') && t.endsWith('"'))) {
                        return t.slice(1, -1).replace(/\\'/g, "'").replace(/\\"/g, '"');
                    }
                    return t;
                });
            }

            function parseInsertSqlToWorkbook(text) {
                const workbook = {};
                const regex = /insert\s+into\s+([`"]?[a-zA-Z0-9_]+[`"]?(?:\.[`"]?[a-zA-Z0-9_]+[`"]?)?)\s*\(([^)]+)\)\s*values\s*([\s\S]*?);/gi;
                let m = regex.exec(text);
                while (m) {
                    const table = m[1].replace(/[`"]/g, "").split(".").pop();
                    const columns = m[2].split(",").map((c) => c.replace(/[`"\s]/g, "").trim());
                    const tupleList = splitValuesTuples(m[3]);
                    if (!workbook[table]) workbook[table] = [];
                    tupleList.forEach((tuple) => {
                        const values = splitTupleValues(tuple);
                        const row = {};
                        for (let i = 0; i < columns.length; i++) {
                            row[columns[i]] = values[i] !== undefined ? values[i] : null;
                        }
                        workbook[table].push(row);
                    });
                    m = regex.exec(text);
                }
                if (Object.keys(workbook).length === 0) throw new Error("未识别到有效 Insert 语句");
                return workbook;
            }

            function getSourceWorkbook() {
                const sourceType = document.getElementById("source-type").value;
                if (sourceType === "json") {
                    return getTextInputWorkbook("json");
                }
                if (sourceType === "csv") {
                    return getTextInputWorkbook("csv");
                }
                if (sourceType === "sql") {
                    return getTextInputWorkbook("sql");
                }
                if (!workbookData) throw new Error("请先上传 Excel 文件");
                return workbookData;
            }

            function workbookToInsertSql(wb) {
                const blocks = [];
                Object.keys(wb).forEach((sheetName) => {
                    const rows = wb[sheetName] || [];
                    if (rows.length === 0) return;
                    const cols = Object.keys(rows[0]);
                    const values = rows.map((row) => {
                        return (
                            "(" +
                            cols
                                .map((col) => {
                                    const v = row[col];
                                    if (v === null || v === undefined || v === "") return "NULL";
                                    if (typeof v === "number") return String(v);
                                    return "'" + String(v).replace(/'/g, "\\'") + "'";
                                })
                                .join(", ") +
                            ")"
                        );
                    });
                    blocks.push("insert into " + sheetName + " (" + cols.join(", ") + ") values\n" + values.join(",\n") + ";");
                });
                return blocks.join("\n\n");
            }

            function workbookToInsertMap(wb) {
                const map = {};
                Object.keys(wb).forEach((sheetName) => {
                    const rows = wb[sheetName] || [];
                    if (!rows.length) {
                        map[sheetName] = "-- 空表，无可生成 insert 数据";
                        return;
                    }
                    const cols = Object.keys(rows[0]);
                    const values = rows.map((row) => {
                        return (
                            "(" +
                            cols
                                .map((col) => {
                                    const v = row[col];
                                    if (v === null || v === undefined || v === "") return "NULL";
                                    if (typeof v === "number") return String(v);
                                    return "'" + String(v).replace(/'/g, "\\'") + "'";
                                })
                                .join(", ") +
                            ")"
                        );
                    });
                    map[sheetName] = "insert into " + sheetName + " (" + cols.join(", ") + ") values\n" + values.join(",\n") + ";";
                });
                return map;
            }

            function workbookToCsvText(wb) {
                const sheets = Object.keys(wb);
                if (sheets.length === 0) return "";
                const first = wb[sheets[0]];
                if (!first || first.length === 0) return "";
                const headers = Object.keys(first[0]);
                const rows = [headers.join(",")];
                first.forEach((item) => {
                    rows.push(headers.map((k) => escapeCsvValue(item[k])).join(","));
                });
                return rows.join("\r\n");
            }

            function workbookToCsvMap(wb) {
                const map = {};
                Object.keys(wb).forEach((sheetName) => {
                    const rowsData = wb[sheetName] || [];
                    if (!rowsData.length) {
                        map[sheetName] = "";
                        return;
                    }
                    const headers = Object.keys(rowsData[0]);
                    const rows = [headers.join(",")];
                    rowsData.forEach((item) => {
                        rows.push(headers.map((k) => escapeCsvValue(item[k])).join(","));
                    });
                    map[sheetName] = rows.join("\r\n");
                });
                return map;
            }

            function workbookToJsonText(wb) {
                const names = Object.keys(wb);
                if (names.length === 1) return JSON.stringify(wb[names[0]], null, 2);
                return JSON.stringify(wb, null, 2);
            }

            function workbookToJsonMap(wb) {
                const map = {};
                Object.keys(wb).forEach((sheetName) => {
                    map[sheetName] = JSON.stringify(wb[sheetName] || [], null, 2);
                });
                return map;
            }

            function workbookToExcelBlob(wb) {
                const wbObj = XLSX.utils.book_new();
                Object.keys(wb).forEach((sheetName) => {
                    const arr = wb[sheetName] || [];
                    const ws = XLSX.utils.json_to_sheet(arr);
                    XLSX.utils.book_append_sheet(wbObj, ws, sheetName.slice(0, 31) || "Sheet1");
                });
                const out = XLSX.write(wbObj, { bookType: "xlsx", type: "array" });
                return new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
            }

            function runConvert() {
                try {
                    const wb = getSourceWorkbook();
                    const target = document.getElementById("target-type").value;
                    outputBlob = null;
                    outputFilename = "";
                    outputTextData = "";

                    if (target === "insert") {
                        const insertMap = workbookToInsertMap(wb);
                        setMultiOutput(insertMap);
                        outputTextData = Object.keys(insertMap)
                            .map((k) => "-- TABLE: " + k + "\n" + insertMap[k])
                            .join("\n\n");
                        outputBlob = new Blob([outputTextData], { type: "text/plain" });
                        outputFilename = "output.sql";
                        setStatus("转换成功：多表结果已按 tab 分组展示。", false);
                        return;
                    }
                    if (target === "json") {
                        const jsonMap = workbookToJsonMap(wb);
                        setMultiOutput(jsonMap);
                        outputTextData = Object.keys(jsonMap)
                            .map((k) => "// " + k + "\n" + jsonMap[k])
                            .join("\n\n");
                        outputBlob = new Blob([workbookToJsonText(wb)], { type: "application/json" });
                        outputFilename = "output.json";
                        setStatus("转换成功：JSON 已按表 / sheet 分组为多个 tab。", false);
                        return;
                    }
                    if (target === "csv") {
                        const csvMap = workbookToCsvMap(wb);
                        setMultiOutput(csvMap);
                        outputTextData = Object.keys(csvMap)
                            .map((k) => "-- SHEET: " + k + "\n" + csvMap[k])
                            .join("\n\n");
                        outputBlob = new Blob(["\ufeff" + outputTextData], { type: "text/csv" });
                        outputFilename = "output.csv";
                        setStatus("转换成功：CSV 已按 sheet 分组为多个 tab。", false);
                        return;
                    }
                    if (target === "excel") {
                        outputBlob = workbookToExcelBlob(wb);
                        outputFilename = "output.xlsx";
                        const summaryMap = {};
                        Object.keys(wb).forEach((name) => {
                            const rows = wb[name] || [];
                            summaryMap[name] = "行数：" + rows.length + "\n预览(前5行)：\n" + JSON.stringify(rows.slice(0, 5), null, 2);
                        });
                        setMultiOutput(summaryMap);
                        setStatus("转换成功：多表 Insert 会按表名导出为多个 Sheet。", false);
                    }
                } catch (error) {
                    setSingleOutput("");
                    outputBlob = null;
                    outputFilename = "";
                    setStatus("转换失败：" + error.message, true);
                }
            }

            function downloadOutput() {
                if (!outputBlob) {
                    setStatus("请先执行转换。", true);
                    return;
                }
                const a = document.createElement("a");
                a.href = URL.createObjectURL(outputBlob);
                a.download = outputFilename || "output.txt";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
            }

            function clearAll() {
                const sheet = getActiveSheet();
                if (sheet) sheet.content = "";
                textInputEl.value = "";
                syncInputFromTextarea();
                persistSheetsState();
                document.getElementById("output").value = "";
                document.getElementById("excel-file").value = "";
                workbookData = null;
                outputBlob = null;
                outputFilename = "";
                outputTextData = "";
                outputSections = {};
                activeSectionKey = "";
                document.getElementById("output-tabs").innerHTML = "";
                setStatus("已清空当前输入页。", false);
            }

            function syncUIBySourceType() {
                const sourceType = document.getElementById("source-type").value;
                const excelFile = document.getElementById("excel-file");
                const isExcel = sourceType === "excel";
                if (inputWrapEl) inputWrapEl.hidden = isExcel;
                if (inputHintEl) inputHintEl.hidden = isExcel;
                excelFile.style.display = isExcel ? "inline-block" : "none";
                if (isExcel) {
                    textInputEl.placeholder = "请上传 Excel 文件（支持多 Sheet），然后点击“执行转换”。";
                } else if (sourceType === "sql") {
                    textInputEl.placeholder =
                        "每个工作表可粘贴 SQL Insert；底部 + 可新建工作表，双击标签可重命名。";
                } else if (sourceType === "csv") {
                    textInputEl.placeholder =
                        "每个工作表粘贴一份 CSV（首行为表头）；底部可切换多个工作表。";
                } else {
                    textInputEl.placeholder =
                        "每个工作表可粘贴 JSON 数组；底部 + 可新建工作表，双击标签可重命名。";
                }
                refreshTargetOptionsVisibility();
                enforceSourceTargetExclusion(false);
            }

            document.getElementById("excel-file").addEventListener("change", function (event) {
                const file = event.target.files && event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const wb = XLSX.read(data, { type: "array", cellDates: true });
                        const obj = {};
                        wb.SheetNames.forEach((name) => {
                            obj[name] = XLSX.utils.sheet_to_json(wb.Sheets[name], {
                                defval: null,
                                raw: false,
                                dateNF: "yyyy-mm-dd HH:mm:ss"
                            });
                        });
                        workbookData = obj;
                        setStatus("已读取 Excel 文件：" + file.name + "（" + wb.SheetNames.length + " 个 Sheet）", false);
                    } catch (error) {
                        workbookData = null;
                        setStatus("Excel 读取失败：" + error.message, true);
                    }
                };
                reader.readAsArrayBuffer(file);
            });

            document.getElementById("source-type").addEventListener("change", function () {
                syncUIBySourceType();
                enforceSourceTargetExclusion(true);
            });
            document.getElementById("target-type").addEventListener("change", function () {
                enforceSourceTargetExclusion(true);
            });
            document.getElementById("convert-btn").addEventListener("click", runConvert);
            document.getElementById("download-btn").addEventListener("click", downloadOutput);
            document.getElementById("clear-btn").addEventListener("click", clearAll);
            document.addEventListener("contextmenu", function (event) {
                event.preventDefault();
            });
            const output = document.getElementById("output");

            if (sheetAddBtn) sheetAddBtn.addEventListener("click", addSheet);

            if (sheetTabsEl && window.ToolSheetTabsDrag) {
                ToolSheetTabsDrag.attach({
                    container: sheetTabsEl,
                    isDragDisabled: () => !!sheetRenameId,
                    onReorder: reorderSheet,
                });
            }

            textInputEl.addEventListener("input", function () {
                const sheet = getActiveSheet();
                if (sheet) sheet.content = textInputEl.value;
                schedulePersistSheets();
            });

            function restoreSheetsFromPersist() {
                if (!sheetsMetaInput.value && !textInputEl.value && inputSheets.length > 0) return;
                initSheetsFromStorage();
                applyActiveSheetToInput();
                renderSheetTabs();
            }
            window.toolNavRestoreForm = restoreSheetsFromPersist;

            restoreSheetsFromPersist();
            persistSheetsState();
            window.addEventListener("load", restoreSheetsFromPersist);
            document.addEventListener("tool-nav:form-restored", restoreSheetsFromPersist);
            syncUIBySourceType();
        </script>
        <script src="libs/tool-form-persist.js"></script>
    </body>
</html>
