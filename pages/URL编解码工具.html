<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>URL 编解码</title>
        <script src="libs/codec-url-iife.js"></script>
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                --bg: #f3f7ff;
                --card: #fff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
                --foot-bg: #f8fbff;
                --input-border: #cfdcf7;
                --toolbar-line: #e4edff;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
                overflow: hidden;
            }
            .page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                min-height: 0;
                gap: 10px;
            }
            .opts {
                flex-shrink: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                padding: 8px 12px;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 10px 16px;
            }
            .mode-seg {
                display: inline-flex;
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                overflow: hidden;
                background: #edf3ff;
            }
            .mode-seg button {
                border: none;
                background: transparent;
                padding: 6px 16px;
                font-size: 13px;
                cursor: pointer;
                color: #3c4f78;
            }
            .mode-seg button:hover:not(.active) {
                color: var(--primary);
                background: rgba(47, 107, 255, 0.06);
            }
            .mode-seg button.active {
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
                color: #fff;
            }
            .mode-seg button.active:hover {
                opacity: 0.95;
                color: #fff;
            }
            .split {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                gap: 10px;
                align-items: stretch;
            }
            .split[hidden] {
                display: none !important;
            }
            .pane {
                flex: 1 1 0;
                min-width: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .pane-hd {
                flex-shrink: 0;
                padding: 8px 10px;
                font-weight: 600;
                font-size: 14px;
                color: #324a76;
                background: var(--foot-bg);
                border-bottom: 1px solid var(--toolbar-line);
            }
            .pane-body {
                flex: 1;
                min-height: 0;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 0;
            }
            .pane-ta {
                flex: 1;
                width: 100%;
                min-height: 120px;
                border: 1px solid var(--input-border);
                border-radius: 8px;
                padding: 10px;
                font-family: Consolas, "Courier New", monospace;
                font-size: 14px;
                line-height: 1.55;
                resize: none;
                outline: none;
                background: #fff;
                color: var(--text);
            }
            .pane-ta:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.12);
            }
            .pane-ta[readonly] {
                background: #fafcff;
            }
            .foot {
                flex-shrink: 0;
                border-top: 1px solid var(--toolbar-line);
                background: var(--foot-bg);
                padding: 8px 10px;
                display: flex;
                flex-wrap: wrap;
                gap: 10px 14px;
                align-items: center;
            }
            .foot .foot-hint {
                flex: 1 1 100%;
                margin: 0;
                font-size: 12px;
                color: var(--muted);
                line-height: 1.45;
            }
            .foot .foot-hint code {
                font-size: 11px;
                background: #eef3ff;
                padding: 1px 5px;
                border-radius: 4px;
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 6px 12px;
                font-size: 13px;
                cursor: pointer;
            }
            .btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .out-wrap {
                position: relative;
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }
            .out-empty {
                position: absolute;
                inset: 0;
                display: none;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                color: var(--muted);
                font-size: 13px;
                pointer-events: none;
                background: #fafcff;
                border-radius: 8px;
                z-index: 1;
            }
            .out-empty.visible {
                display: flex;
            }
            .out-empty-icon {
                width: 40px;
                height: 32px;
                border: 2px solid #cfdcf7;
                border-radius: 4px;
                position: relative;
                opacity: 0.85;
            }
            .out-empty-icon::before {
                content: "";
                position: absolute;
                left: 5px;
                right: 5px;
                top: -5px;
                height: 7px;
                border: 2px solid #cfdcf7;
                border-bottom: none;
                border-radius: 4px 4px 0 0;
            }
            @media (max-width: 820px) {
                .split {
                    flex-direction: column;
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="opts">
                <div class="mode-seg" role="tablist">
                    <button type="button" class="active" data-tab="enc">编码</button>
                    <button type="button" data-tab="dec">解码</button>
                </div>
            </div>

            <div id="split-enc" class="split">
                <section class="pane">
                    <div class="pane-hd">输入</div>
                    <div class="pane-body">
                        <textarea id="encIn" class="pane-ta" placeholder="例如：q=你好&amp;x=1"></textarea>
                    </div>
                    <div class="foot">
                        <button type="button" class="btn" id="encRun" title="执行编码">▶</button>
                        <p class="foot-hint">
                            使用 <code>strict-uri-encode</code> 思路（<code>libs/codec-url-iife.js</code>），适用于 URI 组件编码。
                        </p>
                    </div>
                </section>
                <section class="pane">
                    <div class="pane-hd">URL 输出</div>
                    <div class="pane-body">
                        <div class="out-wrap">
                            <div id="encEmpty" class="out-empty visible">
                                <span class="out-empty-icon" aria-hidden="true"></span>
                                <span>暂无输出</span>
                            </div>
                            <textarea id="encOut" class="pane-ta" readonly placeholder="编码结果"></textarea>
                        </div>
                    </div>
                </section>
            </div>

            <div id="split-dec" class="split" hidden>
                <section class="pane">
                    <div class="pane-hd">输入</div>
                    <div class="pane-body">
                        <textarea id="decIn" class="pane-ta" placeholder="例如 %E4%BD%A0%E5%A5%BD"></textarea>
                    </div>
                    <div class="foot">
                        <button type="button" class="btn" id="decRun" title="执行解码">▶</button>
                        <p class="foot-hint">使用 <code>decode-uri-component</code> 解码百分号编码。</p>
                    </div>
                </section>
                <section class="pane">
                    <div class="pane-hd">解码输出</div>
                    <div class="pane-body">
                        <div class="out-wrap">
                            <div id="decEmpty" class="out-empty visible">
                                <span class="out-empty-icon" aria-hidden="true"></span>
                                <span>暂无输出</span>
                            </div>
                            <textarea id="decOut" class="pane-ta" readonly placeholder="解码结果"></textarea>
                        </div>
                    </div>
                </section>
            </div>
        </div>
        <script>
            (function () {
                if (typeof window.ctoolStrictUriEncode !== "function") {
                    document.querySelector(".page").innerHTML = "<p style='padding:12px'>缺少 libs/codec-url-iife.js</p>";
                    return;
                }
                var encTimer = null;
                var decTimer = null;
                function syncEncEmpty() {
                    var v = document.getElementById("encOut").value;
                    document.getElementById("encEmpty").classList.toggle("visible", !v || !String(v).trim());
                }
                function syncDecEmpty() {
                    var v = document.getElementById("decOut").value;
                    document.getElementById("decEmpty").classList.toggle("visible", !v || !String(v).trim());
                }
                function runEnc() {
                    var encOut = document.getElementById("encOut");
                    try {
                        encOut.value =
                            document.getElementById("encIn").value === ""
                                ? ""
                                : window.ctoolStrictUriEncode(document.getElementById("encIn").value);
                    } catch (e) {
                        encOut.value = String(e && e.message ? e.message : e);
                    }
                    syncEncEmpty();
                }
                function runDec() {
                    var decOut = document.getElementById("decOut");
                    try {
                        decOut.value =
                            document.getElementById("decIn").value === ""
                                ? ""
                                : window.ctoolDecodeUriComponent(document.getElementById("decIn").value);
                    } catch (e) {
                        decOut.value = String(e && e.message ? e.message : e);
                    }
                    syncDecEmpty();
                }
                function scheduleEnc() {
                    clearTimeout(encTimer);
                    encTimer = setTimeout(runEnc, 80);
                }
                function scheduleDec() {
                    clearTimeout(decTimer);
                    decTimer = setTimeout(runDec, 80);
                }
                document.getElementById("encIn").addEventListener("input", scheduleEnc);
                document.getElementById("decIn").addEventListener("input", scheduleDec);
                document.getElementById("encRun").addEventListener("click", function () {
                    clearTimeout(encTimer);
                    runEnc();
                });
                document.getElementById("decRun").addEventListener("click", function () {
                    clearTimeout(decTimer);
                    runDec();
                });
                document.querySelectorAll(".mode-seg button").forEach(function (btn) {
                    btn.addEventListener("click", function () {
                        document.querySelectorAll(".mode-seg button").forEach(function (b) {
                            b.classList.toggle("active", b === btn);
                        });
                        var tab = btn.getAttribute("data-tab");
                        document.getElementById("split-enc").hidden = tab !== "enc";
                        document.getElementById("split-dec").hidden = tab !== "dec";
                    });
                });
                runEnc();
                runDec();
            })();
            document.addEventListener("contextmenu", function (e) {
                e.preventDefault();
            });
        </script>
    </body>
</html>
