<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>翻译工具</title>
        <link rel="stylesheet" href="libs/tool-danger-btn.css" />
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                --bg: #f3f7ff;
                --card: #ffffff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --shadow: 0 10px 24px rgba(36, 90, 190, 0.12);
                --foot-bg: #f8fbff;
                --toolbar-line: #e4edff;
                --input-border: #cfdcf7;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                font-size: 13px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
                overflow: hidden;
            }
            .page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                min-height: 0;
                box-sizing: border-box;
            }
            .panel {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 10px;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
                box-shadow: var(--shadow);
                padding: 10px;
                min-height: 0;
                overflow: hidden;
            }
            h3 {
                margin: 0;
                font-size: 14px;
                color: var(--text);
                flex-shrink: 0;
            }
            .hint {
                font-size: 11px;
                color: var(--muted);
                line-height: 1.5;
                margin: 0;
                flex-shrink: 0;
            }
            .fill-stack {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .row-2 {
                flex: 1;
                min-height: 0;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                align-items: stretch;
            }
            @media (max-width: 880px) {
                .row-2 {
                    grid-template-columns: 1fr;
                }
            }
            .pane {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                min-height: 0;
                min-width: 0;
                height: 100%;
            }
            .pane-hd {
                flex-shrink: 0;
                padding: 8px 10px;
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 8px;
                font-size: 13px;
                font-weight: 600;
                color: #324a76;
                background: var(--foot-bg);
                border-bottom: 1px solid var(--toolbar-line);
                border-radius: 10px 10px 0 0;
            }
            .pane-hd.fill {
                justify-content: flex-start;
            }
            select.lang {
                border: 1px solid var(--input-border);
                border-radius: 8px;
                padding: 6px 8px;
                font-size: 12px;
                background: #fff;
                color: var(--text);
                min-width: 112px;
                max-width: 100%;
                outline: none;
                font-family: inherit;
            }
            select.lang:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.15);
            }
            .swap-btn {
                width: 34px;
                height: 32px;
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
                flex-shrink: 0;
            }
            .swap-btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .mode-seg {
                display: inline-flex;
                flex-wrap: wrap;
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                overflow: hidden;
                background: #edf3ff;
            }
            .mode-seg button {
                border: none;
                background: transparent;
                padding: 6px 12px;
                font-size: 13px;
                cursor: pointer;
                color: #3c4f78;
                font-family: inherit;
            }
            .mode-seg button:hover:not(.active) {
                color: var(--primary);
                background: rgba(47, 107, 255, 0.06);
            }
            .mode-seg button.active {
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
                color: #fff;
            }
            .pane-body {
                flex: 1;
                position: relative;
                padding: 10px;
                display: flex;
                flex-direction: column;
                min-height: 0;
                overflow: hidden;
            }
            .pane-body.scroll-y {
                overflow-y: auto;
            }
            .ta-wrap {
                flex: 1;
                position: relative;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }
            textarea.main-ta {
                flex: 1;
                width: 100%;
                min-height: 0;
                border: 1px solid var(--input-border);
                border-radius: 8px;
                resize: none;
                font-size: 14px;
                line-height: 1.55;
                outline: none;
                padding: 10px 32px 10px 10px;
                font-family: inherit;
                color: var(--text);
                background: #fff;
            }
            textarea.main-ta:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.12);
            }
            .out-text {
                flex: 1;
                width: 100%;
                min-height: 0;
                font-size: 14px;
                line-height: 1.55;
                white-space: pre-wrap;
                word-break: break-word;
                color: var(--text);
                border: 1px solid var(--input-border);
                border-radius: 8px;
                padding: 10px;
                background: #fafcff;
                overflow-y: auto;
                transition: opacity 0.2s ease;
            }
            .out-text.is-loading {
                opacity: 0.45;
            }
            .out-wrap {
                flex: 1;
                position: relative;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }
            .translate-loading {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(248, 251, 255, 0.88);
                border-radius: 8px;
                z-index: 2;
            }
            .translate-loading[hidden] {
                display: none !important;
            }
            .translate-loading-inner {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 10px 14px;
                background: #fff;
                border: 1px solid #dbe7ff;
                border-radius: 10px;
                box-shadow: 0 8px 20px rgba(36, 90, 190, 0.12);
            }
            .translate-loading-spinner {
                width: 22px;
                height: 22px;
                border-radius: 50%;
                border: 2px solid #e0e9ff;
                border-top-color: var(--primary);
                animation: translate-spin 0.75s linear infinite;
                flex-shrink: 0;
            }
            @keyframes translate-spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .translate-loading-text {
                font-size: 13px;
                color: #3c4f78;
                font-weight: 600;
            }
            .pane-foot {
                flex-shrink: 0;
                border-top: 1px solid var(--toolbar-line);
                background: var(--foot-bg);
                padding: 8px 10px;
                display: flex;
                flex-wrap: wrap;
                gap: 8px 10px;
                align-items: center;
                justify-content: space-between;
                border-radius: 0 0 10px 10px;
            }
            .icon-group {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-wrap: wrap;
            }
            .icon-btn {
                width: 32px;
                height: 32px;
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
            }
            .icon-btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .icon-btn.active {
                border-color: var(--primary);
                color: var(--primary);
                background: rgba(47, 107, 255, 0.1);
            }
            .icon-btn:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }
            .icon-btn.tool-btn-danger {
                color: #fff;
                border-color: transparent;
                background: linear-gradient(135deg, #e04040, #ff7979);
            }
            .icon-btn.tool-btn-danger:hover:not(:disabled) {
                filter: brightness(1.05);
                color: #fff;
                border-color: transparent;
            }
            .char-count {
                font-size: 12px;
                color: var(--muted);
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 6px 12px;
                font-size: 13px;
                cursor: pointer;
                font-family: inherit;
                display: inline-flex;
                align-items: center;
                gap: 4px;
            }
            .btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .btn-sm {
                padding: 4px 10px;
                font-size: 12px;
            }
            .detail-body {
                display: flex;
                flex-direction: column;
                gap: 8px;
                flex: 1;
                min-height: 0;
                overflow: hidden;
            }
            .ai-body {
                font-size: 17px;
                font-weight: 600;
                line-height: 1.45;
                margin-bottom: 0;
                min-height: 0;
                flex: 1;
                overflow-y: auto;
                color: var(--text);
            }
            .dict-line {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 8px;
                flex-shrink: 0;
            }
            .dict-term {
                color: var(--primary);
                font-weight: 700;
                font-size: 15px;
            }
            .dict-trans {
                font-size: 14px;
                color: var(--text);
            }
            .tag-soft {
                font-size: 11px;
                color: var(--muted);
                background: #eef3ff;
                padding: 2px 8px;
                border-radius: 4px;
                border: 1px solid var(--border);
            }
            .detail-body > div:nth-child(2) {
                flex-shrink: 0;
            }
            .ex-title {
                font-size: 12px;
                color: var(--muted);
                margin: 8px 0 4px;
                flex-shrink: 0;
            }
            .ex-list {
                margin: 0;
                padding: 0;
                list-style: none;
                display: flex;
                flex-direction: column;
                gap: 10px;
                flex: 1;
                min-height: 0;
                overflow-y: auto;
            }
            .ex-item {
                font-size: 13px;
                line-height: 1.55;
            }
            .ex-zh {
                color: var(--text);
            }
            .ex-en {
                color: #465a84;
                margin-top: 4px;
            }
            .ex-en em,
            .ex-zh em {
                font-style: normal;
                color: var(--primary);
                font-weight: 600;
            }
            .ex-src {
                font-size: 11px;
                color: var(--muted);
                margin-top: 4px;
            }
            .ai-head {
                font-size: 14px;
                font-weight: 600;
                color: #324a76;
                padding-bottom: 6px;
                margin-bottom: 10px;
                border-bottom: 2px solid var(--primary);
                display: inline-block;
            }
            .ai-foot {
                font-size: 11px;
                color: var(--muted);
                line-height: 1.5;
                margin: 0;
                flex-shrink: 0;
            }
            .global-err {
                color: #c0392b;
                font-size: 12px;
                padding: 0 2px;
                display: none;
                flex-shrink: 0;
            }
            #copy-toast {
                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%) translateY(10px);
                padding: 8px 16px;
                background: rgba(31, 42, 68, 0.92);
                color: #fff;
                border-radius: 8px;
                font-size: 13px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease, transform 0.2s ease;
                z-index: 100000;
                box-shadow: 0 4px 16px rgba(36, 90, 190, 0.2);
            }
            #copy-toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="panel">
                <h3>翻译工具</h3>
                <p class="hint">
                    译文由 MyMemory 开放接口提供（需联网）。词典例句为根据原文/译文自动组装的示意句，非权威语料库。
                </p>

                <div class="fill-stack">
                <div class="row-2">
                    <section class="pane">
                        <div class="pane-hd">
                            <select id="src-lang" class="lang" name="src_lang" title="源语言">
                                <option value="auto">自动检测</option>
                                <option value="zh-CN">中文</option>
                                <option value="en">英语</option>
                                <option value="ja">日语</option>
                                <option value="ko">韩语</option>
                                <option value="fr">法语</option>
                                <option value="de">德语</option>
                            </select>
                            <button type="button" class="swap-btn" id="swap-lang" title="交换语言" aria-label="交换语言">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12m0 0l4-4m-4 4l-4-4" />
                                </svg>
                            </button>
                            <select id="tgt-lang" class="lang" name="tgt_lang" title="目标语言">
                                <option value="en">英语</option>
                                <option value="zh-CN">中文</option>
                                <option value="ja">日语</option>
                                <option value="ko">韩语</option>
                                <option value="fr">法语</option>
                                <option value="de">德语</option>
                            </select>
                        </div>
                        <div class="pane-body">
                            <div class="ta-wrap">
                                <textarea
                                    id="src-text"
                                    class="main-ta"
                                    name="src_text"
                                    maxlength="5000"
                                    placeholder="请输入文本"
                                    spellcheck="false"
                                ></textarea>
                            </div>
                        </div>
                        <div class="pane-foot">
                            <div class="icon-group">
                                <button type="button" class="icon-btn" id="speak-src" title="朗读原文（浏览器语音）" aria-label="朗读原文">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                        <path
                                            d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
                                        />
                                    </svg>
                                </button>
                                <button type="button" class="icon-btn" id="retry-translate" title="重新翻译" aria-label="重新翻译">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M23 4v6h-6M1 20v-6h6" />
                                        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />
                                    </svg>
                                </button>
                                <button type="button" class="icon-btn tool-btn-danger" id="clear-src" title="清空" aria-label="清空">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="3 6 5 6 21 6" />
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                                        <line x1="10" y1="11" x2="10" y2="17" />
                                        <line x1="14" y1="11" x2="14" y2="17" />
                                    </svg>
                                </button>
                            </div>
                            <span class="char-count"><span id="char-num">0</span>/5000</span>
                        </div>
                    </section>

                    <section class="pane">
                        <div class="pane-hd fill">
                            <div class="mode-seg domain-tabs" role="tablist">
                                <button type="button" class="active" data-domain="general">通用领域</button>
                                <button type="button" data-domain="bio">生物医学</button>
                                <button type="button" data-domain="finance">金融财经</button>
                            </div>
                        </div>
                        <div class="pane-body">
                            <div class="out-wrap">
                                <div id="main-out" class="out-text" aria-live="polite"></div>
                                <div id="translate-loading" class="translate-loading" hidden aria-hidden="true" role="status">
                                    <div class="translate-loading-inner">
                                        <div class="translate-loading-spinner" aria-hidden="true"></div>
                                        <span id="translate-loading-text" class="translate-loading-text">正在翻译…</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="pane-foot">
                            <div class="icon-group">
                                <button type="button" class="icon-btn" id="speak-out" title="朗读译文" aria-label="朗读译文">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                        <path
                                            d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
                                        />
                                    </svg>
                                </button>
                                <button type="button" class="icon-btn" id="retry-out" title="重新翻译" aria-label="重新翻译">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M23 4v6h-6M1 20v-6h6" />
                                        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />
                                    </svg>
                                </button>
                            </div>
                            <div class="icon-group">
                                <button type="button" class="btn btn-sm" id="copy-main">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="9" y="9" width="13" height="13" rx="2" />
                                        <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" />
                                    </svg>
                                    复制
                                </button>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="row-2">
                    <section class="pane">
                        <div class="pane-hd">词典释义</div>
                        <div class="pane-body detail-body">
                            <div class="dict-line">
                                <span id="dict-term" class="dict-term"></span>
                                <span id="dict-trans" class="dict-trans"></span>
                            </div>
                            <div><span class="tag-soft">常用</span> <span class="tag-soft">双语例句</span></div>
                            <div class="ex-title">以下为示意例句（随译文更新自动生成）</div>
                            <ul id="ex-list" class="ex-list"></ul>
                        </div>
                    </section>

                    <section class="pane">
                        <div class="pane-hd">AI大模型译文</div>
                        <div class="pane-body detail-body">
                            <div id="ai-out" class="ai-body"></div>
                            <p class="ai-foot">
                                以上结果为同次机器翻译的强调展示样式；接入自有大模型 API 后可替换为真实模型输出。当前非腾讯混元。
                            </p>
                        </div>
                        <div class="pane-foot">
                            <div class="icon-group">
                                <button type="button" class="icon-btn" id="speak-ai" title="朗读" aria-label="朗读">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                        <path
                                            d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
                                        />
                                    </svg>
                                </button>
                                <button type="button" class="icon-btn" id="retry-ai" title="重新翻译" aria-label="重新翻译">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M23 4v6h-6M1 20v-6h6" />
                                        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />
                                    </svg>
                                </button>
                            </div>
                            <div class="icon-group">
                                <button type="button" class="btn btn-sm" id="copy-ai">复制</button>
                            </div>
                        </div>
                    </section>
                </div>
                </div>

                <p id="global-err" class="global-err"></p>
            </div>
        </div>
        <div id="copy-toast" role="status" aria-live="polite"></div>

        <script>
            (function () {
                var MAX = 5000;
                var srcLang = document.getElementById("src-lang");
                var tgtLang = document.getElementById("tgt-lang");
                var srcText = document.getElementById("src-text");
                var mainOut = document.getElementById("main-out");
                var aiOut = document.getElementById("ai-out");
                var charNum = document.getElementById("char-num");
                var globalErr = document.getElementById("global-err");
                var dictTerm = document.getElementById("dict-term");
                var dictTrans = document.getElementById("dict-trans");
                var exList = document.getElementById("ex-list");
                var domain = "general";
                var lastTrans = "";
                var debounceTimer = null;
                var loading = false;
                var translateReqId = 0;
                var translateLoadingEl = document.getElementById("translate-loading");
                var translateLoadingText = document.getElementById("translate-loading-text");

                function setTranslateLoading(on, msg) {
                    if (!translateLoadingEl) return;
                    if (on && srcText.value.trim()) {
                        translateLoadingEl.hidden = false;
                        translateLoadingEl.setAttribute("aria-hidden", "false");
                        mainOut.classList.add("is-loading");
                        if (translateLoadingText && msg) {
                            translateLoadingText.textContent = msg;
                        }
                    } else {
                        translateLoadingEl.hidden = true;
                        translateLoadingEl.setAttribute("aria-hidden", "true");
                        mainOut.classList.remove("is-loading");
                    }
                }

                function showErr(msg) {
                    if (!msg) {
                        globalErr.style.display = "none";
                        globalErr.textContent = "";
                        return;
                    }
                    globalErr.textContent = msg;
                    globalErr.style.display = "block";
                }

                function escapeHtml(s) {
                    return String(s)
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;");
                }

                function countCJK(t) {
                    var m = String(t).match(/[\u4e00-\u9fff\u3400-\u4dbf]/g);
                    return m ? m.length : 0;
                }

                function countLatinLetters(t) {
                    var m = String(t).match(/[A-Za-z]/g);
                    return m ? m.length : 0;
                }

                function detectSourceCode(text) {
                    var cjk = countCJK(text);
                    var lat = countLatinLetters(text);
                    if (cjk === 0 && lat === 0) return "zh-CN";
                    return cjk >= lat ? "zh-CN" : "en";
                }

                function getEffectivePair() {
                    var raw = srcText.value;
                    var s = srcLang.value;
                    var t = tgtLang.value;
                    if (s === "auto") {
                        s = detectSourceCode(raw);
                    }
                    if (s === t) {
                        t = s === "zh-CN" ? "en" : "zh-CN";
                    }
                    return { src: s, tgt: t, detected: srcLang.value === "auto" ? s : null };
                }

                function domainPrefix() {
                    if (domain === "bio") return "【生物医学语境】";
                    if (domain === "finance") return "【金融财经语境】";
                    return "";
                }

                function updateCharCount() {
                    var n = srcText.value.length;
                    charNum.textContent = String(n);
                }

                function updateSrcLangLabel() {
                    var opt = srcLang.querySelector('option[value="auto"]');
                    if (!opt) return;
                    if (srcLang.value !== "auto") {
                        opt.textContent = "自动检测";
                        return;
                    }
                    var d = detectSourceCode(srcText.value);
                    var map = { "zh-CN": "中文", en: "英语", ja: "日语", ko: "韩语", fr: "法语", de: "德语" };
                    opt.textContent = "自动检测（当前推断为" + (map[d] || d) + "）";
                }

                function renderExamples(src, trans) {
                    exList.innerHTML = "";
                    if (!src.trim() || !trans.trim()) return;
                    var term = src.trim().split(/\n/)[0];
                    if (term.length > 36) term = term.slice(0, 36) + "…";
                    var tr = trans.trim().split(/\n/)[0];
                    if (tr.length > 48) tr = tr.slice(0, 48) + "…";
                    var pair = getEffectivePair();
                    var toZh = pair.tgt === "zh-CN";

                    function addEx(lineZh, lineEn, url) {
                        var li = document.createElement("li");
                        li.className = "ex-item";
                        li.innerHTML =
                            '<div class="ex-zh">' +
                            lineZh +
                            '</div><div class="ex-en">' +
                            lineEn +
                            "</div>" +
                            (url ? '<div class="ex-src">' + escapeHtml(url) + "</div>" : "");
                        exList.appendChild(li);
                    }

                    if (toZh) {
                        addEx(
                            "1. 我们在上一迭代中落实了「" + escapeHtml(tr) + "」。",
                            '1. We implemented <em>' + escapeHtml(term) + "</em> in the last sprint.",
                            "example.local/dev"
                        );
                        addEx(
                            "2. 请在发布前再次确认「" + escapeHtml(tr) + "」。",
                            '2. Please double-check <em>' + escapeHtml(term) + "</em> before release.",
                            ""
                        );
                    } else {
                        addEx(
                            "1. 我们加强了「" + escapeHtml(term) + "」相关流程。",
                            '1. We strengthened <em>' + escapeHtml(tr) + "</em> in related processes.",
                            "example.local/dev"
                        );
                        addEx(
                            "2. 系统将「" + escapeHtml(term) + "」列为关键能力。",
                            '2. The system treats <em>' + escapeHtml(tr) + "</em> as a key capability.",
                            ""
                        );
                    }
                }

                function fillDict(src, trans) {
                    var line = src.trim().split(/\n/)[0] || src.trim();
                    if (line.length > 80) line = line.slice(0, 80) + "…";
                    dictTerm.textContent = line || "—";
                    dictTrans.textContent = trans.trim() ? trans.trim().split(/\n/)[0] : "—";
                    renderExamples(src, trans);
                }

                function applyResult(text) {
                    lastTrans = text;
                    mainOut.textContent = text;
                    aiOut.textContent = text ? titleCaseIfEnglish(text) : "";
                    fillDict(srcText.value, text);
                }

                function titleCaseIfEnglish(s) {
                    var pair = getEffectivePair();
                    if (pair.tgt !== "en") return s;
                    return s.replace(/\b[a-z](\w*)/g, function (m) {
                        return m.charAt(0).toUpperCase() + m.slice(1);
                    });
                }

                function translateNow() {
                    showErr("");
                    var q = srcText.value.trim();
                    if (!q) {
                        setTranslateLoading(false);
                        applyResult("");
                        return;
                    }
                    var reqId = ++translateReqId;
                    var pair = getEffectivePair();
                    var prefix = domainPrefix();
                    var apiQ = prefix ? prefix + "\n" + q : q;
                    loading = true;
                    setTranslateLoading(true, "正在翻译…");
                    var url =
                        "https://api.mymemory.translated.net/get?q=" +
                        encodeURIComponent(apiQ.slice(0, 4500)) +
                        "&langpair=" +
                        encodeURIComponent(pair.src + "|" + pair.tgt);
                    fetch(url, { method: "GET" })
                        .then(function (r) {
                            if (!r.ok) throw new Error("HTTP " + r.status);
                            return r.json();
                        })
                        .then(function (data) {
                            if (reqId !== translateReqId) return;
                            var txt =
                                data &&
                                data.responseData &&
                                typeof data.responseData.translatedText === "string"
                                    ? data.responseData.translatedText
                                    : "";
                            if (!txt && data && data.responseStatus && data.responseStatus !== 200) {
                                throw new Error((data.responseDetails || "").trim() || "翻译接口返回异常");
                            }
                            var clean = String(txt).replace(/^\s*【(?:生物医学|金融财经)语境】\s*\n?/, "");
                            applyResult(clean);
                            if (data && data.responseDetails && String(data.responseDetails).toLowerCase().indexOf("limit") >= 0) {
                                showErr("提示：" + data.responseDetails);
                            }
                        })
                        .catch(function (e) {
                            if (reqId !== translateReqId) return;
                            showErr(
                                (e && e.message ? e.message : String(e)) +
                                    "（若从 file:// 打开，可能受跨域限制，请通过本地 HTTP 访问。）"
                            );
                            applyResult("");
                        })
                        .finally(function () {
                            if (reqId !== translateReqId) return;
                            loading = false;
                            setTranslateLoading(false);
                        });
                }

                function scheduleTranslate() {
                    if (debounceTimer) clearTimeout(debounceTimer);
                    var q = srcText.value.trim();
                    if (!q) {
                        translateReqId++;
                        setTranslateLoading(false);
                        applyResult("");
                        showErr("");
                        return;
                    }
                    setTranslateLoading(true, "正在解析…");
                    debounceTimer = setTimeout(function () {
                        debounceTimer = null;
                        translateNow();
                    }, 550);
                }

                srcText.addEventListener("input", function () {
                    if (srcText.value.length > MAX) srcText.value = srcText.value.slice(0, MAX);
                    updateCharCount();
                    updateSrcLangLabel();
                    scheduleTranslate();
                });

                srcText.addEventListener("paste", function () {
                    setTimeout(function () {
                        if (srcText.value.trim()) {
                            setTranslateLoading(true, "正在解析…");
                        }
                    }, 0);
                });

                srcLang.addEventListener("change", function () {
                    updateSrcLangLabel();
                    if (srcText.value.trim()) setTranslateLoading(true, "正在翻译…");
                    translateNow();
                });
                tgtLang.addEventListener("change", function () {
                    if (srcText.value.trim()) setTranslateLoading(true, "正在翻译…");
                    translateNow();
                });

                document.querySelectorAll(".domain-tabs button").forEach(function (btn) {
                    btn.addEventListener("click", function () {
                        document.querySelectorAll(".domain-tabs button").forEach(function (b) {
                            b.classList.toggle("active", b === btn);
                        });
                        domain = btn.getAttribute("data-domain") || "general";
                        if (srcText.value.trim()) setTranslateLoading(true, "正在翻译…");
                        translateNow();
                    });
                });

                document.getElementById("clear-src").addEventListener("click", function () {
                    translateReqId++;
                    if (debounceTimer) {
                        clearTimeout(debounceTimer);
                        debounceTimer = null;
                    }
                    srcText.value = "";
                    updateCharCount();
                    updateSrcLangLabel();
                    setTranslateLoading(false);
                    applyResult("");
                    showErr("");
                });

                document.getElementById("swap-lang").addEventListener("click", function () {
                    var s = srcLang.value;
                    var t = tgtLang.value;
                    var oldOut = lastTrans;
                    if (s === "auto") {
                        srcLang.value = t;
                        tgtLang.value = "zh-CN";
                    } else {
                        srcLang.value = t;
                        tgtLang.value = s;
                    }
                    srcText.value = oldOut || "";
                    updateCharCount();
                    updateSrcLangLabel();
                    if (srcText.value.trim()) setTranslateLoading(true, "正在翻译…");
                    translateNow();
                });

                function speechLang(code) {
                    var map = {
                        en: "en-US",
                        "zh-CN": "zh-CN",
                        ja: "ja-JP",
                        ko: "ko-KR",
                        fr: "fr-FR",
                        de: "de-DE",
                    };
                    return map[code] || code || "zh-CN";
                }

                /** 译文朗读用语言：优先目标语种，中文/英文时再按正文推断，避免与下拉不一致 */
                function speechLangForOutput(text) {
                    var pair = getEffectivePair();
                    var tgt = pair.tgt;
                    if (tgt !== "zh-CN" && tgt !== "en") {
                        return speechLang(tgt);
                    }
                    var inferred = detectSourceCode(text);
                    if (tgt === "zh-CN" && inferred === "zh-CN") return speechLang("zh-CN");
                    if (tgt === "en" && inferred === "en") return speechLang("en");
                    return speechLang(tgt);
                }

                function speak(text, langGuess) {
                    var content = String(text || "").trim();
                    if (!content) {
                        showErr("没有可朗读的内容，请先输入或完成翻译。");
                        return;
                    }
                    if (!window.speechSynthesis) {
                        showErr("当前浏览器不支持语音朗读。");
                        return;
                    }
                    showErr("");
                    var lang = speechLang(langGuess);

                    function doSpeak() {
                        var syn = window.speechSynthesis;
                        if (syn.paused) {
                            try {
                                syn.resume();
                            } catch (e) {}
                        }
                        var u = new SpeechSynthesisUtterance(content);
                        u.lang = lang;
                        u.onerror = function (ev) {
                            var err = ev && ev.error;
                            if (err === "interrupted" || err === "canceled") return;
                            showErr("朗读失败，请检查系统语音设置或稍后重试。");
                        };
                        syn.speak(u);
                    }

                    var syn = window.speechSynthesis;
                    if (syn.speaking || syn.pending) {
                        syn.cancel();
                        setTimeout(doSpeak, 100);
                    } else {
                        doSpeak();
                    }
                }

                function speakTranslated(text) {
                    var content = String(text || "").trim();
                    if (!content) {
                        showErr("没有可朗读的内容，请先完成翻译。");
                        return;
                    }
                    speak(content, speechLangForOutput(content));
                }

                function legacyCopy(text) {
                    var ta = document.createElement("textarea");
                    ta.value = text;
                    ta.setAttribute("readonly", "");
                    ta.style.position = "fixed";
                    ta.style.left = "-9999px";
                    document.body.appendChild(ta);
                    ta.select();
                    try {
                        document.execCommand("copy");
                    } catch (e) {}
                    document.body.removeChild(ta);
                }

                var copyToastTimer = null;
                function showCopyTip(msg) {
                    var el = document.getElementById("copy-toast");
                    if (!el) return;
                    el.textContent = msg || "已复制到剪贴板";
                    el.classList.add("show");
                    if (copyToastTimer) clearTimeout(copyToastTimer);
                    copyToastTimer = setTimeout(function () {
                        el.classList.remove("show");
                        copyToastTimer = null;
                    }, 2000);
                }

                function copyText(text) {
                    var t = String(text || "").trim();
                    if (!t) {
                        showErr("没有可复制的内容。");
                        return;
                    }
                    function onCopied() {
                        showErr("");
                        showCopyTip("已复制到剪贴板");
                    }
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(t).then(onCopied).catch(function () {
                            legacyCopy(t);
                            onCopied();
                        });
                    } else {
                        legacyCopy(t);
                        onCopied();
                    }
                }

                document.getElementById("speak-src").addEventListener("click", function () {
                    var p = getEffectivePair();
                    var guess = srcLang.value === "auto" ? p.detected || detectSourceCode(srcText.value) : srcLang.value;
                    speak(srcText.value, guess);
                });
                document.getElementById("speak-out").addEventListener("click", function () {
                    speakTranslated(lastTrans || mainOut.textContent);
                });
                document.getElementById("speak-ai").addEventListener("click", function () {
                    speakTranslated(aiOut.textContent || lastTrans);
                });

                document.getElementById("retry-translate").addEventListener("click", translateNow);
                document.getElementById("retry-out").addEventListener("click", translateNow);
                document.getElementById("retry-ai").addEventListener("click", translateNow);

                document.getElementById("copy-main").addEventListener("click", function () {
                    copyText(mainOut.textContent || lastTrans);
                });
                document.getElementById("copy-ai").addEventListener("click", function () {
                    copyText(aiOut.textContent);
                });

                updateCharCount();
                updateSrcLangLabel();
            })();
        </script>
    </body>
</html>
