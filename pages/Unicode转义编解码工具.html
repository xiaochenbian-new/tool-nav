<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Unicode 转义编解码</title>
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                --bg: #f3f7ff;
                --card: #fff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
                --foot-bg: #f8fbff;
                --input-border: #cfdcf7;
                --toolbar-line: #e4edff;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
                overflow: hidden;
            }
            .page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                min-height: 0;
                gap: 10px;
            }
            .opts {
                flex-shrink: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                padding: 8px 12px;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 10px 16px;
            }
            .mode-seg {
                display: inline-flex;
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                overflow: hidden;
                background: #edf3ff;
            }
            .mode-seg button {
                border: none;
                background: transparent;
                padding: 6px 16px;
                font-size: 13px;
                cursor: pointer;
                color: #3c4f78;
            }
            .mode-seg button:hover:not(.active) {
                color: var(--primary);
                background: rgba(47, 107, 255, 0.06);
            }
            .mode-seg button.active {
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
                color: #fff;
            }
            .mode-seg button.active:hover {
                opacity: 0.95;
                color: #fff;
            }
            .split {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                gap: 10px;
                align-items: stretch;
            }
            .split[hidden] {
                display: none !important;
            }
            .pane {
                flex: 1 1 0;
                min-width: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .pane-hd {
                flex-shrink: 0;
                padding: 8px 10px;
                font-weight: 600;
                font-size: 14px;
                color: #324a76;
                background: var(--foot-bg);
                border-bottom: 1px solid var(--toolbar-line);
            }
            .pane-body {
                flex: 1;
                min-height: 0;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 0;
            }
            .pane-ta {
                flex: 1;
                width: 100%;
                min-height: 120px;
                border: 1px solid var(--input-border);
                border-radius: 8px;
                padding: 10px;
                font-family: Consolas, "Courier New", monospace;
                font-size: 14px;
                line-height: 1.55;
                resize: none;
                outline: none;
                background: #fff;
                color: var(--text);
            }
            .pane-ta:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.12);
            }
            .pane-ta[readonly] {
                background: #fafcff;
            }
            .foot {
                flex-shrink: 0;
                border-top: 1px solid var(--toolbar-line);
                background: var(--foot-bg);
                padding: 8px 10px;
                display: flex;
                flex-wrap: wrap;
                gap: 10px 14px;
                align-items: center;
            }
            .foot label {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                font-size: 13px;
                color: var(--text);
            }
            .foot select {
                border: 1px solid var(--input-border);
                border-radius: 6px;
                padding: 5px 10px;
                font-size: 13px;
                background: #fff;
                color: var(--text);
                max-width: 240px;
            }
            .foot select:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.1);
            }
            .foot .foot-hint {
                flex: 1 1 100%;
                margin: 0;
                font-size: 12px;
                color: var(--muted);
                line-height: 1.45;
            }
            .foot .foot-hint code {
                font-size: 11px;
                background: #eef3ff;
                padding: 1px 5px;
                border-radius: 4px;
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 6px 12px;
                font-size: 13px;
                cursor: pointer;
            }
            .btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .btn-primary {
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
                color: #fff;
                border-color: transparent;
            }
            .btn-primary:hover {
                opacity: 0.95;
                color: #fff;
            }
            .out-wrap {
                position: relative;
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }
            .out-empty {
                position: absolute;
                inset: 0;
                display: none;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                color: var(--muted);
                font-size: 13px;
                pointer-events: none;
                background: #fafcff;
                border-radius: 8px;
                z-index: 1;
            }
            .out-empty.visible {
                display: flex;
            }
            .out-empty-icon {
                width: 40px;
                height: 32px;
                border: 2px solid #cfdcf7;
                border-radius: 4px;
                position: relative;
                opacity: 0.85;
            }
            .out-empty-icon::before {
                content: "";
                position: absolute;
                left: 5px;
                right: 5px;
                top: -5px;
                height: 7px;
                border: 2px solid #cfdcf7;
                border-bottom: none;
                border-radius: 4px 4px 0 0;
            }
            input[type="checkbox"] {
                accent-color: var(--primary);
            }
            @media (max-width: 820px) {
                .split {
                    flex-direction: column;
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="opts">
                <div class="mode-seg" role="tablist">
                    <button type="button" class="active" data-tab="enc">编码</button>
                    <button type="button" data-tab="dec">解码</button>
                </div>
            </div>

            <div id="split-enc" class="split">
                <section class="pane">
                    <div class="pane-hd">输入</div>
                    <div class="pane-body">
                        <textarea
                            id="plainEnc"
                            class="pane-ta"
                            placeholder="文本；或按下方类型粘贴 base64 / hex"
                        ></textarea>
                    </div>
                    <div class="foot">
                        <button type="button" class="btn" id="encRun" title="执行编码">▶</button>
                        <label>
                            输入类型
                            <select id="encSrc" aria-label="输入类型">
                                <option value="text">text</option>
                                <option value="base64">base64</option>
                                <option value="hex">hex</option>
                            </select>
                        </label>
                        <button type="button" class="btn btn-primary" id="encPickBtn">选择文件</button>
                        <input type="file" id="encFile" hidden />
                        <label>
                            模式
                            <select id="encType" aria-label="编码模式"></select>
                        </label>
                        <label><input type="checkbox" id="ignoreAscii" checked /> 忽略 ASCII</label>
                        <p class="foot-hint">
                            支持 <code>text</code> / <code>base64</code> / <code>hex</code>；选择文件后按 <strong>UTF-8</strong> 解码为文本再转义编码。
                        </p>
                    </div>
                </section>
                <section class="pane">
                    <div class="pane-hd">转义输出</div>
                    <div class="pane-body">
                        <div class="out-wrap">
                            <div id="encEmpty" class="out-empty visible">
                                <span class="out-empty-icon" aria-hidden="true"></span>
                                <span>暂无输出</span>
                            </div>
                            <textarea id="escOut" class="pane-ta" readonly placeholder="Unicode 转义结果"></textarea>
                        </div>
                    </div>
                </section>
            </div>

            <div id="split-dec" class="split" hidden>
                <section class="pane">
                    <div class="pane-hd">输入</div>
                    <div class="pane-body">
                        <textarea id="escIn" class="pane-ta" placeholder="例如 \\u4e2d 或 U+4E2D"></textarea>
                    </div>
                    <div class="foot">
                        <button type="button" class="btn" id="decRun" title="执行解码">▶</button>
                        <label>
                            模式
                            <select id="decType" aria-label="解码模式"></select>
                        </label>
                        <p class="foot-hint">按所选模式将转义序列还原为 Unicode 文本。</p>
                    </div>
                </section>
                <section class="pane">
                    <div class="pane-hd">解码输出</div>
                    <div class="pane-body">
                        <div class="out-wrap">
                            <div id="decEmpty" class="out-empty visible">
                                <span class="out-empty-icon" aria-hidden="true"></span>
                                <span>暂无输出</span>
                            </div>
                            <textarea id="plainDec" class="pane-ta" readonly placeholder="解码结果"></textarea>
                        </div>
                    </div>
                </section>
            </div>
        </div>
        <script>
            (function () {
                var TYPES = [
                    { v: "unicode_point_default", n: "\\uXXXX（默认）" },
                    { v: "unicode_point_wide", n: "\\u 可变长十六进制" },
                    { v: "unicode_point_wide_brace", n: "\\u{…} 花括号" },
                    { v: "unicode_number", n: "U+XXXX" },
                    { v: "html_entity_10", n: "HTML 十进制 &#…;" },
                    { v: "html_entity_16", n: "HTML 十六进制 &#x…;" },
                    { v: "css_entity", n: "CSS \\xx" },
                ];
                var noIgnore = { unicode_point_wide: 1, unicode_number: 1, css_entity: 1 };
                var Unicode = {
                    repair: function (str) {
                        return str.length > 3 ? str : "0000".slice(str.length) + str;
                    },
                    decode: function (str, type) {
                        var err = function (item, fn) {
                            try {
                                return fn();
                            } catch (e) {
                                throw new Error(item + " decode error:" + e);
                            }
                        };
                        switch (type) {
                            case "unicode_point_default":
                                return str.replace(/\\[Uu][0-9a-fA-F]{4}/g, function (item) {
                                    return err(item, function () {
                                        return String.fromCodePoint(parseInt("0x" + item.toLowerCase().replace(/\\u/g, ""), 16));
                                    });
                                });
                            case "unicode_point_wide":
                                return str.replace(/\\[Uu][0-9a-fA-F]{1,6}/g, function (item) {
                                    return err(item, function () {
                                        return String.fromCodePoint(parseInt("0x" + item.toLowerCase().replace(/\\u/g, ""), 16));
                                    });
                                });
                            case "unicode_point_wide_brace":
                                return str.replace(/\\[Uu]\{[0-9a-fA-F]{1,6}\}/g, function (item) {
                                    return err(item, function () {
                                        var h = item.toLowerCase().replace(/\\u/g, "").replace("{", "").replace("}", "");
                                        return String.fromCodePoint(parseInt("0x" + h, 16));
                                    });
                                });
                            case "unicode_number":
                                return str.replace(/U\+[0-9a-fA-F]{1,6}/g, function (item) {
                                    return err(item, function () {
                                        return String.fromCodePoint(parseInt("0x" + item.replace(/U\+/i, "").toLowerCase(), 16));
                                    });
                                });
                            case "html_entity_10":
                                return str.replace(/&#[0-9]+;/g, function (item) {
                                    return err(item, function () {
                                        return String.fromCodePoint(parseInt(item.replace("&#", "").replace(";", ""), 10));
                                    });
                                });
                            case "html_entity_16":
                                return str.replace(/&#x[0-9a-fA-F]{1,6};/gi, function (item) {
                                    return err(item, function () {
                                        return String.fromCodePoint(parseInt("0x" + item.replace(/&#x/gi, "").replace(";", "").toLowerCase(), 16));
                                    });
                                });
                            case "css_entity":
                                return str.replace(/\\[0-9a-fA-F]{1,6}/g, function (item) {
                                    return err(item, function () {
                                        return String.fromCodePoint(parseInt("0x" + item.replace("\\", "").toLowerCase(), 16));
                                    });
                                });
                            default:
                                throw new Error("decode type error");
                        }
                    },
                    encode: function (str, type, ignore_ascii) {
                        var code = [];
                        for (var i = 0; i < str.length; ) {
                            var cp = str.codePointAt(i);
                            var charLen = cp > 65535 ? 2 : 1;
                            var hexStr = cp.toString(16);
                            var decStr = cp.toString(10);
                            if (hexStr.length < 3 && ignore_ascii && !noIgnore[type]) {
                                code.push(str.slice(i, i + charLen));
                                i += charLen;
                                continue;
                            }
                            var hexRepairStr = this.repair(hexStr);
                            switch (type) {
                                case "unicode_point_default":
                                    if (hexStr.length > 4) {
                                        for (var j = 0; j < charLen; j++) {
                                            code.push("\\u" + this.repair(str.charCodeAt(i + j).toString(16)));
                                        }
                                    } else {
                                        code.push("\\u" + hexRepairStr);
                                    }
                                    break;
                                case "unicode_point_wide":
                                    code.push("\\u" + hexRepairStr);
                                    break;
                                case "unicode_point_wide_brace":
                                    code.push("\\u{" + hexStr + "}");
                                    break;
                                case "unicode_number":
                                    code.push("U+" + hexRepairStr.toUpperCase());
                                    break;
                                case "html_entity_10":
                                    code.push("&#" + decStr + ";");
                                    break;
                                case "html_entity_16":
                                    code.push("&#x" + hexStr + ";");
                                    break;
                                case "css_entity":
                                    code.push("\\" + hexRepairStr);
                                    break;
                                default:
                                    throw new Error("encode type error");
                            }
                            i += charLen;
                        }
                        return code.join("");
                    },
                };

                var encTimer = null;
                var decTimer = null;
                var encType = document.getElementById("encType");
                var decType = document.getElementById("decType");
                TYPES.forEach(function (t) {
                    var o1 = document.createElement("option");
                    o1.value = t.v;
                    o1.textContent = t.n;
                    encType.appendChild(o1);
                    var o2 = document.createElement("option");
                    o2.value = t.v;
                    o2.textContent = t.n;
                    decType.appendChild(o2);
                });
                encType.value = "unicode_point_default";
                decType.value = "unicode_point_default";

                function syncEncEmpty() {
                    var v = document.getElementById("escOut").value;
                    document.getElementById("encEmpty").classList.toggle("visible", !v || !String(v).trim());
                }
                function syncDecEmpty() {
                    var v = document.getElementById("plainDec").value;
                    document.getElementById("decEmpty").classList.toggle("visible", !v || !String(v).trim());
                }

                function normalizeHex(s) {
                    return (s || "").replace(/0x/gi, "").replace(/[^0-9a-fA-F]/g, "");
                }
                function hexToUtf8(hex) {
                    if (hex.length % 2 !== 0) throw new Error("hex 长度须为偶数");
                    var u8 = new Uint8Array(hex.length / 2);
                    for (var i = 0; i < u8.length; i++) u8[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16);
                    return new TextDecoder("utf-8", { fatal: false }).decode(u8);
                }
                function b64ToUtf8(s) {
                    var t = (s || "").replace(/\s+/g, "");
                    if (/^data:[^;]+;base64,/i.test(t)) t = t.split(",").pop() || "";
                    var bin = atob(t);
                    var u8 = new Uint8Array(bin.length);
                    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
                    return new TextDecoder("utf-8", { fatal: false }).decode(u8);
                }
                var encFileStr = null;
                function encoderInputString() {
                    if (encFileStr !== null) return encFileStr;
                    var raw = document.getElementById("plainEnc").value;
                    var src = document.getElementById("encSrc").value;
                    if (src === "base64") return b64ToUtf8(raw);
                    if (src === "hex") return hexToUtf8(normalizeHex(raw));
                    return raw;
                }
                function syncIgnore() {
                    var t = encType.value;
                    document.getElementById("ignoreAscii").disabled = !!noIgnore[t];
                }
                function runEnc() {
                    try {
                        var ig = document.getElementById("ignoreAscii").checked && !noIgnore[encType.value];
                        document.getElementById("escOut").value = Unicode.encode(encoderInputString(), encType.value, ig);
                    } catch (e) {
                        document.getElementById("escOut").value = String(e && e.message ? e.message : e);
                    }
                    syncEncEmpty();
                }
                function runDec() {
                    try {
                        document.getElementById("plainDec").value = Unicode.decode(document.getElementById("escIn").value, decType.value);
                    } catch (e) {
                        document.getElementById("plainDec").value = String(e && e.message ? e.message : e);
                    }
                    syncDecEmpty();
                }
                function scheduleEnc() {
                    clearTimeout(encTimer);
                    encTimer = setTimeout(runEnc, 80);
                }
                function scheduleDec() {
                    clearTimeout(decTimer);
                    decTimer = setTimeout(runDec, 80);
                }

                document.getElementById("plainEnc").addEventListener("input", function () {
                    encFileStr = null;
                    scheduleEnc();
                });
                document.getElementById("encSrc").addEventListener("change", function () {
                    encFileStr = null;
                    runEnc();
                });
                document.getElementById("encPickBtn").addEventListener("click", function () {
                    document.getElementById("encFile").click();
                });
                document.getElementById("encFile").addEventListener("change", function (ev) {
                    var f = ev.target.files && ev.target.files[0];
                    encFileStr = null;
                    if (!f) {
                        runEnc();
                        return;
                    }
                    var r = new FileReader();
                    r.onload = function () {
                        encFileStr = new TextDecoder("utf-8", { fatal: false }).decode(new Uint8Array(r.result));
                        runEnc();
                    };
                    r.readAsArrayBuffer(f);
                });
                encType.addEventListener("change", function () {
                    syncIgnore();
                    runEnc();
                });
                document.getElementById("ignoreAscii").addEventListener("change", runEnc);
                document.getElementById("encRun").addEventListener("click", function () {
                    clearTimeout(encTimer);
                    runEnc();
                });
                document.getElementById("escIn").addEventListener("input", scheduleDec);
                decType.addEventListener("change", runDec);
                document.getElementById("decRun").addEventListener("click", function () {
                    clearTimeout(decTimer);
                    runDec();
                });

                document.querySelectorAll(".mode-seg button").forEach(function (btn) {
                    btn.addEventListener("click", function () {
                        document.querySelectorAll(".mode-seg button").forEach(function (b) {
                            b.classList.toggle("active", b === btn);
                        });
                        var tab = btn.getAttribute("data-tab");
                        document.getElementById("split-enc").hidden = tab !== "enc";
                        document.getElementById("split-dec").hidden = tab !== "dec";
                    });
                });
                syncIgnore();
                runEnc();
                runDec();
            })();
            document.addEventListener("contextmenu", function (e) {
                e.preventDefault();
            });
        </script>
            <script src="libs/tool-form-persist.js"></script>
    </body>
</html>
