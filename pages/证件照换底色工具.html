<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <title>证件照换底色</title>
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                --bg: #f3f7ff;
                --card: #fff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
            }
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                font-size: 15px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
            }
            .page {
                height: 100%;
                max-height: 100%;
                padding: 6px 8px;
                display: flex;
                flex-direction: column;
                gap: 6px;
                min-height: 0;
                overflow: hidden;
            }
            .page:fullscreen {
                background: #fff;
            }
            .page:fullscreen .preview-wrap {
                background: #fafafa;
            }
            .hd {
                flex: 0 0 auto;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
                box-shadow: var(--shadow);
                padding: 5px 8px;
            }
            .hd-title {
                font-size: 15px;
                font-weight: 700;
                color: #2b3e63;
                display: flex;
                align-items: center;
                gap: 6px;
                min-width: 0;
            }
            .hd-actions {
                display: flex;
                gap: 6px;
                flex-shrink: 0;
            }
            .toolbar {
                flex: 0 1 auto;
                max-height: min(38vh, 320px);
                overflow: auto;
                -webkit-overflow-scrolling: touch;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
                box-shadow: var(--shadow);
                padding: 8px 10px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .row {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
            }
            .row-label {
                font-size: 13px;
                color: #5a6f94;
                font-weight: 600;
                width: 100%;
                margin-bottom: -4px;
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 6px 12px;
                font-size: 14px;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 4px;
            }
            .btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .btn-primary {
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
                color: #fff;
                border-color: transparent;
            }
            .btn-primary:hover {
                color: #fff;
                opacity: 0.95;
            }
            .btn:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }
            input[type="file"] {
                display: none;
            }
            .size-group {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
            }
            .size-chip {
                border: 1px solid #cfdcf7;
                border-radius: 6px;
                background: #fbfcff;
                padding: 5px 10px;
                font-size: 13px;
                cursor: pointer;
                color: #324a76;
                line-height: 1.25;
                text-align: center;
            }
            .size-chip small {
                display: block;
                font-size: 11px;
                color: var(--muted);
                font-weight: 400;
            }
            .size-chip:hover {
                border-color: var(--primary);
            }
            .size-chip.active {
                border-color: var(--primary);
                background: #e8f0ff;
                color: #1e4a9e;
                font-weight: 600;
            }
            .pct-wrap {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                font-size: 13px;
                color: #324a76;
            }
            .pct-wrap select {
                border: 1px solid #cfdcf7;
                border-radius: 4px;
                padding: 4px 6px;
                font-size: 13px;
            }
            .colors {
                display: flex;
                flex-wrap: wrap;
                gap: 10px 14px;
                align-items: flex-end;
            }
            .color-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 3px;
                cursor: pointer;
                user-select: none;
            }
            .color-item .sw {
                width: 32px;
                height: 32px;
                border-radius: 6px;
                border: 2px solid #cfdcf7;
                box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
            }
            .color-item .lab {
                font-size: 12px;
                color: #5a6f94;
            }
            .color-item:hover .sw {
                border-color: var(--primary);
            }
            .color-item.active .sw {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.28);
            }
            .color-item.other .sw {
                background: linear-gradient(135deg, #fff 50%, #dbe6ff 50%);
            }
            #customColor {
                position: absolute;
                opacity: 0;
                width: 0;
                height: 0;
                pointer-events: none;
            }
            .slider-row {
                width: 100%;
                max-width: 420px;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .slider-row label {
                font-size: 13px;
                color: #324a76;
                font-weight: 600;
            }
            .slider-row input[type="range"] {
                width: 100%;
                accent-color: #e53935;
            }
            .preview-wrap {
                flex: 1 1 0%;
                min-height: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
                box-shadow: var(--shadow);
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: auto;
                padding: 12px;
            }
            #stage {
                position: relative;
                display: inline-block;
                max-width: 100%;
                max-height: 100%;
            }
            #viewCanvas {
                display: block;
                max-width: 100%;
                max-height: calc(100vh - 280px);
                height: auto;
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            }
            .placeholder {
                color: var(--muted);
                font-size: 14px;
                text-align: center;
                padding: 40px 20px;
                max-width: 360px;
                line-height: 1.5;
            }
            .status {
                font-size: 12px;
                color: var(--muted);
                min-height: 1.2em;
            }
            .modal-back {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 50;
                background: rgba(30, 40, 60, 0.45);
                align-items: center;
                justify-content: center;
                padding: 16px;
            }
            .modal-back.on {
                display: flex;
            }
            .modal {
                background: #fff;
                border-radius: 10px;
                border: 1px solid var(--border);
                max-width: 520px;
                width: 100%;
                padding: 14px 16px;
                box-shadow: var(--shadow);
            }
            .modal h3 {
                margin: 0 0 8px;
                font-size: 15px;
            }
            .modal pre {
                margin: 0;
                padding: 10px;
                background: #f5f8ff;
                border-radius: 6px;
                font-size: 12px;
                overflow: auto;
                max-height: 200px;
                border: 1px solid #e4edff;
                white-space: pre-wrap;
                word-break: break-all;
            }
            .modal .modal-actions {
                margin-top: 10px;
                display: flex;
                justify-content: flex-end;
                gap: 8px;
            }
        </style>
    </head>
    <body>
        <div class="page" id="rootPage">
            <header class="hd">

                    <span aria-hidden="true">📷</span>

                <div class="hd-actions">

            <div class="toolbar">

                <h3>嵌入本工具</h3>
                <p style="margin: 0 0 8px; font-size: 13px; color: var(--muted)">在自有页面中通过 iframe 打开本工具（路径相对于站点根目录）：</p>
                <pre id="embedCode"></pre>
                <div class="modal-actions">
                    <button type="button" class="btn" id="modalClose">知道了</button>
                </div>
            </div>
        </div>
        <script>
            (function installFileProtocolImglyLoader() {
                if (location.protocol !== "file:" || window.__fileImglyFetchPatched) return;
                window.__fileImglyFetchPatched = true;
                const origFetch = window.fetch.bind(window);
                const chunkScriptBase = "libs/imgly-data/chunks-js/";
                const chunkScriptLoading = {};

                function resolveFetchUrl(input) {
                    if (typeof input === "string") return input;
                    if (typeof URL !== "undefined" && input instanceof URL) return input.href;
                    if (input && typeof input === "object" && typeof input.url === "string") return input.url;
                    return "";
                }

                function toFileHref(url) {
                    if (!url) return "";
                    if (url.indexOf("file:") === 0) return url;
                    try {
                        return new URL(url, location.href).href;
                    } catch (e) {
                        return url;
                    }
                }

                function extractChunkHash(href) {
                    const m = href.match(/\/imgly-data\/(?:chunks-js\/)?([a-f0-9]{64})(?:\.js)?(?:\?|$)/i);
                    return m ? m[1] : null;
                }

                function b64ToArrayBuffer(b64) {
                    const bin = atob(b64);
                    const out = new Uint8Array(bin.length);
                    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
                    return out.buffer;
                }

                function loadChunkScript(hash) {
                    if (window.__IMGLY_CHUNK_B64 && window.__IMGLY_CHUNK_B64[hash]) {
                        return Promise.resolve(window.__IMGLY_CHUNK_B64[hash]);
                    }
                    if (chunkScriptLoading[hash]) return chunkScriptLoading[hash];
                    chunkScriptLoading[hash] = new Promise(function (resolve, reject) {
                        const s = document.createElement("script");
                        s.src = chunkScriptBase + hash + ".js";
                        s.onload = function () {
                            delete chunkScriptLoading[hash];
                            if (window.__IMGLY_CHUNK_B64 && window.__IMGLY_CHUNK_B64[hash]) {
                                resolve(window.__IMGLY_CHUNK_B64[hash]);
                            } else {
                                reject(new Error("分片脚本未注册: " + hash));
                            }
                        };
                        s.onerror = function () {
                            delete chunkScriptLoading[hash];
                            reject(
                                new Error(
                                    "无法加载 " +
                                        chunkScriptBase +
                                        hash +
                                        ".js，请执行 npm run generate:imgly-file-assets"
                                )
                            );
                        };
                        document.head.appendChild(s);
                    });
                    return chunkScriptLoading[hash];
                }

                function fileProtocolFetch(input, init) {
                    const href = toFileHref(resolveFetchUrl(input));
                    if (/resources\.json(\?|$)/i.test(href)) {
                        if (!window.__IMGLY_RESOURCE_MAP) {
                            return Promise.reject(
                                new Error(
                                    "缺少 resources.embed.js，请在 tool-nav 执行 npm run generate:imgly-file-assets"
                                )
                            );
                        }
                        return Promise.resolve(
                            new Response(JSON.stringify(window.__IMGLY_RESOURCE_MAP), {
                                status: 200,
                                headers: { "Content-Type": "application/json" }
                            })
                        );
                    }
                    const hash = extractChunkHash(href);
                    if (hash) {
                        return loadChunkScript(hash).then(function (b64) {
                            return new Response(b64ToArrayBuffer(b64), { status: 200 });
                        });
                    }
                    return Promise.reject(new TypeError("Failed to fetch " + href));
                }

                window.fetch = function (input, init) {
                    const url = resolveFetchUrl(input);
                    if (url && toFileHref(url).indexOf("file:") === 0) {
                        return fileProtocolFetch(input, init);
                    }
                    return origFetch(input, init);
                };
            })();
        </script>
