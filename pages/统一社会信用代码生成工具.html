<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>统一社会信用代码生成工具</title>
        <link rel="stylesheet" href="libs/tool-danger-btn.css" />
        <script src="libs/tool-copy.js"></script>
        <style>
            * { box-sizing: border-box; }
            :root {
                --bg: #f3f7ff;
                --card: #fff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --danger: #f05656;
                --border: #dbe6ff;
                --text: #1f2a44;
                --shadow: 0 10px 24px rgba(36, 90, 190, 0.12);
            }
            body {
                margin: 0;
                padding: 8px;
                min-height: 100vh;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                background: var(--bg);
            }
            .page {
                height: calc(100vh);
                display: flex;
                gap: 8px;
            }
            .panel {
                flex: 1;
                display: flex;
                flex-direction: column;
                min-height: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
                box-shadow: var(--shadow);
                padding: 8px;
            }
            h3 { margin: 0 0 8px; font-size: 13px; color: var(--text); }
            .row {
                display: flex;
                gap: 6px;
                align-items: center;
                flex-wrap: wrap;
                margin-bottom: 8px;
            }
            label { font-size: 12px; }
            select, input, textarea {
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                padding: 6px 8px;
                font-size: 12px;
                outline: none;
            }
            select:focus, input:focus, textarea:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.15);
            }
            button {
                border: 0;
                border-radius: 6px;
                padding: 6px 10px;
                font-size: 12px;
                color: #fff;
                cursor: pointer;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            textarea {
                width: 100%;
                flex: 1;
                resize: none;
                line-height: 1.6;
            }
            .hint, .result {
                border: 1px solid #dbe7ff;
                background: #f8fbff;
                border-radius: 8px;
                padding: 8px;
                font-size: 12px;
                line-height: 1.6;
            }
            @media (max-width: 900px) { .page { flex-direction: column; } }
        </style>
    
    <!-- 外壳注入：清除 body/根容器内边距 + 隐藏根滚动条，使工具内容宽度与导航栏一致（file:// 跨域下由页面自带） -->
    <style id="tool-shell-flush">
        body{padding:0!important;}
        body>*{padding:0!important;margin:0!important;}
        html::-webkit-scrollbar{width:0!important;height:0!important;}
        html{scrollbar-width:none!important;}
    </style>
    </head>
    <body>
        <div class="page">
            <div class="panel">
                <h3>批量生成</h3>
                <div class="row">
                    <label for="registerType">登记管理部门</label>
                    <select id="registerType">
                        <option value="1">1-机构编制</option>
                        <option value="5">5-民政</option>
                        <option value="9">9-工商</option>
                        <option value="Y">Y-其他</option>
                    </select>
                    <label for="orgType">机构类别</label>
                    <select id="orgType">
                        <option value="1">1-企业</option>
                        <option value="2">2-个体工商户</option>
                        <option value="3">3-农民专业合作社</option>
                        <option value="9">9-其他组织</option>
                    </select>
                </div>
                <div class="row">
                    <label for="areaCode">行政区划码</label>
                    <select id="areaCode"></select>
                    <label for="count">数量</label>
                    <input id="count" type="number" min="1" max="100" value="10" />
                    <button type="button" id="genBtn">生成</button>
                    <button type="button" id="copyBtn">复制</button>
                    <button type="button" class="danger tool-btn-danger" id="clearBtn">清空</button>
                </div>
                <textarea id="result" readonly></textarea>
            </div>
            <div class="panel">
                <h3>校验与解析</h3>
                <div class="row">
                    <label for="checkInput">统一社会信用代码</label>
                    <input id="checkInput" style="width: 280px;" />
                    <button type="button" id="checkBtn">校验</button>
                </div>
                <div id="checkResult" class="result">输入18位代码后点击校验。</div>
                <div class="hint" style="margin-top:8px;">
                    说明：本工具用于测试数据生成与格式校验，不作为官方编码申请依据。
                </div>
            </div>
        </div>
        <script>
            const BASE_CODE = "0123456789ABCDEFGHJKLMNPQRTUWXY";
            const WEIGHTS = [1, 3, 9, 27, 19, 26, 16, 17, 20, 29, 25, 13, 8, 24, 10, 30, 28];
            const AREA_LIST = [
                { name: "北京市 东城区", code: "110101" },
                { name: "上海市 黄浦区", code: "310101" },
                { name: "广州市 越秀区", code: "440104" },
                { name: "深圳市 南山区", code: "440305" },
                { name: "杭州市 西湖区", code: "330106" },
                { name: "成都市 锦江区", code: "510104" },
                { name: "武汉市 武昌区", code: "420106" }
            ];

            function randomPick(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            }

            function calcCheckChar(code17) {
                let sum = 0;
                for (let i = 0; i < code17.length; i++) {
                    const v = BASE_CODE.indexOf(code17[i]);
                    sum += v * WEIGHTS[i];
                }
                const logicCheck = (31 - (sum % 31)) % 31;
                return BASE_CODE[logicCheck];
            }

            function randomBodyCode() {
                let part = "";
                for (let i = 0; i < 9; i++) part += randomPick(BASE_CODE);
                return part;
            }

            function generateOne() {
                const registerType = document.getElementById("registerType").value;
                const orgType = document.getElementById("orgType").value;
                const areaCode = document.getElementById("areaCode").value;
                const head17 = registerType + orgType + areaCode + randomBodyCode();
                return head17 + calcCheckChar(head17);
            }

            function validateCode(raw) {
                const code = String(raw || "").trim().toUpperCase();
                if (!/^[0-9A-Z]{18}$/.test(code)) return { ok: false, msg: "格式错误：需18位数字/大写字母" };
                if (/[^0-9ABCDEFGHJKLMNPQRTUWXY]/.test(code)) return { ok: false, msg: "包含非法字符（不允许 I/O/S/V/Z）" };
                const expected = calcCheckChar(code.slice(0, 17));
                if (expected !== code[17]) return { ok: false, msg: "校验位错误，正确应为 " + expected };
                return {
                    ok: true,
                    msg: "校验通过：登记管理部门=" + code[0] + "，机构类别=" + code[1] + "，行政区划码=" + code.slice(2, 8)
                };
            }

            function initArea() {
                const el = document.getElementById("areaCode");
                el.innerHTML = "";
                AREA_LIST.forEach(function (item) {
                    const opt = document.createElement("option");
                    opt.value = item.code;
                    opt.textContent = item.name + "（" + item.code + "）";
                    el.appendChild(opt);
                });
            }

            document.getElementById("genBtn").addEventListener("click", function () {
                let count = Number(document.getElementById("count").value);
                if (!count || count < 1) count = 1;
                if (count > 100) count = 100;
                const lines = [];
                for (let i = 0; i < count; i++) lines.push(generateOne());
                document.getElementById("result").value = lines.join("\n");
            });

            document.getElementById("copyBtn").addEventListener("click", function () {
                ToolCopy.copy(document.getElementById("result").value, { onLabelEl: this });
            });

            document.getElementById("clearBtn").addEventListener("click", function () {
                document.getElementById("result").value = "";
            });

            document.getElementById("checkBtn").addEventListener("click", function () {
                const r = validateCode(document.getElementById("checkInput").value);
                const out = document.getElementById("checkResult");
                out.textContent = r.msg;
                out.style.color = r.ok ? "#1f7a3a" : "#d34848";
            });

            initArea();
            document.addEventListener("contextmenu", function (event) { event.preventDefault(); });
        </script>
            <script src="libs/tool-form-persist.js"></script>
    </body>
</html>
