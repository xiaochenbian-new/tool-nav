<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>YAML / Properties 转换</title>
        <script src="../vendor/js-yaml/js-yaml.min.js"></script>
        <script src="libs/tool-copy.js"></script>
        <link rel="stylesheet" href="libs/tool-danger-btn.css" />
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                --bg: #f3f7ff;
                --card: #fff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
                --foot-bg: #f8fbff;
                --input-border: #cfdcf7;
                --toolbar-line: #e4edff;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
                overflow: hidden;
            }
            .page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                min-height: 0;
                gap: 10px;
            }
            .opts {
                flex-shrink: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                padding: 8px 12px;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 10px 16px;
            }
            .mode-seg {
                display: inline-flex;
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                overflow: hidden;
                background: #edf3ff;
            }
            .mode-seg button {
                border: none;
                background: transparent;
                padding: 6px 16px;
                font-size: 13px;
                cursor: pointer;
                color: #3c4f78;
            }
            .mode-seg button:hover:not(.active) {
                color: var(--primary);
                background: rgba(47, 107, 255, 0.06);
            }
            .mode-seg button.active {
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
                color: #fff;
            }
            .mode-seg button.active:hover {
                opacity: 0.95;
                color: #fff;
            }
            .status {
                font-size: 12px;
                color: var(--muted);
                flex: 1 1 auto;
                min-width: 120px;
            }
            .status.err {
                color: #c0392b;
            }
            .split {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                gap: 10px;
                align-items: stretch;
            }
            .pane {
                flex: 1 1 0;
                min-width: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .pane-hd {
                flex-shrink: 0;
                padding: 8px 10px;
                font-weight: 600;
                font-size: 14px;
                color: #324a76;
                background: var(--foot-bg);
                border-bottom: 1px solid var(--toolbar-line);
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
            }
            .pane-hd-actions {
                display: flex;
                gap: 6px;
                align-items: center;
            }
            .pane-body {
                flex: 1;
                min-height: 0;
                padding: 10px;
                display: flex;
                flex-direction: column;
            }
            .pane-ta {
                flex: 1;
                width: 100%;
                min-height: 120px;
                border: 1px solid var(--input-border);
                border-radius: 8px;
                padding: 10px;
                font-family: Consolas, "Courier New", monospace;
                font-size: 13px;
                line-height: 1.55;
                resize: none;
                outline: none;
                background: #fff;
                color: var(--text);
            }
            .pane-ta:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.12);
            }
            .pane-ta[readonly] {
                background: #fafcff;
            }
            .foot {
                flex-shrink: 0;
                border-top: 1px solid var(--toolbar-line);
                background: var(--foot-bg);
                padding: 8px 10px;
                display: flex;
                flex-wrap: wrap;
                gap: 8px 10px;
                align-items: center;
            }
            .foot .foot-hint {
                flex: 1 1 100%;
                margin: 0;
                font-size: 12px;
                color: var(--muted);
                line-height: 1.45;
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 6px 12px;
                font-size: 13px;
                cursor: pointer;
            }
            .btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .btn-primary {
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
                color: #fff;
                border-color: transparent;
            }
            .btn-primary:hover {
                opacity: 0.95;
                color: #fff;
            }
            .title-btn {
                border: 1px solid #d8e5ff;
                border-radius: 5px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 3px 8px;
                font-size: 12px;
                cursor: pointer;
            }
            .title-btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            @media (max-width: 820px) {
                .split {
                    flex-direction: column;
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="opts">
                <div class="mode-seg" role="tablist">
                    <button type="button" class="active" data-mode="y2p" id="mode-y2p">YAML → Properties</button>
                    <button type="button" data-mode="p2y" id="mode-p2y">Properties → YAML</button>
                </div>
                <span class="status" id="status">支持文本粘贴或文件导入，输入后自动转换</span>
            </div>

            <div class="split">
                <section class="pane">
                    <div class="pane-hd">
                        <span id="input-label">YAML 输入</span>
                        <div class="pane-hd-actions">
                            <button type="button" class="title-btn" id="btn-copy-in">复制</button>
                            <button type="button" class="title-btn danger" id="btn-clear-in">清空</button>
                        </div>
                    </div>
                    <div class="pane-body">
                        <textarea
                            id="input"
                            class="pane-ta"
                            placeholder="粘贴 YAML 或 Properties 内容，或从文件加载"
                            spellcheck="false"
                        ></textarea>
                    </div>
                    <div class="foot">
                        <button type="button" class="btn" id="btn-convert" title="立即转换">▶ 转换</button>
                        <button type="button" class="btn btn-primary" id="btn-pick-in">选择文件</button>
                        <input type="file" id="file-in" hidden accept=".yaml,.yml,.properties,.txt,.conf,.cfg" />
                        <p class="foot-hint" id="input-hint">
                            支持 .yaml / .yml / .properties / .txt 等文本文件；嵌套结构以点号键名展开（如 <code>server.port=8080</code>）。
                        </p>
                    </div>
                </section>
                <section class="pane">
                    <div class="pane-hd">
                        <span id="output-label">Properties 输出</span>
                        <div class="pane-hd-actions">
                            <button type="button" class="title-btn" id="btn-copy-out">复制</button>
                            <button type="button" class="title-btn" id="btn-download">下载</button>
                        </div>
                    </div>
                    <div class="pane-body">
                        <textarea id="output" class="pane-ta" readonly placeholder="转换结果" spellcheck="false"></textarea>
                    </div>
                    <div class="foot">
                        <p class="foot-hint" id="output-hint">输出为 Java Properties 格式，键名使用点号表示层级。</p>
                    </div>
                </section>
            </div>
        </div>
        <script>
            (function () {
                var MODE = "y2p";
                var debounceTimer = null;
                var loadedFileName = "";

                function isPlainObject(v) {
                    return v !== null && typeof v === "object" && !Array.isArray(v);
                }

                function flattenProps(obj, prefix, out) {
                    prefix = prefix || "";
                    out = out || {};
                    if (Array.isArray(obj)) {
                        obj.forEach(function (item, i) {
                            var p = prefix ? prefix + "." + i : String(i);
                            if (item !== null && typeof item === "object") flattenProps(item, p, out);
                            else out[p] = item;
                        });
                        return out;
                    }
                    if (isPlainObject(obj)) {
                        Object.keys(obj).forEach(function (k) {
                            var p = prefix ? prefix + "." + k : k;
                            var v = obj[k];
                            if (v !== null && typeof v === "object") flattenProps(v, p, out);
                            else out[p] = v;
                        });
                        return out;
                    }
                    out[prefix || "value"] = obj;
                    return out;
                }

                function normalizeArrays(obj) {
                    if (Array.isArray(obj)) return obj.map(normalizeArrays);
                    if (!isPlainObject(obj)) return obj;
                    var keys = Object.keys(obj);
                    if (keys.length > 0 && keys.every(function (k) {
                        return /^\d+$/.test(k);
                    })) {
                        var max = Math.max.apply(null, keys.map(Number));
                        var arr = [];
                        for (var i = 0; i <= max; i++) {
                            arr[i] = normalizeArrays(obj[String(i)]);
                        }
                        return arr;
                    }
                    var out = {};
                    keys.forEach(function (k) {
                        out[k] = normalizeArrays(obj[k]);
                    });
                    return out;
                }

                function unflattenProps(flat) {
                    var root = {};
                    Object.keys(flat).forEach(function (key) {
                        var parts = key.split(".");
                        var cur = root;
                        for (var i = 0; i < parts.length; i++) {
                            var part = parts[i];
                            var isLast = i === parts.length - 1;
                            var nextPart = parts[i + 1];
                            var nextIsIndex = nextPart !== undefined && /^\d+$/.test(nextPart);
                            if (isLast) {
                                if (Array.isArray(cur)) cur[Number(part)] = flat[key];
                                else cur[part] = flat[key];
                            } else {
                                var exists = Array.isArray(cur) ? cur[Number(part)] : cur[part];
                                if (exists === undefined) {
                                    var created = nextIsIndex ? [] : {};
                                    if (Array.isArray(cur)) cur[Number(part)] = created;
                                    else cur[part] = created;
                                }
                                cur = Array.isArray(cur) ? cur[Number(part)] : cur[part];
                            }
                        }
                    });
                    return normalizeArrays(root);
                }

                function escapePropertyValue(val) {
                    if (val === null || val === undefined) return "";
                    var s = String(val);
                    return s
                        .replace(/\\/g, "\\\\")
                        .replace(/\n/g, "\\n")
                        .replace(/\r/g, "\\r")
                        .replace(/\t/g, "\\t");
                }

                function objToProperties(obj) {
                    var flat = flattenProps(obj);
                    return Object.keys(flat)
                        .sort()
                        .map(function (k) {
                            return k + "=" + escapePropertyValue(flat[k]);
                        })
                        .join("\n");
                }

                function unescapePropertyValue(raw) {
                    var out = "";
                    for (var i = 0; i < raw.length; i++) {
                        var c = raw[i];
                        if (c !== "\\") {
                            out += c;
                            continue;
                        }
                        if (i + 1 >= raw.length) {
                            out += "\\";
                            break;
                        }
                        var n = raw[++i];
                        if (n === "n") out += "\n";
                        else if (n === "r") out += "\r";
                        else if (n === "t") out += "\t";
                        else if (n === "u" && i + 4 < raw.length) {
                            var hex = raw.slice(i + 1, i + 5);
                            if (/^[0-9a-fA-F]{4}$/.test(hex)) {
                                out += String.fromCharCode(parseInt(hex, 16));
                                i += 4;
                            } else out += n;
                        } else out += n;
                    }
                    return out;
                }

                function findPropertySeparator(line) {
                    for (var i = 0; i < line.length; i++) {
                        var c = line[i];
                        if (c === "\\") {
                            i++;
                            continue;
                        }
                        if (c === "=" || c === ":") return i;
                        if (c === " " || c === "\t") return i;
                    }
                    return -1;
                }

                function joinContinuationLines(text) {
                    var src = (text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
                    var lines = [];
                    for (var i = 0; i < src.length; i++) {
                        var line = src[i];
                        while (line.endsWith("\\") && i + 1 < src.length) {
                            line = line.slice(0, -1) + src[++i];
                        }
                        lines.push(line);
                    }
                    return lines;
                }

                function parseProperties(text) {
                    var lines = joinContinuationLines(text);
                    var result = {};
                    for (var i = 0; i < lines.length; i++) {
                        var ln = lines[i];
                        if (!ln.trim()) continue;
                        var trimmed = ln.trim();
                        if (trimmed.charAt(0) === "#" || trimmed.charAt(0) === "!") continue;
                        var sep = findPropertySeparator(ln);
                        if (sep < 0) continue;
                        var key = ln.slice(0, sep).trim();
                        var val = unescapePropertyValue(ln.slice(sep + 1).trim());
                        if (!key) continue;
                        result[key] = val;
                    }
                    if (!Object.keys(result).length) throw new Error("未解析到有效的 Properties 键值对");
                    return result;
                }

                function yamlToProperties(text) {
                    if (typeof jsyaml === "undefined") throw new Error("js-yaml 未加载");
                    var obj = jsyaml.load(text);
                    if (obj === undefined || obj === null) throw new Error("YAML 内容为空");
                    if (typeof obj !== "object") return "value=" + escapePropertyValue(obj);
                    return objToProperties(obj);
                }

                function propertiesToYaml(text) {
                    if (typeof jsyaml === "undefined") throw new Error("js-yaml 未加载");
                    var flat = parseProperties(text);
                    var obj = unflattenProps(flat);
                    return jsyaml.dump(obj, { lineWidth: 120, noRefs: true, sortKeys: false });
                }

                function setStatus(msg, isErr) {
                    var el = document.getElementById("status");
                    el.textContent = msg;
                    el.classList.toggle("err", !!isErr);
                }

                function updateLabels() {
                    var y2p = MODE === "y2p";
                    document.getElementById("input-label").textContent = y2p ? "YAML 输入" : "Properties 输入";
                    document.getElementById("output-label").textContent = y2p ? "Properties 输出" : "YAML 输出";
                    document.getElementById("input").placeholder = y2p
                        ? "例如：\nserver:\n  port: 8080\n  host: localhost"
                        : "例如：\nserver.port=8080\nserver.host=localhost";
                    document.getElementById("input-hint").innerHTML = y2p
                        ? "粘贴 YAML 文本，或导入 .yaml / .yml 文件；嵌套对象将展开为点号键名。"
                        : "粘贴 Properties 文本，或导入 .properties / .conf 文件；点号键名将还原为 YAML 层级。";
                    document.getElementById("output-hint").textContent = y2p
                        ? "输出为 Java Properties 格式，键名使用点号表示层级。"
                        : "输出为标准 YAML 格式，支持嵌套对象与数组。";
                    document.getElementById("file-in").accept = y2p
                        ? ".yaml,.yml,.txt"
                        : ".properties,.conf,.cfg,.txt";
                }

                function convert(silent) {
                    var input = document.getElementById("input").value;
                    var output = document.getElementById("output");
                    if (!input.trim()) {
                        output.value = "";
                        setStatus("请输入内容或选择文件");
                        return;
                    }
                    try {
                        output.value = MODE === "y2p" ? yamlToProperties(input) : propertiesToYaml(input);
                        var hint = loadedFileName ? "（来源：" + loadedFileName + "）" : "";
                        setStatus("转换成功" + hint, false);
                        if (!silent) ToolCopy.toast("转换完成");
                    } catch (e) {
                        output.value = "";
                        setStatus("转换失败：" + (e && e.message ? e.message : e), true);
                    }
                }

                function scheduleConvert() {
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(function () {
                        convert(true);
                    }, 200);
                }

                function downloadOutput() {
                    var text = document.getElementById("output").value;
                    if (!text.trim()) {
                        ToolCopy.toast("无内容可下载");
                        return;
                    }
                    var ext = MODE === "y2p" ? "properties" : "yaml";
                    var name = loadedFileName
                        ? loadedFileName.replace(/\.[^.]+$/, "") + "." + ext
                        : "output." + ext;
                    var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
                    var a = document.createElement("a");
                    a.href = URL.createObjectURL(blob);
                    a.download = name;
                    a.click();
                    setTimeout(function () {
                        URL.revokeObjectURL(a.href);
                    }, 1000);
                    ToolCopy.toast("已下载 " + name);
                }

                document.getElementById("mode-y2p").addEventListener("click", function () {
                    MODE = "y2p";
                    document.getElementById("mode-y2p").classList.add("active");
                    document.getElementById("mode-p2y").classList.remove("active");
                    updateLabels();
                    convert(true);
                });
                document.getElementById("mode-p2y").addEventListener("click", function () {
                    MODE = "p2y";
                    document.getElementById("mode-p2y").classList.add("active");
                    document.getElementById("mode-y2p").classList.remove("active");
                    updateLabels();
                    convert(true);
                });

                document.getElementById("input").addEventListener("input", function () {
                    loadedFileName = "";
                    scheduleConvert();
                });
                document.getElementById("btn-convert").addEventListener("click", function () {
                    convert(false);
                });
                document.getElementById("btn-pick-in").addEventListener("click", function () {
                    document.getElementById("file-in").click();
                });
                document.getElementById("file-in").addEventListener("change", function (ev) {
                    var f = ev.target.files && ev.target.files[0];
                    if (!f) return;
                    var reader = new FileReader();
                    reader.onload = function () {
                        document.getElementById("input").value = String(reader.result || "");
                        loadedFileName = f.name;
                        convert(true);
                    };
                    reader.onerror = function () {
                        setStatus("文件读取失败", true);
                    };
                    reader.readAsText(f, "utf-8");
                    ev.target.value = "";
                });
                document.getElementById("btn-copy-in").addEventListener("click", function () {
                    ToolCopy.copy(document.getElementById("input").value, {
                        onLabelEl: this,
                        labelText: "复制",
                        emptyMsg: "输入为空"
                    });
                });
                document.getElementById("btn-copy-out").addEventListener("click", function () {
                    ToolCopy.copy(document.getElementById("output").value, {
                        onLabelEl: this,
                        labelText: "复制",
                        emptyMsg: "输出为空"
                    });
                });
                document.getElementById("btn-download").addEventListener("click", downloadOutput);
                document.getElementById("btn-clear-in").addEventListener("click", function () {
                    document.getElementById("input").value = "";
                    document.getElementById("output").value = "";
                    loadedFileName = "";
                    document.getElementById("file-in").value = "";
                    setStatus("已清空");
                });

                updateLabels();
            })();
        </script>
    </body>
</html>
