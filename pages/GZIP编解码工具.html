<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>GZIP / Deflate 编解码</title>
        <script src="libs/pako.min.js"></script>
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                --bg: #f3f7ff;
                --card: #fff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
                --foot-bg: #f8fbff;
                --input-border: #cfdcf7;
                --toolbar-line: #e4edff;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
                overflow: hidden;
            }
            .page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                min-height: 0;
                gap: 10px;
            }
            .opts {
                flex-shrink: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                padding: 8px 12px;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 10px 16px;
            }
            .mode-seg {
                display: inline-flex;
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                overflow: hidden;
                background: #edf3ff;
            }
            .mode-seg button {
                border: none;
                background: transparent;
                padding: 6px 16px;
                font-size: 13px;
                cursor: pointer;
                color: #3c4f78;
            }
            .mode-seg button:hover:not(.active) {
                color: var(--primary);
                background: rgba(47, 107, 255, 0.06);
            }
            .mode-seg button.active {
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
                color: #fff;
            }
            .mode-seg button.active:hover {
                opacity: 0.95;
                color: #fff;
            }
            .split {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                gap: 10px;
                align-items: stretch;
            }
            .split[hidden] {
                display: none !important;
            }
            .pane {
                flex: 1 1 0;
                min-width: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .pane-hd {
                flex-shrink: 0;
                padding: 8px 10px;
                font-weight: 600;
                font-size: 14px;
                color: #324a76;
                background: var(--foot-bg);
                border-bottom: 1px solid var(--toolbar-line);
            }
            .pane-body {
                flex: 1;
                min-height: 0;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 0;
            }
            .pane-ta {
                flex: 1;
                width: 100%;
                min-height: 120px;
                border: 1px solid var(--input-border);
                border-radius: 8px;
                padding: 10px;
                font-family: Consolas, "Courier New", monospace;
                font-size: 14px;
                line-height: 1.55;
                resize: none;
                outline: none;
                background: #fff;
                color: var(--text);
            }
            .pane-ta:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.12);
            }
            .pane-ta[readonly] {
                background: #fafcff;
            }
            .foot {
                flex-shrink: 0;
                border-top: 1px solid var(--toolbar-line);
                background: var(--foot-bg);
                padding: 8px 10px;
                display: flex;
                flex-wrap: wrap;
                gap: 10px 14px;
                align-items: center;
            }
            .foot label {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                font-size: 13px;
                color: var(--text);
            }
            .foot select {
                border: 1px solid var(--input-border);
                border-radius: 6px;
                padding: 5px 10px;
                font-size: 13px;
                background: #fff;
                color: var(--text);
                max-width: 240px;
            }
            .foot select:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.1);
            }
            .foot .foot-hint {
                flex: 1 1 100%;
                margin: 0;
                font-size: 12px;
                color: var(--muted);
                line-height: 1.45;
            }
            .foot .foot-hint code {
                font-size: 11px;
                background: #eef3ff;
                padding: 1px 5px;
                border-radius: 4px;
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 6px 12px;
                font-size: 13px;
                cursor: pointer;
            }
            .btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .out-wrap {
                position: relative;
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }
            .out-empty {
                position: absolute;
                inset: 0;
                display: none;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                color: var(--muted);
                font-size: 13px;
                pointer-events: none;
                background: #fafcff;
                border-radius: 8px;
                z-index: 1;
            }
            .out-empty.visible {
                display: flex;
            }
            .out-empty-icon {
                width: 40px;
                height: 32px;
                border: 2px solid #cfdcf7;
                border-radius: 4px;
                position: relative;
                opacity: 0.85;
            }
            .out-empty-icon::before {
                content: "";
                position: absolute;
                left: 5px;
                right: 5px;
                top: -5px;
                height: 7px;
                border: 2px solid #cfdcf7;
                border-bottom: none;
                border-radius: 4px 4px 0 0;
            }
            input[type="checkbox"] {
                accent-color: var(--primary);
            }
            @media (max-width: 820px) {
                .split {
                    flex-direction: column;
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="opts">
                <div class="mode-seg" role="tablist">
                    <button type="button" class="active" data-tab="enc">压缩编码</button>
                    <button type="button" data-tab="dec">解压解码</button>
                </div>
            </div>

            <div id="split-enc" class="split">
                <section class="pane">
                    <div class="pane-hd">输入（UTF-8 文本）</div>
                    <div class="pane-body">
                        <textarea id="plainZip" class="pane-ta" placeholder="要压缩的文本"></textarea>
                    </div>
                    <div class="foot">
                        <button type="button" class="btn" id="zipEncRun" title="压缩">▶</button>
                        <label><input type="checkbox" id="useDeflate" /> Deflate（否则 GZIP）</label>
                        <label>
                            输出格式
                            <select id="encFmt" aria-label="输出格式">
                                <option value="base64">base64</option>
                                <option value="hex">hex</option>
                            </select>
                        </label>
                        <p class="foot-hint">文本 → <code>pako.gzip</code> 或 <code>pako.deflate</code> → Base64 或 Hex。</p>
                    </div>
                </section>
                <section class="pane">
                    <div class="pane-hd">输出</div>
                    <div class="pane-body">
                        <div class="out-wrap">
                            <div id="zipEncEmpty" class="out-empty visible">
                                <span class="out-empty-icon" aria-hidden="true"></span>
                                <span>暂无输出</span>
                            </div>
                            <textarea id="zipOut" class="pane-ta" readonly placeholder="base64 / hex"></textarea>
                        </div>
                    </div>
                </section>
            </div>

            <div id="split-dec" class="split" hidden>
                <section class="pane">
                    <div class="pane-hd">输入</div>
                    <div class="pane-body">
                        <textarea id="zipIn" class="pane-ta" placeholder="压缩数据的 Base64 或 Hex"></textarea>
                    </div>
                    <div class="foot">
                        <button type="button" class="btn" id="zipDecRun" title="解压">▶</button>
                        <label>
                            输入格式
                            <select id="decFmt" aria-label="输入格式">
                                <option value="base64">base64</option>
                                <option value="hex">hex</option>
                            </select>
                        </label>
                        <p class="foot-hint">使用 <code>pako.inflate</code>；输入为 Base64 或 Hex 转成的字节。</p>
                    </div>
                </section>
                <section class="pane">
                    <div class="pane-hd">解压结果（UTF-8）</div>
                    <div class="pane-body">
                        <div class="out-wrap">
                            <div id="zipDecEmpty" class="out-empty visible">
                                <span class="out-empty-icon" aria-hidden="true"></span>
                                <span>暂无输出</span>
                            </div>
                            <textarea id="plainUnzip" class="pane-ta" readonly placeholder="解压文本"></textarea>
                        </div>
                    </div>
                </section>
            </div>
        </div>
        <script>
            (function () {
                if (typeof pako === "undefined") {
                    document.querySelector(".page").innerHTML = "<p style='padding:16px'>未加载 pako：请确认存在 pages/libs/pako.min.js</p>";
                    return;
                }
                function u8ToB64(u8) {
                    var bin = "";
                    for (var i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
                    return btoa(bin);
                }
                function u8ToHex(u8) {
                    var s = "";
                    for (var i = 0; i < u8.length; i++) {
                        var h = u8[i].toString(16);
                        if (h.length < 2) h = "0" + h;
                        s += h;
                    }
                    return s;
                }
                function b64ToU8(s) {
                    var t = (s || "").replace(/\s+/g, "");
                    if (/^data:[^;]+;base64,/i.test(t)) t = t.split(",").pop() || "";
                    var bin = atob(t);
                    var u8 = new Uint8Array(bin.length);
                    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
                    return u8;
                }
                function hexToU8(s) {
                    var hex = (s || "").replace(/0x/gi, "").replace(/[^0-9a-fA-F]/g, "");
                    if (hex.length % 2 !== 0) throw new Error("hex 长度须为偶数");
                    var u8 = new Uint8Array(hex.length / 2);
                    for (var i = 0; i < u8.length; i++) u8[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16);
                    return u8;
                }
                var tZip = null;
                var tUnzip = null;
                function syncZipEncEmpty() {
                    var v = document.getElementById("zipOut").value;
                    document.getElementById("zipEncEmpty").classList.toggle("visible", !v || !String(v).trim());
                }
                function syncZipDecEmpty() {
                    var v = document.getElementById("plainUnzip").value;
                    document.getElementById("zipDecEmpty").classList.toggle("visible", !v || !String(v).trim());
                }
                function zip() {
                    var out = document.getElementById("zipOut");
                    try {
                        var bytes = new TextEncoder().encode(document.getElementById("plainZip").value);
                        var u8 = document.getElementById("useDeflate").checked ? pako.deflate(bytes) : pako.gzip(bytes);
                        out.value = document.getElementById("encFmt").value === "hex" ? u8ToHex(u8) : u8ToB64(u8);
                    } catch (e) {
                        out.value = "压缩失败: " + (e && e.message ? e.message : e);
                    }
                    syncZipEncEmpty();
                }
                function unzip() {
                    var out = document.getElementById("plainUnzip");
                    try {
                        var raw = document.getElementById("zipIn").value;
                        var u8 = document.getElementById("decFmt").value === "hex" ? hexToU8(raw) : b64ToU8(raw);
                        var dec = pako.inflate(u8, { to: "string" });
                        out.value = dec;
                    } catch (e) {
                        out.value = "解压失败: " + (e && e.message ? e.message : e);
                    }
                    syncZipDecEmpty();
                }
                document.getElementById("plainZip").addEventListener("input", function () {
                    clearTimeout(tZip);
                    tZip = setTimeout(zip, 80);
                });
                document.getElementById("useDeflate").addEventListener("change", zip);
                document.getElementById("encFmt").addEventListener("change", zip);
                document.getElementById("zipIn").addEventListener("input", function () {
                    clearTimeout(tUnzip);
                    tUnzip = setTimeout(unzip, 80);
                });
                document.getElementById("decFmt").addEventListener("change", unzip);
                document.getElementById("zipEncRun").addEventListener("click", function () {
                    clearTimeout(tZip);
                    zip();
                });
                document.getElementById("zipDecRun").addEventListener("click", function () {
                    clearTimeout(tUnzip);
                    unzip();
                });
                document.querySelectorAll(".mode-seg button").forEach(function (btn) {
                    btn.addEventListener("click", function () {
                        document.querySelectorAll(".mode-seg button").forEach(function (b) {
                            b.classList.toggle("active", b === btn);
                        });
                        var t = btn.getAttribute("data-tab");
                        document.getElementById("split-enc").hidden = t !== "enc";
                        document.getElementById("split-dec").hidden = t !== "dec";
                    });
                });
                zip();
                unzip();
            })();
            document.addEventListener("contextmenu", function (e) {
                e.preventDefault();
            });
        </script>
            <script src="libs/tool-form-persist.js"></script>
    </body>
</html>
