<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>集合比较工具</title>
        <link rel="stylesheet" href="libs/tool-danger-btn.css" />
        <script src="libs/tool-copy.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            :root {
                --card: #ffffff;
                --bg: #f3f7ff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
            }
            html,
            body {
                width: 100%;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
            }
            .page {
                width: 100%;
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                overflow-y: auto;
            }
            .toolbar {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                padding: 8px;
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 8px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 7px 12px;
                font-size: 14px;
                cursor: pointer;
            }
            .btn.primary {
                color: #fff;
                border-color: transparent;
                background: linear-gradient(135deg, var(--primary), var(--primary-2));
            }
            .hint {
                color: var(--muted);
                font-size: 14px;
            }
            .input-wrap {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                min-height: 0;
            }
            .panel {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                overflow: hidden;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }
            .panel-title {
                padding: 8px 10px;
                font-size: 14px;
                color: #324a76;
                border-bottom: 1px solid #e4edff;
                background: #f8fbff;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                flex-wrap: wrap;
            }
            .panel-title-main {
                display: flex;
                flex-direction: column;
                gap: 2px;
                min-width: 0;
            }
            .input-stats {
                font-size: 12px;
                color: var(--muted);
                font-weight: normal;
            }
            .title-btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 4px 10px;
                font-size: 13px;
                cursor: pointer;
            }
            textarea {
                width: 100%;
                height: 180px;
                min-height: 120px;
                max-height: 38vh;
                border: none;
                outline: none;
                resize: vertical;
                padding: 10px;
                font-size: 14px;
                line-height: 1.6;
                color: var(--text);
                background: #fff;
                font-family: Consolas, "Courier New", monospace;
            }
            .result-wrap {
                flex: 1 1 220px;
                min-height: 220px;
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 8px;
            }
            .result-wrap > .panel {
                min-height: 0;
            }
            .result-list {
                flex: 1;
                min-height: 0;
                padding: 8px;
                overflow: auto;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .item {
                border: 1px solid #e6eeff;
                background: #f8fbff;
                border-radius: 6px;
                padding: 4px 8px;
                font-size: 13px;
                line-height: 1.5;
                word-break: break-all;
                font-family: Consolas, "Courier New", monospace;
            }
            .empty {
                color: var(--muted);
                font-size: 13px;
                padding: 8px;
            }
            .dup-modal {
                position: fixed;
                inset: 0;
                background: rgba(16, 30, 60, 0.35);
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 99;
                padding: 16px;
            }
            .dup-modal.show {
                display: flex;
            }
            .dup-card {
                width: min(560px, 100%);
                max-height: 70vh;
                background: #fff;
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .dup-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                padding: 8px 10px;
                border-bottom: 1px solid #e4edff;
                background: #f8fbff;
                font-size: 14px;
                color: #324a76;
                flex-wrap: wrap;
            }
            .dup-actions {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-wrap: wrap;
            }
            .title-btn:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }
            .dup-list {
                padding: 10px;
                overflow: auto;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .split-panel {
                flex-shrink: 0;
            }
            .split-panel > summary {
                padding: 8px 10px;
                font-size: 14px;
                color: #324a76;
                border-bottom: 1px solid #e4edff;
                background: #f8fbff;
                cursor: pointer;
                list-style: none;
                user-select: none;
            }
            .split-panel > summary::-webkit-details-marker {
                display: none;
            }
            .split-panel > summary::before {
                content: "▸ ";
                display: inline-block;
                transition: transform 0.15s ease;
            }
            .split-panel[open] > summary::before {
                transform: rotate(90deg);
            }
            .split-panel[open] > summary {
                border-bottom: 1px solid #e4edff;
            }
            .split-panel:not([open]) > summary {
                border-bottom: none;
            }
            .split-toolbar {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
                padding: 8px 10px;
                border-bottom: 1px solid #e4edff;
                background: #f8fbff;
            }
            .split-toolbar label {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                font-size: 13px;
                color: #324a76;
            }
            .split-toolbar select,
            .split-toolbar input[type="number"] {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #fff;
                color: var(--text);
                padding: 4px 8px;
                font-size: 13px;
                min-width: 0;
            }
            .split-toolbar input[type="number"] {
                width: 72px;
            }
            .split-summary {
                font-size: 12px;
                color: var(--muted);
                margin-left: auto;
            }
            .split-result-wrap {
                padding: 8px;
                overflow: auto;
                max-height: 28vh;
                min-height: 80px;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-content: flex-start;
            }
            .split-group {
                flex: 1 1 180px;
                max-width: 280px;
                border: 1px solid #e6eeff;
                border-radius: 8px;
                background: #f8fbff;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .split-group-title {
                padding: 6px 8px;
                font-size: 12px;
                color: #324a76;
                border-bottom: 1px solid #e6eeff;
                background: #fff;
                font-weight: 600;
            }
            .split-group-list {
                padding: 6px;
                overflow: auto;
                max-height: 140px;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .split-group-list .item {
                font-size: 12px;
                padding: 3px 6px;
            }
            @media (max-width: 900px) {
                .input-wrap {
                    grid-template-columns: 1fr;
                }
                .result-wrap {
                    grid-template-columns: 1fr;
                }
                .split-summary {
                    margin-left: 0;
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="toolbar">
                <button id="compare-btn" class="btn primary" type="button">开始比较</button>
                <button id="swap-btn" class="btn" type="button">交换 A/B</button>
                <button id="clear-btn" class="btn tool-btn-danger" type="button">清空</button>
                <span id="summary" class="hint">支持空格、换行、逗号分隔</span>
            </div>

            <div class="input-wrap">
                <div class="panel">
                    <div class="panel-title">
                        <div class="panel-title-main">
                            <span>A 集合输入</span>
                            <span id="stats-a" class="input-stats">共 0 项 · 去重后 0 项</span>
                        </div>
                        <button id="show-dup-a" class="title-btn" type="button">查看重复</button>
                    </div>
                    <textarea id="set-a" placeholder="输入 A 集合，支持空格、换行、逗号混合分隔"></textarea>
                </div>
                <div class="panel">
                    <div class="panel-title">
                        <div class="panel-title-main">
                            <span>B 集合输入</span>
                            <span id="stats-b" class="input-stats">共 0 项 · 去重后 0 项</span>
                        </div>
                        <button id="show-dup-b" class="title-btn" type="button">查看重复</button>
                    </div>
                    <textarea id="set-b" placeholder="输入 B 集合，支持空格、换行、逗号混合分隔"></textarea>
                </div>
            </div>

            <div class="result-wrap">
                <div class="panel">
                    <div class="panel-title">
                        <span id="a-only-title">A 独有 (0)</span>
                        <button id="copy-a-only" class="title-btn" type="button">复制</button>
                    </div>
                    <div id="a-only" class="result-list"></div>
                </div>
                <div class="panel">
                    <div class="panel-title">
                        <span id="both-title">A/B 共有 (0)</span>
                        <button id="copy-both" class="title-btn" type="button">复制</button>
                    </div>
                    <div id="both" class="result-list"></div>
                </div>
                <div class="panel">
                    <div class="panel-title">
                        <span id="b-only-title">B 独有 (0)</span>
                        <button id="copy-b-only" class="title-btn" type="button">复制</button>
                    </div>
                    <div id="b-only" class="result-list"></div>
                </div>
            </div>

            <details id="split-panel" class="panel split-panel">
                <summary>分隔集合（点击展开）</summary>
                <div class="split-toolbar">
                    <label>
                        来源
                        <select id="split-source">
                            <option value="set-a">A 集合</option>
                            <option value="set-b">B 集合</option>
                        </select>
                    </label>
                    <label>
                        每组
                        <input id="split-size" type="number" min="1" step="1" value="100" />
                        个
                    </label>
                    <button id="split-btn" class="title-btn" type="button">开始分隔</button>
                    <button id="split-export-btn" class="title-btn" type="button" disabled>导出 Excel</button>
                    <span id="split-summary" class="split-summary">按指定个数将集合均分，每组对应 Excel 一个 sheet</span>
                </div>
                <div id="split-result" class="split-result-wrap">
                    <div class="empty">选择来源并设置每组个数后点击「开始分隔」</div>
                </div>
            </details>
        </div>
        <div id="dup-modal" class="dup-modal">
            <div class="dup-card">
                <div class="dup-head">
                    <span id="dup-title">重复元素</span>
                    <div class="dup-actions">
                        <button id="dup-copy" class="title-btn" type="button" disabled>复制</button>
                        <button id="dedupe-current" class="title-btn" type="button" disabled>去掉重复（每项保留一次）</button>
                        <button id="dup-close" class="title-btn" type="button">关闭</button>
                    </div>
                </div>
                <div id="dup-list" class="dup-list"></div>
            </div>
        </div>

        <script>
            var STORAGE_KEY = "form_data_set_compare_tool_v1";
            var XLSX_SCRIPT_URL = "../vendor/xlsx/xlsx.full.min.js";
            var xlsxLoadingPromise = null;

            function loadXlsxLibrary() {
                if (window.XLSX) {
                    return Promise.resolve(window.XLSX);
                }
                if (xlsxLoadingPromise) {
                    return xlsxLoadingPromise;
                }
                xlsxLoadingPromise = new Promise(function (resolve, reject) {
                    var script = document.createElement("script");
                    script.src = XLSX_SCRIPT_URL;
                    script.onload = function () {
                        if (window.XLSX) {
                            resolve(window.XLSX);
                        } else {
                            reject(new Error("XLSX not available"));
                        }
                    };
                    script.onerror = function () {
                        reject(new Error("Failed to load XLSX"));
                    };
                    document.head.appendChild(script);
                });
                return xlsxLoadingPromise;
            }

            var lastSplitGroups = [];

            function saveFormData() {
                var payload = {
                    setA: document.getElementById("set-a").value,
                    setB: document.getElementById("set-b").value,
                    splitSource: document.getElementById("split-source").value,
                    splitSize: document.getElementById("split-size").value,
                    splitOpen: document.getElementById("split-panel").open
                };
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
                } catch (e) {
                    // Ignore storage write errors (privacy mode/full storage).
                }
            }

            function restoreFormData() {
                try {
                    var raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return;
                    var data = JSON.parse(raw);
                    document.getElementById("set-a").value = data.setA || "";
                    document.getElementById("set-b").value = data.setB || "";
                    if (data.splitSource) {
                        document.getElementById("split-source").value = data.splitSource;
                    }
                    if (data.splitSize) {
                        document.getElementById("split-size").value = data.splitSize;
                    }
                    if (data.splitOpen) {
                        document.getElementById("split-panel").open = true;
                    }
                } catch (e) {
                    // Ignore storage parse/read errors.
                }
            }

            function parseRawItems(text) {
                return String(text || "")
                    .replace(/\r\n/g, "\n")
                    .split(/[\s,，]+/)
                    .map(function (item) {
                        return item.trim();
                    })
                    .filter(function (item) {
                        return item.length > 0;
                    });
            }

            function parseInput(text) {
                return Array.from(new Set(parseRawItems(text)));
            }

            /** 按首次出现顺序去重（与 parseInput 的 Set 顺序一致，便于与比较逻辑一致） */
            function uniquePreserveOrder(items) {
                var seen = new Set();
                var out = [];
                items.forEach(function (item) {
                    if (!seen.has(item)) {
                        seen.add(item);
                        out.push(item);
                    }
                });
                return out;
            }

            var dupModalInputId = null;
            var lastCompareResult = { aOnly: [], both: [], bOnly: [] };
            var lastDuplicateValues = [];

            function getInputStats(text) {
                var raw = parseRawItems(text);
                return { total: raw.length, unique: uniquePreserveOrder(raw).length };
            }

            function updateInputStats() {
                var a = getInputStats(document.getElementById("set-a").value);
                var b = getInputStats(document.getElementById("set-b").value);
                document.getElementById("stats-a").textContent =
                    "共 " + a.total + " 项 · 去重后 " + a.unique + " 项";
                document.getElementById("stats-b").textContent =
                    "共 " + b.total + " 项 · 去重后 " + b.unique + " 项";
            }

            function getDuplicateItems(text) {
                var counts = new Map();
                parseRawItems(text).forEach(function (item) {
                    counts.set(item, (counts.get(item) || 0) + 1);
                });
                return Array.from(counts.entries())
                    .filter(function (entry) {
                        return entry[1] > 1;
                    })
                    .sort(function (a, b) {
                        return b[1] - a[1];
                    });
            }

            function renderList(el, values) {
                if (!values.length) {
                    el.innerHTML = '<div class="empty">暂无数据</div>';
                    return;
                }
                el.innerHTML = values
                    .map(function (val) {
                        return '<div class="item">' + escapeHtml(val) + "</div>";
                    })
                    .join("");
            }

            function escapeHtml(input) {
                return String(input)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
            }

            function compareSets() {
                updateInputStats();
                var aValues = parseInput(document.getElementById("set-a").value);
                var bValues = parseInput(document.getElementById("set-b").value);
                var bSet = new Set(bValues);
                var aSet = new Set(aValues);

                var aOnly = aValues.filter(function (item) {
                    return !bSet.has(item);
                });
                var both = aValues.filter(function (item) {
                    return bSet.has(item);
                });
                var bOnly = bValues.filter(function (item) {
                    return !aSet.has(item);
                });

                lastCompareResult.aOnly = aOnly;
                lastCompareResult.both = both;
                lastCompareResult.bOnly = bOnly;

                document.getElementById("a-only-title").textContent = "A 独有 (" + aOnly.length + ")";
                document.getElementById("both-title").textContent = "A/B 共有 (" + both.length + ")";
                document.getElementById("b-only-title").textContent = "B 独有 (" + bOnly.length + ")";

                renderList(document.getElementById("a-only"), aOnly);
                renderList(document.getElementById("both"), both);
                renderList(document.getElementById("b-only"), bOnly);

                document.getElementById("summary").textContent =
                    "A 去重后 " +
                    aValues.length +
                    " 条，B 去重后 " +
                    bValues.length +
                    " 条，交集 " +
                    both.length +
                    " 条";
            }

            function dedupeCurrentTextarea() {
                if (!dupModalInputId) return;
                var el = document.getElementById(dupModalInputId);
                var unique = uniquePreserveOrder(parseRawItems(el.value));
                el.value = unique.join("\n");
                saveFormData();
                compareSets();
                document.getElementById("dup-modal").classList.remove("show");
            }

            function copyResultColumn(btn, key) {
                var arr = lastCompareResult[key] || [];
                ToolCopy.copy(arr.join("\n"), { onLabelEl: btn, labelText: "复制" });
            }

            function copyDuplicates(btn) {
                ToolCopy.copy(lastDuplicateValues.join("\n"), { onLabelEl: btn, labelText: "复制" });
            }

            function getSplitSourceItems() {
                var inputId = document.getElementById("split-source").value;
                var text = document.getElementById(inputId).value;
                return uniquePreserveOrder(parseRawItems(text));
            }

            function getSplitChunkSize() {
                var size = parseInt(document.getElementById("split-size").value, 10);
                if (!Number.isFinite(size) || size < 1) {
                    return null;
                }
                return size;
            }

            function splitIntoGroups(items, chunkSize) {
                var groups = [];
                for (var i = 0; i < items.length; i += chunkSize) {
                    groups.push(items.slice(i, i + chunkSize));
                }
                return groups;
            }

            function renderSplitGroups(groups) {
                var el = document.getElementById("split-result");
                var exportBtn = document.getElementById("split-export-btn");
                if (!groups.length) {
                    el.innerHTML = '<div class="empty">没有可分隔的数据</div>';
                    exportBtn.disabled = true;
                    return;
                }
                exportBtn.disabled = false;
                el.innerHTML = groups
                    .map(function (group, idx) {
                        var itemsHtml = group.length
                            ? group
                                  .map(function (val) {
                                      return '<div class="item">' + escapeHtml(val) + "</div>";
                                  })
                                  .join("")
                            : '<div class="empty">空组</div>';
                        return (
                            '<div class="split-group">' +
                            '<div class="split-group-title">第 ' +
                            (idx + 1) +
                            " 组（" +
                            group.length +
                            " 项）</div>" +
                            '<div class="split-group-list">' +
                            itemsHtml +
                            "</div></div>"
                        );
                    })
                    .join("");
            }

            function updateSplitSummary(groups, sourceLabel, chunkSize, total) {
                var summary = document.getElementById("split-summary");
                if (!groups.length) {
                    summary.textContent = sourceLabel + " 无数据，无法分隔";
                    return;
                }
                summary.textContent =
                    sourceLabel +
                    " 共 " +
                    total +
                    " 项，每组 " +
                    chunkSize +
                    " 个，共 " +
                    groups.length +
                    " 组";
            }

            function runSplitCollection() {
                var chunkSize = getSplitChunkSize();
                if (chunkSize === null) {
                    alert("请输入有效的每组个数（正整数）");
                    return;
                }
                document.getElementById("split-panel").open = true;
                var sourceId = document.getElementById("split-source").value;
                var sourceLabel = sourceId === "set-a" ? "A 集合" : "B 集合";
                var items = getSplitSourceItems();
                var groups = splitIntoGroups(items, chunkSize);
                lastSplitGroups = groups;
                renderSplitGroups(groups);
                updateSplitSummary(groups, sourceLabel, chunkSize, items.length);
                saveFormData();
            }

            function sanitizeSheetName(name, fallback) {
                var safe = String(name || fallback)
                    .replace(/[\\/?*[\]:]/g, "_")
                    .slice(0, 31);
                return safe || fallback;
            }

            function exportSplitToExcel() {
                if (!lastSplitGroups.length) {
                    alert("请先执行分隔操作");
                    return;
                }
                loadXlsxLibrary()
                    .then(function () {
                        var wb = XLSX.utils.book_new();
                        var usedNames = new Set();
                        lastSplitGroups.forEach(function (group, idx) {
                            var baseName = "组" + (idx + 1);
                            var sheetName = baseName;
                            var suffix = 1;
                            while (usedNames.has(sheetName)) {
                                sheetName = sanitizeSheetName(baseName + "_" + suffix, "Sheet" + (idx + 1));
                                suffix += 1;
                            }
                            usedNames.add(sheetName);
                            sheetName = sanitizeSheetName(sheetName, "Sheet" + (idx + 1));

                            var aoa = [["序号", "元素"]];
                            group.forEach(function (item, i) {
                                aoa.push([i + 1, item]);
                            });
                            var ws = XLSX.utils.aoa_to_sheet(aoa);
                            XLSX.utils.book_append_sheet(wb, ws, sheetName);
                        });

                        var sourceId = document.getElementById("split-source").value;
                        var prefix = sourceId === "set-a" ? "A集合" : "B集合";
                        XLSX.writeFile(wb, prefix + "_分隔_" + lastSplitGroups.length + "组.xlsx");
                    })
                    .catch(function () {
                        alert("Excel 导出组件加载失败，请刷新页面后重试");
                    });
            }

            function showDuplicates(inputId, title) {
                dupModalInputId = inputId;
                var text = document.getElementById(inputId).value;
                var duplicates = getDuplicateItems(text);
                lastDuplicateValues = duplicates.map(function (entry) {
                    return entry[0];
                });
                document.getElementById("dup-title").textContent = title + "（共 " + duplicates.length + " 项）";
                var dedupeBtn = document.getElementById("dedupe-current");
                var dupCopyBtn = document.getElementById("dup-copy");
                dedupeBtn.disabled = duplicates.length === 0;
                dupCopyBtn.disabled = duplicates.length === 0;
                var list = document.getElementById("dup-list");
                if (!duplicates.length) {
                    list.innerHTML = '<div class="empty">没有重复元素</div>';
                } else {
                    list.innerHTML = duplicates
                        .map(function (entry) {
                            return '<div class="item">' + escapeHtml(entry[0]) + " × " + entry[1] + "</div>";
                        })
                        .join("");
                }
                document.getElementById("dup-modal").classList.add("show");
            }

            document.getElementById("compare-btn").addEventListener("click", compareSets);
            document.getElementById("copy-a-only").addEventListener("click", function () {
                copyResultColumn(this, "aOnly");
            });
            document.getElementById("copy-both").addEventListener("click", function () {
                copyResultColumn(this, "both");
            });
            document.getElementById("copy-b-only").addEventListener("click", function () {
                copyResultColumn(this, "bOnly");
            });
            document.getElementById("dedupe-current").addEventListener("click", dedupeCurrentTextarea);
            document.getElementById("dup-copy").addEventListener("click", function () {
                copyDuplicates(this);
            });
            document.getElementById("swap-btn").addEventListener("click", function () {
                var a = document.getElementById("set-a");
                var b = document.getElementById("set-b");
                var tmp = a.value;
                a.value = b.value;
                b.value = tmp;
                saveFormData();
                compareSets();
            });
            document.getElementById("clear-btn").addEventListener("click", function () {
                document.getElementById("set-a").value = "";
                document.getElementById("set-b").value = "";
                lastSplitGroups = [];
                renderSplitGroups([]);
                document.getElementById("split-export-btn").disabled = true;
                document.getElementById("split-summary").textContent =
                    "按指定个数将集合均分，每组对应 Excel 一个 sheet";
                saveFormData();
                compareSets();
                ["set-a", "set-b", "split-source", "split-size"].forEach(function (id) {
                    var el = document.getElementById(id);
                    if (!el) return;
                    el.dispatchEvent(new Event("input", { bubbles: true }));
                    el.dispatchEvent(new Event("change", { bubbles: true }));
                });
            });
            document.getElementById("show-dup-a").addEventListener("click", function () {
                showDuplicates("set-a", "A 集合重复元素");
            });
            document.getElementById("show-dup-b").addEventListener("click", function () {
                showDuplicates("set-b", "B 集合重复元素");
            });
            document.getElementById("dup-close").addEventListener("click", function () {
                document.getElementById("dup-modal").classList.remove("show");
            });
            document.getElementById("dup-modal").addEventListener("click", function (e) {
                if (e.target.id === "dup-modal") {
                    document.getElementById("dup-modal").classList.remove("show");
                }
            });

            document.getElementById("set-a").addEventListener("input", function () {
                saveFormData();
                updateInputStats();
            });
            document.getElementById("set-b").addEventListener("input", function () {
                saveFormData();
                updateInputStats();
            });
            document.getElementById("split-btn").addEventListener("click", runSplitCollection);
            document.getElementById("split-export-btn").addEventListener("click", exportSplitToExcel);
            document.getElementById("split-source").addEventListener("change", function () {
                saveFormData();
            });
            document.getElementById("split-size").addEventListener("change", function () {
                saveFormData();
            });
            document.getElementById("split-size").addEventListener("keydown", function (e) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSplitCollection();
                }
            });
            document.getElementById("split-panel").addEventListener("toggle", function () {
                saveFormData();
            });

            restoreFormData();
            compareSets();
        </script>
            <script src="libs/tool-form-persist.js"></script>
    </body>
</html>
