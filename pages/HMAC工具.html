<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>HMAC</title>
        <script src="libs/crypto-js.js"></script>
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                --bg: #f3f7ff;
                --card: #fff;
                --primary: #2f6bff;
                --primary-2: #5b8dff;
                --border: #dbe6ff;
                --text: #1f2a44;
                --muted: #6f7d96;
                --shadow: 0 10px 30px rgba(36, 90, 190, 0.12);
                --foot-bg: #f8fbff;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                font-size: 14px;
                background: radial-gradient(circle at top right, #eaf1ff, #f8fbff 40%, var(--bg) 80%);
                color: var(--text);
            }
            .page {
                height: 100%;
                padding: 10px;
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .split {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                gap: 10px;
                align-items: stretch;
            }
            .pane {
                flex: 1 1 0;
                min-width: 0;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .pane-hd {
                flex-shrink: 0;
                padding: 8px 10px;
                font-weight: 600;
                font-size: 14px;
                color: #324a76;
                background: var(--foot-bg);
                border-bottom: 1px solid #e4edff;
            }
            .pane-body {
                flex: 1;
                min-height: 0;
                padding: 10px;
                display: flex;
                flex-direction: column;
            }
            .ta {
                flex: 1;
                width: 100%;
                min-height: 120px;
                border: 1px solid #cfdcf7;
                border-radius: 8px;
                padding: 10px;
                font-family: Consolas, "Courier New", monospace;
                font-size: 14px;
                line-height: 1.55;
                resize: none;
                outline: none;
            }
            .ta:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.12);
            }
            .foot {
                flex-shrink: 0;
                border-top: 1px solid #e4edff;
                background: var(--foot-bg);
                padding: 8px 10px;
                display: flex;
                flex-wrap: wrap;
                gap: 10px 14px;
                align-items: center;
            }
            .foot label {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                font-size: 13px;
            }
            .foot select,
            .foot input[type="text"] {
                border: 1px solid #cfdcf7;
                border-radius: 6px;
                padding: 5px 10px;
                font-size: 13px;
            }
            .foot input[type="text"] {
                min-width: 180px;
            }
            .btn {
                border: 1px solid #d8e5ff;
                border-radius: 6px;
                background: #edf3ff;
                color: #3c4f78;
                padding: 6px 14px;
                font-size: 13px;
                cursor: pointer;
            }
            .btn:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .err {
                color: #c62828;
                font-size: 13px;
                padding: 6px 10px 8px;
            }
            @media (max-width: 820px) {
                .split {
                    flex-direction: column;
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="split">
                <section class="pane">
                    <div class="pane-hd">消息与参数</div>
                    <div class="pane-body">
                        <textarea id="msgTa" name="msgTa" class="ta" placeholder="消息原文…"></textarea>
                    </div>
                    <div class="foot">
                        <label>
                            算法
                            <select id="hmacAlg" name="hmacAlg">
                                <option value="MD5">HmacMD5</option>
                                <option value="SHA1">HmacSHA1</option>
                                <option value="SHA224">HmacSHA224</option>
                                <option value="SHA256" selected>HmacSHA256</option>
                                <option value="SHA384">HmacSHA384</option>
                                <option value="SHA512">HmacSHA512</option>
                            </select>
                        </label>
                        <label>
                            密钥编码
                            <select id="keyEnc" name="keyEnc">
                                <option value="Utf8" selected>Utf8</option>
                                <option value="Hex">Hex</option>
                                <option value="Base64">Base64</option>
                            </select>
                        </label>
                        <label>密钥 <input type="text" id="keyStr" name="keyStr" placeholder="HMAC 密钥" autocomplete="off" /></label>
                        <label><input type="checkbox" id="upperHex" name="upperHex" /> 大写 Hex</label>
                        <button type="button" class="btn" id="btnCopy">复制结果</button>
                    </div>
                    <div class="err" id="errBox" style="display: none"></div>
                </section>
                <section class="pane">
                    <div class="pane-hd">HMAC 输出（Hex）</div>
                    <div class="pane-body">
                        <textarea id="outTa" name="outTa" class="ta" readonly placeholder="计算结果"></textarea>
                    </div>
                </section>
            </div>
        </div>
        <script>
            (function () {
                var C = window.CryptoJS;
                if (!C) {
                    document.getElementById("errBox").style.display = "block";
                    document.getElementById("errBox").textContent = "未加载 CryptoJS";
                    return;
                }

                function parseKey(str, encName) {
                    if (encName === "Hex") return C.enc.Hex.parse(String(str || "").replace(/\s/g, ""));
                    if (encName === "Base64") return C.enc.Base64.parse(String(str || "").replace(/\s/g, ""));
                    return C.enc.Utf8.parse(str || "");
                }

                function run() {
                    var err = document.getElementById("errBox");
                    err.style.display = "none";
                    err.textContent = "";
                    var name = document.getElementById("hmacAlg").value;
                    var fn = C["Hmac" + name];
                    if (typeof fn !== "function") {
                        err.style.display = "block";
                        err.textContent = "不支持的算法";
                        return;
                    }
                    var msg = document.getElementById("msgTa").value;
                    var key = parseKey(document.getElementById("keyStr").value, document.getElementById("keyEnc").value);
                    var hex = fn(msg, key).toString(C.enc.Hex);
                    if (document.getElementById("upperHex").checked) hex = hex.toUpperCase();
                    document.getElementById("outTa").value = hex;
                }

                var t;
                function schedule() {
                    clearTimeout(t);
                    t = setTimeout(run, 200);
                }

                ["msgTa", "keyStr", "hmacAlg", "keyEnc", "upperHex"].forEach(function (id) {
                    document.getElementById(id).addEventListener("input", schedule);
                    document.getElementById(id).addEventListener("change", schedule);
                });
                document.getElementById("btnCopy").addEventListener("click", function () {
                    var v = document.getElementById("outTa").value;
                    if (!v) return;
                    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v);
                    else {
                        var ta = document.createElement("textarea");
                        ta.value = v;
                        document.body.appendChild(ta);
                        ta.select();
                        try {
                            document.execCommand("copy");
                        } catch (e) {}
                        document.body.removeChild(ta);
                    }
                });
                run();
            })();
        </script>
    </body>
</html>
