<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>404 - 页面不存在</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
                background: #f3f7ff;
                color: #1f2a44;
            }
            .box {
                text-align: center;
                padding: 32px;
            }
            h1 {
                font-size: 48px;
                font-weight: 700;
                color: #2f6bff;
                margin-bottom: 8px;
            }
            p {
                color: #6f7d96;
                margin-bottom: 20px;
            }
            a {
                color: #2f6bff;
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <h1>404</h1>
            <p>请求的资源不存在</p>
            <a href="/">返回工具导航</a>
        </div>
    </body>
</html>
