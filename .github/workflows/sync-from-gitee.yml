name: Sync gitee to github

# 你推送到 gitee（源），本工作流每 15 分钟把 gitee 的所有分支镜像到本仓库（github），
# 从而实现「push gitee → 自动同步到 github」。github 上的 push 会再触发 deploy-pages 发布到 Pages。
# 也可手动触发（Actions → 本工作流 → Run workflow）。
on:
  # 说明：gitee 对 GitHub Actions 数据中心 IP 限流(HTTP 429)，定时 clone 几乎必失败。
  # 故停用定时任务，改为「手动触发」(workflow_dispatch)。可靠同步请看仓库 docs/gitee-github-auto-sync.md 的"本机同步"方案。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gitee
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Sync content branches from gitee to this repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 避免 gitee 匿名克隆被限流(429)，在仓库 Secrets 里配 gitee 私人令牌即可；
          # 名字用 GITEE_TOKEN 或 GITEE_TOOL_NAV 都行（这里兼容两者）
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN || secrets.GITEE_TOOL_NAV }}
        run: |
          set -e
          # gitee 匿名克隆易被限流(429)，最好用令牌认证。gitee 的令牌认证通常用 用户名:令牌，
          # oauth2: 前缀 gitee 有时不识别（会被当作匿名导致 429）。这里按优先级多方式尝试 + 重试。
          AUTH_URLS=()
          if [ -n "$GITEE_TOKEN" ]; then
            AUTH_URLS+=("https://xiaochenbian:${GITEE_TOKEN}@gitee.com/xiaochenbian/tool-nav.git")
            AUTH_URLS+=("https://oauth2:${GITEE_TOKEN}@gitee.com/xiaochenbian/tool-nav.git")
          fi
          AUTH_URLS+=("https://gitee.com/xiaochenbian/tool-nav.git")

          clone_ok=0
          for url in "${AUTH_URLS[@]}"; do
            for i in 1 2 3; do
              echo "尝试克隆 gitee (第 ${i} 次): ${url/*@/***@}"
              if git clone --mirror "$url" tmp 2>/tmp/ce; then
                echo "克隆成功"; clone_ok=1; break 2
              fi
              echo "  失败: $(tail -n1 /tmp/ce)"
              sleep 5
            done
          done
          if [ "$clone_ok" != "1" ]; then
            echo "所有克隆尝试均失败：" >&2; cat /tmp/ce >&2; exit 1
          fi
          cd tmp
          # 仅同步内容分支（offline/master/online），排除含授权逻辑的 app 分支
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/offline:refs/heads/offline \
            refs/heads/master:refs/heads/master \
            refs/heads/online:refs/heads/online



