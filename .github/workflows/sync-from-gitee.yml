name: Sync gitee to github

# 你推送到 gitee（源），本工作流每 15 分钟把 gitee 的所有分支镜像到本仓库（github），
# 从而实现「push gitee → 自动同步到 github」。github 上的 push 会再触发 deploy-pages 发布到 Pages。
# 也可手动触发（Actions → 本工作流 → Run workflow）。
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gitee
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Sync content branches from gitee to this repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 若 gitee 为私有仓库，需要在仓库 Secrets 里配置 GITEE_TOKEN（gitee 私人令牌），
          # 否则匿名 clone 会失败。若 gitee 已公开，可不配置（走公开 URL）。
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          # 优先以公开方式拉取 gitee；若失败（如私有），再回退用 GITEE_TOKEN
          if git clone --mirror "https://gitee.com/xiaochenbian/tool-nav.git" tmp 2>/tmp/gitee_clone_err; then
            echo "已通过公开方式拉取 gitee"
          elif [ -n "$GITEE_TOKEN" ]; then
            echo "公开拉取失败，改用 GITEE_TOKEN 拉取..."
            git clone --mirror "https://oauth2:${GITEE_TOKEN}@gitee.com/xiaochenbian/tool-nav.git" tmp
          else
            echo "公开拉取失败且未配置 GITEE_TOKEN：" >&2
            cat /tmp/gitee_clone_err >&2
            exit 1
          fi
          cd tmp
          # 仅同步内容分支（offline/master/online），排除含授权逻辑的 app 分支
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/offline:refs/heads/offline \
            refs/heads/master:refs/heads/master \
            refs/heads/online:refs/heads/online



