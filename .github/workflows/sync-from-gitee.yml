name: Sync gitee to github

# 你推送到 gitee（源），本工作流每 15 分钟把 gitee 的所有分支镜像到本仓库（github），
# 从而实现「push gitee → 自动同步到 github」。github 上的 push 会再触发 deploy-pages 发布到 Pages。
# 也可手动触发（Actions → 本工作流 → Run workflow）。
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gitee
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Sync content branches from gitee to this repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 避免 gitee 匿名克隆被限流(429)，在仓库 Secrets 里配 gitee 私人令牌即可；
          # 名字用 GITEE_TOKEN 或 GITEE_TOOL_NAV 都行（这里兼容两者）
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN || secrets.GITEE_TOOL_NAV }}
        run: |
          set -e
          # gitee 匿名克隆易被限流(HTTP 429)，优先使用 GITEE_TOKEN 认证克隆；无令牌再走公开
          if [ -n "$GITEE_TOKEN" ]; then
            echo "使用 GITEE_TOKEN 认证拉取 gitee..."
            git clone --mirror "https://oauth2:${GITEE_TOKEN}@gitee.com/xiaochenbian/tool-nav.git" tmp
          else
            echo "未配置 GITEE_TOKEN，尝试公开方式拉取（可能被 gitee 限流 429）..."
            git clone --mirror "https://gitee.com/xiaochenbian/tool-nav.git" tmp
          fi
          cd tmp
          # 仅同步内容分支（offline/master/online），排除含授权逻辑的 app 分支
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/offline:refs/heads/offline \
            refs/heads/master:refs/heads/master \
            refs/heads/online:refs/heads/online



